<!doctype html>
<html lang="fr">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créateur d'événements · maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Exemple « Créateur d'événements » — Vue 1 : agenda, cartes et fiche d'événement (2026-11-12).
     Tout est fictif et simulé : affiches dessinées en SVG, réservations et inscriptions locales, rien n'est envoyé au serveur.
     Les couleurs viennent de la configuration de l'exemple (shopConfig) ; le fond sombre est calculé à partir de la 2e couleur. -->
<style>
  :root {
    --c1:#83172f; --c2:#111c38; --c3:#d8b36a;
    --bg:#0a1226; --panel:#101a33; --panel2:#15213f; --gold:#d8b36a; --line:rgba(216,179,106,.32);
    --text:#f4f0e8; --muted:#b3bbcc; --on-gold:#0a1226; --alerte:#ffb4a8;
    --serif:"Playfair Display", Georgia, "Times New Roman", serif; --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:var(--sans); color:var(--text); background:var(--bg); line-height:1.5; }
  svg.ic { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  /* En-tête */
  .top { position:sticky; top:var(--ex-h,0px); z-index:40; background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top-in { max-width:1320px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:22px; }
  .logo { display:flex; align-items:center; gap:10px; min-width:0; flex:1 0 auto; max-width:320px; }
  .logo svg { width:34px; height:34px; color:var(--gold); }
  .logo b { font-family:var(--serif); font-size:22px; font-weight:700; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav { display:flex; align-items:center; gap:2px; min-width:0; }
  .nav button { white-space:nowrap; background:none; border:0; border-bottom:2px solid transparent; padding:10px 12px; min-height:44px; cursor:pointer; color:var(--text); font-weight:500; }
  .nav button[aria-current="true"] { color:var(--gold); border-bottom-color:var(--gold); }
  .nav button:hover { color:var(--gold); }
  .tools { display:flex; align-items:center; gap:10px; margin-left:auto; }
  .iconbtn { background:none; border:0; min-width:44px; min-height:44px; border-radius:999px; display:grid; place-items:center; cursor:pointer; }
  .iconbtn:hover { background:rgba(255,255,255,.08); }
  .minebtn { white-space:nowrap; display:flex; align-items:center; gap:8px; border:1.5px solid var(--gold); color:var(--gold); background:none; border-radius:999px; padding:0 18px; min-height:44px; font-weight:600; cursor:pointer; }
  .minebtn:hover { background:rgba(216,179,106,.12); }

  /* Bandeau */
  .hero { background:linear-gradient(100deg, color-mix(in srgb, var(--c1) 55%, var(--bg)) 0%, var(--bg) 72%); border-bottom:1px solid var(--line); overflow:hidden; }
  .hero-in { max-width:1320px; margin:0 auto; padding:34px 20px 28px; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:20px; align-items:center; }
  .eyebrow { letter-spacing:.32em; text-transform:uppercase; font-size:13px; font-weight:600; color:var(--gold); margin:0 0 6px; }
  .hero h2 { font-family:var(--serif); font-weight:800; font-size:clamp(32px, 5.2vw, 58px); line-height:1.08; margin:0 0 12px; text-wrap:balance; }
  .hero p.lead { margin:0 0 20px; max-width:560px; font-size:18px; color:#e6e1d6; }
  .garanties { display:flex; flex-wrap:wrap; gap:18px 26px; }
  .garantie { display:flex; align-items:center; gap:12px; font-size:14px; line-height:1.3; }
  .garantie svg.ic { width:34px; height:34px; color:var(--gold); stroke-width:1.4; }
  .garantie + .garantie { padding-left:26px; border-left:1px solid var(--line); }
  .hero .btn { margin-top:18px; flex:0 0 auto; }
  .hero-art { position:relative; min-height:230px; border-radius:14px; overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 38%); mask-image:linear-gradient(90deg, transparent 0, #000 38%); }
  .hero-art svg { position:absolute; inset:0; width:100%; height:100%; }

  /* Recherche et filtres */
  .wrap { max-width:1320px; margin:0 auto; padding:0 20px 36px; }
  .note { background:#2a2410; border:1px solid #6b5a22; color:#f3e3a6; border-radius:10px; padding:10px 12px; font-size:14px; margin:16px 0 0; }
  .recherche { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; padding:20px 0 6px; }
  .recherche label { display:grid; gap:4px; font-size:13px; color:var(--muted); font-weight:600; }
  .recherche .champ { flex:1 1 260px; }
  .recherche input[type="search"] { width:100%; }
  input[type="search"], input[type="text"], input[type="email"], input[type="number"], select, textarea { font:inherit; font-size:14.5px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:0 12px; min-height:44px; }
  select { cursor:pointer; }
  .barre { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 0 14px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; flex:1 1 auto; }
  .chip { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:rgba(255,255,255,.03); border-radius:999px; padding:0 14px; min-height:44px; cursor:pointer; font-size:14px; }
  .chip:hover { border-color:var(--gold); }
  .chip[aria-pressed="true"] { background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700; }
  .vues { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .vues button { background:none; border:0; min-height:44px; padding:0 16px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
  .vues button[aria-pressed="true"] { background:var(--gold); color:var(--on-gold); }
  .actifs { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 12px; }
  .actifs:empty { display:none; }
  .actif { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--gold); color:var(--gold); background:rgba(216,179,106,.1); border-radius:999px; padding:0 8px 0 14px; min-height:40px; font-size:14px; cursor:pointer; }
  .actif svg.ic { width:16px; height:16px; }
  .lienor { background:none; border:0; color:var(--gold); font-weight:600; cursor:pointer; min-height:44px; padding:0 8px; display:inline-flex; align-items:center; gap:6px; }
  .lienor:hover { text-decoration:underline; }
  .sectitre { font-family:var(--serif); font-size:24px; margin:6px 0 14px; scroll-margin-top:calc(var(--ex-h,0px) + 80px); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .sectitre small { font-family:var(--sans); font-size:15px; color:var(--muted); font-weight:500; }

  /* Cartes */
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:20px; }
  .carte { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; transition:transform .2s, border-color .2s; }
  .carte:hover { transform:translateY(-3px); border-color:var(--gold); }
  .carte .vue { position:relative; aspect-ratio:16/10; background:var(--panel2); cursor:pointer; border:0; padding:0; display:block; width:100%; }
  svg.affiche, .carte .vue svg, .fiche .grand svg { position:absolute; inset:0; width:100%; height:100%; }
  .datebadge { position:absolute; left:12px; top:12px; z-index:2; width:58px; text-align:center; background:var(--gold); color:var(--on-gold); border-radius:10px; padding:6px 0 5px; line-height:1; }
  .datebadge b { display:block; font-family:var(--serif); font-size:25px; }
  .datebadge small { font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .coeur { position:absolute; top:8px; right:8px; width:44px; height:44px; border-radius:999px; border:0; background:rgba(10,18,38,.62); color:#fff; display:grid; place-items:center; cursor:pointer; z-index:2; }
  .coeur[aria-pressed="true"] { color:#ff7a8d; }
  .coeur[aria-pressed="true"] svg.ic { fill:currentColor; }
  .etat { position:absolute; left:12px; bottom:10px; z-index:2; background:rgba(10,18,38,.82); border:1px solid var(--line); color:var(--gold); padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .etat.alerte { color:var(--alerte); border-color:var(--alerte); }
  .carte .corps { padding:14px 16px 16px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .carte h3 { margin:0; font-family:var(--serif); font-size:21px; line-height:1.2; }
  .badge { align-self:flex-start; border:1px solid var(--gold); color:var(--gold); border-radius:999px; padding:1px 12px; font-size:12.5px; }
  .lieu { display:flex; align-items:flex-start; gap:8px; color:var(--muted); font-size:14px; }
  .lieu svg.ic { width:17px; height:17px; margin-top:2px; color:var(--gold); }
  .prix { font-family:var(--serif); font-size:24px; font-weight:700; color:var(--gold); }
  .jauge { height:6px; border-radius:999px; background:rgba(216,179,106,.2); overflow:hidden; }
  .jauge i { display:block; height:100%; background:var(--gold); border-radius:999px; }
  .jauge.pleine i { background:var(--alerte); }
  .places { font-size:13px; color:var(--muted); }
  .actions { display:flex; gap:10px; margin-top:auto; padding-top:4px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 14px; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--gold); background:none; color:var(--text); flex:1 1 0; text-align:center; }
  .btn:hover { background:rgba(216,179,106,.14); }
  .btn.or { background:var(--gold); color:var(--on-gold); }
  .btn.or:hover { filter:brightness(1.08); }
  .btn[disabled] { opacity:.5; cursor:not-allowed; }

  /* Agenda */
  .mois { font-family:var(--serif); font-size:22px; margin:22px 0 10px; text-transform:capitalize; color:var(--gold); }
  .agenda { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .ev { display:grid; grid-template-columns:72px minmax(0,1fr) auto; gap:16px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px 12px 12px; }
  .ev:hover { border-color:var(--gold); }
  .ev .datebloc { background:var(--gold); color:var(--on-gold); border-radius:10px; text-align:center; padding:8px 4px; line-height:1; }
  .ev .datebloc b { display:block; font-family:var(--serif); font-size:28px; }
  .ev .datebloc small { font-size:12px; text-transform:uppercase; font-weight:700; letter-spacing:.08em; }
  .ev h3 { margin:0 0 4px; font-family:var(--serif); font-size:20px; line-height:1.2; }
  .ev .meta { color:var(--muted); font-size:14px; }
  .ev .droite { display:grid; justify-items:end; gap:6px; text-align:right; }
  .ev .droite .btn { flex:0 0 auto; padding:0 18px; }

  /* Pied de liste */
  .pied { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:26px; }
  .pied .compte { color:var(--muted); font-size:15px; }
  .pages { display:flex; align-items:center; gap:8px; }
  .pg { min-width:44px; min-height:44px; border-radius:999px; border:0; background:none; cursor:pointer; font-weight:600; }
  .pg:hover { background:rgba(255,255,255,.08); }
  .pg[aria-current="page"] { background:var(--gold); color:var(--on-gold); }
  .pg[disabled] { opacity:.35; cursor:not-allowed; }
  .vide { text-align:center; padding:46px 16px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); }
  .vide b { display:block; color:var(--text); font-family:var(--serif); font-size:22px; margin-bottom:6px; }
  .demo { font-size:12.5px; color:var(--muted); margin:22px 0 0; }

  /* Fenêtres */
  .overlay { position:fixed; inset:0; background:rgba(3,6,14,.72); display:none; align-items:center; justify-content:center; padding:calc(16px + var(--ex-h,0px)) 16px 16px; z-index:80; }
  .overlay.open { display:flex; }
  .sheet { background:var(--panel); border:1px solid var(--line); border-radius:16px; width:100%; max-width:920px; max-height:calc(100vh - var(--ex-h,0px) - 32px); overflow:auto; padding:22px; position:relative; }
  .sheet.etroit { max-width:560px; }
  .sheet h2 { margin:0 0 6px; font-family:var(--serif); font-size:27px; line-height:1.15; padding-right:44px; }
  .close { position:absolute; top:10px; right:10px; width:44px; height:44px; border-radius:999px; border:0; background:rgba(255,255,255,.08); cursor:pointer; display:grid; place-items:center; }
  .fiche { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; margin-top:12px; }
  .fiche .grand { position:relative; aspect-ratio:16/10; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--panel2); }
  .faits { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .faits div { background:var(--panel2); border:1px solid rgba(216,179,106,.18); border-radius:10px; padding:8px 10px; font-size:14px; }
  .faits b { display:block; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .histoire { color:#e6e1d6; margin:0 0 12px; }
  .st { font-family:var(--serif); font-size:19px; margin:18px 0 8px; }
  .prog { list-style:none; margin:0; padding:0; display:grid; gap:0; border-left:2px solid var(--line); margin-left:6px; }
  .prog li { display:grid; grid-template-columns:70px minmax(0,1fr); gap:10px; padding:6px 0 6px 14px; position:relative; font-size:14.5px; }
  .prog li::before { content:""; position:absolute; left:-6px; top:14px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
  .prog li b { color:var(--gold); font-variant-numeric:tabular-nums; }
  .interv { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .interv li { display:flex; align-items:center; gap:10px; background:var(--panel2); border-radius:10px; padding:8px 10px; font-size:14px; line-height:1.3; }
  .interv .rond { width:38px; height:38px; border-radius:50%; background:var(--panel); border:1px solid var(--line); display:grid; place-items:center; color:var(--gold); font-weight:700; flex:none; }
  .interv small { display:block; color:var(--muted); }
  .resa { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:16px; }
  .resa h3 { margin:0 0 8px; font-family:var(--serif); font-size:20px; }
  .rang { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-top:10px; }
  .qty { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .qty button { background:none; border:0; min-width:44px; min-height:44px; font-size:18px; cursor:pointer; }
  .qty button:hover { background:rgba(255,255,255,.08); }
  .qty span { padding:0 12px; min-width:36px; text-align:center; font-variant-numeric:tabular-nums; }
  .total { display:flex; justify-content:space-between; font-family:var(--serif); font-size:22px; margin:12px 0; }
  .form { display:grid; gap:10px; }
  .form label { font-size:14px; display:grid; gap:4px; color:var(--muted); }
  .form input { width:100%; }
  .aide { font-size:13px; color:var(--muted); margin:6px 0 0; }
  .ok { color:var(--gold); font-weight:600; }
  .refcode { font-family:ui-monospace, Consolas, monospace; letter-spacing:.06em; background:var(--panel); border:1px dashed var(--line); border-radius:8px; padding:2px 8px; }
  .lignes { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:10px; }
  .lignes li { display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--panel2); border-radius:10px; padding:8px 10px; }
  .lignes .pt { position:relative; width:56px; height:44px; border-radius:6px; overflow:hidden; }
  .lignes .pt svg { position:absolute; inset:0; width:100%; height:100%; }
  .lignes small { color:var(--muted); display:block; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--on-gold); font-weight:600; padding:11px 18px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:100; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }

  .etapes { list-style:none; display:flex; gap:8px; margin:0 0 14px; padding:0; }
  .etapes li { flex:1 1 0; display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); min-width:0; }
  .etapes li span { flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:13px; }
  .etapes li[aria-current="step"] { color:var(--gold); font-weight:700; }
  .etapes li[aria-current="step"] span { background:var(--gold); color:var(--on-gold); border-color:var(--gold); }
  .etapes li.fait span { border-color:var(--gold); color:var(--gold); }
  .typesb { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .typesb li { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px 14px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .typesb small { display:block; color:var(--muted); font-size:13px; line-height:1.35; }
  .typesb .prix { font-size:21px; }
  .recap { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px; }
  .recap li { display:flex; justify-content:space-between; gap:12px; }
  .recap li.tot { border-top:1px solid var(--line); padding-top:10px; font-family:var(--serif); font-size:22px; }
  .promo { display:flex; gap:8px; }
  .promo input { flex:1 1 auto; min-width:0; }
  .form .lbl { font-size:14px; color:var(--muted); display:block; margin-bottom:4px; }
  .resa h3:focus { outline:none; }
  @media (max-width:600px) { .typesb li { grid-template-columns:minmax(0,1fr) auto; } .typesb .qty { grid-column:1 / -1; justify-self:start; } .etapes li { font-size:12px; } }
  @media (max-width:1180px) {
    .top-in { flex-wrap:wrap; }
    .nav { order:3; flex:1 1 100%; overflow-x:auto; scrollbar-width:none; margin:0 -6px; }
  }
  @media (max-width:900px) {
    .hero-in { grid-template-columns:1fr; }
    .hero-art { min-height:170px; -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 40%); mask-image:linear-gradient(180deg, transparent 0, #000 40%); }
    .garantie + .garantie { padding-left:0; border-left:0; }
    .fiche { grid-template-columns:1fr; }
  }
  @media (max-width:600px) {
    .top-in { padding:8px 14px; gap:10px; }
    .logo { flex:1 1 0; max-width:none; }
    .logo b { font-size:18px; }
    .minebtn { padding:0 12px; }
    .wrap, .hero-in { padding-left:14px; padding-right:14px; }
    .grille { grid-template-columns:1fr; gap:14px; }
    .ev { grid-template-columns:60px minmax(0,1fr); }
    .ev .droite { grid-column:1 / -1; justify-items:start; text-align:left; grid-template-columns:auto 1fr; align-items:center; }
    .ev .droite .btn { justify-self:end; }
    .interv { grid-template-columns:1fr; }
    .vues { width:100%; } .vues button { flex:1; justify-content:center; }
    .pied { justify-content:center; }
  }
  @media (max-width:480px) { #navCompte, .minebtn .lib { display:none; } }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .carte, .toast { transition:none; } .carte:hover { transform:none; } }
</style>
</head>
<body>
<script src="/assets/boutique-types.js"></script>
<script src="exemple-commun.js"></script>

<header class="top">
  <div class="top-in">
    <div class="logo">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:1.5"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.600-1.9-1.800 2.600-.400z" style="stroke-width:1.2"/></svg>
      <b id="shopName"></b>
    </div>
    <nav class="nav" aria-label="Rubriques">
      <button type="button" data-nav="accueil">Accueil</button>
      <button type="button" data-nav="cartes" id="navCartes">Événements</button>
      <button type="button" data-nav="agenda" id="navAgenda">Agenda</button>
    </nav>
    <div class="tools">
      <button class="iconbtn" type="button" id="navCompte" aria-label="Mon compte (simulé)">

  }
  function initResa(e) { state.sel = { [typesBillets(e)[0].id]: 1 }; state.etape = 1; state.promo = null; }
  const maxPlaces = (e) => Math.min(placesRestantes(e), 10);
  const placesSel = () => typesBillets(state.current).reduce((n, t) => n + (state.sel[t.id] || 0) * t.places, 0);
  const sousTotal = () => typesBillets(state.current).reduce((n, t) => n + (state.sel[t.id] || 0) * t.prix, 0);
  const remise = () => state.promo ? Math.round(sousTotal() * state.promo.pct) / 100 : 0;
  const aPayer = () => sousTotal() - remise();
  function etapesHtml() {
    return '<ol class="etapes" aria-label="Étapes de la réservation">' + ["Billets", "Coordonnées", "Récapitulatif"].map((x, i) =>
      "<li" + (state.etape === i + 1 ? ' aria-current="step"' : "") + (state.etape > i + 1 ? ' class="fait"' : "") + "><span>" + (i + 1) + "</span>" + x + "</li>").join("") + "</ol>";
  }
  function majSel() {
    const e = state.current, n = placesSel(), a = $("#qaide"), b = $("#btnSuite"), t = $("#qt");
    if (t) t.textContent = fmt(sousTotal());
    if (a) a.textContent = n + " place" + (n > 1 ? "s" : "") + " sélectionnée" + (n > 1 ? "s" : "") + " sur " + maxPlaces(e) + " possible" + (maxPlaces(e) > 1 ? "s" : "") + " par réservation.";
    if (b) b.disabled = n < 1;
  }
  function lireCoord(f) { if (f && f.nom) state.coord = { nom: f.nom.value, email: f.email.value }; }
  function appliquerPromo(valeur) {
    const code = String(valeur || "").trim().toUpperCase();
    if (!code) { state.promo = null; return "Aucun code appliqué."; }
    if (code === "DIASPO10") { state.promo = { code, pct: 10 }; return "Code DIASPO10 appliqué : −10 %."; }
    state.promo = null; return "Code inconnu. Pour l'exemple, essayez DIASPO10.";
  }
  function versTitre() { const h = $("#resa h3"); if (h) { h.tabIndex = -1; h.focus(); } }
  function reservation() {
    const e = state.current, r = placesRestantes(e), deja = state.mine.get(e.id), z = $("#resa"), billet = e.mode === "billet";
    if (deja) {
      const lg = (deja.lignes || []).map(l => "<li><span>" + l[1] + " × " + esc(l[0]) + "</span><b>" + fmt(l[2]) + "</b></li>").join("");
      z.innerHTML = '<h3>Votre ' + (billet ? "billet" : "inscription") + '</h3><p class="ok">' + deja.places + " place" + (deja.places > 1 ? "s" : "") + " réservée" + (deja.places > 1 ? "s" : "") + " pour " + esc(dateLongue(e)) + ".</p>"
        + (lg ? '<ul class="recap">' + lg + (deja.remise ? "<li><span>Code " + esc(deja.promo) + "</span><b>− " + fmt(deja.remise) + "</b></li>" : "") + '<li class="tot"><span>Total</span><b>' + fmt(deja.total) + "</b></li></ul>" : "")
        + (deja.nom ? '<p class="aide">Au nom de ' + esc(deja.nom) + " (" + esc(deja.email) + ").</p>" : "")
        + '<p>Référence : <span class="refcode">' + deja.ref + '</span></p><p class="aide">' + (e.fmt === "ligne" ? "Le lien de connexion vous est envoyé par e-mail la veille." : "Présentez cette référence à l'entrée.") + " Simulation : aucun e-mail n'est réellement envoyé.</p>"
        + '<div class="rang"><button class="btn" type="button" data-annuler="' + e.id + '" style="flex:0 0 auto">Annuler ma réservation</button></div>';
      return;
    }
    if (r <= 0) { z.innerHTML = '<h3>Événement complet</h3><p class="aide" style="margin-top:0">Toutes les places sont réservées. Laissez-nous votre adresse : vous serez prévenu(e) si une place se libère.</p><div class="rang"><button class="btn or" type="button" data-attente="' + e.id + '" style="flex:0 0 auto">Me prévenir si une place se libère</button></div>'; return; }
    const types = typesBillets(e), tete = "<h3>" + (billet ? "Réserver des billets" : "S'inscrire") + "</h3>" + etapesHtml();
    if (state.etape === 1) {
      z.innerHTML = tete + '<ul class="typesb">' + types.map(t => "<li><div><b>" + esc(t.nom) + "</b><small>" + esc(t.desc) + '</small></div><span class="prix">' + fmt(t.prix) + '</span><div class="qty" role="group" aria-label="Quantité : ' + esc(t.nom) + '"><button type="button" data-qt="' + t.id + '" data-d="-1" aria-label="Un de moins : ' + esc(t.nom) + '">−</button><span id="qv-' + t.id + '" aria-live="polite">' + (state.sel[t.id] || 0) + '</span><button type="button" data-qt="' + t.id + '" data-d="1" aria-label="Un de plus : ' + esc(t.nom) + '">+</button></div></li>').join("") + "</ul>"
        + '<div class="total"><span>Sous-total</span><span id="qt"></span></div><p class="aide" id="qaide" style="margin-top:0"></p>'
        + '<button class="btn or" type="button" data-etape="2" id="btnSuite" style="width:100%">Continuer</button>';
      majSel();
    } else if (state.etape === 2) {
      z.innerHTML = tete + '<form class="form" id="coordForm" novalidate>'
        + '<label>Nom et prénom<input type="text" name="nom" autocomplete="name" value="' + esc(state.coord.nom) + '" required></label>'
        + '<label>Adresse e-mail<input type="email" name="email" autocomplete="email" value="' + esc(state.coord.email) + '" required></label>'
        + (sousTotal() > 0 ? '<div><label class="lbl" for="promoIn">Code promo (facultatif)</label><div class="promo"><input type="text" id="promoIn" name="promo" autocomplete="off" value="' + (state.promo ? esc(state.promo.code) : "") + '"><button class="btn" type="button" data-promo style="flex:0 0 auto">Appliquer</button></div><p class="aide" id="promoMsg" role="status">' + (state.promo ? "Code " + esc(state.promo.code) + " appliqué : −" + state.promo.pct + " %." : "Pour l'exemple, le code DIASPO10 donne 10 % de remise.") + "</p></div>" : "")
        + '<p class="aide" id="regErr" role="alert" style="color:var(--alerte);margin:0"></p>'
        + '<div class="rang"><button class="btn" type="button" data-etape="1" style="flex:0 0 auto">Retour</button><button class="btn or" type="submit" style="flex:1 1 auto">Voir le récapitulatif</button></div></form>';
    } else {
      const lg = types.filter(t => state.sel[t.id]);
      z.innerHTML = tete + '<ul class="recap">' + lg.map(t => "<li><span>" + state.sel[t.id] + " × " + esc(t.nom) + "</span><b>" + fmt(state.sel[t.id] * t.prix) + "</b></li>").join("")
        + (remise() ? "<li><span>Code " + esc(state.promo.code) + " (−" + state.promo.pct + " %)</span><b>− " + fmt(remise()) + "</b></li>" : "")
        + '<li class="tot"><span>Total</span><b>' + fmt(aPayer()) + "</b></li></ul>"
        + '<p class="aide">' + placesSel() + " place" + (placesSel() > 1 ? "s" : "") + " pour " + esc(dateLongue(e)) + ", au nom de " + esc(state.coord.nom) + " (" + esc(state.coord.email) + ").</p>"
        + '<div class="rang"><button class="btn" type="button" data-etape="1" style="flex:0 0 auto">Modifier</button><button class="btn or" type="button" data-confirmer="' + e.id + '" style="flex:1 1 auto">' + (aPayer() > 0 ? "Confirmer et payer (simulé)" : billet ? "Confirmer la réservation" : "Confirmer mon inscription") + "</button></div>"
        + '<p class="aide">Aucun paiement réel n\'est effectué.</p>';
    }
  }
  let compteur = 1000 + Number(lire("ev_ex_n", 0));
  function reserver(id, places, extra) {
    const e = EVENTS.find(x => x.id === id);
    if (places > placesRestantes(e)) { toast("Il ne reste que " + placesRestantes(e) + " place(s)."); return false; }
    compteur++; ecrire("ev_ex_n", compteur - 1000);
    e.sold += places; state.mine.set(id, Object.assign({ places, ref: "DA-" + id + "-" + compteur }, extra || {}));
    memoriser(); return true;
  }
  function fermer(ov) {
    const id = state.ouvreur && state.ouvreur.dataset ? state.ouvreur.dataset.ev : null;
    ov.classList.remove("open");
    render();
    /* La liste est redessinée : on retrouve le même événement pour rendre le focus à l'endroit d'où l'on vient. */
    let cible = state.ouvreur && document.contains(state.ouvreur) ? state.ouvreur : null;
    if (!cible && id) cible = document.querySelector('.btn.or[data-ev="' + id + '"]') || document.querySelector('[data-ev="' + id + '"]');
    if (cible && cible.focus) cible.focus();
  }
  function listeMine() {
    const l = [...state.mine].map(([id, m]) => ({ e: EVENTS.find(x => x.id === id), m }));
    $("#mineBody").innerHTML = l.length
      ? '<ul class="lignes">' + l.map(x => '<li><span class="pt">' + affiche(x.e) + '</span><span><b>' + esc(x.e.t) + "</b><small>" + esc(dateLongue(x.e)) + " · " + x.m.places + " place" + (x.m.places > 1 ? "s" : "") + (x.m.total != null ? " · " + fmt(x.m.total) : "") + "</small><small>Réf. " + x.m.ref + '</small></span><button class="btn" type="button" data-ev="' + x.e.id + '" style="flex:0 0 auto">Voir</button></li>').join("") + "</ul>"
      : '<div class="vide"><b>Aucune inscription</b>Réservez un événement : votre billet apparaîtra ici.</div>';
  }

  /* ── Navigation et interactions ── */
  function versCatalogue(vue) {
    if (vue) { state.vue = vue; state.page = 1; render(); }
    const c = $("#sectMain"); if (c) c.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  document.addEventListener("click", ev => {
    const t = ev.target, q = (s) => t.closest(s); let b;
    if ((b = q("[data-nav]"))) { const v = b.dataset.nav; if (v === "accueil") window.scrollTo({ top: 0, behavior: "smooth" }); else versCatalogue(v); return; }
    if ((b = q("[data-cat]"))) { state.cat = b.dataset.cat; state.page = 1; render(); return; }
    if (q("[data-favfiltre]")) { state.fav = !state.fav; state.page = 1; render(); return; }
    if (q("#vueCartes")) { state.vue = "cartes"; state.page = 1; render(); return; }
    if (q("#vueAgenda")) { state.vue = "agenda"; render(); return; }
    if ((b = q("[data-retirer]"))) { const k = b.dataset.retirer; if (k === "q") { state.q = ""; $("#q").value = ""; } if (k === "cat") state.cat = "all"; if (k === "mois") { state.mois = "all"; $("#fMois").value = "all"; } if (k === "format") { state.format = "all"; $("#fFormat").value = "all"; } if (k === "prix") { state.prix = "all"; $("#fPrix").value = "all"; } if (k === "fav") state.fav = false; state.page = 1; render(); return; }
    if (q("[data-raz]")) { Object.assign(state, { cat: "all", q: "", mois: "all", format: "all", prix: "all", fav: false, page: 1 }); $("#q").value = ""; $("#fMois").value = "all"; $("#fFormat").value = "all"; $("#fPrix").value = "all"; render(); return; }
    if ((b = q("[data-page]"))) { state.page = Number(b.dataset.page); render(); $("#sectMain").scrollIntoView({ block: "start" }); return; }
    if ((b = q("[data-fav]"))) { const id = Number(b.dataset.fav); state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id); memoriser(); toast(state.favs.has(id) ? "Ajouté aux favoris." : "Retiré des favoris."); render(); const nb = document.querySelector('[data-fav="' + id + '"]'); if (nb) nb.focus(); return; }
    if ((b = q("[data-ev]"))) { const dansMine = $("#mineOv").classList.contains("open"); if (dansMine) $("#mineOv").classList.remove("open"); ouvrir(Number(b.dataset.ev), dansMine ? $("#openMine") : b); return; }
    if ((b = q("[data-qt]"))) {
      const e = state.current, ty = typesBillets(e).find(x => x.id === b.dataset.qt), d = Number(b.dataset.d), n = (state.sel[ty.id] || 0) + d;
      if (n < 0) return;
      if (d > 0 && placesSel() + ty.places > maxPlaces(e)) { toast("Maximum : " + maxPlaces(e) + " place" + (maxPlaces(e) > 1 ? "s" : "") + " par réservation."); return; }
      state.sel[ty.id] = n; $("#qv-" + ty.id).textContent = n; majSel(); return;
    }
    if ((b = q("[data-etape]"))) {
      lireCoord($("#coordForm"));
      const v = Number(b.dataset.etape); if (v === 2 && placesSel() < 1) return;
      state.etape = v; reservation(); versTitre(); return;
    }
    if (q("[data-promo]")) { lireCoord($("#coordForm")); $("#promoMsg").textContent = appliquerPromo($("#promoIn").value); return; }
    if ((b = q("[data-confirmer]"))) {
      const e = state.current, lignes = typesBillets(e).filter(x => state.sel[x.id]).map(x => [x.nom, state.sel[x.id], state.sel[x.id] * x.prix]);
      const extra = { nom: state.coord.nom.trim(), email: state.coord.email.trim(), lignes, total: aPayer(), remise: remise(), promo: state.promo ? state.promo.code : "" };
      if (reserver(e.id, placesSel(), extra)) { toast("Réservation simulée : " + placesSel() + " place(s). Aucun paiement réel."); ficher(); versTitre(); }
      return;
    }
    if ((b = q("[data-annuler]"))) { const id = Number(b.dataset.annuler), m = state.mine.get(id); EVENTS.find(x => x.id === id).sold -= m.places; state.mine.delete(id); memoriser(); toast("Réservation annulée."); ficher(); return; }
    if (q("[data-attente]")) { toast("Liste d'attente simulée : vous serez prévenu(e) si une place se libère."); return; }
    if (q("#openMine")) { state.ouvreur = q("#openMine"); listeMine(); $("#mineOv").classList.add("open"); $("#mineOv [data-close]").focus(); return; }
    if (q("#navCompte")) { toast("Compte simulé : vous êtes connecté(e) en tant que visiteur de l'exemple."); return; }
    if (q("[data-close]")) { fermer(q(".overlay")); return; }
    if (t.classList && t.classList.contains("overlay")) fermer(t);
  });
  document.addEventListener("submit", ev => {
    if (ev.target.id !== "coordForm") return;
    ev.preventDefault();
    const f = ev.target, err = $("#regErr"); lireCoord(f);
    if (!state.coord.nom.trim()) { err.textContent = "Indiquez votre nom et prénom."; f.nom.focus(); return; }
    if (!/^\S+@\S+\.\S+$/.test(state.coord.email.trim())) { err.textContent = "Indiquez une adresse e-mail valide, par exemple nom@exemple.fr."; f.email.focus(); return; }
    const pi = $("#promoIn");
    if (pi) {
      const msg = appliquerPromo(pi.value);
      if (pi.value.trim() && !state.promo) { err.textContent = msg + " Corrigez le code ou videz le champ."; pi.focus(); return; }
    }
    state.etape = 3; reservation(); versTitre();
  });
  $("#q").addEventListener("input", ev => { state.q = ev.target.value; state.page = 1; render(); });
  $("#fMois").addEventListener("change", ev => { state.mois = ev.target.value; state.page = 1; render(); });
  $("#fFormat").addEventListener("change", ev => { state.format = ev.target.value; state.page = 1; render(); });
  $("#fPrix").addEventListener("change", ev => { state.prix = ev.target.value; state.page = 1; render(); });
  $("#tri").addEventListener("change", ev => { state.tri = ev.target.value; state.page = 1; render(); });
  document.addEventListener("keydown", ev => {
    const ouverts = [...document.querySelectorAll(".overlay.open")];
    if (!ouverts.length) return;
    const ov = ouverts[ouverts.length - 1];
    if (ev.key === "Escape") { fermer(ov); return; }
    if (ev.key === "Tab") {
      const f = [...ov.querySelectorAll("button, a[href], input, select, textarea")].filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return; const a = f[0], z = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === a) { ev.preventDefault(); z.focus(); } else if (!ev.shiftKey && document.activeElement === z) { ev.preventDefault(); a.focus(); }
    }
  });
  /* Hauteur du bandeau d'exemple : sert de décalage aux éléments collants et aux fenêtres */
  (function () {
    const maj = () => { const b = document.getElementById("exBandeau"); document.documentElement.style.setProperty("--ex-h", (b ? b.offsetHeight : 0) + "px"); };
    window.addEventListener("load", maj); window.addEventListener("resize", maj); maj();
    if (window.ResizeObserver) { const b = document.getElementById("exBandeau"); if (b) new ResizeObserver(maj).observe(b); }
  })();
  optionsMois();
  render();
</script>
</body>
</html>
