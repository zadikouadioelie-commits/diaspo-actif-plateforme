  /* ══════════ PARTICIPER ══════════ */
  async function vueParticiper(id){
    let data;
    try { data = await apiRec('GET', `/recensements/${id}`); } catch(e) { wrap.innerHTML = `<div class="rec-empty">Recensement introuvable ou clos.</div>`; return; }
    const rec = data.recensement;
    const estPro = rec.modele === 'carnet_professionnel';
    const champsActifs = rec.champs_config.filter(c => c.actif);
    // Brouillon sauvegardé avant un aller-retour "créer un compte" (§35) — restauré plus bas.
    const cleBrouillon = `da_rec_brouillon_${id}`;
    let visibiliteChamps = {};

    /* Types 'tags'/'domaine_activite'/'upload_photo' ajoutés pour le Carnet professionnel
       (§9, §7, §6) — champHtml()/lireChamps() restent la seule fonction de rendu du
       formulaire, réutilisée telle quelle par le Dénombrement (aucun de ces types n'y est
       proposé, donc aucun changement de comportement pour lui). */
    const tagsState = {}; // { fid: [valeurs] }
    function champHtml(c, prefix){
      const fid = `${prefix}-${c.id}`;
      const oblig = c.obligatoire ? ' *' : '';
      if (c.type === 'oui_non') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><select id="${fid}"><option value="">—</option><option value="oui">Oui</option><option value="non">Non</option></select></div>`;
      if (['choix_unique','liste_deroulante'].includes(c.type)) return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><select id="${fid}"><option value="">—</option>${(c.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;
      if (c.type === 'choix_multiple') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label>${(c.options||[]).map(o=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:4px;"><input type="checkbox" class="cm-${fid}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`;
      if (c.type === 'nombre') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><input type="number" id="${fid}"></div>`;
      if (c.type === 'date' || c.id === 'date_naissance') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><input type="date" id="${fid}"></div>`;
      if (c.type === 'texte_long') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><textarea id="${fid}" rows="3"></textarea></div>`;
      if (c.type === 'domaine_activite') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><select id="${fid}"><option value="">— Sélectionner —</option>${window.domaineActiviteOptionsHTML ? domaineActiviteOptionsHTML() : ''}</select></div>`;
      if (c.type === 'upload_photo') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><div id="${fid}-preview" style="margin-bottom:6px;"></div><button type="button" class="rec-btn rec-btn-outline" data-photo-btn="${fid}">📷 Choisir une photo</button><input type="hidden" id="${fid}"></div>`;
      if (c.type === 'tags') { tagsState[fid] = tagsState[fid] || []; return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label>
        <div style="display:flex;gap:8px;"><input type="text" id="${fid}-ajout" placeholder="Tapez puis Entrée..."><button type="button" class="rec-btn rec-btn-outline" data-tag-btn="${fid}">+ Ajouter</button></div>
        <div id="${fid}-liste" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div></div>`; }
      if (c.id === 'email' || c.type === 'email') return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><input type="email" id="${fid}"></div>`;
      return `<div class="rec-field"><label>${esc(c.label)}${oblig}</label><input type="text" id="${fid}" ${c.type==='texte_suggere'?'list="'+fid+'-suggestions"':''}></div>`;
    }
    function wireChampSpeciaux(liste, prefix){
      liste.forEach(c => {
        const fid = `${prefix}-${c.id}`;
        if (c.type === 'tags') {
          const rerender = () => { document.getElementById(`${fid}-liste`).innerHTML = tagsState[fid].map((t,i) => `<span style="background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;">${esc(t)}<button type="button" data-tag-del="${fid}:${i}" style="background:none;border:none;cursor:pointer;color:#dc2626;">✕</button></span>`).join(''); document.querySelectorAll(`[data-tag-del^="${fid}:"]`).forEach(b => b.addEventListener('click', () => { tagsState[fid].splice(+b.dataset.tagDel.split(':')[1], 1); rerender(); })); };
          const ajouter = () => { const inp = document.getElementById(`${fid}-ajout`); const v = inp.value.trim(); if (v) { tagsState[fid].push(v); inp.value = ''; rerender(); } };
          document.querySelector(`[data-tag-btn="${fid}"]`)?.addEventListener('click', ajouter);
          document.getElementById(`${fid}-ajout`)?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ajouter(); } });
          rerender();
        }
        if (c.type === 'upload_photo') {
          document.querySelector(`[data-photo-btn="${fid}"]`)?.addEventListener('click', async () => {
            if (typeof pickAndUpload !== 'function') return;
            const url = await pickAndUpload('post', { maxW: 800, maxH: 800 });
            if (!url) return;
            document.getElementById(fid).value = url;
            document.getElementById(`${fid}-preview`).innerHTML = `<img src="${esc(url)}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;">`;
          });
        }
      });
    }

    const accesConfigCampagne = rec.acces_config || {}; // exposé seulement si on est propriétaire, sinon undefined — normal, sans effet ici (participant ≠ propriétaire)
    wrap.innerHTML = `
      ${rec.image_url ? `<img src="${esc(rec.image_url)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:18px;">` : ''}
      <div class="rec-hero"><div><h1>${esc(rec.nom)}</h1><p>${esc(rec.description)}</p></div>
        <a class="rec-btn rec-btn-outline" href="recensement.html">← Retour</a></div>
      ${!moi ? `
      <div class="rec-card" style="background:#EFF6FF;border-color:#BFDBFE;">
        <h3 style="margin:0 0 10px;color:#1e40af;">Accéder au formulaire</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <a class="rec-btn rec-btn-outline" href="login.html?redirect=${encodeURIComponent(location.href)}">J'ai déjà un compte Diaspo'Actif → Se connecter</a>
          <button type="button" class="rec-btn rec-btn-primary" id="part-btn-creer-compte">Je n'ai pas de compte → Créer mon compte Diaspo'Actif</button>
        </div>
        <p style="font-size:12px;color:#1e40af;margin:10px 0 0;">Créer un compte gratuit permet de retrouver et mettre à jour votre fiche, développer votre réseau professionnel, découvrir des initiatives et recevoir des opportunités correspondant à votre profil. Vous pouvez aussi <strong>continuer sans compte</strong> ci-dessous si vous préférez.</p>
      </div>` : ''}
      <div class="rec-card">
        <h3 style="margin:0 0 14px;">Vos informations</h3>
        <div id="part-champs-adulte">${champsActifs.map(c => champHtml(c, 'pa')).join('')}</div>
        ${estPro ? `<div id="part-visibilite-zone"></div>` : ''}
        ${rec.mineurs_autorises ? `
          <label style="display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;cursor:pointer;margin:18px 0 10px;background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:9px;padding:13px 14px;color:#9A3412;">
            <input type="checkbox" id="part-est-mineur" style="width:18px;height:18px;flex:none;"> 🧒 Je déclare une personne mineure (au lieu de moi-même)
          </label>
          <div id="part-mineur-detail" style="display:none;">
            <div class="rec-card" style="background:var(--bg);border:none;">
              <h4 style="margin:0 0 10px;">Informations de la personne mineure</h4>
              ${rec.champs_mineur_config.filter(c=>c.actif).map(c => champHtml(c, 'pm')).join('')}
              <h4 style="margin:14px 0 10px;">Responsable légal déclarant</h4>
              <div class="rec-field"><label>Nom *</label><input id="resp-nom"></div>
              <div class="rec-field"><label>Prénom *</label><input id="resp-prenom"></div>
              <div class="rec-field"><label>Adresse e-mail *</label><input type="email" id="resp-email"></div>
              <div class="rec-field"><label>Téléphone</label><input id="resp-tel"></div>
            </div>
          </div>` : ''}
        <div id="part-acces-wrap" style="${moi ? 'display:none;' : ''}">
          <h4 style="margin:18px 0 8px;">Pour retrouver votre déclaration</h4>
          <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">${moi ? 'Vous êtes connecté — votre déclaration sera associée à votre compte.' : "Continuer sans compte : cette adresse e-mail et ce mot de passe vous permettront de retrouver votre déclaration."}</p>
          <div class="rec-field"><label>Adresse e-mail</label><input type="email" id="part-acces-email"></div>
          <div class="rec-field"><label>Mot de passe</label><input type="password" id="part-acces-pwd"></div>
        </div>
        <button class="rec-btn rec-btn-primary" id="part-btn-envoyer">Envoyer ma déclaration</button>
        <p class="rec-msg" id="part-msg"></p>
      </div>
    `;
    wireChampSpeciaux(champsActifs, 'pa');
    if (rec.mineurs_autorises) wireChampSpeciaux(rec.champs_mineur_config.filter(c=>c.actif), 'pm');

    /* §18 — la personne recensée choisit, pour chacun de SES champs actifs, jusqu'où elle veut
       le diffuser (jamais le créateur de la campagne, qui ne règle que l'accès global §15-17). */
    if (estPro) {
      const zone = document.getElementById('part-visibilite-zone');
      const NIVEAUX = [['prive','🔒 Privé'],['autorises','🎯 Autorisés'],['membres','👥 Membres'],['public','🌐 Public']];
      zone.innerHTML = `<div class="rec-card" style="background:var(--bg);border:none;margin-top:6px;">
        <h4 style="margin:0 0 4px;">Visibilité de vos informations</h4>
        <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Pour chaque information, choisissez qui peut la voir. Une donnée renseignée n'est jamais automatiquement publiée.</p>
        ${champsActifs.map(c => `<div class="rec-champ-row"><span class="rec-champ-nom">${esc(c.label)}</span><select data-vis="${c.id}" style="width:auto;">${NIVEAUX.map(([v,l])=>`<option value="${v}" ${v==='prive'?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}
      </div>`;
      zone.querySelectorAll('[data-vis]').forEach(sel => sel.addEventListener('change', () => { visibiliteChamps[sel.dataset.vis] = sel.value; }));
    }

    const chk = document.getElementById('part-est-mineur');
    if (chk) chk.addEventListener('change', (e) => { document.getElementById('part-mineur-detail').style.display = e.target.checked ? '' : 'none'; document.getElementById('part-acces-wrap').style.display = (moi || e.target.checked) ? 'none' : ''; });

    // §35 — brouillon restauré après un retour depuis la création de compte (voir plus bas).
    (function restaurerBrouillon(){
      let brouillon; try { brouillon = JSON.parse(localStorage.getItem(cleBrouillon) || 'null'); } catch(e) { brouillon = null; }
      if (!brouillon) return;
      localStorage.removeItem(cleBrouillon);
      Object.entries(brouillon.reponses || {}).forEach(([k,v]) => { const el = document.getElementById(`pa-${k}`); if (el && typeof v === 'string') el.value = v; else if (Array.isArray(v) && tagsState[`pa-${k}`]) { tagsState[`pa-${k}`] = v; wireChampSpeciaux(champsActifs, 'pa'); } });
    })();
    document.getElementById('part-btn-creer-compte')?.addEventListener('click', () => {
      try { localStorage.setItem(cleBrouillon, JSON.stringify({ reponses: lireChamps(champsActifs, 'pa') })); } catch(e) {}
      location.href = `inscription.html?redirect=${encodeURIComponent(location.href)}`;
    });

    function lireChamps(liste, prefix){
      const out = {};
      liste.forEach(c => {
        const fid = `${prefix}-${c.id}`;
        if (c.type === 'choix_multiple') { out[c.id] = [...document.querySelectorAll(`.cm-${fid}:checked`)].map(x=>x.value); return; }
        if (c.type === 'tags') { out[c.id] = tagsState[fid] || []; return; }
        const el = document.getElementById(fid);
        if (el) out[c.id] = el.value;
      });
      return out;
    }

    document.getElementById('part-btn-envoyer').addEventListener('click', async () => {
      const msg = document.getElementById('part-msg');
      const estMineur = chk && chk.checked;
      const reponses = lireChamps(champsActifs, 'pa');
      for (const c of champsActifs) if (c.obligatoire && !(Array.isArray(reponses[c.id]) ? reponses[c.id].length : reponses[c.id])) { msg.className='rec-msg rec-msg-err'; msg.textContent = `Le champ « ${c.label} » est obligatoire.`; return; }
      const body = { est_mineur: !!estMineur, reponses };
      if (estPro) body.visibilite_champs = visibiliteChamps;
      if (estMineur) {
        body.reponses = lireChamps(rec.champs_mineur_config.filter(c=>c.actif), 'pm');
        body.responsable = { nom: document.getElementById('resp-nom').value.trim(), prenom: document.getElementById('resp-prenom').value.trim(), email: document.getElementById('resp-email').value.trim(), telephone: document.getElementById('resp-tel').value.trim() };
        if (!body.responsable.nom || !body.responsable.prenom || !body.responsable.email) { msg.className='rec-msg rec-msg-err'; msg.textContent = 'Les informations du responsable légal déclarant sont obligatoires.'; return; }
      }
      if (!moi) {
        body.acces_email = document.getElementById('part-acces-email').value.trim();
        body.acces_password = document.getElementById('part-acces-pwd').value;
        if (!body.acces_email || !body.acces_password) { msg.className='rec-msg rec-msg-err'; msg.textContent = 'Adresse e-mail et mot de passe requis pour retrouver votre déclaration.'; return; }
      }
      try {
        const r = await apiRec('POST', `/recensements/${id}/declarations`, body);
        if (r.acces_token) setToken(r.id, r.acces_token);
        if (!moi) {
          // §35 — fin du parcours sans compte : proposer la création plutôt que de l'imposer.
          try { localStorage.setItem('da_rec_invite_' + r.id, '1'); } catch(e) {}
        }
        location.href = `recensement.html?vue=declaration&decl=${r.id}`;
      } catch(e) {
        msg.className = 'rec-msg rec-msg-err';
        msg.textContent = e.status === 409 ? e.message : (e.message || 'Erreur lors de l\'envoi.');
      }
    });
  }

  /* ══════════ MA DÉCLARATION ══════════ */
  async function vueDeclaration(declId){
    if (!declId) { location.href = 'recensement.html'; return; }
    let data;
    try { data = await apiRec('GET', `/recensement-declarations/${declId}`, undefined, declId); }
    catch(e) { wrap.innerHTML = `<div class="rec-empty">⚠️ ${e.status===403?'Accès refusé.':'Déclaration introuvable.'}</div>`; return; }
    const d = data.declaration, rep = d.reponses, recMeta = data.recensement || {};
    /* Vérification d'identité — le bouton n'apparaît que si le créateur l'a activée pour ce
       recensement ET que la déclaration n'est pas déjà vérifiée/en cours. Si "les_deux"
       documents sont acceptés, on demande d'abord lequel le participant compte présenter :
       Stripe Identity ne restreint pas par pays (il détecte le document lui-même), ce choix
       est donc uniquement informatif/déclaratif, gardé en mémoire côté navigateur pour cette
       session — jamais envoyé comme une preuve, seul le document réel scanné par Stripe fait foi. */
    const peutVerifier = recMeta.verification_identite === 'activee' && !['verifie','en_cours'].includes(d.identite_statut);
    const docsAcceptes = recMeta.verification_identite_documents || 'les_deux';
    const visLabels = { prive: '🔒 Privé', autorises: '🎯 Autorisés', membres: '👥 Membres', public: '🌐 Public' };
    const visChamps = d.visibilite_champs || {};
    // §35, dernière étape — invite (pas d'obligation) à créer un compte, une seule fois après
    // une déclaration faite sans compte (marqueur posé par vueParticiper à l'envoi).
    let inviteCompte = '';
    if (!moi) { try { if (localStorage.getItem('da_rec_invite_' + declId)) { localStorage.removeItem('da_rec_invite_' + declId); inviteCompte = `
      <div class="rec-card" style="background:#EFF6FF;border-color:#BFDBFE;margin-bottom:16px;">
        <h3 style="margin:0 0 8px;color:#1e40af;">✅ Votre ${recMeta.modele==='carnet_professionnel'?'Carnet professionnel a été enregistré':'déclaration a été enregistrée'}.</h3>
        <p style="font-size:13px;color:#1e40af;margin:0 0 12px;">Créez maintenant votre compte Diaspo'Actif pour retrouver votre fiche, la mettre à jour et profiter des services de la plateforme.</p>
        <a class="rec-btn rec-btn-primary" href="inscription.html">Créer mon compte Diaspo'Actif</a>
      </div>`; } } catch(e){} }
    const lienPartage = `${location.origin}/recensement.html?vue=fiche&decl=${declId}`;
    wrap.innerHTML = `
      ${inviteCompte}
      <div class="rec-hero"><div><h1>Ma déclaration</h1><p>${esc(recMeta.nom||'')} — ${esc(d.identifiant)}</p></div>
        <a class="rec-btn rec-btn-outline" href="recensement.html">← Retour</a></div>
      <div class="rec-card">
        <span class="rec-badge rec-badge-${d.identite_statut}">${IDENTITE_LABELS[d.identite_statut]||d.identite_statut}</span>
        <div style="margin-top:14px;">
          ${Object.entries(rep).map(([k,v]) => v && (typeof v !== 'object' || (Array.isArray(v)&&v.length)) ? `<div class="rec-resume-row"><span class="k">${esc(k.replace(/_/g,' '))}</span><span class="v">${recMeta.modele==='carnet_professionnel'?esc(visLabels[visChamps[k]||'prive']):'🔒'} ${esc(Array.isArray(v)?v.join(', '):v)}</span></div>` : '').join('')}
        </div>
        ${recMeta.modele==='carnet_professionnel' ? `
        <div class="rec-actions" style="margin-top:14px;">
          <button class="rec-btn rec-btn-outline" id="decl-btn-partager">🔗 Partager ma fiche</button>
        </div>
        <p class="rec-msg" id="decl-partage-msg"></p>` : ''}
        ${peutVerifier ? `
        <div class="rec-card" style="background:#EFF6FF;border-color:#BFDBFE;margin-top:16px;">
          <h4 style="margin:0 0 8px;color:#1e40af;">🪪 Vérification d'identité</h4>
          <p style="font-size:12.5px;color:#1e40af;margin:0 0 12px;">Diaspo'Actif ne stocke jamais votre document — il est transmis directement à notre prestataire (Stripe Identity), seul le résultat de la vérification est conservé.</p>
          ${docsAcceptes === 'les_deux' ? `
          <div class="rec-field"><label>Avec quel document allez-vous vérifier votre identité ?</label>
            <select id="decl-verif-doc">
              <option value="residence">Document du pays de résidence</option>
              <option value="origine">Document du pays d'origine</option>
            </select>
          </div>` : `<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;">Document accepté pour ce recensement : ${docsAcceptes==='residence'?'pays de résidence':'pays d\'origine'}.</p>`}
          <button class="rec-btn rec-btn-primary" id="decl-btn-verifier">🪪 Vérifier mon identité</button>
        </div>` : ''}
        <div class="rec-actions" style="margin-top:18px;">
          <button class="rec-btn rec-btn-outline" id="decl-btn-modif">✏️ Demander une modification</button>
          <button class="rec-btn rec-btn-danger" id="decl-btn-suppr">🗑️ Supprimer mes informations</button>
        </div>
        <p class="rec-msg" id="decl-msg"></p>
      </div>
    `;
    if (peutVerifier) {
      document.getElementById('decl-btn-verifier').addEventListener('click', async () => {
        const btn = document.getElementById('decl-btn-verifier');
        btn.disabled = true; btn.textContent = '⏳ Préparation…';
        try {
          const r = await apiRec('POST', `/recensement-declarations/${declId}/verification-identite`, {}, declId);
          location.href = r.url;
        } catch(e) {
          btn.disabled = false; btn.textContent = '🪪 Vérifier mon identité';
          const m=document.getElementById('decl-msg'); m.className='rec-msg rec-msg-err'; m.textContent = e.message;
        }
      });
    }
    document.getElementById('decl-btn-partager')?.addEventListener('click', () => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(13,27,42,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
      overlay.innerHTML = `<div class="rec-card" style="max-width:340px;width:100%;margin:0;text-align:center;">
        <h3 style="margin:0 0 14px;">🔗 Partager ma fiche</h3>
        <div id="decl-qr" style="display:flex;justify-content:center;margin-bottom:14px;"></div>
        <input readonly value="${esc(lienPartage)}" style="width:100%;box-sizing:border-box;padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:12px;margin-bottom:10px;" onclick="this.select()">
        <div style="display:flex;gap:8px;justify-content:center;">
          <button type="button" class="rec-btn rec-btn-primary" id="decl-copier-lien">Copier le lien</button>
          <button type="button" class="rec-btn rec-btn-outline" id="decl-fermer-partage">Fermer</button>
        </div>
        <p style="font-size:11px;color:var(--muted);margin:12px 0 0;">Seuls les champs que vous avez rendus visibles apparaîtront à la personne qui ouvre ce lien.</p>
      </div>`;
      document.body.appendChild(overlay);
      if (window.QRCode) new QRCode(document.getElementById('decl-qr'), { text: lienPartage, width: 160, height: 160 });
      document.getElementById('decl-copier-lien').addEventListener('click', () => { navigator.clipboard?.writeText(lienPartage); document.getElementById('decl-copier-lien').textContent = 'Copié ✓'; });
      document.getElementById('decl-fermer-partage').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    });
    document.getElementById('decl-btn-modif').addEventListener('click', () => {
      const champ = prompt("Quel champ souhaitez-vous modifier ? (ex : email, telephone, adresse...)");
      if (!champ) return;
      const val = prompt("Nouvelle valeur :");
      if (!val) return;
      const motif = prompt("Motif (facultatif) :") || '';
      apiRec('POST', `/recensement-declarations/${declId}/demande-modification`, { champ, nouvelle_valeur: val, motif }, declId)
        .then(() => { const m=document.getElementById('decl-msg'); m.className='rec-msg rec-msg-ok'; m.textContent='Demande envoyée — 🟠 en attente de traitement.'; })
        .catch(e => { const m=document.getElementById('decl-msg'); m.className='rec-msg rec-msg-err'; m.textContent=e.message; });
    });
    document.getElementById('decl-btn-suppr').addEventListener('click', () => {
      if (!confirm("⚠️ Suppression définitive\n\nVous êtes sur le point de supprimer vos informations de ce dénombrement. Cette action est définitive.\n\nConfirmer ?")) return;
      apiRec('DELETE', `/recensement-declarations/${declId}`, undefined, declId)
        .then(() => { alert('Vos informations ont été supprimées.'); location.href = 'recensement.html'; })
        .catch(e => alert(e.message));
    });
  }

  /* ══════════ FICHE PUBLIQUE — Carnet professionnel (§23-24) ══════════
     Distincte de vueDeclaration() : ici un TIERS consulte la fiche de quelqu'un d'autre — accès
     et visibilité par champ vérifiés côté serveur à chaque appel, jamais côté client (§18/§32). */
  async function vueFichePublique(declId){
    if (!declId) { location.href = 'recensement.html'; return; }
    let data, emailVisiteur = null;
    async function charger(){
      const opts = { credentials: 'same-origin', headers: {} };
      if (emailVisiteur) opts.headers['X-Visiteur-Email'] = emailVisiteur;
      const res = await fetch(`/api/recensement-declarations/${declId}/fiche-publique`, opts);
      const j = await res.json();
      if (!res.ok) throw Object.assign(new Error(j.error || 'Erreur'), { status: res.status });
      return j;
    }
    try { data = await charger(); }
    catch(e) {
      if (e.status === 403) {
        wrap.innerHTML = `<div class="rec-card" style="max-width:420px;margin:40px auto;text-align:center;">
          <div style="font-size:32px;">🔒</div>
          <h3 style="margin:10px 0;">Fiche non accessible</h3>
          <p style="font-size:13px;color:var(--muted);">Cette fiche est réservée à certaines personnes. Si vous avez été autorisé par adresse e-mail, saisissez-la ci-dessous.</p>
          <div class="rec-field"><input type="email" id="fp-email" placeholder="votre@email.com"></div>
          <button class="rec-btn rec-btn-primary" id="fp-retry">Vérifier mon accès</button>
        </div>`;
        document.getElementById('fp-retry').addEventListener('click', () => { emailVisiteur = document.getElementById('fp-email').value.trim(); vueFichePublique(declId); });
        return;
      }
      wrap.innerHTML = `<div class="rec-empty">Fiche introuvable.</div>`; return;
    }
    const rep = data.fiche.reponses;
    const nomComplet = [rep.prenom, rep.nom_professionnel || rep.nom].filter(Boolean).join(' ') || 'Fiche professionnelle';
    const ligne = (label, val) => val ? `<div class="rec-resume-row"><span class="k">${esc(label)}</span><span class="v">${esc(Array.isArray(val)?val.join(' · '):val)}</span></div>` : '';
    wrap.innerHTML = `
      <div class="rec-hero"><div><h1>${esc(nomComplet)}</h1><p>${esc([rep.metier_principal, rep.domaine_principal].filter(Boolean).join(' — '))}</p></div>
        <a class="rec-btn rec-btn-outline" href="recensement.html">← Retour</a></div>
      <div class="rec-card">
        ${rep.photo ? `<img src="${esc(rep.photo)}" alt="" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:14px;">` : ''}
        ${rep.presentation ? `<p style="font-size:13.5px;line-height:1.6;margin:0 0 16px;">${esc(rep.presentation)}</p>` : ''}
        ${ligne('Fonction', rep.fonction_poste)}${ligne('Statut', rep.statut_professionnel)}
        ${ligne('Compétences', rep.competences)}${ligne('Services proposés', rep.services_proposes)}
        ${ligne('Entreprise', rep.entreprise_nom)}${ligne('Secteur', rep.entreprise_secteur)}
        ${ligne('Ville', rep.entreprise_ville)}${ligne('Pays', rep.entreprise_pays)}
        ${ligne('SIRET', rep.entreprise_siret)}
        <div class="rec-actions" style="margin-top:16px;">
          ${rep.email_pro ? `<a class="rec-btn rec-btn-outline" href="mailto:${esc(rep.email_pro)}">✉️ Contacter</a>` : ''}
          ${rep.site_web ? `<a class="rec-btn rec-btn-outline" href="${esc(rep.site_web)}" target="_blank" rel="noopener">🌐 Voir le site</a>` : ''}
          <button class="rec-btn rec-btn-outline" id="fp-partager">🔗 Partager</button>
        </div>
      </div>
    `;
    document.getElementById('fp-partager').addEventListener('click', () => { navigator.clipboard?.writeText(location.href); alert('Lien copié.'); });
  }

  /* ══════════ ANNUAIRE — recherche dans la base professionnelle (§22) ══════════ */
  async function vueAnnuaire(id){
    if (!id) { location.href = 'recensement.html'; return; }
    let rec;
    try { rec = (await apiRec('GET', `/recensements/${id}`)).recensement; } catch(e) { wrap.innerHTML = `<div class="rec-empty">Recensement introuvable.</div>`; return; }
    wrap.innerHTML = `
      <div class="rec-hero"><div><h1>🔎 Annuaire professionnel</h1><p>${esc(rec.nom)}</p></div>
        <a class="rec-btn rec-btn-outline" href="recensement.html">← Retour</a></div>
      <div class="rec-card">
        <div class="rec-row2">
          <div class="rec-field"><label>Métier</label><input id="an-metier"></div>
          <div class="rec-field"><label>Domaine</label><input id="an-domaine"></div>
          <div class="rec-field"><label>Entreprise</label><input id="an-entreprise"></div>
          <div class="rec-field"><label>Compétence</label><input id="an-competence"></div>
          <div class="rec-field"><label>Ville</label><input id="an-ville"></div>
          <div class="rec-field"><label>Pays</label><input id="an-pays"></div>
        </div>
        <button class="rec-btn rec-btn-primary" id="an-btn-rechercher">🔎 Rechercher</button>
      </div>
      <div id="an-resultats"></div>
    `;
    async function rechercher(){
      const q = new URLSearchParams();
      [['metier','an-metier'],['domaine','an-domaine'],['entreprise','an-entreprise'],['competence','an-competence'],['ville','an-ville'],['pays','an-pays']]
        .forEach(([k,fid]) => { const v = document.getElementById(fid).value.trim(); if (v) q.set(k, v); });
      const zone = document.getElementById('an-resultats');
      zone.innerHTML = `<div class="rec-empty">Recherche…</div>`;
      try {
        const r = await apiRec('GET', `/recensements/${id}/annuaire?${q.toString()}`);
        const resultats = r.resultats || [];
        zone.innerHTML = !resultats.length ? `<div class="rec-empty">Aucun résultat.</div>` : `<div class="rec-grid">${resultats.map(f => `
          <div class="rec-card rec-campagne-card" onclick="location.href='recensement.html?vue=fiche&decl=${f.id}'">
            <h3 style="margin:0 0 6px;font-size:15px;">${esc([f.reponses.prenom, f.reponses.nom_professionnel||f.reponses.nom].filter(Boolean).join(' ')||'Fiche')}</h3>
            <p style="margin:0;font-size:12.5px;color:var(--muted);">${esc([f.reponses.metier_principal, f.reponses.domaine_principal].filter(Boolean).join(' — '))}</p>
            ${f.reponses.entreprise_nom ? `<p style="margin:4px 0 0;font-size:12px;color:var(--muted);">🏢 ${esc(f.reponses.entreprise_nom)}</p>` : ''}
          </div>`).join('')}</div>`;
      } catch(e) { zone.innerHTML = `<div class="rec-empty">${esc(e.message)}</div>`; }
    }
    document.getElementById('an-btn-rechercher').addEventListener('click', rechercher);
    rechercher();
  }

  init();
})();
</script>
</body>
</html>
