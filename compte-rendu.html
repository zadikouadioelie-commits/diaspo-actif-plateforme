const ST = { evtId: null, data: null, user: null, ed: null, mail: null };

/* ---------- utilitaires ---------- */
function toast(m) { const t = document.createElement('div'); t.className = 'crp-toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function modal(html, onReady) {
  const ov = document.createElement('div'); ov.className = 'crp-ov'; ov.innerHTML = '<div class="crp-modal">' + html + '</div>';
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov); if (onReady) onReady(ov, () => ov.remove()); return ov;
}
function mentionHtml(s) {
  let h = esc(s || '');
  h = h.replace(/[@*]\[([^\]]+)\]\(([uic]):(\d+)\)/g, (m, nom, t, id) => {
    const href = { u: 'profil.html?id=', i: 'initiative.html?id=', c: 'profil-collectivite.html?id=' }[t] + id;
    return '<a href="' + href + '" class="crp-chip" style="padding:0 6px">@' + nom + '</a>';
  });
  return h.replace(/\n/g, '<br>');
}
const fmtDate = d => d ? new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
const fmtDateCourte = d => d ? new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

/* ---------- autocomplétion @ et * (propositions : inscrits de l'événement + recherche de comptes) ---------- */
function attachMention(el) {
  let box = null, idx = 0, items = [], timer = null;
  const close = () => { if (box) box.remove(); box = null; };
  async function chercher(q) {
    try { const r = await api('GET', `/evenements/${ST.evtId}/identifications/suggestions?q=${encodeURIComponent(q)}`); items = (r.suggestions || []).slice(0, 6); } catch (_) { items = []; }
    if (!items.length) { close(); return; }
    idx = 0;
    if (!box) { box = document.createElement('div'); box.className = 'crp-ac'; el.parentNode.style.position = 'relative'; el.parentNode.appendChild(box); box.style.left = '0'; box.style.top = (el.offsetTop + el.offsetHeight + 2) + 'px'; }
    box.innerHTML = items.map((c, i) => '<div class="' + (i === 0 ? 'act' : '') + '" data-i="' + i + '"><b>' + esc(c.nom) + '</b> <span class="crp-note">' + esc(c.detail || '') + '</span></div>').join('');
    $$('div', box).forEach(d => d.addEventListener('mousedown', ev => { ev.preventDefault(); pick(items[d.dataset.i]); }));
  }
  function pick(c) {
    const pos = el.selectionStart, before = el.value.slice(0, pos), after = el.value.slice(pos);
    const nb = before.replace(/[@*]([^@*\n]*)$/, '@[' + c.nom + '](u:' + c.user_id + ') ');
    el.value = nb + after; el.setSelectionRange(nb.length, nb.length); close(); el.focus(); el.dispatchEvent(new Event('input'));
  }
  el.addEventListener('input', () => {
    const before = el.value.slice(0, el.selectionStart), m = before.match(/(^|\s)[@*]([^\s@*\[][^@*\n\[]{0,24}|)$/);
    if (!m) { close(); return; }
    clearTimeout(timer); timer = setTimeout(() => chercher(m[2].toLowerCase()), 180);
  });
  el.addEventListener('keydown', e => {
    if (!box) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pick(items[idx]); return; }
    else if (e.key === 'Escape') { close(); return; } else return;
    $$('div', box).forEach((d, i) => d.classList.toggle('act', i === idx));
  });
  el.addEventListener('blur', () => setTimeout(close, 150));
}

/* ---------- identification des participants ---------- */
function chipsIdentifies(editable) {
  const l = (ST.data.identifies || []).map(i => '<a class="crp-chip" href="profil.html?id=' + i.user_id + '">@' + esc(i.nom) + '</a>' + '').join('');
  const removable = (ST.data.identifies || []).map(i => '<span class="crp-chip">@' + esc(i.nom) + ' <span class="x" data-idrm="' + i.user_id + '">×</span></span>').join('');
  return (editable ? removable : l) + (editable ? '<button type="button" class="crp-chip add" data-ident>＋ Identifier un participant</button>' : '');
}
async function identModal() {
  modal('<h2>Identifier des participants</h2><p class="crp-note">Choisissez les comptes qui ont participé à l\'événement. Ils reçoivent une notification. Vous pouvez le faire même sans compte-rendu.</p><input id="idq" placeholder="Rechercher un nom…" style="width:100%;box-sizing:border-box"><div class="crp-pick" id="idl"></div><div style="text-align:right"><button class="cr-btn pri" id="idok">Terminé</button></div>', (ov, close) => {
    const draw = async () => {

function detailHtml(cr) {

}
function etapeHtml(cr) {
  if (!cr.etape_texte && !cr.etape_date) return '';
  return '<div class="cr-etape"><div class="cr-etape-lbl">➡️ L\'étape suivante</div>' + (cr.etape_date ? '<div class="cr-etape-date">📅 ' + esc(fmtDateCourte(cr.etape_date)) + '</div>' : '') + (cr.etape_texte ? '<div class="cr-etape-txt">' + mentionHtml(cr.etape_texte) + '</div>' : '')

function videoHtml(url) {

/* Réactions et commentaires du compte-rendu : ceux de son post du fil (même fil de discussion que le fil d'actualité) ;
   à défaut de post (événement non public), ceux de l'événement. */
async function chargerSocial() {
  const box = $('#crp-social'); if (!box) return;
  const cr = ST.data.compte_rendu, postId = cr.statut === 'publie' ? cr.fil_post_id : null;
  const connecte = !!ST.user;
  let reacts = {}, mine = {}, coms = [];
  try {
    if (postId) {
      const [p, c] = await Promise.all([api('GET', `/fil/${postId}`), api('GET', `/fil/${postId}/commentaires`)]);
      reacts = (p.post && p.post.reactions) || {}; coms = (c.commentaires || c.comments || c || []);
      if (p.post && p.post.user_a_aime) mine.like = true;
    } else {
      const r = await api('GET', `/evenements/${ST.evtId}/interactions`);
      reacts = r.reactions || {}; (r.mes_reactions || []).forEach(e => mine[e] = true);
      coms = (r.commentaires || []).map(c => ({ id: c.id, auteur_nom: c.auteur_nom, contenu: c.contenu, created_at: c.created_at }));
    }
  } catch (_) {}
  const types = postId ? FIL_REACTIONS.map(r => [r.type, r.emoji]) : Object.keys(reacts).map(e => [e, e]);
  box.innerHTML = '<div class="crp-react">' + types.map(([k, em]) => '<button type="button" class="crp-r ' + (mine[k] ? 'on' : '') + '" data-rk="' + esc(k) + '">' + em + ' ' + (reacts[k] || 0) + '</button>').join('') + '<span class="crp-note" style="margin-left:auto">' + coms.length + ' commentaire' + (coms.length > 1 ? 's' : '') + '</span></div>'
    + coms.map(c => '<div class="crp-cm"><div class="av">' + esc(String(c.auteur_nom || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase()) + '</div><div class="bub"><b>' + esc(c.auteur_nom || '') + '</b> ' + mentionHtml(c.contenu) + '</div></div>').join('')
    + (connecte ? '<div class="crp-cin"><input id="crp-cin" placeholder="Écrire un commentaire…"><button type="button" class="cr-btn sec" id="crp-cpost">Commenter</button></div>' : '<p class="crp-note" style="margin-top:12px"><a href="login.html" class="cr-link">Connectez-vous</a> pour réagir et commenter.</p>');
  $$('[data-rk]', box).forEach(b => b.addEventListener('click', async () => {
    if (!connecte) { location.href = 'login.html'; return; }
    try { postId ? await api('POST', `/fil/${postId}/react`, { type: b.dataset.rk }) : await api('POST', `/evenements/${ST.evtId}/reactions`, { emoji: b.dataset.rk }); chargerSocial(); } catch (e) { toast(e.message || 'Erreur'); }
  }));
  const post = $('#crp-cpost', box);
  if (post) post.addEventListener('click', async () => {
    const t = $('#crp-cin', box).value.trim(); if (!t) return;
    try { postId ? await api('POST', `/fil/${postId}/commentaires`, { contenu: t }) : await api('POST', `/evenements/${ST.evtId}/commentaires`, { contenu: t }); chargerSocial(); } catch (e) { toast(e.message || 'Erreur'); }
  });
}

function nouvelEd() {
  const cr = ST.data.compte_rendu;
  const ed = { type: (cr && cr.type_cr) || 'eco', libre: (cr && cr.type_libre) || '', titre: (cr && cr.titre) || ST.data.evenement.titre, resume: (cr && cr.resume) || '',
    forts: cr ? [...(cr.forts || [])] : [], etape_texte: (cr && cr.etape_texte) || '', etape_date: (cr && cr.etape_date) || '', etape_bouton: (cr && cr.etape_bouton) || '', etape_lien: (cr && cr.etape_lien) || '',
    video: (cr && cr.video_url) || '', medias: cr ? [...(cr.medias || [])] : [], saisie: {}, extras: [] };
  Object.keys(CANEVAS).forEach(k => ed.saisie[k] = CANEVAS[k].champs.map(() => ''));
  /* Les sections enregistrées sont redistribuées sur les champs du type courant (par titre) ; les autres restent visibles en « Autres sections ». */
  (cr ? cr.details || [] : []).forEach(d => {
    const i = CANEVAS[ed.type].champs.findIndex(c => c[0] === d.titre);
    if (i >= 0) ed.saisie[ed.type][i] = d.texte; else ed.extras.push({ titre: d.titre, texte: d.texte });
  });
  return ed;
}
function collecterEd() {
  const ed = ST.ed;
  ed.titre = $('#ed-titre').value.trim(); ed.resume = $('#ed-resume').value; ed.libre = ($('#ed-libre') || {}).value || ed.libre;
  ed.etape_texte = $('#ed-etxt').value; ed.etape_date = $('#ed-edate').value; ed.etape_bouton = $('#ed-ebtn').value; ed.etape_lien = $('#ed-elien').value; ed.video = $('#ed-video').value.trim();

function bodyEd() {
  const ed = ST.ed;
  const details = CANEVAS[ed.type].champs.map((c, i) => ({ titre: c[0], texte: ed.saisie[ed.type][i] || '' })).concat(ed.extras);
  return { titre: ed.titre, type_cr: ed.type, type_libre: ed.type === 'autre' ? ed.libre : '', resume: ed.resume, details, forts: ed.forts, etape_texte: ed.etape_texte, etape_date: ed.etape_date || null, etape_bouton: ed.etape_bouton, etape_lien: ed.etape_lien, video_url: ed.video, medias: ed.medias };
}

    const d = document.createElement('div'); d.className = 'crp-fld';
    d.innerHTML = '<label>' + esc(x.titre) + ' <em>section conservée d\'un autre canevas</em></label><textarea data-x="' + i + '" maxlength="10000"></textarea>';
    const t = $('textarea', d); t.value = x.texte || ''; t.addEventListener('input', () => { x.texte = t.value; }); attachMention(t); box.appendChild(d);
  });
}
function drawForts() {
  const ed = ST.ed;
  $('#ed-forts').innerHTML = ed.forts.map((f, i) => '<span class="crp-chip">' + esc(f) + ' <span class="x" data-fortrm="' + i + '">×</span></span>').join('') || '<span class="crp-note">Aucun temps fort.</span>';
  $$('[data-fortrm]').forEach(x => x.addEventListener('click', () => { ed.forts.splice(Number(x.dataset.fortrm), 1); drawForts(); }));
}
function drawPhotos() {
  const ed = ST.ed;
  $('#ed-photos').innerHTML = ed.medias.map((u, i) => '<div><img src="' + esc(u) + '" alt=""><button type="button" data-phrm="' + i + '" title="Retirer">×</button></div>').join('');
  $$('[data-phrm]').forEach(b => b.addEventListener('click', () => { ed.medias.splice(Number(b.dataset.phrm), 1); drawPhotos(); }));
}

/* ---------- pré-remplissage depuis l'événement ---------- */
async function prefillModal() {
  let r;
  try { r = await api('GET', `/evenements/${ST.evtId}/compte-rendu/sources`); } catch (e) { toast(e.message || 'Erreur'); return; }
  const lignes = (r.sources || []).map(s => '<div class="crp-src"><span style="font-weight:800;color:' + (s.trouve ? '#16794C' : '#F26422') + '">' + (s.trouve ? '✓' : '!') + '</span><span><b>' + esc(s.libelle) + '</b><small>' + esc(s.detail) + '</small></span></div>').join('');
  const progs = r.programmes || [];
  modal('<h2>✨ Pré-remplir depuis l\'événement</h2><p class="crp-note">Voici ce qui a été lu. Ce qui n\'existe pas est signalé, jamais inventé. Vous relisez et complétez ensuite.</p><div class="crp-pick" style="max-height:none">' + lignes + '</div>'
    + (progs.length > 1 ? '<div class="crp-fld"><label>Deux programmes ont été trouvés, lequel utiliser pour le déroulé ?</label><select id="pf-prog">' + progs.map((p, i) => '<option value="' + i + '">' + (p.origine === 'fiche' ? "Fiche d'inscription" : "Événement") + '</option>').join('') + '</select></div>' : '')
    + (progs.some(p => p.fichier_url && !p.texte) ? '<p class="crp-note">Un programme est fourni en pièce jointe (image ou PDF) : il n\'est pas lu automatiquement, consultez-le et saisissez le déroulé.</p>' : '')
    + '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="cr-btn out" id="pf-no">Annuler</button><button class="cr-btn pri" id="pf-ok">Pré-remplir</button></div>', (ov, close) => {
    $('#pf-no', ov).onclick = close;
    $('#pf-ok', ov).onclick = () => {
      collecterEd(); collecterChamps(); const ed = ST.ed, sg = r.suggestions || {}; let n = 0;
      if (sg.forts && sg.forts.length) { ed.forts = sg.forts.slice(0, 8); n++; }
      const idx = progs.length > 1 ? Number(($('#pf-prog', ov) || { value: 0 }).value) : 0;
      const deroule = progs[idx] && progs[idx].texte ? progs[idx].texte : '';
      CANEVAS[ed.type].champs.forEach((c, i) => {
        if (/^(Déroulé|Programme|Contenu et déroulé)/.test(c[0]) && deroule) { ed.saisie[ed.type][i] = deroule; n++; }
        else if (/^Participation/.test(c[0]) && sg.participation_texte) { ed.saisie[ed.type][i] = sg.participation_texte; n++; }
      });
      if (sg.video_url && !ed.video) { ed.video = sg.video_url; $('#ed-video').value = ed.video; n++; }
      if (!ed.resume.trim() && r.resume_fiche && r.resume_fiche.resume) { /* ne remplace jamais un résumé existant */ }
      drawForts(); drawChamps(); close(); toast(n ? 'Pré-rempli : relisez et complétez' : 'Rien à pré-remplir : aucune donnée trouvée');
    };
  });
}

/* ---------- envoi par e-mail ---------- */
async function vueMail() {
  const zone = $('#ed-mailzone'); zone.innerHTML = '<div class="crp-card"><div class="crp-note">Chargement des destinataires…</div></div>';
  let d = { fiche: null, groupes: [], personnes: [] }, envois = [];
  try { d = await api('GET', `/evenements/${ST.evtId}/compte-rendu/destinataires`); } catch (_) {}
  try { envois = (await api('GET', `/evenements/${ST.evtId}/compte-rendu/envois`)).envois || []; } catch (_) {}
  const M = ST.mail = { g: new Set(), p: new Set(), ext: [], objet: "Compte-rendu : " + ST.data.evenement.titre };
  const nb = () => { let n = 0; d.groupes.forEach(g => { if (M.g.has(g.type_id)) n += g.nb; }); d.personnes.forEach(p => { if (!M.g.has(p.type_id) && M.p.has(p.id)) n++; }); return n + M.ext.length; };
  zone.innerHTML = '<div class="crp-card"><h2 style="margin-top:0">Envoyer le compte-rendu par e-mail</h2>'
    + '<p class="crp-note">' + (d.fiche ? 'Les adresses viennent de la fiche d\'inscription « ' + esc(d.fiche.nom) + ' ». Les groupes sont ses types d\'inscription.' : 'Cet événement n\'a pas de fiche d\'inscription liée : ajoutez simplement les adresses ci-dessous.') + '</p>'
    + (d.groupes.length ? '<div class="crp-lbl">Groupes de la fiche</div><div class="crp-grp" id="mg"></div><div class="crp-lbl">Ou des personnes de la fiche en particulier</div><input id="mrech" placeholder="Rechercher une personne…" style="width:100%;box-sizing:border-box;margin-bottom:8px"><div class="crp-list" id="mp"></div>' : '')
    + '<div class="crp-lbl">Ajouter une adresse e-mail <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)">· pour quelqu\'un qui n\'est pas dans la fiche</span></div>'
    + '<div class="crp-extform"><input id="mxn" placeholder="Nom"><input id="mxm" type="email" placeholder="adresse@exemple.com"><button type="button" class="cr-btn sec" id="mxa">＋ Ajouter</button></div><div class="crp-note" id="mxe" style="color:#F26422;display:none"></div><div class="crp-chips" id="mxl" style="margin-top:8px"></div>'
    + '<p class="crp-note"><b id="mnb">0</b> destinataire(s) sélectionné(s).</p>'
    + '<div class="crp-fld"><label>Objet</label><input id="mobj" maxlength="200"></div>'
    + '<div class="cr-btns"><button class="cr-btn pri" id="menv">Envoyer</button><button class="cr-btn out" id="mtest">M\'envoyer un test</button></div><p class="crp-note" id="mres"></p>'
    + (envois.length ? '<div class="crp-lbl">Historique des envois</div>' + envois.map(e => '<div class="crp-note" style="padding:4px 0;border-bottom:1px solid var(--border)">✓ ' + esc(e.created_at) + ' — ' + e.nb_envoyes + '/' + e.nb_destinataires + ' envoyé(s) · ' + esc(e.objet || '') + '</div>').join('') : '')
    + '</div>';
  $('#mobj').value = M.objet;
  const draw = () => {
    const g = $('#mg'); if (g) g.innerHTML = d.groupes.map(x => '<label class="' + (M.g.has(x.type_id) ? 'sel' : '') + '"><input type="checkbox" data-g="' + x.type_id + '" ' + (M.g.has(x.type_id) ? 'checked' : '') + '> <span>' + esc(x.label) + '<small>' + x.nb + ' adresse(s)</small></span></label>').join('');
    const q = ($('#mrech') || { value: '' }).value.toLowerCase(), pl = $('#mp');
    if (pl) pl.innerHTML = d.personnes.filter(p => (p.prenom + ' ' + p.nom + ' ' + (p.type_label || '')).toLowerCase().includes(q)).map(p => { const inc = M.g.has(p.type_id); return '<label class="' + (inc ? 'inc' : '') + '"><input type="checkbox" data-p="' + p.id + '" ' + (inc || M.p.has(p.id) ? 'checked' : '') + ' ' + (inc ? 'disabled' : '') + '> ' + esc((p.prenom + ' ' + p.nom).trim()) + '<span class="crp-q">' + esc(p.type_label || '') + (inc ? ' · via le groupe' : '') + '</span></label>'; }).join('') || '<div class="crp-note" style="padding:10px">Aucun résultat.</div>';
    $$('[data-g]').forEach(i => i.addEventListener('change', () => { const id = Number(i.dataset.g); i.checked ? M.g.add(id) : M.g.delete(id); draw(); }));
    $$('[data-p]').forEach(i => i.addEventListener('change', () => { const id = Number(i.dataset.p); i.checked ? M.p.add(id) : M.p.delete(id); $('#mnb').textContent = nb(); }));
    $('#mxl').innerHTML = M.ext.map((x, i) => '<span class="crp-chip ext">✉️ ' + esc(x.nom) + ' · ' + esc(x.email) + ' <span class="x" data-xrm="' + i + '">×</span></span>').join('');
    $$('[data-xrm]').forEach(x => x.addEventListener('click', () => { M.ext.splice(Number(x.dataset.xrm), 1); draw(); }));
    $('#mnb').textContent = nb();
  };
  const rech = $('#mrech'); if (rech) rech.addEventListener('input', draw);
  const addExt = () => {
    const nom = $('#mxn').value.trim(), email = $('#mxm').value.trim(), er = $('#mxe'); const show = m => { er.textContent = m; er.style.display = 'block'; };
    if (!nom) { show('Indiquez le nom de la personne.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { show("Cette adresse e-mail n'a pas un format valide."); return; }
    if (M.ext.some(x => x.email.toLowerCase() === email.toLowerCase())) { show('Cette adresse est déjà dans la liste.'); return; }
    er.style.display = 'none'; M.ext.push({ nom, email }); $('#mxn').value = ''; $('#mxm').value = ''; draw(); $('#mxn').focus();
  };
  $('#mxa').onclick = addExt; ['#mxn', '#mxm'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addExt(); } }));
  const envoyer = async test => {
    const n = test ? 1 : nb(); if (!n) { toast('Choisissez un groupe, une personne ou ajoutez une adresse'); return; }
    if (!test && !confirm('Envoyer le compte-rendu à ' + n + ' personne(s) ?')) return;
    const res = $('#mres'); res.textContent = 'Envoi en cours…';
    try {
      const r = await api('POST', `/evenements/${ST.evtId}/compte-rendu/envoyer`, { test, objet: $('#mobj').value, groupes: [...M.g], personnes: [...M.p], externes: M.ext });
      res.textContent = r.mail_non_configure ? "L'envoi d'e-mails n'est pas configuré sur ce serveur : aucun message n'est parti."
        : (test ? 'Test envoyé à votre adresse.' : r.envoyes + ' e-mail(s) envoyé(s) sur ' + r.destinataires + (r.ignores_desinscrits ? ' · ' + r.ignores_desinscrits + ' désinscrit(s) ignoré(s)' : '') + (r.echecs ? ' · ' + r.echecs + ' échec(s)' : '') + (r.non_traites ? ' · ' + r.non_traites + ' restant(s) : relancez l\'envoi' : ''));
    } catch (e) { res.textContent = e.message || 'Erreur'; }
  };
  $('#menv').onclick = () => envoyer(false); $('#mtest').onclick = () => envoyer(true);
  draw(); zone.scrollIntoView({ behavior: 'smooth' });
}

/* =================== AIGUILLAGE =================== */
async function init() {
  const p = new URLSearchParams(location.search);
  ST.evtId = Number(p.get('evt')) || null;
  ST.user = await fetchCurrentUser().catch(() => null);
  const root = $('#crp');
  if (!ST.evtId) {
    if (!ST.user) { location.href = 'login.html'; return; }
    return vueListe();
  }
  try { ST.data = await api('GET', `/evenements/${ST.evtId}/compte-rendu`); }
  catch (e) { root.innerHTML = '<div class="crp-card"><h1>Compte-rendu introuvable</h1><p class="crp-note">' + esc(e.message || "Cet événement n'existe pas ou n'est pas accessible.") + '</p></div>'; return; }
  document.title = "Diaspo'Actif — Compte-rendu : " + ST.data.evenement.titre;
  const d = ST.data, edition = p.get('edition') === '1';
  if (d.peut_editer && (edition || !d.compte_rendu)) {
    if (!d.evenement.termine && (!ST.user || ST.user.role !== 'administrateur')) {
      root.innerHTML = '<div class="crp-card"><h1>Pas encore</h1><p class="crp-note">Le compte-rendu s\'écrit une fois l\'événement terminé. En attendant, vous pouvez déjà identifier des participants depuis <a class="cr-link" href="evenements.html?evt=' + d.evenement.id + '">la page de l\'événement</a>.</p></div>';
      return;
    }
    ST.ed = nouvelEd(); return vueEditeur();
  }
  if (d.compte_rendu) return vuePublique();
  root.innerHTML = '<div class="crp-card"><h1>' + esc(d.evenement.titre) + '</h1><p class="crp-note">Aucun compte-rendu n\'a été publié pour cet événement.</p><div class="cr-btns"><a class="cr-btn sec" href="evenements.html?evt=' + d.evenement.id + '">ℹ️ Voir l\'événement</a></div></div>';
}
init();
