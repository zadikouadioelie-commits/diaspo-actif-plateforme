const ST = { evtId: null, data: null, user: null, ed: null, mail: null };

/* ---------- utilitaires ---------- */
function toast(m) { const t = document.createElement('div'); t.className = 'crp-toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function modal(html, onReady) {
  const ov = document.createElement('div'); ov.className = 'crp-ov'; ov.innerHTML = '<div class="crp-modal">' + html + '</div>';
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov); if (onReady) onReady(ov, () => ov.remove()); return ov;
}
function mentionHtml(s) {
  let h = esc(s || '');
  h = h.replace(/[@*]\[([^\]]+)\]\(([uic]):(\d+)\)/g, (m, nom, t, id) => {
    const href = { u: 'profil.html?id=', i: 'initiative.html?id=', c: 'profil-collectivite.html?id=' }[t] + id;
    return '<a href="' + href + '" class="crp-chip" style="padding:0 6px">@' + nom + '</a>';
  });
  return h.replace(/\n/g, '<br>');
}
/* ---------- texte riche (2026-10-06) : résumé et parties en HTML mis en forme, anciens textes simples toujours lisibles ---------- */
const estHtml = s => /<(p|h[1-6]|ul|ol|li|blockquote|br|strong|em|b|i|u|a)[\s>\/]/i.test(String(s || ''));
const BALISES_OK = { P: 1, BR: 1, STRONG: 1, B: 1, EM: 1, I: 1, U: 1, UL: 1, OL: 1, LI: 1, H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1, A: 1 };
/* Second filet côté page (le serveur nettoie déjà à l'écriture) : on ne garde que ces balises, des liens http(s)/mailto et l'alignement. */
function nettoyerHtml(html) {
  const doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  const racine = doc.body.firstChild;
  (function parcourir(n) {
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      const tag = c.tagName;
      if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'NOSCRIPT', 'TEMPLATE', 'SVG', 'MATH', 'FORM', 'INPUT', 'BUTTON', 'LINK', 'META'].includes(tag)) { c.remove(); return; }
      parcourir(c);
      if (!BALISES_OK[tag]) { c.replaceWith(...[...c.childNodes]); return; }
      [...c.attributes].forEach(a => {
        const nom = a.name.toLowerCase();
        if (tag === 'A' && nom === 'href' && /^(https?:|mailto:)/i.test(a.value.trim())) return;
        if (nom === 'style' && tag !== 'A' && /^\s*text-align\s*:\s*(left|center|right)\s*;?\s*$/i.test(a.value)) return;
        c.removeAttribute(a.name);
      });
      if (tag === 'A') { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener noreferrer'); }
    });
  })(racine);
  return racine.innerHTML;
}
/* Version texte simple d'un contenu (riche ou non) : comptage de mots/caractères, illustration automatique, vérification « vide ». */
function brut(s) {
  s = String(s == null ? '' : s);
  if (!estHtml(s)) return s;
  const d = document.createElement('div');
  d.innerHTML = nettoyerHtml(s).replace(/<\/(p|h[2-4]|li|blockquote)>/gi, '\n').replace(/<br\s*\/?>/gi, '\n');
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}
const RE_MENTION = /[@*]\[([^\]]+)\]\(([uic]):(\d+)\)/g;
const hrefMention = (t, id) => ({ u: 'profil.html?id=', i: 'initiative.html?id=', c: 'profil-collectivite.html?id=' }[t]) + id;
/* Page publique : HTML nettoyé, mentions en liens, et une liste d'au moins 6 éléments courts devient la grille de tuiles illustrées. */
function richeVersPage(html) {
  const d = document.createElement('div'); d.innerHTML = nettoyerHtml(html);
  d.querySelectorAll('ul').forEach(ul => {
    const lis = [...ul.children].filter(x => x.tagName === 'LI'), t = lis.map(l => l.textContent.trim());
    if (lis.length >= 6 && t.every(x => x.length <= 60 && !/\d/.test(x) && !/[@*]\[/.test(x))) {
      const g = document.createElement('div'); g.className = 'cr2-mosaique'; g.setAttribute('role', 'list');
      g.innerHTML = t.map(x => '<div class="cr2-tuile" role="listitem">' + svgIc(iconeAuto(x) || 'people') + '<span>' + esc(x.replace(/[.;]$/, '')) + '</span></div>').join('');
      ul.replaceWith(g);
    } else ul.classList.add('cr2-puces');
  });
  return '<div class="cr2-rich">' + d.innerHTML.replace(RE_MENTION, (m, nom, t, id) => '<a href="' + hrefMention(t, id) + '" class="crp-chip" style="padding:0 6px">@' + nom + '</a>') + '</div>';
}

function texteVersHtml(t) {

    const lignes = bloc.split('\n').map(l => l.trim()).filter(Boolean);

/* Branche l'éditeur riche (gras, italique, titres, listes, alignement, liens…) sur une zone de texte + les mentions @ et *. */
function riche(textarea, placeholder) {

  const wrap = textarea.nextElementSibling, area = wrap && wrap.querySelector('.rich-editor-area');

function attachMentionRiche(area, wrap) {
  let box = null, idx = 0, items = [], timer = null;
  const close = () => { if (box) box.remove(); box = null; };
  function contexte() {
    const sel = getSelection(); if (!sel.rangeCount || !sel.isCollapsed) return null;
    const n = sel.anchorNode; if (!n || n.nodeType !== 3 || !area.contains(n)) return null;
    const avant = n.nodeValue.slice(0, sel.anchorOffset), m = avant.match(/(^|\s)[@*]([^\s@*\[][^@*\n\[]{0,24}|)$/);
    return m ? { n, offset: sel.anchorOffset, q: m[2], debut: avant.length - m[0].length + m[1].length } : null;
  }
  async function chercher(q) {
    try { const r = await api('GET', `/evenements/${ST.evtId}/identifications/suggestions?q=${encodeURIComponent(q)}`); items = (r.suggestions || []).slice(0, 6); } catch (_) { items = []; }
    if (!items.length) { close(); return; }

    box.innerHTML = items.map((c, i) => '<div class="' + (i === 0 ? 'act' : '') + '" data-i="' + i + '"><b>' + esc(c.nom) + '</b> <span class="crp-note">' + esc(c.detail || '') + '</span></div>').join('');
    $$('div', box).forEach(d => d.addEventListener('mousedown', ev => { ev.preventDefault(); pick(items[d.dataset.i]); }));
  }
  function pick(c) {
    const ctx = contexte(); if (!ctx) { close(); return; }
    const n = ctx.n, texte = n.nodeValue, parent = n.parentNode;
    const p = document.createElement('span'); p.className = 'crp-chip crp-mention'; p.contentEditable = 'false'; p.dataset.tok = 'u:' + c.user_id; p.dataset.nom = c.nom; p.textContent = '@' + c.nom;
    const suite = document.createTextNode(' ' + texte.slice(ctx.offset));
    n.nodeValue = texte.slice(0, ctx.debut);

    const r = document.createRange(); r.setStart(suite, 1); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    close(); area.dispatchEvent(new Event('input', { bubbles: true }));
  }
  area.addEventListener('input', () => {
    const ctx = contexte(); if (!ctx) { close(); return; }
    clearTimeout(timer); timer = setTimeout(() => chercher(ctx.q.toLowerCase()), 180);
  });
  area.addEventListener('keydown', e => {
    if (!box) return;

    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pick(items[idx]); return; }
    else if (e.key === 'Escape') { close(); return; } else return;
    $$('div', box).forEach((d, i) => d.classList.toggle('act', i === idx));
  });

}

/* Cartes du récit : aperçu replié, « Lire la suite » seulement quand le texte déborde, « Tout déplier / Tout replier ». */
function initCartes() {
  const cartes = $$('.cr2-card');
  const libelle = (c, ouvert) => { const m = $('[data-more]', c); if (m) { m.textContent = ouvert ? 'Réduire ▴' : 'Lire la suite ▾'; m.setAttribute('aria-expanded', ouvert ? 'true' : 'false'); } };
  const evaluer = () => cartes.forEach(c => {
    const b = $('.cr2-card-b', c), m = $('[data-more]', c); if (!b || !m) return;
    const ouvert = c.classList.contains('open'), trop = !ouvert && b.scrollHeight > b.clientHeight + 6;
    m.hidden = !(trop || ouvert); b.classList.toggle('coupe', trop);
  });
  cartes.forEach(c => { const m = $('[data-more]', c); if (m) m.addEventListener('click', () => { const o = c.classList.toggle('open'); libelle(c, o); evaluer(); if (!o) c.scrollIntoView({ block: 'nearest' }); }); });
  $$('[data-recit]').forEach(b => b.addEventListener('click', () => { const ouvrir = b.dataset.recit === 'ouvrir'; cartes.forEach(c => { c.classList.toggle('open', ouvrir); libelle(c, ouvrir); }); evaluer(); }));
  evaluer(); window.addEventListener('resize', evaluer); setTimeout(evaluer, 500); setTimeout(evaluer, 1800);
}
/* Menu « Le récit » de la barre fixe + bouton « haut de page ». */
function initNav() {
  const menu = $('[data-menu]'), pop = $('#cr-nav-pop');
  if (menu && pop) {
    const basculer = o => { pop.hidden = !o; menu.setAttribute('aria-expanded', o ? 'true' : 'false'); };
    menu.addEventListener('click', e => { e.stopPropagation(); basculer(pop.hidden); });
    $$('[data-t], [data-part]', pop).forEach(b => b.addEventListener('click', () => {
      basculer(false); const el = document.getElementById(b.dataset.t || b.dataset.part); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }));
    document.addEventListener('click', e => { if (!pop.hidden && !e.target.closest('.cr2-nav')) basculer(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden && !$('#cr-synth')) { basculer(false); menu.focus(); } });
  }
  const agirB = $('#cr-agir-btn'), agirP = $('#cr-agir-pop');
  if (agirB && agirP) {
    const basc = o => { agirP.hidden = !o; agirB.setAttribute('aria-expanded', o ? 'true' : 'false'); };
    agirB.addEventListener('click', e => { e.stopPropagation(); basc(agirP.hidden); });
    document.addEventListener('click', e => { if (!agirP.hidden && !e.target.closest('.cr2-nav-pop-agir')) basc(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !agirP.hidden && !$('#cr-synth')) { basc(false); agirB.focus(); } });
  }
  /* Barre fixée par script : le « position:sticky » CSS ne marche pas ici (le corps de page du site porte un overflow qui en
     fait un conteneur de défilement). Un repère invisible garde la place pour éviter tout saut de mise en page. */
  const barre = $('#cr-nav');
  if (barre) {
    const repere = document.createElement('div'); repere.className = 'cr2-nav-repere'; barre.parentNode.insertBefore(repere, barre);
    const maj = () => {
      const r = repere.getBoundingClientRect(), fixe = r.top < 0;
      if (fixe) { repere.style.height = barre.offsetHeight + 12 + 'px'; barre.classList.add('fixe'); barre.style.left = r.left + 'px'; barre.style.width = r.width + 'px'; }
      else { barre.classList.remove('fixe'); barre.style.left = ''; barre.style.width = ''; repere.style.height = '0'; }
    };
    window.addEventListener('scroll', maj, { passive: true }); window.addEventListener('resize', maj); maj();
  }
  const haut = document.createElement('button');
  haut.type = 'button'; haut.className = 'cr2-haut'; haut.setAttribute('aria-label', 'Retour en haut de la page'); haut.title = 'Haut de page'; haut.textContent = '↑'; haut.hidden = true;
  haut.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  document.body.appendChild(haut);
  window.addEventListener('scroll', () => { haut.hidden = window.scrollY < 700; }, { passive: true });
}

/* Barre fixe (clic = défilement, section en cours surlignée) et taille du texte réglable (mémorisée). */
function initLecture(ids) {
  let fs = 18; try { const s = parseInt(localStorage.getItem('cr-fs2'), 10); if (s >= 14 && s <= 26) fs = s; } catch (_) {}
  const appliquer = () => { $('#crp').style.setProperty('--cr-fs', fs + 'px'); try { localStorage.setItem('cr-fs2', fs); } catch (_) {} };
  $('#cr-fsm').onclick = () => { if (fs > 14) { fs -= 1; appliquer(); } };
  $('#cr-fsp').onclick = () => { if (fs < 26) { fs += 1; appliquer(); } };
  appliquer();
  $$('.cr2-nav-in [data-t]:not([data-menu])').forEach(b => b.addEventListener('click', () => { const el = document.getElementById(b.dataset.t); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }));
  const suivre = () => {
    let cur = ids[0];
    ids.forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 150) cur = id; });
    $$('.cr2-nav-in .cr2-nav-i').forEach(b => b.classList.toggle('on', b.dataset.t === cur));
    const on = $('.cr2-nav-in .cr2-nav-i.on'), barre = $('.cr2-nav-in');
    if (on && barre && barre.scrollWidth > barre.clientWidth) barre.scrollTo({ left: on.offsetLeft - barre.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth' });
  };
  window.addEventListener('scroll', suivre, { passive: true }); suivre();
}

/* Réactions et commentaires du compte-rendu : ceux de son post du fil (même fil de discussion que le fil d'actualité) ;
   à défaut de post (événement non public), ceux de l'événement. */
/* Republier / partager (2026-10-06) : republier crée, comme dans le fil, une publication sur le profil de la personne
   (avec sa carte « Lire le compte-rendu complet ») ; partager ouvre le partage du téléphone ou copie le lien de la page. */
async function republierCr() {
  const cr = ST.data.compte_rendu, postId = cr.statut === 'publie' ? cr.fil_post_id : null;
  if (!postId) { toast('Ce compte-rendu n’est pas dans le fil : seul le partage est possible.'); return; }
  if (!ST.user) { location.href = 'login.html'; return; }
  const commentaire = window.prompt('Ajouter un commentaire à votre republication (facultatif) :');
  if (commentaire === null) return;
  try { await api('POST', `/fil/${postId}/republier`, { commentaire }); toast('Republié : le compte-rendu apparaît maintenant sur votre profil.'); }
  catch (e) { toast(e.message || 'Republication impossible'); }
}
async function partagerCr() {
  const cr = ST.data.compte_rendu, url = location.origin + location.pathname + '?evt=' + ST.evtId;
  if (navigator.share) {
    try { await navigator.share({ title: cr.titre || ST.data.evenement.titre, text: brut(cr.resume).slice(0, 160), url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Lien copié'); } catch (_) { window.prompt('Copiez ce lien :', url); }
}
async function chargerSocial() {
  const box = $('#crp-social'); if (!box) return;
  const cr = ST.data.compte_rendu, postId = cr.statut === 'publie' ? cr.fil_post_id : null;
  const connecte = !!ST.user;
  let reacts = {}, mine = {}, coms = [];
  try {
    if (postId) {
      const [p, c] = await Promise.all([api('GET', `/fil/${postId}`), api('GET', `/fil/${postId}/commentaires`)]);
      reacts = (p.post && p.post.reactions) || {}; coms = (c.commentaires || c.comments || c || []);
      if (p.post && p.post.user_a_aime) mine.like = true;
    } else {
      const r = await api('GET', `/evenements/${ST.evtId}/interactions`);
      reacts = r.reactions || {}; (r.mes_reactions || []).forEach(e => mine[e] = true);
      coms = (r.commentaires || []).map(c => ({ id: c.id, auteur_nom: c.auteur_nom, contenu: c.contenu, created_at: c.created_at }));
    }
  } catch (_) {}
  const types = postId ? FIL_REACTIONS.map(r => [r.type, r.emoji]) : Object.keys(reacts).map(e => [e, e]);
  box.innerHTML = '<div class="crp-react">' + types.map(([k, em]) => '<button type="button" class="crp-r ' + (mine[k] ? 'on' : '') + '" data-rk="' + esc(k) + '">' + em + ' ' + (reacts[k] || 0) + '</button>').join('') + (postId ? '<button type="button" class="crp-r" data-repost title="Republier sur votre profil">🔁 Republier</button>' : '') + '<button type="button" class="crp-r" data-share title="Partager ce compte-rendu">📤 Partager</button><span class="crp-note" style="margin-left:auto">' + coms.length + ' commentaire' + (coms.length > 1 ? 's' : '') + '</span></div>'
    + coms.map(c => '<div class="crp-cm"><div class="av">' + esc(String(c.auteur_nom || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase()) + '</div><div class="bub"><b>' + esc(c.auteur_nom || '') + '</b> ' + mentionHtml(c.contenu) + '</div></div>').join('')
    + (connecte ? '<div class="crp-cin"><input id="crp-cin" placeholder="Écrire un commentaire…"><button type="button" class="cr-btn sec" id="crp-cpost">Commenter</button></div>' : '<p class="crp-note" style="margin-top:12px"><a href="login.html" class="cr-link">Connectez-vous</a> pour réagir et commenter.</p>');
  $$('[data-rk]', box).forEach(b => b.addEventListener('click', async () => {
    if (!connecte) { location.href = 'login.html'; return; }
    try { postId ? await api('POST', `/fil/${postId}/react`, { type: b.dataset.rk }) : await api('POST', `/evenements/${ST.evtId}/reactions`, { emoji: b.dataset.rk }); chargerSocial(); } catch (e) { toast(e.message || 'Erreur'); }
  }));
  $$('[data-repost]', box).forEach(b => b.addEventListener('click', republierCr));
  $$('[data-share]', box).forEach(b => b.addEventListener('click', partagerCr));
  const post = $('#crp-cpost', box);
  if (post) post.addEventListener('click', async () => {
    const t = $('#crp-cin', box).value.trim(); if (!t) return;
    try { postId ? await api('POST', `/fil/${postId}/commentaires`, { contenu: t }) : await api('POST', `/evenements/${ST.evtId}/commentaires`, { contenu: t }); chargerSocial(); } catch (e) { toast(e.message || 'Erreur'); }
  });
}

/* =================== ÉDITEUR =================== */
function nouvelEd() {
  const cr = ST.data.compte_rendu;
  const ed = { type: (cr && cr.type_cr) || 'eco', libre: (cr && cr.type_libre) || '', titre: (cr && cr.titre) || ST.data.evenement.titre, resume: (cr && cr.resume) || '',
    forts: cr ? [...(cr.forts || [])] : [], etape_texte: (cr && cr.etape_texte) || '', etape_date: (cr && cr.etape_date) || '', actions: (cr && Array.isArray(cr.actions)) ? cr.actions.map(x => ({ bouton: x.bouton, lien: x.lien })) : [],
    video: (cr && cr.video_url) || '', medias: cr ? [...(cr.medias || [])] : [], saisie: {}, icones: {}, extras: [], logo: (cr && cr.logo_url) || '', partenaires: cr ? (cr.partenaires || []).map(p => ({ ...p })) : [], profils: cr ? (cr.profils || []).map(p => ({ ...p })) : [] };
  Object.keys(CANEVAS).forEach(k => { ed.saisie[k] = CANEVAS[k].champs.map(() => ''); ed.icones[k] = CANEVAS[k].champs.map(() => ''); });
  /* Les sections enregistrées sont redistribuées sur les champs du type courant (par titre) ; les autres restent visibles en « Autres sections ». */
  (cr ? cr.details || [] : []).forEach(d => {
    const i = CANEVAS[ed.type].champs.findIndex(c => c[0] === d.titre);
    if (i >= 0) { ed.saisie[ed.type][i] = d.texte; ed.icones[ed.type][i] = d.icone || ''; } else ed.extras.push({ titre: d.titre, texte: d.texte, icone: d.icone || '' });
  });
  return ed;
}
function collecterEd() {
  const ed = ST.ed;
  ed.titre = $('#ed-titre').value.trim(); ed.resume = pourEnvoi($('#ed-resume').value); ed.libre = ($('#ed-libre') || {}).value || ed.libre;
  ed.etape_texte = $('#ed-etxt').value; ed.etape_date = $('#ed-edate').value; ed.video = $('#ed-video').value.trim();
}
function bodyEd() {
  const ed = ST.ed;
  const details = CANEVAS[ed.type].champs.map((c, i) => ({ titre: c[0], texte: ed.saisie[ed.type][i] || '', icone: (ed.icones[ed.type] || [])[i] || '' })).concat(ed.extras);
  return { titre: ed.titre, type_cr: ed.type, type_libre: ed.type === 'autre' ? ed.libre : '', resume: ed.resume, details, forts: ed.forts, etape_texte: ed.etape_texte, etape_date: ed.etape_date || null, etape_bouton: (ed.actions.find(x => x.bouton && x.lien) || {}).bouton || '', etape_lien: (ed.actions.find(x => x.bouton && x.lien) || {}).lien || '', actions: ed.actions.filter(x => x.bouton && x.lien), video_url: ed.video, medias: ed.medias, logo_url: ed.logo, partenaires: ed.partenaires, profils: ed.profils };
}
async function sauver(silencieux) {
  collecterEd();
  const r = await api('PUT', `/evenements/${ST.evtId}/compte-rendu`, bodyEd());

  if (!silencieux) toast('Brouillon enregistré');

/* ---------- logo de l'organisateur, partenaires, personnes mises en lumière (2026-10-06) ---------- */
const CATEGORIES_SUGGEREES = ['Associations de la diaspora', 'Accompagnement, santé et emploi', 'Entrepreneurs et exposants', 'Institutions et réseaux', 'Culture et création', 'Intervenants', 'Animation'];
function selectIcone(attr, idx, val) {
  return '<div class="crp-ic"><span>Illustration</span><select ' + attr + '="' + idx + '">' + ICONES_CHOIX.map(([k, l]) => '<option value="' + k + '"' + (k === val ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></div>';
}
async function envoyerLogo(file) {
  if (!file) return null;
  if (!/^image\//.test(file.type)) throw new Error('Choisissez une image (PNG, JPEG ou WebP).');
  if (file.size > 5 * 1024 * 1024) throw new Error('Image trop lourde (5 Mo maximum).');
  toast('Envoi de ' + file.name + '…');
  return uploadMedia(file, 'logo');
}
function drawLogo() {
  const ed = ST.ed, ev = ST.data.evenement, defaut = ev.organisateur_officiel ? 'assets/logo.png' : '', cur = ed.logo || defaut;
  $('#ed-logo').innerHTML = '<div class="crp-logo-prev">' + (cur ? '<img src="' + esc(cur) + '" alt="">' : '<span class="crp-note">Aucun logo</span>') + '</div><div style="flex:1;min-width:200px">'
    + '<button type="button" class="cr-btn out" id="ed-logobtn">' + (ed.logo ? 'Changer le logo' : 'Ajouter un logo') + '</button>' + (ed.logo ? ' <button type="button" class="cr-btn out" id="ed-logorm">Retirer</button>' : '')
    + '<input type="file" id="ed-logofile" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"><div class="crp-hint">' + (ev.organisateur_officiel && !ed.logo ? 'Le logo Diaspo’Actif est utilisé par défaut.' : 'Facultatif : affiché en tête de la page.') + '</div></div>';
  $('#ed-logobtn').onclick = () => $('#ed-logofile').click();
  $('#ed-logofile').onchange = async e => { try { const u = await envoyerLogo(e.target.files[0]); if (u) { ed.logo = u; drawLogo(); } } catch (err) { toast(err.message || 'Échec du téléversement'); } };
  const rm = $('#ed-logorm'); if (rm) rm.onclick = () => { ed.logo = ''; drawLogo(); };
}
function drawParts() {
  const ed = ST.ed, box = $('#ed-parts');
  box.innerHTML = ed.partenaires.map((p, i) => '<div class="crp-part"><div class="crp-part-logo">' + (p.logo_url ? '<img src="' + esc(p.logo_url) + '" alt="">' : '<span class="crp-note">Logo</span>')
    + '<button type="button" class="cr-btn out" data-plogo="' + i + '">' + (p.logo_url ? 'Changer' : 'Ajouter') + '</button><input type="file" data-pfile="' + i + '" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"></div>'
    + '<div class="crp-part-f"><input data-pn="' + i + '" maxlength="80" placeholder="Nom du partenaire" value="' + esc(p.nom) + '"><input data-pd="' + i + '" maxlength="300" placeholder="Courte présentation (facultatif)" value="' + esc(p.description) + '"><input data-pl="' + i + '" placeholder="https://… lien (facultatif)" value="' + esc(p.lien) + '"></div>'
    + '<button type="button" class="crp-x" data-prm="' + i + '" title="Retirer ce partenaire">×</button></div>').join('') || '<span class="crp-note">Aucun partenaire.</span>';
  $$('[data-pn]', box).forEach(x => x.addEventListener('input', () => { ed.partenaires[Number(x.dataset.pn)].nom = x.value; }));
  $$('[data-pd]', box).forEach(x => x.addEventListener('input', () => { ed.partenaires[Number(x.dataset.pd)].description = x.value; }));
  $$('[data-pl]', box).forEach(x => x.addEventListener('input', () => { ed.partenaires[Number(x.dataset.pl)].lien = x.value; }));
  $$('[data-prm]', box).forEach(x => x.addEventListener('click', () => { ed.partenaires.splice(Number(x.dataset.prm), 1); drawParts(); }));
  $$('[data-plogo]', box).forEach(x => x.addEventListener('click', () => $('[data-pfile="' + x.dataset.plogo + '"]', box).click()));
  $$('[data-pfile]', box).forEach(x => x.addEventListener('change', async e => { try { const u = await envoyerLogo(e.target.files[0]); if (u) { ed.partenaires[Number(x.dataset.pfile)].logo_url = u; drawParts(); } } catch (err) { toast(err.message || 'Échec du téléversement'); } }));
  const add = $('#ed-partadd'); if (add) add.disabled = ed.partenaires.length >= 12;
}
function drawProfils() {
  const ed = ST.ed, box = $('#ed-profils');
  box.innerHTML = (ed.profils.length ? '<div class="crp-prof crp-prof-h" aria-hidden="true"><span>Nom et prénom <em>(ou organisation)</em></span><span>Catégorie</span><span>Communauté d’origine</span><span>Lien <em>(facultatif)</em></span><span></span></div>' : '')
    + ed.profils.map((p, i) => '<div class="crp-prof"><input data-fn="' + i + '" maxlength="80" aria-label="Nom et prénom" placeholder="Nom et prénom (ou organisation)" value="' + esc(p.nom) + '"><input data-fc="' + i + '" maxlength="60" list="dl-cats" aria-label="Catégorie" placeholder="Catégorie" value="' + esc(p.categorie) + '"><input data-fm="' + i + '" maxlength="40" aria-label="Communauté d’origine" placeholder="Communauté (facultatif)" value="' + esc(p.communaute) + '"><input data-fl="' + i + '" aria-label="Lien" placeholder="https://… lien (facultatif)" value="' + esc(p.lien) + '"><button type="button" class="crp-x" data-frm="' + i + '" title="Retirer">×</button></div>').join('')
    + '<datalist id="dl-cats">' + CATEGORIES_SUGGEREES.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>';
  $$('[data-fn]', box).forEach(x => x.addEventListener('input', () => { ed.profils[Number(x.dataset.fn)].nom = x.value; }));
  $$('[data-fc]', box).forEach(x => x.addEventListener('input', () => { ed.profils[Number(x.dataset.fc)].categorie = x.value; }));
  $$('[data-fm]', box).forEach(x => x.addEventListener('input', () => { ed.profils[Number(x.dataset.fm)].communaute = x.value; }));
  $$('[data-fl]', box).forEach(x => x.addEventListener('input', () => { ed.profils[Number(x.dataset.fl)].lien = x.value; }));
  $$('[data-frm]', box).forEach(x => x.addEventListener('click', () => { ed.profils.splice(Number(x.dataset.frm), 1); drawProfils(); }));
  const add = $('#ed-profadd'); if (add) add.disabled = ed.profils.length >= 40;
}

/* ---------- pré-remplissage depuis l'événement ---------- */
async function prefillModal() {
  let r;
  try { r = await api('GET', `/evenements/${ST.evtId}/compte-rendu/sources`); } catch (e) { toast(e.message || 'Erreur'); return; }
  const lignes = (r.sources || []).map(s => '<div class="crp-src"><span style="font-weight:800;color:' + (s.trouve ? '#16794C' : '#F26422') + '">' + (s.trouve ? '✓' : '!') + '</span><span><b>' + esc(s.libelle) + '</b><small>' + esc(s.detail) + '</small></span></div>').join('');
  const progs = r.programmes || [];
  modal('<h2>✨ Pré-remplir depuis l\'événement</h2><p class="crp-note">Voici ce qui a été lu. Ce qui n\'existe pas est signalé, jamais inventé. Vous relisez et complétez ensuite.</p><div class="crp-pick" style="max-height:none">' + lignes + '</div>'
    + (progs.length > 1 ? '<div class="crp-fld"><label>Deux programmes ont été trouvés, lequel utiliser pour le déroulé ?</label><select id="pf-prog">' + progs.map((p, i) => '<option value="' + i + '">' + (p.origine === 'fiche' ? "Fiche d'inscription" : "Événement") + '</option>').join('') + '</select></div>' : '')
    + (progs.some(p => p.fichier_url && !p.texte) ? '<p class="crp-note">Un programme est fourni en pièce jointe (image ou PDF) : il n\'est pas lu automatiquement, consultez-le et saisissez le déroulé.</p>' : '')
    + '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="cr-btn out" id="pf-no">Annuler</button><button class="cr-btn pri" id="pf-ok">Pré-remplir</button></div>', (ov, close) => {
    $('#pf-no', ov).onclick = close;
    $('#pf-ok', ov).onclick = () => {
      collecterEd(); collecterChamps(); const ed = ST.ed, sg = r.suggestions || {}; let n = 0;
      if (sg.forts && sg.forts.length) { ed.forts = sg.forts.slice(0, 8); n++; }
      const idx = progs.length > 1 ? Number(($('#pf-prog', ov) || { value: 0 }).value) : 0;
      const deroule = progs[idx] && progs[idx].texte ? progs[idx].texte : '';
      CANEVAS[ed.type].champs.forEach((c, i) => {
        if (/^(Déroulé|Programme|Contenu et déroulé)/.test(c[0]) && deroule) { ed.saisie[ed.type][i] = deroule; n++; }
        else if (/^Participation/.test(c[0]) && sg.participation_texte) { ed.saisie[ed.type][i] = sg.participation_texte; n++; }
      });
      if (sg.video_url && !ed.video) { ed.video = sg.video_url; $('#ed-video').value = ed.video; n++; }
      if (!ed.resume.trim() && r.resume_fiche && r.resume_fiche.resume) { /* ne remplace jamais un résumé existant */ }
      drawForts(); drawChamps(); close(); toast(n ? 'Pré-rempli : relisez et complétez' : 'Rien à pré-remplir : aucune donnée trouvée');
    };
  });
}

/* ---------- envoi par e-mail ---------- */
async function vueMail() {
  const zone = $('#ed-mailzone'); zone.innerHTML = '<div class="crp-card"><div class="crp-note">Chargement des destinataires…</div></div>';
  let d = { fiche: null, groupes: [], personnes: [] }, envois = [];
  try { d = await api('GET', `/evenements/${ST.evtId}/compte-rendu/destinataires`); } catch (_) {}
  try { envois = (await api('GET', `/evenements/${ST.evtId}/compte-rendu/envois`)).envois || []; } catch (_) {}
  const M = ST.mail = { g: new Set(), p: new Set(), ext: [], objet: "Compte-rendu : " + ST.data.evenement.titre };
  const nb = () => { let n = 0; d.groupes.forEach(g => { if (M.g.has(g.type_id)) n += g.nb; }); d.personnes.forEach(p => { if (!M.g.has(p.type_id) && M.p.has(p.id)) n++; }); return n + M.ext.length; };
  zone.innerHTML = '<div class="crp-card"><h2 style="margin-top:0">Envoyer le compte-rendu par e-mail</h2>'
    + '<p class="crp-note">' + (d.fiche ? 'Les adresses viennent de la fiche d\'inscription « ' + esc(d.fiche.nom) + ' ». Les groupes sont ses types d\'inscription.' : 'Cet événement n\'a pas de fiche d\'inscription liée : ajoutez simplement les adresses ci-dessous.') + '</p>'
    + (d.groupes.length ? '<div class="crp-lbl">Groupes de la fiche</div><div class="crp-grp" id="mg"></div><div class="crp-lbl">Ou des personnes de la fiche en particulier</div><input id="mrech" placeholder="Rechercher une personne…" style="width:100%;box-sizing:border-box;margin-bottom:8px"><div class="crp-list" id="mp"></div>' : '')
    + '<div class="crp-lbl">Ajouter une adresse e-mail <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)">· pour quelqu\'un qui n\'est pas dans la fiche</span></div>'
    + '<div class="crp-extform"><input id="mxn" placeholder="Nom"><input id="mxm" type="email" placeholder="adresse@exemple.com"><button type="button" class="cr-btn sec" id="mxa">＋ Ajouter</button></div><div class="crp-note" id="mxe" style="color:#F26422;display:none"></div><div class="crp-chips" id="mxl" style="margin-top:8px"></div>'
    + '<p class="crp-note"><b id="mnb">0</b> destinataire(s) sélectionné(s).</p>'
    + '<div class="crp-fld"><label>Objet</label><input id="mobj" maxlength="200"></div>'
    + '<div class="cr-btns"><button class="cr-btn pri" id="menv">Envoyer</button><button class="cr-btn out" id="mtest">M\'envoyer un test</button></div><p class="crp-note" id="mres"></p>'
    + (envois.length ? '<div class="crp-lbl">Historique des envois</div>' + envois.map(e => '<div class="crp-note" style="padding:4px 0;border-bottom:1px solid var(--border)">✓ ' + esc(e.created_at) + ' — ' + e.nb_envoyes + '/' + e.nb_destinataires + ' envoyé(s) · ' + esc(e.objet || '') + '</div>').join('') : '')
    + '</div>';
  $('#mobj').value = M.objet;
  const draw = () => {
    const g = $('#mg'); if (g) g.innerHTML = d.groupes.map(x => '<label class="' + (M.g.has(x.type_id) ? 'sel' : '') + '"><input type="checkbox" data-g="' + x.type_id + '" ' + (M.g.has(x.type_id) ? 'checked' : '') + '> <span>' + esc(x.label) + '<small>' + x.nb + ' adresse(s)</small></span></label>').join('');
    const q = ($('#mrech') || { value: '' }).value.toLowerCase(), pl = $('#mp');
    if (pl) pl.innerHTML = d.personnes.filter(p => (p.prenom + ' ' + p.nom + ' ' + (p.type_label || '')).toLowerCase().includes(q)).map(p => { const inc = M.g.has(p.type_id); return '<label class="' + (inc ? 'inc' : '') + '"><input type="checkbox" data-p="' + p.id + '" ' + (inc || M.p.has(p.id) ? 'checked' : '') + ' ' + (inc ? 'disabled' : '') + '> ' + esc((p.prenom + ' ' + p.nom).trim()) + '<span class="crp-q">' + esc(p.type_label || '') + (inc ? ' · via le groupe' : '') + '</span></label>'; }).join('') || '<div class="crp-note" style="padding:10px">Aucun résultat.</div>';
    $$('[data-g]').forEach(i => i.addEventListener('change', () => { const id = Number(i.dataset.g); i.checked ? M.g.add(id) : M.g.delete(id); draw(); }));
    $$('[data-p]').forEach(i => i.addEventListener('change', () => { const id = Number(i.dataset.p); i.checked ? M.p.add(id) : M.p.delete(id); $('#mnb').textContent = nb(); }));
    $('#mxl').innerHTML = M.ext.map((x, i) => '<span class="crp-chip ext">✉️ ' + esc(x.nom) + ' · ' + esc(x.email) + ' <span class="x" data-xrm="' + i + '">×</span></span>').join('');
    $$('[data-xrm]').forEach(x => x.addEventListener('click', () => { M.ext.splice(Number(x.dataset.xrm), 1); draw(); }));
    $('#mnb').textContent = nb();
  };
  const rech = $('#mrech'); if (rech) rech.addEventListener('input', draw);
  const addExt = () => {
    const nom = $('#mxn').value.trim(), email = $('#mxm').value.trim(), er = $('#mxe'); const show = m => { er.textContent = m; er.style.display = 'block'; };
    if (!nom) { show('Indiquez le nom de la personne.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { show("Cette adresse e-mail n'a pas un format valide."); return; }
    if (M.ext.some(x => x.email.toLowerCase() === email.toLowerCase())) { show('Cette adresse est déjà dans la liste.'); return; }
    er.style.display = 'none'; M.ext.push({ nom, email }); $('#mxn').value = ''; $('#mxm').value = ''; draw(); $('#mxn').focus();
  };
  $('#mxa').onclick = addExt; ['#mxn', '#mxm'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addExt(); } }));
  const envoyer = async test => {
    const n = test ? 1 : nb(); if (!n) { toast('Choisissez un groupe, une personne ou ajoutez une adresse'); return; }
    if (!test && !confirm('Envoyer le compte-rendu à ' + n + ' personne(s) ?')) return;
    const res = $('#mres'); res.textContent = 'Envoi en cours…';
    try {
      const r = await api('POST', `/evenements/${ST.evtId}/compte-rendu/envoyer`, { test, objet: $('#mobj').value, groupes: [...M.g], personnes: [...M.p], externes: M.ext });
      res.textContent = r.mail_non_configure ? "L'envoi d'e-mails n'est pas configuré sur ce serveur : aucun message n'est parti."
        : (test ? 'Test envoyé à votre adresse.' : r.envoyes + ' e-mail(s) envoyé(s) sur ' + r.destinataires + (r.ignores_desinscrits ? ' · ' + r.ignores_desinscrits + ' désinscrit(s) ignoré(s)' : '') + (r.echecs ? ' · ' + r.echecs + ' échec(s)' : '') + (r.non_traites ? ' · ' + r.non_traites + ' restant(s) : relancez l\'envoi' : ''));
    } catch (e) { res.textContent = e.message || 'Erreur'; }
  };
  $('#menv').onclick = () => envoyer(false); $('#mtest').onclick = () => envoyer(true);
  draw(); zone.scrollIntoView({ behavior: 'smooth' });
}

/* =================== AIGUILLAGE =================== */
async function init() {
  const p = new URLSearchParams(location.search);
  ST.evtId = Number(p.get('evt')) || null;
  ST.user = await fetchCurrentUser().catch(() => null);
  const root = $('#crp');
  if (!ST.evtId) {
    if (!ST.user) { location.href = 'login.html'; return; }
    return vueListe();
  }
  try { ST.data = await api('GET', `/evenements/${ST.evtId}/compte-rendu`); }
  catch (e) { root.innerHTML = '<div class="crp-card"><h1>Compte-rendu introuvable</h1><p class="crp-note">' + esc(e.message || "Cet événement n'existe pas ou n'est pas accessible.") + '</p></div>'; return; }
  document.title = "Diaspo'Actif — Compte-rendu : " + ST.data.evenement.titre;
  const d = ST.data, edition = p.get('edition') === '1';
  if (d.peut_editer && (edition || !d.compte_rendu)) {
    if (!d.evenement.termine && (!ST.user || ST.user.role !== 'administrateur')) {
      root.innerHTML = '<div class="crp-card"><h1>Pas encore</h1><p class="crp-note">Le compte-rendu s\'écrit une fois l\'événement terminé. En attendant, vous pouvez déjà identifier des participants depuis <a class="cr-link" href="evenements.html?evt=' + d.evenement.id + '">la page de l\'événement</a>.</p></div>';
      return;
    }
    ST.ed = nouvelEd(); return vueEditeur();
  }
  if (d.compte_rendu) return vuePublique();
  root.innerHTML = '<div class="crp-card"><h1>' + esc(d.evenement.titre) + '</h1><p class="crp-note">Aucun compte-rendu n\'a été publié pour cet événement.</p><div class="cr-btns"><a class="cr-btn sec" href="evenements.html?evt=' + d.evenement.id + '">ℹ️ Voir l\'événement</a></div></div>';
}
init();
</script>
