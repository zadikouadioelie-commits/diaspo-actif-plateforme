<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes inscriptions — Diaspo'Actif</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="assets/styles.v2.css">
<link rel="stylesheet" href="/assets/responsive.v2.css?v=2">
<link rel="stylesheet" href="/assets/ui-enhancements.v2.css">
<link rel="stylesheet" href="/assets/design-upgrade.v2.css">
<link rel="stylesheet" href="/assets/theme-manager.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D2B4E">
<link rel="apple-touch-icon" href="assets/logo.png">
<style>
.mi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.mi-card{border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--card,#fff);}
.mi-fiche{font-size:12px;color:var(--muted);margin-bottom:4px;}
.mi-titre{font-weight:800;font-size:15px;margin-bottom:8px;}
.mi-meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.mi-badge{display:inline-block;border-radius:99px;padding:3px 12px;font-size:11px;font-weight:700;margin-bottom:10px;}
.mi-badge-confirme{background:#F0FDF4;color:#16a34a;}
.mi-badge-inscrit{background:#F0F4FF;color:#1B3A6B;}
.mi-badge-liste_attente{background:#FFF7ED;color:#c2410c;}
.mi-badge-annule{background:#FEF2F2;color:#dc2626;}
.mi-badge-present{background:#EFF6FF;color:#1d4ed8;}
.mi-badge-absent{background:#F1F5F9;color:#64748b;}
</style>
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="topbar-inner">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">&#9776;</button>
    <div class="logo"><img loading="lazy" class="logo-img" src="assets/logo.png" alt="Diaspo'Actif"> DIASPO'ACTIF</div>
    <nav class="nav">
      <a href="index.html">Accueil</a>
      <a href="annuaire.html">Annuaire</a>
      <a href="evenements.html">Événements</a>
    </nav>
    <div class="topbar-right">
      <div id="auth-area" class="auth-area"></div>
    </div>
  </div>
</header>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<aside class="sidebar" id="sidebar">
  <button class="sidebar-close" id="sidebar-close" aria-label="Fermer">&#x2715;</button>
  <div class="brand">Diaspo'Actif</div>
  <a href="index.html">🏠 Accueil</a>
  <a href="evenements.html">📅 Événements</a>
  <a href="mes-inscriptions-evt.html">🎟️ Mes inscriptions</a>
  <div id="hb-account-section"></div>
</aside>

<main class="container" style="max-width:1000px;margin:0 auto;padding:24px 16px;">
  <h1 style="font-size:22px;font-weight:900;color:#0D2B4E;margin:0 0 6px;">🎟️ Mes inscriptions</h1>
  <p style="color:var(--muted);font-size:14px;margin:0 0 8px;">Retrouvez toutes vos inscriptions à des événements Diaspo'Actif.</p>
  <div id="mi-list" class="mi-grid"><div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">Chargement…</div></div>
</main>
</div>

<script src="assets/data.js"></script>
<script src="assets/demo.js?v=2"></script>
<script src="assets/app.js?v=12"></script>
<script>
const MI_STATUT_LABEL = { inscrit:'🔵 Inscrit', confirme:'🟢 Confirmé', present:'✅ Présent', absent:'⬛ Absent', annule:'❌ Annulé', liste_attente:'🟠 Liste d\'attente' };
(async function initMesInscriptions() {
  const me = await fetchCurrentUser();
  if (!me) { window.location.href = 'login.html?next=mes-inscriptions-evt.html'; return; }
  try {
    const { inscriptions } = await api('GET', '/mes-inscriptions-evt');
    const el = document.getElementById('mi-list');
    if (!inscriptions.length) {
      el.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">Vous n\'avez pas encore d\'inscription à un événement.<br><a href="evenements.html" class="btn btn-orange" style="margin-top:14px;display:inline-block;">Voir les événements →</a></div>';
      return;
    }
    el.innerHTML = inscriptions.map(i => `
      <div class="mi-card" id="insc-${i.id}">
        <div class="mi-badge mi-badge-${i.statut}">${MI_STATUT_LABEL[i.statut] || i.statut}</div>
        <div class="mi-fiche">${escH(i.fiche_nom)}</div>
        <div class="mi-titre">${escH(i.evenement_titre || i.fiche_nom)}</div>
        <div class="mi-meta">
          ${i.date_evt ? `<span>📅 ${escH(i.date_evt)}${i.heure_debut ? ' · ' + escH(i.heure_debut) : ''}</span>` : ''}
          ${i.ville || i.pays ? `<span>📍 ${escH([i.ville, i.pays].filter(Boolean).join(', '))}</span>` : ''}
          <span>🎫 ${escH(i.type_label)}</span>
          <span style="font-size:11px;">N° ${escH(i.reference || '')}</span>
        </div>
        ${i.statut === 'confirme' || i.statut === 'present' ? `<a class="btn btn-orange" style="font-size:12px;text-decoration:none;" href="/api/insc/inscriptions/${i.id}/confirmation.pdf" target="_blank" rel="noopener">Voir mon QR Code →</a>` : ''}
      </div>`).join('');
  } catch (e) {
    document.getElementById('mi-list').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#dc2626;">Erreur : ${escH(e.message)}</div>`;
  }
})();
</script>
<script src="/assets/cookies-banner.js"></script>
<script src="/assets/theme-manager.js"></script>
<script src="assets/back-button.js"></script>
</body>
</html>
