<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo.png">
<title>Rapport de résultats — Diaspo'Actif</title>
<style>
/* Rapport de résultats d'un sondage (2026-11-10) — document anonymisé, destiné à être imprimé, enregistré en PDF ou transmis à des autorités.
   À l'écran : fond « nuit » + feuille blanche. À l'impression : la feuille seule, en noir sur blanc. Diagrammes en SVG (vectoriels, nets à l'impression).
   Couleurs des diagrammes : palette de référence validée (bleu pour les barres ; 6 teintes dans l'ordre fixe pour le camembert). Le sens ne repose
   jamais sur la couleur seule : chaque part porte son libellé, son pourcentage et son effectif. */
:root{
  --nuit:#0b1020; --nuit-2:#141b30; --or:#e3c06e; --or-2:#c79a3b; --ink:#16202b; --ink-2:#4a5560; --ink-3:#6b7580;
  --papier:#ffffff; --filet:#e4e7ec; --filet-2:#cfd5dd; --piste:#eef1f5;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --alerte:#8a5a00; --alerte-bg:#fff7e0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}

/* ── Barre d'outils (écran seulement) ── */
.barre{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.96);backdrop-filter:blur(6px);border-bottom:1px solid rgba(227,192,110,.25);padding:10px 16px}
.barre-in{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.retour{color:#e8ecf5;text-decoration:none;font-size:14px;font-weight:600;padding:8px 4px}
.retour:hover{color:var(--or)}
.grp{display:flex;align-items:center;gap:8px;color:#c8cfdf;font-size:13px}
.grp>span{font-weight:600}
.seg{display:inline-flex;border:1px solid rgba(227,192,110,.5);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#e8ecf5;border:0;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--or);color:#1a1405}
.barre select{background:var(--nuit-2);color:#e8ecf5;border:1px solid rgba(227,192,110,.5);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;min-height:40px}
.coche{display:inline-flex;align-items:center;gap:7px;color:#e8ecf5;font-size:13px;cursor:pointer;min-height:40px}
.coche input{width:18px;height:18px;accent-color:var(--or)}
.act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--or);background:transparent;color:var(--or);border-radius:999px;padding:9px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{background:rgba(227,192,110,.12)}
.btn.plein{background:var(--or);color:#1a1405}
.btn.plein:hover{background:#efd083}

/* ── Feuille ── */
.page{padding:22px 12px 60px}
.feuille{max-width:820px;margin:0 auto;background:var(--papier);border-radius:6px;box-shadow:0 18px 60px rgba(0,0,0,.45);padding:44px 48px 36px}
.ent-sur{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;margin:0 0 10px;color:var(--ink);font-weight:750}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--ink-2);margin:0 0 14px}
.meta b{color:var(--ink)}
.desc{font-size:14px;color:var(--ink-2);margin:0 0 16px;white-space:pre-line}
.anon{border:1px solid var(--filet-2);border-left:4px solid var(--c1);background:#f6f9fe;border-radius:4px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin:0 0 22px}
.anon b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--filet-2);border-radius:6px;margin:0 0 26px}
.kpi{padding:14px 16px;border-left:1px solid var(--filet-2)}
.kpi:first-child{border-left:0}
.kpi .v{font-size:30px;font-weight:750;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink-2)}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:4px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink);font-weight:750}
.q{padding:16px 0 18px;border-bottom:1px solid var(--filet);break-inside:avoid;page-break-inside:avoid}
.q:last-child{border-bottom:0}
.q-t{display:flex;gap:10px;align-items:baseline;margin:0 0 3px}
.q-n{flex:none;font-weight:750;color:var(--c1);font-variant-numeric:tabular-nums}
.q-t h3{margin:0;font-size:16px;line-height:1.35;font-weight:700;color:var(--ink)}
.q-d{margin:0 0 4px 28px;font-size:13px;color:var(--ink-3)}
.q-base{margin:0 0 12px 28px;font-size:12.5px;color:var(--ink-2)}
.q-base .tag{display:inline-block;border:1px solid var(--filet-2);border-radius:999px;padding:1px 8px;margin-right:6px;font-size:11.5px;color:var(--ink-2)}
.faible{margin:0 0 10px 28px;background:var(--alerte-bg);border-left:4px solid #e6a100;color:var(--alerte);font-size:12.5px;padding:6px 10px;border-radius:3px}
.corps{margin-left:28px}
/* barres horizontales */
.bars{display:grid;gap:7px}
.br{display:grid;grid-template-columns:minmax(110px,36%) 1fr 92px;gap:10px;align-items:center;font-size:13.5px}
.br .lib{color:var(--ink);overflow-wrap:anywhere}
.br .piste{height:16px;background:var(--piste);border-radius:3px;overflow:hidden}
.br .rem{height:100%;background:var(--c1);border-radius:0 4px 4px 0;min-width:0}
.br .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.br .val b{font-weight:750}
.br .val span{color:var(--ink-3);font-size:12px;margin-left:4px}
/* camembert + légende */
.cam{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.cam svg{flex:none;width:190px;height:190px}
.leg{flex:1;min-width:230px;border-collapse:collapse;font-size:13.5px}
.leg td{padding:5px 8px 5px 0;border-bottom:1px solid var(--filet);vertical-align:middle}
.leg td.nb{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.leg .sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.leg tr:last-child td{border-bottom:0}
/* colonnes (échelles, évolution) */
.col svg{width:100%;height:auto;display:block;overflow:visible}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:10px 0 0;font-size:13.5px;color:var(--ink-2)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.ext{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:4px}
/* réponses libres */
.verb{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.verb li{border-left:3px solid var(--filet-2);padding:2px 0 2px 12px;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.note{font-size:13px;color:var(--ink-2);margin:0}
.methode{margin-top:30px;border-top:2px solid var(--ink);padding-top:12px;font-size:12.5px;color:var(--ink-2)}
.methode h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.methode ul{margin:0 0 12px;padding-left:18px}
.methode li{margin-bottom:3px}
.pied{margin-top:14px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.etat{max-width:620px;margin:60px auto;background:var(--nuit-2);color:#e8ecf5;border:1px solid rgba(227,192,110,.35);border-radius:12px;padding:26px;text-align:center}
.etat a{color:var(--or);font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:720px){
  .feuille{padding:26px 18px 24px}
  h1{font-size:22px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--filet-2)}
  .br{grid-template-columns:1fr auto;grid-template-areas:"lib val" "piste piste"}
  .br .lib{grid-area:lib}.br .val{grid-area:val}.br .piste{grid-area:piste}
  .corps,.q-d,.q-base,.faible{margin-left:0}
  .act{margin-left:0}
  .barre{position:static}
}
@media print{
  @page{size:A4;margin:14mm 13mm 16mm;@bottom-right{content:counter(page) " / " counter(pages);font:10px system-ui,sans-serif;color:#6b7580}}
  html,body{background:#fff!important}
  .barre,.no-print{display:none!important}
  .page{padding:0}
  .feuille{box-shadow:none;border-radius:0;max-width:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .q{break-inside:avoid}
  h2{break-after:avoid}
  a{text-decoration:none}
}
</style>
</head>
<body>
<header class="barre no-print" id="barre" hidden>
  <div class="barre-in">
    <a class="retour" href="sondages.html" id="retour">← Mes sondages</a>
    <div class="grp"><span id="l-vue">Diagramme</span>
      <div class="seg" role="group" aria-labelledby="l-vue">
        <button type="button" data-vue="barres" aria-pressed="true">Barres</button>
        <button type="button" data-vue="camembert" aria-pressed="false">Camembert</button>
      </div>
    </div>
    <label class="grp"><span>Ordre</span>
      <select id="tri" aria-label="Ordre des réponses">
        <option value="questionnaire">Celui du questionnaire</option>
        <option value="effectif">Du plus au moins cité</option>
      </select>
    </label>
    <label class="coche"><input type="checkbox" id="verb" checked> Réponses libres</label>
    <div class="act">
      <button type="button" class="btn" id="csv">Exporter les données (CSV)</button>
      <button type="button" class="btn plein" id="imp">Imprimer / PDF</button>
    </div>
  </div>
</header>
<main class="page" id="page"><div class="etat" role="status">Chargement du rapport…</div></main>

<script>
(function () {
  'use strict';
  var SID = parseInt(new URLSearchParams(location.search).get('id'), 10);
  var COUL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'];
  var TYPES = { choix_unique: 'Choix unique', choix_multiple: 'Choix multiples', oui_non: 'Oui / Non', texte_libre: 'Réponse libre', texte_long: 'Réponse libre', echelle_5: 'Échelle de 1 à 5', echelle_10: 'Échelle de 1 à 10', etoiles: 'Notation de 1 à 5 étoiles', nombre: 'Nombre', date: 'Date' };
  var CATS = { consultation_citoyenne: 'Consultation citoyenne', projet: 'Projet', emploi: 'Emploi', formation: 'Formation', culture: 'Culture', tourisme: 'Tourisme', investissement: 'Investissement', sante: 'Santé', numerique: 'Numérique', education: 'Éducation', environnement: 'Environnement', autre: 'Sondage' };
  var STAT = { ouvert: 'en cours', cloture: 'terminé', brouillon: 'brouillon', archive: 'archivé' };
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var R = null, OPT = { vue: 'barres', tri: 'questionnaire', verb: true };

  function load() { try { var o = JSON.parse(localStorage.getItem('rapport_sondage_opts') || '{}'); if (o.vue) OPT.vue = o.vue; if (o.tri) OPT.tri = o.tri; if (o.verb === false) OPT.verb = false; } catch (e) { /* stockage indisponible */ } }
  function save() { try { localStorage.setItem('rapport_sondage_opts', JSON.stringify(OPT)); } catch (e) { /* stockage indisponible */ } }
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var nf = function (x, d) { return Number(x).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: d === undefined ? 1 : d }); };
  var pf = function (x) { return nf(x, 1) + ' %'; };
  var jour = function (iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? parseInt(m[3], 10) + (m[3] === '01' ? 'er' : '') + ' ' + MOIS[parseInt(m[2], 10) - 1] + ' ' + m[1] : '—'; };
  var jourCourt = function (iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] : ''; };
  var moisLib = function (ym) { var m = /^(\d{4})-(\d{2})$/.exec(ym || ''); return m ? MOIS[parseInt(m[2], 10) - 1] + ' ' + m[1] : ym; };
  var pl = function (n, un, plus) { return nf(n, 0) + ' ' + (n > 1 ? plus : un); };

  /* ── Diagrammes ── */
  function barres(mods, couleur) {
    var max = Math.max.apply(null, mods.map(function (m) { return m.pct; }).concat([1]));
    return '<div class="bars">' + mods.map(function (m) {
      return '<div class="br"><div class="lib">' + esc(m.libelle) + '</div><div class="piste" aria-hidden="true"><div class="rem" style="width:' + Math.max(m.pct, 0) + '%;background:' + couleur + '" title="' + esc(m.libelle) + ' : ' + pf(m.pct) + ' (' + pl(m.n, 'réponse', 'réponses') + ')"></div></div><div class="val"><b>' + pf(m.pct) + '</b><span>' + nf(m.n, 0) + '</span></div></div>';
    }).join('') + '</div>';
  }
  function arc(cx, cy, r, a0, a1) { var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1); return [x0, y0, x1, y1, a1 - a0 > Math.PI ? 1 : 0]; }
  function camembert(mods, total) {
    var utiles = mods.filter(function (m) { return m.n > 0; }), svg = '', a = -Math.PI / 2, cx = 100, cy = 100, R1 = 92, R0 = 54;
    var somme = utiles.reduce(function (s, m) { return s + m.n; }, 0) || 1;
    if (utiles.length === 1) {
      var ci = mods.indexOf(utiles[0]) % COUL.length;
      svg = '<circle cx="100" cy="100" r="' + ((R1 + R0) / 2) + '" fill="none" stroke="' + COUL[ci] + '" stroke-width="' + (R1 - R0) + '"><title>' + esc(utiles[0].libelle) + ' : 100 %</title></circle>';
    } else {
      utiles.forEach(function (m) {
        var ang = (m.n / somme) * Math.PI * 2, b = a + ang, o = arc(cx, cy, R1, a, b), i = arc(cx, cy, R0, a, b);
        var d = 'M' + o[0].toFixed(2) + ' ' + o[1].toFixed(2) + ' A' + R1 + ' ' + R1 + ' 0 ' + o[4] + ' 1 ' + o[2].toFixed(2) + ' ' + o[3].toFixed(2) + ' L' + i[2].toFixed(2) + ' ' + i[3].toFixed(2) + ' A' + R0 + ' ' + R0 + ' 0 ' + i[4] + ' 0 ' + i[0].toFixed(2) + ' ' + i[1].toFixed(2) + ' Z';
        svg += '<path d="' + d + '" fill="' + COUL[mods.indexOf(m) % COUL.length] + '" stroke="#fff" stroke-width="2"><title>' + esc(m.libelle) + ' : ' + pf(m.pct) + ' (' + pl(m.n, 'réponse', 'réponses') + ')</title></path>';
        a = b;
      });
    }
    svg += '<text x="100" y="98" text-anchor="middle" font-size="26" font-weight="750" fill="#16202b">' + nf(total, 0) + '</text><text x="100" y="116" text-anchor="middle" font-size="11" fill="#4a5560">' + (total > 1 ? 'réponses' : 'réponse') + '</text>';
    var legende = '<table class="leg"><tbody>' + mods.map(function (m, i) {
      return '<tr><td><span class="sw" style="background:' + COUL[i % COUL.length] + '"></span>' + esc(m.libelle) + '</td><td class="nb"><b>' + pf(m.pct) + '</b></td><td class="nb">' + nf(m.n, 0) + '</td></tr>';
    }).join('') + '</tbody></table>';
    return '<div class="cam"><svg viewBox="0 0 200 200" role="img" aria-label="Camembert : ' + esc(mods.map(function (m) { return m.libelle + ' ' + pf(m.pct); }).join(', ')) + '">' + svg + '</svg>' + legende + '</div>';
  }
  /* colonnes verticales : data = [{lib, v, titre}] ; format = fonction d'affichage de la valeur */
  function colonnes(data, couleur, format, aria, etiquettes) {
    var W = 700, H = 190, g = 34, b = 26, n = data.length, max = Math.max.apply(null, data.map(function (d) { return d.v; }).concat([1]));
    var cw = (W - 10) / n, bw = Math.min(46, cw * 0.62), s = '';
    s += '<line x1="0" y1="' + (H - b) + '" x2="' + W + '" y2="' + (H - b) + '" stroke="#cfd5dd"/>';
    [0.5, 1].forEach(function (f) { var y = (H - b) - (H - b - g) * f; s += '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + W + '" y2="' + y.toFixed(1) + '" stroke="#eef1f5"/>'; });
    var pas = Math.ceil(n / 14);
    data.forEach(function (d, i) {
      var h = (H - b - g) * (d.v / max), x = 5 + i * cw + (cw - bw) / 2, y = H - b - h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, d.v > 0 ? 2 : 0).toFixed(1) + '" rx="3" fill="' + couleur + '"><title>' + esc(d.titre || d.lib) + '</title></rect>';
      if (etiquettes || d.v === max) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#16202b">' + esc(format(d.v)) + '</text>';
      if (i % pas === 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12" fill="#4a5560">' + esc(d.lib) + '</text>';
    });
    return '<div class="col"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">' + s + '</svg></div>';
  }

  /* ── Une question ── */
  function triees(mods, q) { if (OPT.tri !== 'effectif' || q.famille === 'echelle' || q.famille === 'date') return mods; return mods.map(function (m, i) { return { m: m, i: i }; }).sort(function (a, b) { return b.m.n - a.m.n || a.i - b.i; }).map(function (x) { return x.m; }); }
  function questionHtml(q, i) {
    var base = '<span class="tag">' + esc(TYPES[q.type] || q.type) + '</span>' + (q.obligatoire ? '' : '<span class="tag">Facultative</span>') +
      (q.n === 0 ? 'Aucune réponse' : pl(q.n, 'réponse', 'réponses') + ' sur ' + pl(R.repondants, 'répondant', 'répondants') + ' (' + pf(q.taux_reponse) + ')');
    var corps = '';
    if (q.n === 0) corps = '<p class="note">Cette question n’a pas encore reçu de réponse.</p>';
    else if (q.famille === 'choix' || q.famille === 'multiple') {
      var mods = triees(q.modalites, q);
      var okCam = OPT.vue === 'camembert' && q.famille === 'choix' && mods.length <= COUL.length;
      corps = okCam ? camembert(mods, q.n) : barres(mods, COUL[0]);
      if (OPT.vue === 'camembert' && !okCam) corps += '<p class="note" style="margin-top:8px">' + (q.famille === 'multiple' ? 'Plusieurs réponses possibles : un camembert serait trompeur, la question est présentée en barres.' : 'Plus de ' + COUL.length + ' modalités : présentée en barres pour rester lisible.') + '</p>';
      else if (q.famille === 'multiple') corps += '<p class="note" style="margin-top:8px">Plusieurs réponses possibles : le total peut dépasser 100 %.</p>';
    } else if (q.famille === 'echelle') {
      var st = q.stats || {};
      corps = colonnes(q.modalites.map(function (m) { return { lib: m.libelle, v: m.pct, titre: 'Note ' + m.libelle + ' : ' + pf(m.pct) + ' (' + pl(m.n, 'réponse', 'réponses') + ')' }; }), COUL[0], pf, 'Répartition des notes : ' + q.modalites.map(function (m) { return m.libelle + ' → ' + pf(m.pct); }).join(', '), true);
      if (q.min_label || q.max_label) corps += '<div class="ext"><span>1 = ' + esc(q.min_label || 'minimum') + '</span><span>' + q.max + ' = ' + esc(q.max_label || 'maximum') + '</span></div>';
      corps += '<div class="stats"><span>Moyenne : <b>' + (st.moyenne == null ? '—' : nf(st.moyenne, 2) + ' / ' + q.max) + '</b></span><span>Médiane : <b>' + (st.mediane == null ? '—' : nf(st.mediane, 1)) + '</b></span></div>';
    } else if (q.famille === 'nombre') {
      var s2 = q.stats;
      corps = s2 ? '<div class="stats" style="margin-top:0"><span>Moyenne : <b>' + nf(s2.moyenne, 2) + '</b></span><span>Médiane : <b>' + nf(s2.mediane, 2) + '</b></span><span>Minimum : <b>' + nf(s2.min, 2) + '</b></span><span>Maximum : <b>' + nf(s2.max, 2) + '</b></span></div>' : '<p class="note">Aucune valeur exploitable.</p>';
    } else if (q.famille === 'date') {
      corps = barres(q.modalites.map(function (m) { return { libelle: moisLib(m.libelle), n: m.n, pct: m.pct }; }), COUL[0]);
    } else if (q.famille === 'texte') {
      if (q.verbatims_masques) corps = '<p class="note">Réponses libres non reproduites : moins de ' + R.seuils.verbatims + ' réponses à cette question, une citation pourrait permettre de reconnaître son auteur.</p>';
      else if (!OPT.verb) corps = '<p class="note">' + pl(q.n, 'réponse libre', 'réponses libres') + ' (non reproduites dans cette version du rapport).</p>';
      else {
        corps = '<ul class="verb">' + q.verbatims.map(function (v) { return '<li>« ' + esc(v) + ' »</li>'; }).join('') + '</ul>';
        if (q.verbatims_total > q.verbatims.length) corps += '<p class="note" style="margin-top:8px">' + q.verbatims.length + ' réponses sur ' + q.verbatims_total + ' sont reproduites ici ; l’ensemble figure dans l’export des réponses du sondage.</p>';
        else corps += '<p class="note" style="margin-top:8px">Réponses reproduites telles que saisies, sans nom ni date ; adresses e-mail, liens et numéros de téléphone éventuels sont masqués.</p>';
      }
    }
    return '<section class="q" aria-labelledby="q' + q.id + '"><div class="q-t"><span class="q-n">' + (i + 1) + '.</span><h3 id="q' + q.id + '">' + esc(q.texte) + '</h3></div>' +
      (q.description ? '<p class="q-d">' + esc(q.description) + '</p>' : '') + '<p class="q-base">' + base + '</p>' +
      (q.effectif_faible ? '<p class="faible">Effectif faible (n = ' + q.n + ') : résultats à interpréter avec prudence.</p>' : '') +
      '<div class="corps">' + corps + '</div></section>';
  }

  /* ── Document ── */
  function render() {
    var s = R.sondage, now = new Date();
    var edite = now.toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long', year: 'numeric' }) + ' à ' + now.toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
    var jDeb = s.date_debut, jFin = s.date_fin;
    var periode = (R.premiere_reponse ? jour(R.premiere_reponse) + (R.derniere_reponse !== R.premiere_reponse ? ' au ' + jour(R.derniere_reponse) : '') : (jDeb ? 'du ' + jour(jDeb) + ' au ' + jour(jFin) : '—'));
    var h = '<article class="feuille" id="feuille">' +
      '<p class="ent-sur"><span>Rapport de résultats · Sondage</span><span>Document anonymisé</span></p>' +
      '<h1>' + esc(s.titre) + '</h1>' +
      '<p class="meta">' + (s.organisateur ? '<span>Organisé par <b>' + esc(s.organisateur) + '</b></span>' : '') + '' + (CATS[s.categorie] && s.categorie !== 'autre' ? '<span>' + esc(CATS[s.categorie]) + '</span>' : '') + '<span>Collecte : <b>' + esc(periode) + '</b></span><span>Statut : ' + esc(STAT[s.statut] || s.statut) + '</span></p>' +
      (s.description ? '<p class="desc">' + esc(s.description) + '</p>' : '') +
      '<p class="anon"><b>Données anonymes.</b> Ce rapport ne contient que des résultats agrégés (effectifs et pourcentages). Aucun nom, adresse e-mail, numéro de téléphone ni identifiant de compte n’y figure, et les réponses libres ne sont reproduites que lorsqu’elles sont assez nombreuses pour ne désigner personne.</p>' +
      '<div class="kpis"><div class="kpi"><div class="v">' + nf(R.repondants, 0) + '</div><div class="l">' + (R.repondants > 1 ? 'personnes ont répondu' : 'personne a répondu') + '</div></div>' +
      '<div class="kpi"><div class="v">' + nf(R.nb_questions, 0) + '</div><div class="l">question' + (R.nb_questions > 1 ? 's' : '') + '</div></div>' +
      '<div class="kpi"><div class="v">' + nf(R.taux_reponse_moyen, 0) + '<small> %</small></div><div class="l">taux moyen de réponse par question</div></div>' +
      '<div class="kpi"><div class="v">' + (R.evolution.length ? nf(R.evolution.length, 0) : '—') + '</div><div class="l">jour' + (R.evolution.length > 1 ? 's' : '') + ' avec des réponses</div></div></div>';
    if (R.repondants === 0) {
      h += '<p class="note">Ce sondage n’a pas encore reçu de réponse : les diagrammes apparaîtront ici dès les premières réponses.</p>';
    } else {
      if (R.evolution.length > 1) {
        h += '<h2>Participation dans le temps</h2>' + colonnes(R.evolution.map(function (e) { return { lib: jourCourt(e.jour), v: e.n, titre: jour(e.jour) + ' : ' + pl(e.n, 'réponse', 'réponses') }; }), COUL[0], function (v) { return nf(v, 0); }, 'Nombre de réponses par jour : ' + R.evolution.map(function (e) { return jour(e.jour) + ' → ' + e.n; }).join(', '), R.evolution.length <= 14);
      }
      h += '<h2>Résultats par question</h2>' + R.questions.map(questionHtml).join('');
    }
    h += '<div class="methode"><h4>Lecture des résultats</h4><ul>' +
      '<li>Les pourcentages sont calculés sur le nombre de personnes ayant répondu à la question concernée (indiqué « n » sous chaque question).</li>' +
      '<li>Pour les questions à plusieurs réponses possibles, le total des pourcentages peut dépasser 100 %.</li>' +
      '<li>Sous ' + R.seuils.effectif_faible + ' réponses, une question est signalée comme indicative (effectif faible) ; les réponses libres ne sont reproduites qu’à partir de ' + R.seuils.verbatims + ' réponses.</li>' +
      '<li>Résultats d’un échantillon de personnes ayant choisi de répondre : ils ne sont pas nécessairement représentatifs de l’ensemble de la population concernée.</li></ul>' +
      '<div class="pied"><span>Source : plateforme Diaspo’Actif · sondage n° ' + s.id + '</span><span>Édité le ' + esc(edite) + ' (heure de Paris)</span></div></div></article>';
    document.getElementById('page').innerHTML = h;
  }

  /* ── Export CSV (données agrégées, jamais de données personnelles) ── */
  function csv() {
    var s = R.sondage, L = [], sur = function (v) { var t = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
    var ligne = function (a) { L.push(a.map(sur).join(';')); };
    ligne(['Rapport de résultats du sondage', s.titre]); ligne(['Organisateur', s.organisateur]); ligne(['Répondants', R.repondants]); ligne(['Source', 'Diaspo’Actif · sondage n° ' + s.id]); ligne(['Données anonymes : effectifs et pourcentages uniquement']); L.push('');
    ligne(['N°', 'Question', 'Type', 'Réponses à la question (n)', 'Modalité', 'Effectif', 'Pourcentage (%)']);
    R.questions.forEach(function (q, i) {
      if (q.modalites && q.modalites.length) q.modalites.forEach(function (m) { ligne([i + 1, q.texte, TYPES[q.type] || q.type, q.n, q.famille === 'date' ? moisLib(m.libelle) : m.libelle, m.n, String(m.pct).replace('.', ',')]); });
      else if (q.stats) Object.keys(q.stats).forEach(function (k) { ligne([i + 1, q.texte, TYPES[q.type] || q.type, q.n, k, String(q.stats[k]).replace('.', ','), '']); });
      else if (q.famille === 'texte') {
        if (OPT.verb && q.verbatims.length) q.verbatims.forEach(function (v) { ligne([i + 1, q.texte, 'Réponse libre', q.n, v, '', '']); });
        else ligne([i + 1, q.texte, 'Réponse libre', q.n, q.verbatims_masques ? 'Non reproduites (moins de ' + R.seuils.verbatims + ' réponses)' : '', '', '']);
      } else ligne([i + 1, q.texte, TYPES[q.type] || q.type, q.n, '', '', '']);
    });
    if (R.evolution.length) { L.push(''); ligne(['Jour', 'Réponses reçues']); R.evolution.forEach(function (e) { ligne([e.jour, e.n]); }); }
    var blob = new Blob(['﻿' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'rapport-sondage-' + s.id + '.csv'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function etat(html) { document.getElementById('page').innerHTML = '<div class="etat" role="status">' + html + '</div>'; }
  function majBarre() {
    document.querySelectorAll('[data-vue]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.vue === OPT.vue ? 'true' : 'false'); });
    document.getElementById('tri').value = OPT.tri; document.getElementById('verb').checked = OPT.verb;
  }
  function brancher() {
    document.querySelectorAll('[data-vue]').forEach(function (b) { b.onclick = function () { OPT.vue = b.dataset.vue; save(); majBarre(); render(); }; });
    document.getElementById('tri').onchange = function () { OPT.tri = this.value; save(); render(); };
    document.getElementById('verb').onchange = function () { OPT.verb = this.checked; save(); render(); };
    document.getElementById('imp').onclick = function () { window.print(); };
    document.getElementById('csv').onclick = csv;
  }

  load();
  if (!SID) { etat('Sondage introuvable. <a href="sondages.html">Retour aux sondages</a>'); return; }
  document.getElementById('retour').href = 'sondages.html#mes';
  fetch('/api/sondages/' + SID + '/rapport', { credentials: 'same-origin' }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, d: d }; });
  }).then(function (x) {
    if (x.status === 401) { etat('Connectez-vous pour consulter le rapport de ce sondage. <br><br><a href="sondages.html">Ouvrir la page des sondages</a>'); return; }
    if (x.status === 403 || x.status === 404) { etat('Ce rapport est réservé à la personne qui a créé le sondage. <br><br><a href="sondages.html">Retour aux sondages</a>'); return; }
    if (x.status !== 200 || !x.d.sondage) { etat('Le rapport n’a pas pu être préparé. Réessayez dans un instant. <br><br><a href="">Réessayer</a>'); return; }
    R = x.d; document.title = 'Rapport — ' + R.sondage.titre + ' — Diaspo’Actif';
    document.getElementById('barre').hidden = false; majBarre(); brancher(); render();
  }).catch(function () { etat('Connexion impossible pour le moment. <br><br><a href="">Réessayer</a>'); });
})();
</script>
</body>
</html>
