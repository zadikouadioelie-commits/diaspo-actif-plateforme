<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diaspo'Actif — Carte mentale</title>
<link rel="icon" href="/assets/logo.png">
<style>
  :root{--navy:#0D2B4E;--orange:#F26422;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
  button{font-family:inherit}
  header.barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px}
  header.barre a.retour{color:var(--navy);text-decoration:none;font-weight:700;font-size:14px}
  #titre{flex:1;min-width:180px;font-size:17px;font-weight:800;color:var(--navy);border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent}
  #titre:hover:not([readonly]){border-color:var(--line)}
  #titre:focus{outline:2px solid rgba(242,100,34,.45);background:#fff}
  .etat{font-size:12px;color:var(--muted);min-width:110px;text-align:right}
  .etat.ko{color:#b91c1c;font-weight:700}
  .btn{background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
  .btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.prim{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn.prim:hover:not(:disabled){filter:brightness(1.06);color:#fff}
  .outils{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:6px 14px}
  .outils .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .zone{flex:1;display:flex;min-height:0}
  #toile{flex:1;min-width:0;position:relative;overflow:hidden;background:
    radial-gradient(circle,#dbe3ee 1px,transparent 1px) 0 0/22px 22px,#f8fafc}
  #svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #svg.glisse{cursor:grabbing}
  .noeud{cursor:pointer}
  .noeud rect.cadre{transition:stroke-width .1s}
  .noeud.sel rect.cadre{stroke-width:3.5}
  .noeud text{pointer-events:none;font-size:13px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  aside.panneau{width:300px;flex:none;background:#fff;border-left:1px solid var(--line);padding:14px;overflow-y:auto}
  aside.panneau h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  aside.panneau label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
  aside.panneau input[type=text],aside.panneau textarea,aside.panneau select{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:9px;font-family:inherit;font-size:14px}
  aside.panneau textarea{min-height:110px;resize:vertical}
  .pastilles{display:flex;gap:7px;flex-wrap:wrap}
  .pastille{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #cbd5e1;cursor:pointer;padding:0}
  .pastille.on{box-shadow:0 0 0 3px var(--navy)}
  .pastille.aucune{background:linear-gradient(135deg,#fff 45%,#dc2626 46%,#dc2626 54%,#fff 55%)}
  .aide{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .lecture-note{white-space:pre-wrap;font-size:14px;line-height:1.5;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  #print-zone{display:none}
  .msg{max-width:560px;margin:80px auto;text-align:center;color:var(--muted);padding:0 20px}
  .msg a{color:var(--orange);font-weight:700}
  @media (max-width:820px){.zone{flex-direction:column}aside.panneau{width:100%;max-height:42vh;border-left:0;border-top:1px solid var(--line)}}
  @page{size:A4 landscape;margin:10mm}
  @media print{
    body{background:#fff;display:block}
    header.barre,.outils,.zone{display:none!important}
    #print-zone{display:block!important}
    #print-zone h1{font-size:18px;color:#0D2B4E;margin:0 0 8px}
    #print-zone svg{width:100%;height:auto;max-height:175mm}
  }
</style>
</head>
<body>
<div id="racine"><div class="msg">Chargement…</div></div>

<script>
'use strict';
const PALETTE = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#be185d', '#475569'];
const NS = 'http://www.w3.org/2000/svg';
const idCarte = new URLSearchParams(location.search).get('id');
let carte = null, edition = false, plan = null, formation = null;
let sel = null, historique = [], refaire = [];
let sale = false, minuteur = null, enCours = false, dernierEchec = false;
let vue = { x: 0, y: 0, k: 1 };

const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in (a || {})) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
const nid = () => Math.random().toString(36).slice(2, 10);

/* ── Accès à l'arbre ── */
function trouver(id, n, parent) { n = n || carte.data.racine; if (n.id === id) return { n, parent: parent || null }; for (const e of n.enfants) { const r = trouver(id, e, n); if (r) return r; } return null; }
function compter(n) { return 1 + n.enfants.reduce((a, e) => a + compter(e), 0); }
function profondeur(n) { return 1 + Math.max(0, ...n.enfants.map(profondeur)); }

/* ── Historique (annuler / rétablir) ── */
function instantane() { return JSON.stringify(carte.data); }
function avantChangement() { historique.push(instantane()); if (historique.length > 60) historique.shift(); refaire = []; }
function annuler() { if (!historique.length) return; refaire.push(instantane()); carte.data = JSON.parse(historique.pop()); if (!trouver(sel)) sel = null; marquerSale(); rendre(); majPanneau(); }
function rejouer() { if (!refaire.length) return; historique.push(instantane()); carte.data = JSON.parse(refaire.pop()); if (!trouver(sel)) sel = null; marquerSale(); rendre(); majPanneau(); }

/* ── Enregistrement automatique ── */
function marquerSale() { if (!edition) return; sale = true; majEtat('Modifications non enregistrées…'); clearTimeout(minuteur); minuteur = setTimeout(enregistrer, 1200); }
function majEtat(t, ko) { const e = document.getElementById('etat'); if (e) { e.textContent = t; e.classList.toggle('ko', !!ko); } }
async function enregistrer() {
  if (!edition || enCours) { if (sale && edition) { clearTimeout(minuteur); minuteur = setTimeout(enregistrer, 800); } return; }
  enCours = true; majEtat('Enregistrement…');
  const envoye = instantane();
  try {
    const r = await fetch('/api/cartes-mentales/' + encodeURIComponent(carte.id), { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titre: carte.titre, data: carte.data }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Enregistrement impossible.');
    if (instantane() === envoye) { sale = false; majEtat('✓ Enregistré'); } else { majEtat('Modifications non enregistrées…'); clearTimeout(minuteur); minuteur = setTimeout(enregistrer, 600); }
    dernierEchec = false;
  } catch (e) { dernierEchec = true; majEtat('⚠ ' + (e.message || 'Non enregistré') + ' — nouvelle tentative…', true); clearTimeout(minuteur); minuteur = setTimeout(enregistrer, 5000); }
  enCours = false;
}
window.addEventListener('beforeunload', e => { if (sale && edition) { e.preventDefault(); e.returnValue = ''; } });

/* ── Mise en page : arbre horizontal ── */
const PAD = 14, LH = 17, GAP_X = 64, GAP_Y = 12, MAXCH = 26;
function lignes(t) {
  const mots = String(t).split(/\s+/), out = []; let cur = '';
  for (const m of mots) { if ((cur + ' ' + m).trim().length > MAXCH && cur) { out.push(cur); cur = m; } else cur = (cur + ' ' + m).trim(); }
  if (cur) out.push(cur);
  const l = out.slice(0, 4).map(x => x.length > MAXCH + 4 ? x.slice(0, MAXCH + 3) + '…' : x);
  if (out.length > 4) l[3] = l[3].replace(/…?$/, '…');
  return l.length ? l : [''];
}
function mesurer(n) { n._l = lignes(n.texte); n._w = Math.min(Math.max(Math.max(...n._l.map(x => x.length)) * 7.2 + PAD * 2, 84), 240); n._h = n._l.length * LH + PAD; n.enfants.forEach(mesurer); }
function bloc(n) { if (!n.enfants.length || n.replie) return (n._b = n._h + GAP_Y); let s = 0; n.enfants.forEach(e => { s += bloc(e); }); return (n._b = Math.max(s, n._h + GAP_Y)); }
function largeurs(n, d, acc) { acc[d] = Math.max(acc[d] || 0, n._w); if (!n.replie) n.enfants.forEach(e => largeurs(e, d + 1, acc)); }
function placer(n, d, y0, xs) {
  n._x = xs[d];
  if (!n.enfants.length || n.replie) { n._y = y0 + (n._b - n._h) / 2; return; }
  let y = y0; n.enfants.forEach(e => { placer(e, d + 1, y, xs); y += e._b; });
  const a = n.enfants[0], b = n.enfants[n.enfants.length - 1];
  n._y = (a._y + a._h / 2 + b._y + b._h / 2) / 2 - n._h / 2;
}
function couleurDe(n, heritee, indexBranche) { return n.couleur || heritee || PALETTE[indexBranche % PALETTE.length]; }

function dessiner(svgG, lecturePure) {
  const racine = carte.data.racine;
  mesurer(racine); bloc(racine);
  const acc = []; largeurs(racine, 0, acc);
  const xs = []; let x = 24; acc.forEach((w, i) => { xs[i] = x; x += w + GAP_X; });
  placer(racine, 0, 20, xs);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const aretes = el('g', { fill: 'none', 'stroke-linecap': 'round' }), noeuds = el('g');
  function parcourir(n, d, couleurPere, idxBranche) {
    minX = Math.min(minX, n._x); minY = Math.min(minY, n._y); maxX = Math.max(maxX, n._x + n._w); maxY = Math.max(maxY, n._y + n._h);
    const c = d === 0 ? (n.couleur || '#0D2B4E') : couleurDe(n, couleurPere, idxBranche);
    const racineN = d === 0;
    const g = el('g', { class: 'noeud' + (!lecturePure && n.id === sel ? ' sel' : ''), 'data-id': n.id });
    g.appendChild(el('rect', { class: 'cadre', x: n._x, y: n._y, width: n._w, height: n._h, rx: racineN ? 14 : 10, fill: racineN ? c : c, 'fill-opacity': racineN ? 1 : 0.13, stroke: c, 'stroke-width': racineN ? 2 : 2 }));
    n._l.forEach((ln, i) => g.appendChild(el('text', { x: n._x + n._w / 2, y: n._y + PAD / 2 + LH * (i + 0.8) + 2, 'text-anchor': 'middle', fill: racineN ? '#fff' : '#0f172a', 'font-weight': racineN ? 700 : 500 }, ln)));
    if (n.note) g.appendChild(el('text', { x: n._x + n._w - 4, y: n._y + 12, 'text-anchor': 'end', 'font-size': 11 }, '📝'));
    if (n.lien) g.appendChild(el('text', { x: n._x + 4, y: n._y + 12, 'font-size': 11 }, '🔗'));
    if (n.enfants.length && n.replie) {
      g.appendChild(el('circle', { cx: n._x + n._w + 10, cy: n._y + n._h / 2, r: 10, fill: c, stroke: '#fff', 'stroke-width': 2 }));
      g.appendChild(el('text', { x: n._x + n._w + 10, y: n._y + n._h / 2 + 4, 'text-anchor': 'middle', fill: '#fff', 'font-size': 11, 'font-weight': 700 }, '+' + (compter(n) - 1)));
    }
    noeuds.appendChild(g);
    if (!n.replie) n.enfants.forEach((e, i) => {
      const cc = couleurDe(e, d === 0 ? null : c, d === 0 ? i : idxBranche);
      const x1 = n._x + n._w, y1 = n._y + n._h / 2, x2 = e._x, y2 = e._y + e._h / 2, mx = (x1 + x2) / 2;
      aretes.appendChild(el('path', { d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, stroke: cc, 'stroke-width': d === 0 ? 3 : 2, opacity: 0.8 }));
      parcourir(e, d + 1, d === 0 ? cc : c, d === 0 ? i : idxBranche);
    });
  }
  parcourir(racine, 0, null, 0);
  svgG.appendChild(aretes); svgG.appendChild(noeuds);
  return { minX, minY, maxX, maxY };
}

let cadre = { minX: 0, minY: 0, maxX: 100, maxY: 100 };
function rendre() {
  const g = document.getElementById('vue'); if (!g) return;
  while (g.firstChild) g.removeChild(g.firstChild);
  cadre = dessiner(g, !edition);
  appliquerVue();
}
function appliquerVue() { document.getElementById('vue').setAttribute('transform', `translate(${vue.x},${vue.y}) scale(${vue.k})`); }
function ajuster() {
  const s = document.getElementById('svg'); const W = s.clientWidth || 800, H = s.clientHeight || 500;
  const w = cadre.maxX - cadre.minX + 60, h = cadre.maxY - cadre.minY + 60;
  const k = Math.min(W / w, H / h, 1.3);
  vue = { k, x: (W - (cadre.maxX - cadre.minX) * k) / 2 - cadre.minX * k, y: (H - (cadre.maxY - cadre.minY) * k) / 2 - cadre.minY * k };
  appliquerVue();
}
function zoomer(facteur, cx, cy) {
  const s = document.getElementById('svg'); cx = cx == null ? s.clientWidth / 2 : cx; cy = cy == null ? s.clientHeight / 2 : cy;
  const k2 = Math.min(3, Math.max(0.15, vue.k * facteur)); const f = k2 / vue.k;
  vue = { k: k2, x: cx - (cx - vue.x) * f, y: cy - (cy - vue.y) * f }; appliquerVue();
}

/* ── Actions d'édition ── */
function selection() { return sel ? trouver(sel) : null; }
function ajouterEnfant() {
  const s = selection() || { n: carte.data.racine, parent: null };
  if (compter(carte.data.racine) >= 250) { alert('Une carte ne peut pas dépasser 250 noeuds.'); return; }
  avantChangement();
  const n = { id: nid(), texte: 'Nouvelle idée', enfants: [] };
  s.n.replie = false; s.n.enfants.push(n); sel = n.id;
  marquerSale(); rendre(); majPanneau(true); centrerSur(n.id);
}
function ajouterFrere() {
  const s = selection(); if (!s || !s.parent) { ajouterEnfant(); return; }
  if (compter(carte.data.racine) >= 250) { alert('Une carte ne peut pas dépasser 250 noeuds.'); return; }
  avantChangement();
  const n = { id: nid(), texte: 'Nouvelle idée', enfants: [] };
  const i = s.parent.enfants.indexOf(s.n); s.parent.enfants.splice(i + 1, 0, n); sel = n.id;
  marquerSale(); rendre(); majPanneau(true); centrerSur(n.id);
}
function supprimer() {
  const s = selection(); if (!s || !s.parent) return;
  if (s.n.enfants.length && !confirm('Supprimer cette idée et toutes ses sous-idées ?')) return;
  avantChangement();
  const i = s.parent.enfants.indexOf(s.n); s.parent.enfants.splice(i, 1); sel = s.parent.id;
  marquerSale(); rendre(); majPanneau();
}
function deplacer(delta) {
  const s = selection(); if (!s || !s.parent) return;
  const a = s.parent.enfants, i = a.indexOf(s.n), j = i + delta; if (j < 0 || j >= a.length) return;
  avantChangement(); [a[i], a[j]] = [a[j], a[i]]; marquerSale(); rendre(); majPanneau();
}
function replier() { const s = selection(); if (!s || !s.n.enfants.length) return; if (edition) avantChangement(); s.n.replie = !s.n.replie; if (edition) marquerSale(); rendre(); }
function centrerSur(id) { const r = trouver(id); if (!r) return; const s = document.getElementById('svg'); const n = r.n; vue.x = s.clientWidth / 2 - (n._x + n._w / 2) * vue.k; vue.y = s.clientHeight / 2 - (n._y + n._h / 2) * vue.k; appliquerVue(); }

/* ── Panneau latéral ── */
function lienVers(l) {
  if (!l) return null;
  if (l.type === 'url') return l.url;
  if (!formation) return null;
  return 'suivre-formation.html?id=' + encodeURIComponent(formation.id) + (l.type === 'lecon' ? '&lecon=' + encodeURIComponent(l.id) : '');
}
function majPanneau(focusTexte) {
  const p = document.getElementById('panneau'); if (!p) return;
  const s = selection();
  p.textContent = '';
  const h = document.createElement('h2'); h.textContent = s ? (s.parent ? 'Idée sélectionnée' : 'Idée centrale') : 'Carte mentale'; p.appendChild(h);
  if (!s) {
    const a = document.createElement('p'); a.className = 'aide'; a.style.border = '0'; a.style.paddingTop = '0';
    a.textContent = edition ? 'Cliquez sur une idée pour la modifier. « + Idée liée » ajoute une sous-idée ; Tab et Entrée font de même au clavier.' : 'Cliquez sur une idée pour lire sa note ou suivre son lien. Glissez pour déplacer la carte, molette pour zoomer.';
    p.appendChild(a); return;
  }
  const n = s.n;
  const champ = (lib, node) => { const l = document.createElement('label'); l.textContent = lib; p.appendChild(l); p.appendChild(node); return node; };
  if (edition) {
    const t = document.createElement('input'); t.type = 'text'; t.id = 'f-texte'; t.maxLength = 120; t.value = n.texte;
    let groupe = false;
    t.addEventListener('input', () => { if (!groupe) { avantChangement(); groupe = true; setTimeout(() => { groupe = false; }, 1500); } n.texte = t.value || ' '; marquerSale(); rendre(); });
    champ('Texte', t);
    const note = document.createElement('textarea'); note.id = 'f-note'; note.maxLength = 1500; note.value = n.note || ''; note.placeholder = 'Détails, exemples, rappels…';
    let g2 = false;
    note.addEventListener('input', () => { if (!g2) { avantChangement(); g2 = true; setTimeout(() => { g2 = false; }, 1500); } if (note.value) n.note = note.value; else delete n.note; marquerSale(); rendre(); });
    champ('Note', note);
    const l = document.createElement('label'); l.textContent = 'Couleur de la branche'; p.appendChild(l);
    const pas = document.createElement('div'); pas.className = 'pastilles';
    const aucune = document.createElement('button'); aucune.type = 'button'; aucune.className = 'pastille aucune' + (!n.couleur ? ' on' : ''); aucune.title = 'Couleur automatique'; aucune.setAttribute('aria-label', 'Couleur automatique');
    aucune.addEventListener('click', () => { avantChangement(); delete n.couleur; marquerSale(); rendre(); majPanneau(); }); pas.appendChild(aucune);
    PALETTE.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'pastille' + (n.couleur === c ? ' on' : ''); b.style.background = c; b.setAttribute('aria-label', 'Couleur ' + c); b.addEventListener('click', () => { avantChangement(); n.couleur = c; marquerSale(); rendre(); majPanneau(); }); pas.appendChild(b); });
    p.appendChild(pas);
    /* Lien : chapitre / leçon de la formation (cartes de formation) ou adresse web */
    const sel2 = document.createElement('select'); sel2.id = 'f-lien';
    const opts = [['', 'Aucun lien']];
    if (plan) plan.forEach(it => opts.push([it.type + ':' + it.id, (it.type === 'chapitre' ? '📖 ' : '   📄 ') + it.titre]));
    opts.push(['url', '🌐 Adresse web…']);
    opts.forEach(([v, lab]) => { const o = document.createElement('option'); o.value = v; o.textContent = lab; sel2.appendChild(o); });
    sel2.value = !n.lien ? '' : n.lien.type === 'url' ? 'url' : n.lien.type + ':' + n.lien.id;
    if (n.lien && n.lien.type !== 'url' && sel2.value !== n.lien.type + ':' + n.lien.id) sel2.value = '';
    champ('Lien', sel2);
    const url = document.createElement('input'); url.type = 'text'; url.id = 'f-url'; url.placeholder = 'https://…'; url.maxLength = 500; url.value = n.lien && n.lien.type === 'url' ? n.lien.url : ''; url.style.marginTop = '6px'; url.style.display = sel2.value === 'url' ? '' : 'none'; p.appendChild(url);
    sel2.addEventListener('change', () => { avantChangement(); const v = sel2.value; if (!v) delete n.lien; else if (v === 'url') { url.style.display = ''; url.focus(); n.lien = { type: 'url', url: url.value || 'https://' }; } else { const [ty, id] = v.split(':'); n.lien = { type: ty, id: Number(id) }; url.style.display = 'none'; } marquerSale(); rendre(); });
    url.addEventListener('change', () => { if (/^https?:\/\/[^\s<>"']+$/i.test(url.value.trim())) { avantChangement(); n.lien = { type: 'url', url: url.value.trim() }; marquerSale(); rendre(); } else if (url.value.trim()) alert('Saisissez une adresse commençant par http:// ou https://'); });
    if (focusTexte) { t.focus(); t.select(); }
    const aide = document.createElement('div'); aide.className = 'aide';
    aide.textContent = 'Raccourcis : Tab = sous-idée · Entrée = idée voisine · Suppr = supprimer · Espace = replier · Ctrl+Z / Ctrl+Y = annuler / rétablir.';
    p.appendChild(aide);
  } else {
    const t = document.createElement('div'); t.style.fontWeight = '800'; t.style.fontSize = '16px'; t.textContent = n.texte; p.appendChild(t);
    if (n.note) { const l = document.createElement('label'); l.textContent = 'Note'; p.appendChild(l); const d = document.createElement('div'); d.className = 'lecture-note'; d.textContent = n.note; p.appendChild(d); }
    const href = lienVers(n.lien);
    if (href) { const a = document.createElement('a'); a.href = href; a.className = 'btn prim'; a.style.display = 'inline-block'; a.style.marginTop = '14px'; a.style.textDecoration = 'none'; a.textContent = n.lien.type === 'url' ? '🌐 Ouvrir le lien' : n.lien.type === 'lecon' ? '▶ Aller à cette leçon' : '▶ Aller à la formation'; if (n.lien.type === 'url') { a.target = '_blank'; a.rel = 'noopener noreferrer'; } p.appendChild(a); }
    if (!n.note && !href) { const a = document.createElement('p'); a.className = 'aide'; a.style.border = '0'; a.textContent = 'Cette idée n\'a ni note ni lien.'; p.appendChild(a); }
  }
}

/* ── Export ── */
function svgAutonome(titre) {
  const g = el('g'); const c = dessiner(g, true);
  const m = 24, w = c.maxX - c.minX + m * 2, h = c.maxY - c.minY + m * 2 + 34;
  const svg = el('svg', { xmlns: NS, width: Math.ceil(w), height: Math.ceil(h), viewBox: `0 0 ${Math.ceil(w)} ${Math.ceil(h)}`, 'font-family': 'system-ui, -apple-system, Segoe UI, Arial, sans-serif' });
  svg.appendChild(el('rect', { width: '100%', height: '100%', fill: '#ffffff' }));
  svg.appendChild(el('text', { x: m, y: 26, fill: '#0D2B4E', 'font-size': 17, 'font-weight': 800 }, titre));
  const wrap = el('g', { transform: `translate(${m - c.minX},${34 + m - c.minY})` }); while (g.firstChild) wrap.appendChild(g.firstChild);
  svg.appendChild(wrap);
  svg.querySelectorAll('text').forEach(t => { if (!t.getAttribute('font-size')) t.setAttribute('font-size', '13'); });
  return { svg, w: Math.ceil(w), h: Math.ceil(h) };
}
function exporterPNG() {
  const { svg, w, h } = svgAutonome(carte.titre);
  const xml = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  img.onload = () => {
    const k = 2, cv = document.createElement('canvas'); cv.width = w * k; cv.height = h * k;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'carte-mentale-' + (carte.titre || 'carte').replace(/[^\wÀ-ɏ-]+/g, '-').slice(0, 50) + '.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/png');
  };
  img.onerror = () => alert('Export impossible sur ce navigateur : utilisez « Imprimer / PDF ».');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}
function preparerImpression() {
  const z = document.getElementById('print-zone'); if (!z) return;
  z.textContent = '';
  const h = document.createElement('h1'); h.textContent = carte.titre; z.appendChild(h);
  const { svg } = svgAutonome(''); svg.querySelectorAll('text').forEach(t => { if (t.textContent === '') t.remove(); });
  z.appendChild(svg);
}
window.addEventListener('beforeprint', preparerImpression);
function imprimer() { preparerImpression(); window.print(); }

/* ── Construction de la page ── */
function construire() {
  const r = document.getElementById('racine'); r.textContent = '';
  r.style.display = 'contents';
  const barre = document.createElement('header'); barre.className = 'barre';
  barre.innerHTML = '<a class="retour" href="formations.html">← Formations</a><input id="titre" type="text" maxlength="120" aria-label="Titre de la carte"><span class="etat" id="etat" role="status"></span><button class="btn" id="b-png" type="button">🖼️ Image PNG</button><button class="btn prim" id="b-pdf" type="button">🖨️ Imprimer / PDF</button>';
  const outils = document.createElement('div'); outils.className = 'outils'; outils.id = 'outils';
  const zone = document.createElement('div'); zone.className = 'zone';
  zone.innerHTML = '<div id="toile"><svg id="svg" role="img" aria-label="Carte mentale"><g id="vue"></g></svg></div><aside class="panneau" id="panneau" aria-live="polite"></aside>';
  const pz = document.createElement('div'); pz.id = 'print-zone';
  r.appendChild(barre); r.appendChild(outils); r.appendChild(zone); r.appendChild(pz);
  const t = document.getElementById('titre'); t.value = carte.titre;
  if (!edition) t.readOnly = true;
  t.addEventListener('input', () => { carte.titre = t.value.trim() || 'Ma carte mentale'; marquerSale(); });
  document.title = carte.titre + ' — Carte mentale';
  const btn = (id, txt, fn, titre) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.id = id; b.textContent = txt; if (titre) b.title = titre; b.addEventListener('click', fn); outils.appendChild(b); return b; };
  const sep = () => { const s = document.createElement('span'); s.className = 'sep'; outils.appendChild(s); };
  if (edition) {
    btn('t-enfant', '+ Idée liée', ajouterEnfant, 'Ajouter une sous-idée (Tab)');
    btn('t-frere', '+ Idée voisine', ajouterFrere, 'Ajouter une idée au même niveau (Entrée)');
    btn('t-sup', '🗑️ Supprimer', supprimer, 'Supprimer (Suppr)');
    btn('t-haut', '↑', () => deplacer(-1), 'Monter parmi ses voisines'); btn('t-bas', '↓', () => deplacer(1), 'Descendre parmi ses voisines');
    sep(); btn('t-undo', '↶ Annuler', annuler, 'Ctrl+Z'); btn('t-redo', '↷ Rétablir', rejouer, 'Ctrl+Y'); sep();
  }
  btn('t-replier', '⊟ Replier / déplier', replier, 'Espace');
  sep(); btn('t-moins', '−', () => zoomer(0.8), 'Zoom arrière'); btn('t-plus', '+', () => zoomer(1.25), 'Zoom avant'); btn('t-fit', '⤢ Tout afficher', ajuster);
  if (formation) { const s = document.createElement('span'); s.style.cssText = 'margin-left:auto;font-size:12px;color:#64748b'; s.textContent = 'Formation : ' + formation.titre; outils.appendChild(s); }
  document.getElementById('b-png').addEventListener('click', exporterPNG);
  document.getElementById('b-pdf').addEventListener('click', imprimer);
  majEtat(edition ? '✓ Enregistré' : 'Lecture seule');

  /* Interactions sur la toile */
  const svg = document.getElementById('svg');
  svg.addEventListener('click', e => {
    const g = e.target.closest('.noeud');
    sel = g ? g.getAttribute('data-id') : null; rendre(); majPanneau();
  });
  svg.addEventListener('dblclick', e => { const g = e.target.closest('.noeud'); if (g && edition) { const f = document.getElementById('f-texte'); if (f) { f.focus(); f.select(); } } });
  let glisse = null, bouge = false;
  svg.addEventListener('pointerdown', e => { if (e.target.closest('.noeud')) return; glisse = { x: e.clientX, y: e.clientY, vx: vue.x, vy: vue.y }; bouge = false; svg.setPointerCapture(e.pointerId); svg.classList.add('glisse'); });
  svg.addEventListener('pointermove', e => { if (!glisse) return; const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y; if (Math.abs(dx) + Math.abs(dy) > 3) bouge = true; vue.x = glisse.vx + dx; vue.y = glisse.vy + dy; appliquerVue(); });
  const finGlisse = e => { if (glisse) { glisse = null; svg.classList.remove('glisse'); try { svg.releasePointerCapture(e.pointerId); } catch (_) {} } };
  svg.addEventListener('pointerup', e => { if (glisse && !bouge && !e.target.closest('.noeud')) { sel = null; rendre(); majPanneau(); } finGlisse(e); });
  svg.addEventListener('pointercancel', finGlisse);
  svg.addEventListener('wheel', e => { e.preventDefault(); const rc = svg.getBoundingClientRect(); zoomer(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - rc.left, e.clientY - rc.top); }, { passive: false });
  window.addEventListener('keydown', e => {
    const champ = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
    if ((e.ctrlKey || e.metaKey) && !champ) { if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); if (edition) annuler(); } else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); if (edition) rejouer(); } return; }
    if (champ) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === ' ') { e.preventDefault(); replier(); }
    else if (edition && e.key === 'Tab') { e.preventDefault(); ajouterEnfant(); }
    else if (edition && e.key === 'Enter') { e.preventDefault(); ajouterFrere(); }
    else if (edition && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); supprimer(); }
    else if (edition && e.key === 'F2') { e.preventDefault(); const f = document.getElementById('f-texte'); if (f) { f.focus(); f.select(); } }
  });
  window.addEventListener('resize', () => { /* la vue reste telle quelle */ });
  rendre(); majPanneau();
  setTimeout(ajuster, 30);
}

(async function demarrer() {
  const racine = document.getElementById('racine');
  if (!idCarte) { racine.innerHTML = '<div class="msg">Aucune carte indiquée. <a href="formations.html">Retour aux formations</a></div>'; return; }
  let r;
  try { r = await fetch('/api/cartes-mentales/' + encodeURIComponent(idCarte), { credentials: 'same-origin' }); } catch (e) { racine.innerHTML = '<div class="msg">Connexion impossible. Réessayez.</div>'; return; }
  if (r.status === 401) { racine.innerHTML = '<div class="msg">Connectez-vous pour consulter cette carte.<br><br><a href="login.html">Se connecter</a></div>'; return; }
  if (!r.ok) { racine.innerHTML = '<div class="msg">Carte introuvable, ou vous n\'y avez pas accès. <a href="formations.html">Retour aux formations</a></div>'; return; }
  const d = await r.json();
  carte = d.carte; edition = !!d.edition; plan = d.plan; formation = d.formation;
  construire();
})();
</script>
