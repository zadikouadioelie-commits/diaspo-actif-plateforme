<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Atelier des boutiques</title>
<link rel="icon" href="/assets/logo.png">
<style>
  :root { --fond:#14141b; --carte:#1b1b22; --trait:rgba(216,179,106,.35); --or:#d8b36a; --texte:#f2f2f6; --discret:#b4b4c2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--fond); color: var(--texte); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; min-height: 100dvh; }
  a { color: var(--or); }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; background: var(--carte); border-bottom: 2px solid var(--or); }
  header h1 { font-size: 18px; margin: 0; }
  header .sous { color: var(--discret); font-size: 13px; flex: 1 1 260px; }
  main { flex: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
  nav.types { border-right: 1px solid var(--trait); padding: 12px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  nav.types h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--discret); margin: 4px 4px 6px; font-weight: 600; }
  nav.types button { text-align: left; border: 1px solid var(--trait); background: transparent; color: inherit; border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit; min-height: 44px; }
  nav.types button small { display: block; color: var(--discret); font-size: 12px; }
  nav.types button[aria-current="true"] { background: var(--or); color: #111; border-color: var(--or); }
  nav.types button[aria-current="true"] small { color: #3a2e12; }
  nav.types button:focus-visible, .barre button:focus-visible, .barre a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  section.scene { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .barre { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--trait); }
  .barre .groupe { display: flex; gap: 6px; }
  .barre button, .barre a.bouton { border: 1px solid var(--or); background: transparent; color: var(--texte); border-radius: 999px; padding: 7px 14px; cursor: pointer; font: inherit; font-size: 13px; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center; }
  .barre button[aria-pressed="true"] { background: var(--or); color: #111; }
  .barre .espace { flex: 1; }
  .info { padding: 10px 14px; border-bottom: 1px solid var(--trait); color: var(--discret); font-size: 13px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); align-items: start; }
  .info p { margin: 0; }
  .cadre { flex: 1; min-height: 480px; display: flex; justify-content: center; background: #0c0c11; padding: 12px; overflow: auto; }
  .cadre iframe { border: 1px solid var(--trait); border-radius: 10px; background: #fff; width: 100%; height: 100%; min-height: 70vh; }
  .cadre.tablette iframe { width: 768px; max-width: 100%; }
  .cadre.telephone iframe { width: 400px; max-width: 100%; }
  .refus { margin: 40px auto; max-width: 480px; padding: 24px; text-align: center; border: 1px solid var(--trait); border-radius: 12px; background: var(--carte); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    nav.types { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--trait); }
    nav.types h2 { display: none; }
    nav.types button { flex: 0 0 auto; }
    .info { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Atelier des boutiques</h1>
  <span class="sous">Un exemple réel par type, avec des données fictives. Les vraies boutiques ne changent pas.</span>
  <a href="dashboard-administrateur.html">← Tableau de bord administrateur</a>
</header>

<div id="refus" class="refus" hidden></div>

<main id="atelier" hidden>
  <nav class="types" id="liste" aria-label="Types de boutique"><h2>Types</h2></nav>
  <section class="scene">
    <div class="barre" role="toolbar" aria-label="Affichage de l'exemple">
      <div class="groupe" role="group" aria-label="Taille de l'écran">
        <button type="button" data-vue="ordinateur" aria-pressed="true">Ordinateur</button>
        <button type="button" data-vue="tablette" aria-pressed="false">Tablette</button>
        <button type="button" data-vue="telephone" aria-pressed="false">Téléphone 400 px</button>
      </div>
      <span class="espace"></span>
      <button type="button" id="actualiser">Actualiser</button>
      <a class="bouton" id="onglet" href="#" target="_blank" rel="noopener">Ouvrir dans un onglet</a>
    </div>
    <div class="info">
      <p id="decrit"></p>
      <div id="carteCreateur" aria-label="Aperçu tel que le voit un créateur"></div>
    </div>
    <div class="cadre" id="cadre"><iframe id="scene" title="Exemple de boutique" referrerpolicy="no-referrer"></iframe></div>
  </section>
</main>

<script src="assets/boutique-types.js"></script>
<script src="assets/boutique-exemple-bouton.js"></script>
<script>
(function () {
  "use strict";
  var R = window.BOUTIQUE_TYPES;
  var ROLES = ["administrateur", "super_administrateur"];
  var liste = document.getElementById("liste"), scene = document.getElementById("scene"), cadre = document.getElementById("cadre");
  var courant = null;

  function refuser(msg) {
    var r = document.getElementById("refus");
    r.hidden = false;
    r.innerHTML = "<p><b>" + msg + "</b></p>";
  }

  /* Outils de l'atelier, en plus des types : la création d'une boutique (Paramètres vitrine = tronc commun). */
  var OUTILS = {
    creation: { label: "Création d'une boutique", desc: "Paramètres vitrine : modèle, identité, couleurs, options",
      exemple: "/exemples-boutiques/parametres-vitrine.html",
      what: "Le système de création commun à tous les types : choix du modèle principal (avec « Voir l'exemple »), identité, studio de couleurs, options, rubriques, bonus et publication. Ce que vous réglez ici s'applique aux exemples des types : ouvrez ensuite « Aperçu de ma boutique » pour voir le rendu." },
    apercu: { label: "Aperçu de ma boutique", desc: "Le rendu selon vos réglages de création",
      exemple: "/exemples-boutiques/ma-boutique.html",
      what: "Votre boutique d'essai telle que la décrivent vos réglages de création : le type principal, les options, les couleurs et textures, le nom et les rubriques. Modifiez la création, puis revenez ici (bouton « Actualiser ») pour voir le résultat." }
  };
  function fiche(cle) { return R.TYPES[cle] || OUTILS[cle]; }

  function choisir(cle) {
    if (!fiche(cle)) cle = Object.keys(R.TYPES)[0];
    courant = cle;
    var t = fiche(cle);
    liste.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-current", b.dataset.cle === cle ? "true" : "false"); });
    scene.src = t.exemple;
    document.getElementById("onglet").href = t.exemple;
    document.getElementById("decrit").textContent = t.what;
    document.getElementById("carteCreateur").innerHTML = R.TYPES[cle] ? window.ExempleBoutique.carte(cle) : "";
    try { history.replaceState(null, "", "#" + cle); } catch (e) {}
  }

  function monter() {
    function ajouter(cle, t) {
      var b = document.createElement("button");
      b.type = "button"; b.dataset.cle = cle;
      b.innerHTML = t.label + "<small>" + t.desc + "</small>";
      b.addEventListener("click", function () { choisir(cle); });
      liste.appendChild(b);
    }
    Object.keys(R.TYPES).forEach(function (cle) { ajouter(cle, R.TYPES[cle]); });
    var h2 = document.createElement("h2"); h2.textContent = "Création"; liste.appendChild(h2);
    Object.keys(OUTILS).forEach(function (cle) { ajouter(cle, OUTILS[cle]); });
    document.querySelectorAll("[data-vue]").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("[data-vue]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        cadre.className = "cadre " + (b.dataset.vue === "ordinateur" ? "" : b.dataset.vue);
      });
    });
    document.getElementById("actualiser").addEventListener("click", function () { scene.src = scene.src; });
    document.getElementById("atelier").hidden = false;
    choisir(location.hash.replace("#", ""));
  }

  fetch("/api/auth/me", { credentials: "same-origin" }).then(function (r) { return r.json(); }).then(function (d) {
    var u = d && d.user;
    if (!u) { location.href = "login.html?redirect=" + encodeURIComponent("atelier-boutiques.html"); return; }
    if (ROLES.indexOf(u.role) < 0) { refuser("Cet atelier est réservé aux administrateurs."); return; }
    monter();
  }).catch(function () { refuser("Impossible de vérifier votre connexion. Réessayez."); });
})();
</script>
</body>
</html>
