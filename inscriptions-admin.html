/* ==========================================================================
   Formulaires & Inscriptions — Diaspo'Actif
   Habillage : design validé par Claude Design (design_handoff_formulaires_inscriptions/
   vanilla/diaspo-app.js), structure state/render/dispatch reprise à l'identique.
   Toutes les données ci-dessous sont réelles, chargées via l'API du module
   (server/index.js, routes /api/insc/*) construite et vérifiée les 2026-09-08/09.
   ========================================================================== */

const IA_TABS = [
  { key: 'overview', label: "Vue d'ensemble", emoji: '📊' },
  { key: 'types', label: "Types d'inscription", emoji: '🏷️' },
  { key: 'validation', label: 'Validation', emoji: '✅' },
  { key: 'fields', label: 'Formulaire', emoji: '📝' },
  { key: 'public', label: 'Aperçu public', emoji: '🌐' },
  { key: 'communication', label: 'Communication', emoji: '📧' },
  { key: 'qr', label: 'Contrôle QR', emoji: '🎟️' },
  { key: 'presences', label: 'Présences', emoji: '👥' },
  { key: 'finances', label: 'Finances', emoji: '💰' },
  { key: 'stats', label: 'Statistiques', emoji: '📈' },
  { key: 'historique', label: 'Historique', emoji: '📜' },
];

const IA_STATUS_LABEL = { brouillon: 'Brouillon', programmee: 'Programmée', publiee: 'Publiée', suspendue: 'Suspendue', fermee: 'Fermée', archivee: 'Archivée' };
const IA_STATUS_STYLES = {
  'publiee':   ['oklch(0.94 0.05 150)', 'oklch(0.4 0.13 150)'],
  'brouillon': ['oklch(0.93 0.004 30)', 'oklch(0.4 0.006 30)'],
  'suspendue': ['oklch(0.94 0.05 20)', 'oklch(0.42 0.16 20)'],
  'fermee':    ['oklch(0.94 0.05 85)', 'oklch(0.42 0.13 85)'],
  'archivee':  ['oklch(0.93 0.004 30)', 'oklch(0.5 0.006 30)'],
  'programmee':['oklch(0.94 0.04 258)','oklch(0.4 0.1 258)'],
};
const IA_TYPES_CHAMP = ['texte_court','texte_long','nombre','email','telephone','date','heure','adresse','liste_deroulante','choix_unique','choix_multiple','oui_non','case_a_cocher','upload_photo','upload_fichier','url'];
/* Suggestions génériques par catégorie (2026-09-09, demande explicite) — Nom/Prénom apparaissent
   ici aussi bien qu'ils soient déjà demandés par défaut sur la fiche : un organisateur peut vouloir
   les redemander pour un accompagnant, un second contact, etc. "Personnalisé" reste un champ libre
   (prompt), pas une liste — il n'a donc pas de suggestions. */
const IA_FIELD_SUGGESTIONS = {
  'Identité': [
    { libelle: 'Nom', type_champ: 'texte_court' },
    { libelle: 'Prénom', type_champ: 'texte_court' },
    { libelle: 'Genre', type_champ: 'choix_unique', options: ['Homme', 'Femme'] },
    { libelle: 'Date de naissance', type_champ: 'date' },
    { libelle: "Nombre d'enfants", type_champ: 'nombre' },
    { libelle: 'Nationalité', type_champ: 'texte_court' },
  ],
  'Contact': [
    { libelle: 'Adresse e-mail', type_champ: 'email' },
    { libelle: 'Numéro de téléphone', type_champ: 'telephone' },
    { libelle: 'Site internet', type_champ: 'url' },
    { libelle: 'LinkedIn', type_champ: 'url' },
    { libelle: "Identifiant de compte Diaspo'Actif", type_champ: 'texte_court' },
    { libelle: 'Adresse postale', type_champ: 'adresse' },
  ],
  'Profession': [
    { libelle: 'Fonction / Poste', type_champ: 'texte_court' },
    { libelle: "Secteur d'activité", type_champ: 'texte_court' },
    { libelle: 'Entreprise / Organisation', type_champ: 'texte_court' },
    { libelle: "Années d'expérience", type_champ: 'nombre' },
    { libelle: 'Statut professionnel', type_champ: 'choix_unique', options: ['Salarié', 'Indépendant', 'Étudiant', 'Sans emploi', 'Retraité'] },
  ],
  'Diaspora': [
    { libelle: "Pays d'origine", type_champ: 'texte_court' },
    { libelle: 'Pays de résidence actuelle', type_champ: 'texte_court' },
    { libelle: 'Ville de résidence', type_champ: 'texte_court' },
    { libelle: "Communauté / région d'origine", type_champ: 'texte_court' },
    { libelle: "Année d'arrivée dans le pays de résidence", type_champ: 'nombre' },
  ],
  'Événement': [
    { libelle: 'Attentes pour cet événement', type_champ: 'texte_long' },
    { libelle: 'Comment avez-vous connu cet événement ?', type_champ: 'choix_unique', options: ['Réseaux sociaux', 'Bouche à oreille', 'E-mail', 'Autre'] },
    { libelle: 'Accompagnant(e)', type_champ: 'oui_non' },
    { libelle: 'Régime alimentaire particulier', type_champ: 'texte_court' },
    { libelle: "Besoin d'accessibilité", type_champ: 'texte_long' },
  ],
  'Médias': [
    { libelle: 'Photo de profil', type_champ: 'upload_photo' },
    { libelle: "Pièce d'identité", type_champ: 'upload_fichier' },
    { libelle: 'CV', type_champ: 'upload_fichier' },
    { libelle: 'Vidéo de présentation', type_champ: 'upload_fichier' },
  ],
};
const IA_FIELD_CATEGORIES = [
  { name: 'Identité' }, { name: 'Contact' }, { name: 'Profession' }, { name: 'Diaspora' },
  { name: 'Événement' }, { name: 'Médias' }, { name: 'Personnalisé' },
];

let IA_ME = null;
const state = {
  view: 'list',
  fiches: [],
  selectedFicheId: null,
  ficheDetail: null,        // { fiche, evenements, types } — GET /insc/fiches/:id
  mesEvenements: [],
  activeTab: 'overview',
  selectedTypeId: null,
  champCategorieOuverte: null,
  editionInfosOuverte: false,
  publicData: null,
  publicSelectedTypeId: null,
  publicReponses: {},
  inscriptions: [],
  commRecipient: 'tous',
  commChannelEmail: true,
  commChannelNotif: true,
  commObjet: '',
  commMessage: '',
  commPiecesJointes: [],
  communications: [],
  lienControle: null,
  checkinStats: null,
  presences: [],
  selectedPresenceId: null,
  historique: [],
  historiqueFiltreEvenement: '',
  busy: false,
};

function ia_toast(msg, ok) { if (typeof showToast === 'function') return showToast(msg, ok ? 'success' : 'error'); alert(msg); }
function isAdmin() { return IA_ME && IA_ME.role === 'administrateur'; }
function selectedFiche() { return state.ficheDetail ? state.ficheDetail.fiche : null; }
function currentTypes() { return state.ficheDetail ? state.ficheDetail.types : []; }
function selectedType() { return currentTypes().find(t => t.id === state.selectedTypeId) || currentTypes()[0] || null; }

function buildTypeVM(t) {
  const priceLabel = t.gratuit ? 'Gratuit' : `${(t.prix || 0)} €`;
  const capacityLabel = t.places_max != null ? `${t.nb_inscrits}/${t.places_max} places` : 'Illimité';
  const isSelected = state.selectedTypeId === t.id;
  return {
    id: t.id, name: t.label, priceLabel, capacityLabel,
    capacityDisplay: t.places_max ?? '∞',
    registered: t.nb_inscrits || 0,
    fillWidth: t.places_max ? Math.min(100, Math.round((t.nb_inscrits / t.places_max) * 100)) + '%' : '4%',
    barWidthPct: t.places_max ? Math.min(100, Math.round((t.nb_inscrits / t.places_max) * 100)) : Math.min(100, t.nb_inscrits * 4),
    validationLabel: t.validation_auto ? 'Validation automatique' : 'Validation manuelle',
    validationAuto: !!t.validation_auto,
    periodLabel: (t.date_ouverture || t.date_fermeture) ? `${t.date_ouverture ? t.date_ouverture.slice(0,10) : '…'} → ${t.date_fermeture ? t.date_fermeture.slice(0,10) : '…'}` : 'Période générale de la fiche',
    waitlist: !!t.liste_attente_active,
    isOpen: !!t.actif, isClosed: !t.actif,
    ctaLabel: "S'inscrire",
    cardBorder: isSelected ? 'oklch(0.32 0.09 258)' : 'oklch(0.9 0.004 30)',
    statusBg: t.actif ? 'oklch(0.94 0.05 150)' : 'oklch(0.93 0.004 30)',
    statusColor: t.actif ? 'oklch(0.4 0.13 150)' : 'oklch(0.5 0.006 30)',
    statusLabel: t.actif ? 'Ouvert' : 'Fermé',
    chipBg: isSelected ? 'oklch(0.32 0.09 258)' : '#fff',
    chipColor: isSelected ? '#fff' : 'oklch(0.3 0.006 30)',
    chipBorder: isSelected ? 'oklch(0.32 0.09 258)' : 'oklch(0.85 0.004 30)',
    complet: t.places_max != null && t.nb_inscrits >= t.places_max,
  };
}

// ---------------------------------------------------------------------------
// Chargement des données (remplace les constantes fictives du prototype)
// ---------------------------------------------------------------------------

async function iaChargerListe() {
  const { fiches } = await api('GET', '/insc/fiches');
  state.fiches = fiches;
}
async function iaChargerFiche(id) {
  const data = await api('GET', '/insc/fiches/' + id);
  state.ficheDetail = data;
  if (!state.selectedTypeId || !data.types.some(t => t.id === state.selectedTypeId)) {
    state.selectedTypeId = data.types[0]?.id || null;
  }
  if (!state.mesEvenements.length) {
    try { const r = await api('GET', '/evenements?owner=' + IA_ME.id); state.mesEvenements = r.evenements || []; } catch (e) {}
  }
}
async function iaChargerPublic() {
  const fiche = selectedFiche(); if (!fiche) return;
  try { state.publicData = await api('GET', '/insc/public/' + fiche.slug); }
  catch (e) { state.publicData = { erreur: e.message }; }
}
async function iaChargerInscriptions() {
  const { inscriptions } = await api('GET', `/insc/fiches/${state.selectedFicheId}/inscriptions`);
  state.inscriptions = inscriptions;
}
async function iaChargerCommunications() {
  const { communications } = await api('GET', `/insc/fiches/${state.selectedFicheId}/communications`);
  state.communications = communications;
}
async function iaChargerLienEtStats() {
  const [{ lien }, { stats }] = await Promise.all([
    api('GET', `/insc/fiches/${state.selectedFicheId}/liens-controle`),
    api('GET', `/insc/fiches/${state.selectedFicheId}/checkin-stats`),
  ]);
  state.lienControle = lien; state.checkinStats = stats;
}
async function iaChargerPresences() {
  const { presences } = await api('GET', `/insc/fiches/${state.selectedFicheId}/presences`);
  state.presences = presences;
}
async function iaChargerHistorique() {
  const q = state.historiqueFiltreEvenement ? `?evenement_id=${state.historiqueFiltreEvenement}` : '';
  const { historique } = await api('GET', `/insc/fiches/${state.selectedFicheId}/historique${q}`);
  state.historique = historique;
}
async function iaChargerOnglet(tab) {
  if (tab === 'public') return iaChargerPublic();
  if (tab === 'communication') return iaChargerCommunications();
  if (tab === 'qr' || tab === 'presences') return Promise.all([iaChargerLienEtStats(), iaChargerPresences()]);
  if (tab === 'validation') return iaChargerInscriptions();
  if (tab === 'historique') return iaChargerHistorique();
}

// ---------------------------------------------------------------------------
// Rendu — Liste des fiches
// ---------------------------------------------------------------------------

function renderListView() {
  const cards = state.fiches.map(f => {
    const [bg, color] = IA_STATUS_STYLES[f.statut] || IA_STATUS_STYLES['brouillon'];
    return `
      <div style="background:#fff;border:1px solid oklch(0.9 0.004 30);border-radius:12px;padding:18px;cursor:pointer;" data-action="selectFiche" data-id="${f.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">
          <div style="font-weight:700;font-size:15px;">${escH(f.nom)}</div>
          <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;background:${bg};color:${color};">${IA_STATUS_LABEL[f.statut]}${f.gele_le ? ' · 🔒' : ''}</span>
        </div>
        <div style="font-size:12.5px;color:oklch(0.5 0.006 30);margin-bottom:14px;">📅 ${escH(f.apercu_date || 'Date à définir')} &nbsp;·&nbsp; 📍 ${escH(f.apercu_lieu || 'Lieu à définir')}</div>
        <div style="display:flex;gap:18px;padding-top:12px;border-top:1px solid oklch(0.93 0.004 30);">
          <div><div style="font-size:11px;color:oklch(0.55 0.006 30);">Inscrits</div><div style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;">${f.nb_inscriptions}</div></div>
        </div>
      </div>`;
  }).join('');

  return `
    <div style="max-width:1180px;margin:0 auto;padding:40px 28px;">
      <div style="font-size:12px;color:oklch(0.55 0.006 30);margin-bottom:8px;">Événements &nbsp;›&nbsp; <span style="color:oklch(0.2 0.006 30);font-weight:500;">Formulaires &amp; Inscriptions</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:14px;">
        <h1 style="margin:0;font-size:24px;font-weight:700;">Formulaires &amp; Inscriptions</h1>
        <button style="background:oklch(0.32 0.09 258);border:none;color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:8px;cursor:pointer;" data-action="createFiche">+ Créer une fiche d'inscription</button>
      </div>
      ${state.fiches.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">${cards}</div>` : `<div style="text-align:center;padding:50px 0;color:oklch(0.55 0.006 30);">Aucune fiche pour le moment — créez la première.</div>`}
    </div>`;
}

// ---------------------------------------------------------------------------
// Rendu — Détail d'une fiche (en-tête + onglets + contenu)
// ---------------------------------------------------------------------------

function renderDetailView() {
  const fiche = selectedFiche();
  if (!fiche) return '<div style="text-align:center;padding:60px;color:oklch(0.55 0.006 30);">Chargement…</div>';
  const status = fiche.statut;

  const suspendedBanner = (status === 'suspendue' || fiche.gele_le) ? `
    <div style="background:oklch(0.94 0.05 20); border-bottom:1px solid oklch(0.8 0.1 20); color:oklch(0.4 0.16 20); padding:10px 24px; font-size:14px; font-weight:500; text-align:center;">
      🔒 Cette fiche a été suspendue par l'administration Diaspo'Actif${fiche.gele_motif ? ' : ' + escH(fiche.gele_motif) : '.'} Les nouvelles inscriptions sont bloquées.
    </div>` : '';

  const [bg, color] = IA_STATUS_STYLES[status] || IA_STATUS_STYLES['brouillon'];
  const badge = `<span style="background:${bg};color:${color};font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;">● ${IA_STATUS_LABEL[status]}</span>`;

  const publierBtn = (status === 'brouillon' || status === 'fermee') ? `<button style="background:oklch(0.32 0.09 258); border:none; color:#fff; font-size:13px; font-weight:600; padding:9px 18px; border-radius:8px; cursor:pointer;" data-action="publierFiche">Publier la fiche</button>` :
    status === 'publiee' ? `<button style="background:#fff; border:1px solid oklch(0.78 0.006 30); color:oklch(0.2 0.006 30); font-size:13px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;" data-action="fermerFiche">Fermer les inscriptions</button>` : '';

  const header = `
    <header style="background:#fff; border-bottom:1px solid oklch(0.9 0.004 30); padding:16px 28px;">
      <div style="font-size:12px; color:oklch(0.55 0.006 30); margin-bottom:8px;"><a href="javascript:void(0)" data-action="backToList">Formulaires &amp; Inscriptions</a> &nbsp;›&nbsp; <span style="color:oklch(0.2 0.006 30); font-weight:500;">${escH(fiche.nom)}</span></div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <h1 style="margin:0; font-size:22px; font-weight:700;">${escH(fiche.nom)}</h1>
          ${badge}
        </div>
        <div style="display:flex; gap:10px;">
          <button style="background:oklch(0.96 0.004 30); border:1px solid oklch(0.78 0.006 30); color:oklch(0.2 0.006 30); font-size:13px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;" data-action="goToPublic">Prévisualiser</button>
          ${publierBtn}
          <button style="background:#fff;border:1px solid oklch(0.85 0.004 30);color:oklch(0.3 0.006 30);font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;" data-action="dupliquerFiche">📑 Dupliquer</button>
        </div>
      </div>
      <div style="display:flex; gap:20px; margin-top:10px; font-size:13px; color:oklch(0.5 0.006 30); flex-wrap:wrap;">
        <span>📅 ${escH(fiche.date_ouverture_inscriptions ? fiche.date_ouverture_inscriptions.slice(0,10) : 'Ouverture à définir')} → ${escH(fiche.date_fermeture_inscriptions ? fiche.date_fermeture_inscriptions.slice(0,10) : 'fermeture à définir')}</span>
        <span>👤 Organisateur : ${escH(fiche.organisateur || "Diaspo'Actif")}</span>
      </div>
    </header>`;

  const tabsHtml = IA_TABS.map(t => {
    const active = state.activeTab === t.key;
    return `<button style="border:none; background:none; cursor:pointer; padding:14px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; border-bottom:2px solid ${active ? 'oklch(0.32 0.09 258)' : 'transparent'}; color:${active ? 'oklch(0.2 0.006 30)' : 'oklch(0.5 0.006 30)'};" data-action="selectTab" data-tab="${t.key}">${t.emoji} ${t.label}</button>`;
  }).join('');
  const nav = `<nav style="background:#fff; border-bottom:1px solid oklch(0.9 0.004 30); padding:0 28px; display:flex; gap:2px; overflow-x:auto;">${tabsHtml}</nav>`;
  const main = `<main style="max-width:1180px; margin:0 auto; padding:28px;">${renderTabContent()}</main>`;
  return suspendedBanner + header + nav + main;
}

function renderTabContent() {
  switch (state.activeTab) {
    case 'overview': return renderOverview();
    case 'types': return renderTypes();
    case 'validation': return renderValidation();
    case 'fields': return renderFields();
    case 'public': return renderPublic();
    case 'communication': return renderCommunication();
    case 'qr': return renderQr();
    case 'presences': return renderPresences();
    case 'finances': return renderFinances();
    case 'stats': return renderStats();
    case 'historique': return renderHistorique();
    default: return '';
  }
}

// ---- Vue d'ensemble ----
function renderOverview() {
  const fiche = selectedFiche();
  const types = currentTypes().map(buildTypeVM);
  const totalInscriptions = types.reduce((s, t) => s + t.registered, 0);
  const placesRestantes = types.filter(t => t.capacityDisplay !== '∞').reduce((s, t) => s + Math.max(0, (t.capacityDisplay - t.registered)), 0);
  const bars = types.map(rt => `
    <div style="display:flex; align-items:center; gap:12px;">

  const publicUrl = location.origin + '/inscription-publique.html?slug=' + fiche.slug;
  return `

      </div>
      <div style="background:#fff; border:1px solid oklch(0.9 0.004 30); border-radius:12px; padding:16px;">
        <div style="font-size:12px; color:oklch(0.55 0.006 30); font-weight:500; margin-bottom:6px;">Fonds gelés (J+5)</div>

      </div>

    <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px;">
      <div style="background:#fff; border:1px solid oklch(0.9 0.004 30); border-radius:12px; padding:20px;">
        <h3 style="margin:0 0 14px; font-size:15px; font-weight:700;">Répartition par type d'inscription</h3>
        <div style="display:flex; flex-direction:column; gap:10px;">${bars}</div>

          <div style="display:flex; justify-content:space-between;"><span style="color:oklch(0.55 0.006 30);">Fermeture inscriptions</span><span style="font-weight:600;">${escH(fiche.date_fermeture_inscriptions ? fiche.date_fermeture_inscriptions.replace('T',' · ').slice(0,16) : '—')}</span></div>
        </div>
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid oklch(0.92 0.004 30);">

          <div style="display:flex; gap:8px;">

}

// ---- Informations générales & photo de couverture (édition) ----
// ---- Modèle standard : cette fiche appliquée automatiquement à chaque nouvel événement ----

  const actif = !!fiche.est_modele_standard;
  return `
    <div style="background:${actif ? 'oklch(0.95 0.03 258)' : '#fff'}; border:1px solid ${actif ? 'oklch(0.32 0.09 258)' : 'oklch(0.9 0.004 30)'}; border-radius:12px; padding:14px 20px; margin-bottom:16px; display:flex; align-items:center; gap:14px;">
      <div style="font-size:22px;">⭐</div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:700;">${actif ? 'Modèle standard actif' : 'Appliquer comme modèle standard'}</div>
        <div style="font-size:11.5px; color:oklch(0.5 0.006 30); margin-top:2px;">${actif
          ? "Chaque nouvel événement que vous créez dupliquera automatiquement cette fiche (types, champs), sauf si vous décochez l'option au moment de la créer."
          : "Marquez cette fiche pour qu'elle soit dupliquée automatiquement à chaque nouvel événement, avec le nom du nouvel événement — évite de reconstruire un formulaire chaque fois."}</div>
      </div>
      <button style="background:${actif ? '#fff' : 'oklch(0.32 0.09 258)'}; border:1px solid ${actif ? 'oklch(0.7 0.006 30)' : 'oklch(0.32 0.09 258)'}; color:${actif ? 'oklch(0.3 0.006 30)' : '#fff'}; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;" data-action="toggleModeleStandard" data-actif="${actif ? '0' : '1'}">${actif ? 'Retirer' : 'Définir comme modèle'}</button>

}

          <div style="font-size:11.5px; color:oklch(0.6 0.006 30); margin-top:2px;">Organisateur : ${escH(fiche.organisateur || "Diaspo'Actif")}${fiche.contact_email ? ' · ' + escH(fiche.contact_email) : ''}</div>
        </div>

        <h3 style="margin:0; font-size:15px; font-weight:700;">Informations générales</h3>
        <button style="background:none; border:none; color:oklch(0.55 0.006 30); font-size:13px; cursor:pointer;" data-action="toggleEditionInfos">Fermer</button>
      </div>
      <div style="display:flex; gap:16px; align-items:flex-start; margin-bottom:16px;">
        <div style="width:100px; height:100px; border-radius:10px; flex-shrink:0; background:${fiche.affiche_url ? `url('${escH(fiche.affiche_url)}') center/cover` : 'oklch(0.95 0.004 30)'}; display:flex; align-items:center; justify-content:center; color:oklch(0.6 0.006 30); font-size:11px;">${fiche.affiche_url ? '' : 'Aucune photo'}</div>
        <div>
          <label style="display:inline-block; background:oklch(0.32 0.09 258); color:#fff; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer;">

          <div><label style="display:block; font-size:12px; font-weight:600; margin-bottom:5px;">Ouverture des inscriptions</label><input id="ia-infos-ouverture" type="datetime-local" value="${escH(fiche.date_ouverture_inscriptions ? fiche.date_ouverture_inscriptions.slice(0,16) : '')}" style="width:100%; height:38px; border:1px solid oklch(0.85 0.004 30); border-radius:8px; padding:0 10px; font-size:13px; box-sizing:border-box;"></div>

function renderLiaisonEvenements() {
  const evenementsLies = new Set((state.ficheDetail?.evenements || []).map(e => e.id));

  if (!mesEvenements.length) {
    return `<div style="font-size:12px; color:oklch(0.55 0.006 30); padding-top:6px; border-top:1px solid oklch(0.92 0.004 30);">Aucun événement créé sur votre compte — ${lienCreation} pour pouvoir le lier à cette fiche.</div>`;
  }
  return `
    <div style="padding-top:10px; border-top:1px solid oklch(0.92 0.004 30);">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
        <label style="display:block; font-size:12px; font-weight:600;">Lier à un événement</label>

      <div style="font-size:11px; color:oklch(0.55 0.006 30); margin-bottom:8px;">Le bouton "S'inscrire" de l'événement coché redirigera vers cette fiche au lieu du parcours d'inscription classique.</div>

        ${mesEvenements.map(e => `
          <label class="ia-evt-ligne" style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer;">

            <span>${escH(e.titre)}${e.date_evt ? ' — ' + escH(e.date_evt) : ''}</span>
          </label>`).join('')}

}

// ---- Documents & médias (photos/PDF consultables par inscrits ET non-inscrits) ----
function renderMedias() {
  const medias = (state.ficheDetail && state.ficheDetail.medias) || [];
  const nbPhotos = medias.filter(m => m.type === 'photo').length;
  const nbVideos = medias.filter(m => m.type === 'video').length;
  const iconePour = (m) => {
    if (m.type === 'photo') return `<img src="${escH(m.url)}" style="width:36px; height:36px; border-radius:6px; object-fit:cover; flex-shrink:0;">`;
    if (m.type === 'video') return `<video src="${escH(m.url)}" style="width:36px; height:36px; border-radius:6px; object-fit:cover; flex-shrink:0;" muted></video>`;
    return `<div style="width:36px; height:36px; border-radius:6px; background:oklch(0.94 0.05 20); color:oklch(0.42 0.16 20); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;">📄</div>`;
  };
  const libelleParDefaut = (m) => m.type === 'photo' ? 'Photo' : (m.type === 'video' ? 'Vidéo' : 'Document PDF');
  const liste = medias.map(m => `
    <div style="display:flex; align-items:center; gap:10px; border:1px solid oklch(0.92 0.004 30); border-radius:8px; padding:8px 10px;">
      ${iconePour(m)}
      <a href="${escH(m.url)}" target="_blank" rel="noopener" style="flex:1; font-size:13px; color:oklch(0.2 0.006 30); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escH(m.libelle || libelleParDefaut(m))}${m.type === 'video' && m.duree_sec ? ` <span style="color:oklch(0.55 0.006 30);font-family:'IBM Plex Mono',monospace;font-size:11px;">(${Math.floor(m.duree_sec/60)}:${String(m.duree_sec%60).padStart(2,'0')})</span>` : ''}</a>
      <button style="background:none; border:none; color:oklch(0.6 0.006 30); font-size:15px; cursor:pointer; padding:2px 6px;" data-action="supprimerMedia" data-id="${m.id}">✕</button>
    </div>`).join('') || '<div style="color:oklch(0.55 0.006 30);font-size:13px;">Aucun document ajouté — photos, vidéos ou PDF consultables par tous, inscrits ou non.</div>';

  return `
    <div style="background:#fff; border:1px solid oklch(0.9 0.004 30); border-radius:12px; padding:20px; margin-top:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <h3 style="margin:0; font-size:15px; font-weight:700;">Documents &amp; médias</h3>
        <span style="font-size:12px; color:oklch(0.55 0.006 30);">Visibles par tous sur la page publique</span>
      </div>
      <div style="font-size:11.5px; color:oklch(0.55 0.006 30); margin-bottom:14px;">📷 ${nbPhotos}/7 photos &nbsp;·&nbsp; 🎬 ${nbVideos}/4 vidéos (3 min et 100 Mo max chacune) &nbsp;·&nbsp; 📄 PDF sans limite (15 Mo max)</div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">${liste}</div>
      <label style="display:inline-block; background:#fff; border:1.5px dashed oklch(0.8 0.006 30); color:oklch(0.4 0.006 30); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;">
        + Ajouter une photo, une vidéo ou un PDF
        <input type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,video/mp4,video/webm" data-action="ajouterMedia" style="display:none;">
      </label>
    </div>`;
}

            <button style="background:none; border:1px solid oklch(0.32 0.09 258); color:oklch(0.32 0.09 258); font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; cursor:pointer;" data-action="goToFields">Personnaliser les éléments d'inscription →</button>
          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;">
          <div><div style="font-size:11.5px; color:oklch(0.55 0.006 30); font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;">Tarif</div><div style="font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:600;">${selected.priceLabel}</div></div>
          <div><div style="font-size:11.5px; color:oklch(0.55 0.006 30); font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;">Places</div><div style="font-size:14px; font-weight:600;">${selected.capacityLabel}</div></div>
          <div><div style="font-size:11.5px; color:oklch(0.55 0.006 30); font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;">Validation</div><div style="font-size:14px; font-weight:600;">${selected.validationLabel}</div></div>
          <div><div style="font-size:11.5px; color:oklch(0.55 0.006 30); font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;">Période d'inscription</div><div style="font-size:14px; font-weight:600;">${escH(selected.periodLabel)}</div></div>

          <div style="height:8px; background:oklch(0.93 0.004 30); border-radius:4px; overflow:hidden;"><div style="height:100%; background:oklch(0.45 0.09 258); width:${selected.fillWidth};"></div></div>
        </div>
        <label style="display:flex; align-items:center; gap:10px; margin-top:20px; font-size:13px; cursor:pointer;">
          <input type="checkbox" ${selected.waitlist ? 'checked' : ''} data-action="toggleWaitlist" data-id="${selected.id}" style="width:16px; height:16px; accent-color:oklch(0.32 0.09 258);"/>

        </label>
        <label style="display:flex; align-items:center; gap:10px; margin-top:12px; font-size:13px; cursor:pointer; padding:10px 12px; background:oklch(0.97 0.004 30); border-radius:8px;">
          <input type="checkbox" ${selected.validationAuto ? 'checked' : ''} data-action="toggleValidationAuto" data-id="${selected.id}" style="width:17px; height:17px; accent-color:oklch(0.32 0.09 258); flex-shrink:0;"/>

  return `
    <div style="display:grid; grid-template-columns:1fr 1.3fr; gap:20px;">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button style="background:none; border:1.5px dashed oklch(0.8 0.006 30); color:oklch(0.5 0.006 30); font-size:13px; font-weight:600; padding:12px; border-radius:10px; cursor:pointer;" data-action="addType">+ Ajouter un type d'inscription</button>

// ---- Formulaire (champs) ----
function renderFields() {
  const types = currentTypes().map(buildTypeVM);
  const chips = types.map(rt => `<button style="background:${rt.chipBg}; color:${rt.chipColor}; border:1px solid ${rt.chipBorder}; font-size:13px; font-weight:600; padding:8px 16px; border-radius:20px; cursor:pointer;" data-action="selectType" data-id="${rt.id}">${escH(rt.name)}</button>`).join('');
  const type = selectedType();
  if (!type) return `<div style="color:oklch(0.55 0.006 30);">Créez d'abord un type d'inscription (onglet précédent).</div>`;
  const fields = type.champs || [];
  const fieldsHtml = fields.map((f, i) => `
    <div style="display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid oklch(0.92 0.004 30); border-radius:8px; background:oklch(0.99 0.001 30);">
      <div style="flex:1;"><div style="font-size:13.5px; font-weight:600;">${escH(f.libelle)}${f.condition_json ? ' <span style="font-size:11px;color:oklch(0.5 0.09 258);">· conditionnel</span>' : ''}</div><div style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:oklch(0.55 0.006 30); margin-top:2px;">${escH(f.type_champ)}</div></div>
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:oklch(0.5 0.006 30); cursor:pointer;">
        <input type="checkbox" ${f.obligatoire ? 'checked' : ''} data-action="toggleFieldRequired" data-id="${f.id}" style="width:14px; height:14px; accent-color:oklch(0.32 0.09 258);"/>
        Obligatoire
      </label>
      <button style="background:none; border:none; color:oklch(0.6 0.006 30); font-size:15px; cursor:pointer; padding:2px 6px;" data-action="removeField" data-id="${f.id}">✕</button>
    </div>`).join('') || '<div style="color:oklch(0.55 0.006 30);font-size:13px;">Aucun champ personnalisé — seuls nom/prénom/e-mail/téléphone sont demandés.</div>';

  const catOuverte = state.champCategorieOuverte;
  const cats = IA_FIELD_CATEGORIES.map(c => {
    const actif = catOuverte === c.name;
    return `<button style="background:${actif ? 'oklch(0.32 0.09 258)' : '#fff'}; border:1px solid ${actif ? 'oklch(0.32 0.09 258)' : 'oklch(0.85 0.004 30)'}; color:${actif ? '#fff' : 'oklch(0.3 0.006 30)'}; font-size:12.5px; font-weight:500; padding:7px 13px; border-radius:8px; cursor:pointer;" data-action="toggleChampCategorie" data-category="${escH(c.name)}">${escH(c.name)}</button>`;
  }).join('');

  const suggestions = catOuverte && catOuverte !== 'Personnalisé' ? (IA_FIELD_SUGGESTIONS[catOuverte] || []) : [];
  const panelSuggestions = suggestions.length ? `
    <div style="margin-top:10px; padding:14px; background:oklch(0.97 0.004 30); border:1px solid oklch(0.9 0.004 30); border-radius:10px;">
      <div style="font-size:11.5px; color:oklch(0.55 0.006 30); font-weight:600; margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em;">Suggestions — ${escH(catOuverte)}</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${suggestions.map((s, idx) => `<button style="background:#fff; border:1px solid oklch(0.85 0.004 30); color:oklch(0.2 0.006 30); font-size:12.5px; font-weight:500; padding:7px 13px; border-radius:20px; cursor:pointer;" data-action="ajouterChampSuggere" data-categorie="${escH(catOuverte)}" data-idx="${idx}">+ ${escH(s.libelle)}</button>`).join('')}
      </div>
    </div>` : '';

  return `
    <div style="display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;">${chips}</div>
    <div style="background:#fff; border:1px solid oklch(0.9 0.004 30); border-radius:12px; padding:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0; font-size:15px; font-weight:700;">Formulaire — ${escH(type.name)}</h3>
        <span style="font-size:12px; color:oklch(0.55 0.006 30);">${fields.length} champ(s)</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">${fieldsHtml}</div>
      <div style="margin-top:16px; padding-top:16px; border-top:1px solid oklch(0.92 0.004 30);">
        <div style="font-size:12px; color:oklch(0.55 0.006 30); font-weight:600; margin-bottom:10px;">+ Ajouter un champ — choisissez une catégorie pour voir des suggestions prêtes à l'emploi</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">${cats}</div>
        ${panelSuggestions}
      </div>
      <div style="margin-top:20px; padding-top:16px; border-top:1px solid oklch(0.92 0.004 30); display:flex; justify-content:flex-end;">
        <button style="background:oklch(0.32 0.09 258); border:none; color:#fff; font-size:13px; font-weight:700; padding:10px 22px; border-radius:8px; cursor:pointer;" data-action="enregistrerFormulaire">Enregistrer</button>
      </div>
    </div>`;
}

// ---- Aperçu public (vraie donnée, via l'API publique) ----

  const modeApercu = !!d.apercu;
  let body;

    body = `

}

// ---- Validation (2026-09-09, demande explicite) ----
// Liste les demandes d'inscription en attente (statut='inscrit' = validation manuelle requise
// pour ce type, voir "Validation automatique" dans l'onglet Types d'inscription) avec les
// réponses du formulaire, pour Valider/Refuser sans devoir chercher la personne dans Présences.
function iaLibellesChamps(typeId) {
  const type = (state.ficheDetail?.types || []).find(t => t.id === typeId);
  const map = {};
  (type?.champs || []).forEach(c => { map[c.nom] = c.libelle || c.nom; });
  return map;
}
function renderValidation() {
  const enAttente = (state.inscriptions || []).filter(i => i.statut === 'inscrit');
  const cartes = enAttente.map(i => {
    const libelles = iaLibellesChamps(i.type_id);
    let reponses = {};
    try { reponses = JSON.parse(i.reponses_json || '{}'); } catch (e) {}
    const reponsesHtml = Object.entries(reponses).filter(([,v]) => v !== '' && v != null).map(([k,v]) =>

// ---- Statistiques ----
function renderStats() {
  const types = currentTypes().map(buildTypeVM);
  const totalConfirmes = types.reduce((s,t)=>s+t.registered,0);
  const entrees = state.checkinStats?.entrees || 0;
  const tauxPresence = totalConfirmes ? Math.round((entrees / totalConfirmes) * 100) : 0;
  const placesRestantes = types.filter(t => t.capacityDisplay !== '∞').reduce((s, t) => s + Math.max(0, (t.capacityDisplay - t.registered)), 0);
  return `
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;">
      <div style="background:#fff;border:1px solid oklch(0.9 0.004 30);border-radius:12px;padding:16px;"><div style="font-size:12px;color:oklch(0.55 0.006 30);margin-bottom:6px;">Taux de présence</div><div style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;">${tauxPresence}%</div></div>
      <div style="background:#fff;border:1px solid oklch(0.9 0.004 30);border-radius:12px;padding:16px;"><div style="font-size:12px;color:oklch(0.55 0.006 30);margin-bottom:6px;">Places restantes</div><div style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;">${placesRestantes}</div></div>
      <div style="background:#fff;border:1px solid oklch(0.9 0.004 30);border-radius:12px;padding:16px;"><div style="font-size:12px;color:oklch(0.55 0.006 30);margin-bottom:6px;">Don moyen</div><div style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:oklch(0.6 0.006 30);">—</div></div>
      <div style="background:#fff;border:1px solid oklch(0.9 0.004 30);border-radius:12px;padding:16px;"><div style="font-size:12px;color:oklch(0.55 0.006 30);margin-bottom:6px;">Total inscrits</div><div style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;">${totalConfirmes}</div></div>

// ---------------------------------------------------------------------------
// Actions — branchées sur l'API réelle du module
// ---------------------------------------------------------------------------

const actions = {
  async selectFiche(el) {
    state.selectedFicheId = parseInt(el.dataset.id); state.view = 'detail'; state.activeTab = 'overview'; state.selectedTypeId = null;
    await iaChargerFiche(state.selectedFicheId);
  },
  async createFiche() {
    const nom = prompt("Nom de la fiche d'inscription :");
    if (!nom || !nom.trim()) return;
    try {
      const { fiche } = await api('POST', '/insc/fiches', { nom: nom.trim() });
      state.selectedFicheId = fiche.id; state.view = 'detail'; state.activeTab = 'overview';
      await iaChargerFiche(fiche.id);
    } catch (e) { ia_toast(e.message, false); }
  },
  async backToList() { state.view = 'list'; await iaChargerListe(); },
  async selectTab(el) { state.activeTab = el.dataset.tab; try { await iaChargerOnglet(state.activeTab); } catch (e) { ia_toast(e.message, false); } },
  async goToPublic() { state.activeTab = 'public'; state.publicSelectedTypeId = null; await iaChargerPublic(); },
  goToFields() { state.activeTab = 'fields'; },
  /* Chaque champ est déjà enregistré instantanément à l'ajout/modification/suppression — ce
     bouton n'a donc rien à sauvegarder. Il existe uniquement parce qu'un organisateur cherche
     par réflexe un "Enregistrer" avant de continuer (demande explicite du 2026-09-09) ; le
     ramener aux types évite qu'il se sente bloqué sans action à faire. */
  enregistrerFormulaire() { ia_toast('Formulaire enregistré.', true); state.activeTab = 'types'; },
  selectType(el) { state.selectedTypeId = parseInt(el.dataset.id); },
  async publierFiche() {
    try { await api('PATCH', `/insc/fiches/${state.selectedFicheId}/statut`, { statut: 'publiee' }); ia_toast('Fiche publiée.', true); await iaChargerFiche(state.selectedFicheId); }
    catch (e) { ia_toast(e.message, false); }
  },
  async fermerFiche() {
    try { await api('PATCH', `/insc/fiches/${state.selectedFicheId}/statut`, { statut: 'fermee' }); ia_toast('Inscriptions fermées.', true); await iaChargerFiche(state.selectedFicheId); }
    catch (e) { ia_toast(e.message, false); }
  },
  async dupliquerFiche() {
    try { const r = await api('POST', `/insc/fiches/${state.selectedFicheId}/dupliquer`, {}); ia_toast('Fiche dupliquée.', true); state.selectedFicheId = r.fiche_id; await iaChargerFiche(r.fiche_id); }
    catch (e) { ia_toast(e.message, false); }
  },
  toggleEditionInfos() { state.editionInfosOuverte = !state.editionInfosOuverte; },
  async toggleModeleStandard(el) {
    const actif = el.dataset.actif === '1';
    if (actif && !confirm("Définir cette fiche comme modèle standard ? Elle sera dupliquée automatiquement à chaque nouvel événement créé (remplace le modèle précédent s'il y en avait un).")) return;
    try {
      await api('PATCH', `/insc/fiches/${state.selectedFicheId}/modele-standard`, { actif });
      ia_toast(actif ? 'Définie comme modèle standard.' : 'Retirée comme modèle standard.', true);
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
  async enregistrerInfos() {
    const payload = {
      description: document.getElementById('ia-infos-description')?.value || '',
      organisateur: document.getElementById('ia-infos-organisateur')?.value || '',
      contact_email: document.getElementById('ia-infos-contact-email')?.value || '',
      date_ouverture_inscriptions: document.getElementById('ia-infos-ouverture')?.value || null,
      date_fermeture_inscriptions: document.getElementById('ia-infos-fermeture')?.value || null,
    };
    /* N'envoie evenement_ids QUE si la liste des événements a réellement pu être chargée —
       sinon les cases seraient toutes vides et on écraserait une vraie liaison existante
       avec un tableau vide par accident (voir data-evt-id / .ia-evt-checkbox). */
    if (state.mesEvenements.length) {
      payload.evenement_ids = Array.from(document.querySelectorAll('.ia-evt-checkbox:checked')).map(el => parseInt(el.dataset.evtId));
    }
    try {
      await api('PUT', `/insc/fiches/${state.selectedFicheId}`, payload);
      ia_toast('Informations enregistrées.', true);
      state.editionInfosOuverte = false;
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
  async changerPhotoCouverture(el) {
    const file = el.files[0]; if (!file) return;
    try {
      const fd = new FormData(); fd.append('fichier', file);
      const r = await fetch('/api/insc/public/upload', { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erreur');
      /* Inclut les autres champs actuellement dans le formulaire (même s'ils n'ont pas encore
         été enregistrés) — sinon changer la photo recharge la fiche depuis le serveur et
         efface silencieusement tout ce que l'utilisateur avait tapé mais pas encore cliqué
         "Enregistrer" (bug réel signalé le 2026-09-09). */
      const payload = { affiche_url: d.url };
      const description = document.getElementById('ia-infos-description');
      if (description) {
        payload.description = description.value || '';
        payload.organisateur = document.getElementById('ia-infos-organisateur')?.value || '';
        payload.contact_email = document.getElementById('ia-infos-contact-email')?.value || '';
        payload.date_ouverture_inscriptions = document.getElementById('ia-infos-ouverture')?.value || null;
        payload.date_fermeture_inscriptions = document.getElementById('ia-infos-fermeture')?.value || null;
        if (state.mesEvenements.length) {
          payload.evenement_ids = Array.from(document.querySelectorAll('.ia-evt-checkbox:checked')).map(c => parseInt(c.dataset.evtId));
        }
      }
      await api('PUT', `/insc/fiches/${state.selectedFicheId}`, payload);
      ia_toast('Photo de couverture mise à jour.', true);
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
  async ajouterMedia(el) {
    const file = el.files[0]; if (!file) return;
    const libelle = prompt('Nom de ce document (affiché aux visiteurs) :', file.name) || '';
    try {
      const fd = new FormData(); fd.append('fichier', file); fd.append('libelle', libelle);
      const r = await fetch(`/api/insc/fiches/${state.selectedFicheId}/medias`, { method: 'POST', credentials: 'include', body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erreur');
      ia_toast('Document ajouté.', true);
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
    el.value = '';
  },
  async supprimerMedia(el) {
    if (!confirm('Supprimer ce document ?')) return;
    try { await api('DELETE', '/insc/medias/' + el.dataset.id); await iaChargerFiche(state.selectedFicheId); }
    catch (e) { ia_toast(e.message, false); }
  },
  async addType() {
    const label = prompt("Nom du type d'inscription (ex : Participant, Exposant, Bénévole…) :");
    if (!label || !label.trim()) return;
    const gratuit = confirm('Ce type est-il gratuit ? OK = Gratuit, Annuler = Payant');
    let prix = null; if (!gratuit) prix = parseFloat(prompt('Prix en euros :', '0')) || 0;
    const placesTxt = prompt('Nombre de places maximum (laisser vide = illimité) :');
    try {
      await api('POST', `/insc/fiches/${state.selectedFicheId}/types`, { label: label.trim(), gratuit, prix, places_max: placesTxt ? parseInt(placesTxt) : null, liste_attente_active: !!placesTxt });
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
  async toggleWaitlist(el) {
    const id = parseInt(el.dataset.id);
    try { await api('PUT', '/insc/types/' + id, { liste_attente_active: el.checked ? 1 : 0 }); await iaChargerFiche(state.selectedFicheId); }
    catch (e) { ia_toast(e.message, false); }
  },
  async toggleValidationAuto(el) {
    const id = parseInt(el.dataset.id);
    // Coché = validation automatique (validation_auto=1) ; décoché = validation manuelle requise.
    try {
      await api('PUT', '/insc/types/' + id, { validation_auto: el.checked ? 1 : 0 });
      ia_toast(el.checked ? 'Validation automatique activée.' : 'Inscription avec validation activée — chaque demande attendra votre approbation.', true);
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
  async toggleFieldRequired(el) {
    const id = parseInt(el.dataset.id);
    try { await api('PUT', '/insc/champs/' + id, { obligatoire: el.checked ? 1 : 0 }); await iaChargerFiche(state.selectedFicheId); }
    catch (e) { ia_toast(e.message, false); }
  },
  async removeField(el) {
    if (!confirm('Supprimer ce champ ?')) return;
    try { await api('DELETE', '/insc/champs/' + el.dataset.id); await iaChargerFiche(state.selectedFicheId); }
    catch (e) { ia_toast(e.message, false); }
  },
  async toggleChampCategorie(el) {
    const cat = el.dataset.category;
    if (cat === 'Personnalisé') {
      state.champCategorieOuverte = null;
      const libelle = prompt('Libellé du champ personnalisé :');
      if (!libelle || !libelle.trim()) return;
      try {
        await api('POST', `/insc/types/${state.selectedTypeId}/champs`, { libelle: libelle.trim(), type_champ: 'texte_court', obligatoire: false });
        await iaChargerFiche(state.selectedFicheId);
      } catch (e) { ia_toast(e.message, false); }
      return;
    }
    state.champCategorieOuverte = state.champCategorieOuverte === cat ? null : cat;
  },
  async ajouterChampSuggere(el) {
    const suggestion = (IA_FIELD_SUGGESTIONS[el.dataset.categorie] || [])[parseInt(el.dataset.idx)];
    if (!suggestion) return;
    try {
      await api('POST', `/insc/types/${state.selectedTypeId}/champs`, {
        libelle: suggestion.libelle, type_champ: suggestion.type_champ, obligatoire: false,
        options: suggestion.options || undefined,
      });
      ia_toast(`Champ « ${suggestion.libelle} » ajouté.`, true);
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
  selectPublicType(el) { state.publicSelectedTypeId = parseInt(el.dataset.id); },
  backToPublicTypes() { state.publicSelectedTypeId = null; },
  async soumettreApercu() {
    const inputs = document.querySelectorAll('#ia-root [data-champ]');
    const reponses = {}; let prenom = '', nom = '', email = '';
    inputs.forEach(i => { if (i.dataset.champ === '__prenom') prenom = i.value; else if (i.dataset.champ === '__nom') nom = i.value; else if (i.dataset.champ === '__email') email = i.value; else reponses[i.dataset.champ] = i.value; });
    if (!prenom.trim() || !nom.trim()) return ia_toast('Prénom et nom sont requis.', false);
    try {
      const r = await api('POST', `/insc/public/${selectedFiche().slug}/inscriptions`, { type_id: state.publicSelectedTypeId, nom, prenom, email, reponses });
      ia_toast(`Inscription test créée (référence ${r.reference}) — visible dans l'onglet Inscriptions.`, true);
      state.publicSelectedTypeId = null; await iaChargerPublic();
    } catch (e) { ia_toast(e.message, false); }
  },
  copierLienPublic(el) { navigator.clipboard?.writeText(el.dataset.url); ia_toast('Lien copié.', true); },
  copierLienControle(el) { navigator.clipboard?.writeText(el.dataset.url); ia_toast('Lien copié.', true); },
  selectCommRecipient(el) { state.commRecipient = el.dataset.id; },
  toggleCommEmail() { state.commChannelEmail = !state.commChannelEmail; },
  toggleCommNotif() { state.commChannelNotif = !state.commChannelNotif; },
  async ajouterPieceJointeComm(el) {
    const file = el.files[0]; if (!file) return;
    try {
      const fd = new FormData(); fd.append('fichier', file);
      const r = await fetch(`/api/insc/fiches/${state.selectedFicheId}/communications/upload`, { method: 'POST', credentials: 'include', body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Erreur');
      state.commPiecesJointes.push({ url: d.url, nom: d.nom });
    } catch (e) { ia_toast(e.message, false); }
  },
  retirerPieceJointeComm(el) { state.commPiecesJointes.splice(parseInt(el.dataset.idx), 1); },
  async envoyerCommunication() {
    const objet = document.getElementById('ia-comm-objet')?.value || '';
    const message = document.getElementById('ia-comm-message')?.value || '';
    if (!message.trim()) return ia_toast('Le message est requis.', false);
    const canal = state.commChannelEmail && state.commChannelNotif ? 'les_deux' : state.commChannelEmail ? 'email' : 'notification';
    try {
      const r = await api('POST', `/insc/fiches/${state.selectedFicheId}/communications`, { destinataire_type: state.commRecipient, canal, objet, message, pieces_jointes: state.commPiecesJointes });
      ia_toast(`Envoyé à ${r.nb_destinataires} destinataire(s) (${r.nb_email} e-mails, ${r.nb_notif} notifications).`, true);
      state.commObjet = ''; state.commMessage = ''; state.commPiecesJointes = [];
      await iaChargerCommunications();
    } catch (e) { ia_toast(e.message, false); }
  },
  async rafraichirLienControle() {
    const duree = document.getElementById('ia-qr-duree')?.value || '24h';
    try { await api('POST', `/insc/fiches/${state.selectedFicheId}/liens-controle`, { duree }); ia_toast('Lien créé.', true); await iaChargerLienEtStats(); }
    catch (e) { ia_toast(e.message, false); }
  },
  async revoquerLiensControle() {
    if (!confirm('Désactiver tous les liens de contrôle actifs ?')) return;
    try { await api('POST', `/insc/fiches/${state.selectedFicheId}/liens-controle/revoquer`, {}); ia_toast('Liens désactivés.', true); await iaChargerLienEtStats(); }
    catch (e) { ia_toast(e.message, false); }
  },
  selectPresence(el) { state.selectedPresenceId = parseInt(el.dataset.id); },
  async validerInscription(el) {
    try {
      await api('PATCH', `/insc/inscriptions/${el.dataset.id}/statut`, { statut: 'confirme' });
      ia_toast('Inscription confirmée — e-mail de confirmation envoyé.', true);
      await Promise.all([iaChargerPresences(), iaChargerInscriptions()]);
    } catch (e) { ia_toast(e.message, false); }
  },
  async refuserInscription(el) {
    if (!confirm('Refuser cette inscription ? La personne ne sera pas notifiée automatiquement.')) return;
    try {
      await api('PATCH', `/insc/inscriptions/${el.dataset.id}/statut`, { statut: 'annule' });
      ia_toast('Inscription refusée.', true);
      await Promise.all([iaChargerPresences(), iaChargerInscriptions()]);
    } catch (e) { ia_toast(e.message, false); }
  },
  async filtrerHistorique(el) {
    state.historiqueFiltreEvenement = el.value;
    await iaChargerHistorique();
  },
  async supprimerHistorique(el) {
    if (!confirm('Supprimer définitivement cette entrée d\'historique ?')) return;
    try {
      await api('DELETE', `/insc/historique/${el.dataset.id}`);
      state.historique = state.historique.filter(h => String(h.id) !== el.dataset.id);
      ia_toast('Entrée supprimée.', true);
    } catch (e) { ia_toast(e.message, false); }
  },
  async toggleFreezeFonds() {
    const fiche = selectedFiche();
    try {
      if (fiche.fonds_geles_le) { await api('POST', `/insc/fiches/${state.selectedFicheId}/degeler-fonds`, {}); ia_toast('Fonds débloqués.', true); }
      else { const motif = prompt('Motif du gel (obligatoire) :'); if (!motif || !motif.trim()) return; await api('POST', `/insc/fiches/${state.selectedFicheId}/geler-fonds`, { motif: motif.trim() }); ia_toast('Fonds gelés.', true); }
      await iaChargerFiche(state.selectedFicheId);
    } catch (e) { ia_toast(e.message, false); }
  },
};

async function dispatch(name, el) {
  if (!actions[name]) return;
  state.busy = true;
  try { await actions[name](el); } catch (e) { ia_toast(e.message || String(e), false); }
  state.busy = false;
  render();
}

const root = document.getElementById('ia-root');
function render() {
  root.innerHTML = `<div style="min-height:100%; width:100%;">${state.view === 'list' ? renderListView() : renderDetailView()}</div>`;
}
root.addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el || !root.contains(el)) return;
  if (el.tagName === 'INPUT') return;
  dispatch(el.dataset.action, el);
});
root.addEventListener('change', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.tagName === 'SELECT') dispatch(el.dataset.action, el);
  else if (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'file')) dispatch(el.dataset.action, el);
});

(async function initInscriptionsAdmin() {
  IA_ME = await fetchCurrentUser();
  if (!IA_ME || !['initiative', 'administrateur', 'collectivite'].includes(IA_ME.role)) {
    document.getElementById('ia-root').innerHTML = '<div style="text-align:center;padding:60px;color:oklch(0.55 0.006 30);">Cette page est réservée aux comptes Initiative.</div>';
    return;
  }
  try {
    await iaChargerListe();
    /* Lien direct depuis evenements.html (aperçu du modèle standard avant création d'un
       événement) — ?fiche=<id> ouvre directement le détail plutôt que la liste. */
    const ficheIdParam = new URLSearchParams(location.search).get('fiche');
    if (ficheIdParam && state.fiches.some(f => f.id === parseInt(ficheIdParam))) {
      state.selectedFicheId = parseInt(ficheIdParam); state.view = 'detail';
      await iaChargerFiche(state.selectedFicheId);
    }
    render();
  }
  catch (e) { root.innerHTML = `<div style="text-align:center;padding:60px;color:oklch(0.5 0.16 20);">${escH(e.message)}</div>`; }
})();
</script>
