<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/assets/logo.png">
<title>Diaspo'Actif — Relances des comptes-rendus (administration)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/styles.v2.css">
<link rel="stylesheet" href="/assets/responsive.v2.css?v=2">
<style>
.rc{max-width:820px;margin:0 auto;padding:22px 16px 80px}
.rc h1{font-size:22px;margin:0 0 4px}.rc .sub{color:var(--muted,#5B6B82);font-size:13.5px;margin:0 0 16px;line-height:1.55}
.rc-card{background:#fff;border:1px solid var(--border,#DCE4F0);border-radius:14px;padding:18px;margin-bottom:16px}
.rc-card h2{font-size:16px;margin:0 0 10px}
.rc-note{font-size:12.5px;color:var(--muted,#5B6B82);line-height:1.55}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.rc-kpi{background:#F6F9FE;border-radius:11px;padding:12px 14px}.rc-kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.rc-kpi span{font-size:12px;color:#5B6B82}
.rc-btn{border:none;border-radius:10px;padding:11px 18px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
.rc-btn.pri{background:#F26422;color:#1f0e02}.rc-btn.out{background:#fff;border:1.5px solid #DCE4F0;color:#1f2937}
.rc-btn:disabled{opacity:.55;cursor:default}
.rc select{padding:9px 11px;border:1.5px solid #DCE4F0;border-radius:9px;font:inherit;font-size:13.5px}
.rc-ex{border-top:1px solid #EEF2F8;padding:9px 0;font-size:13px}.rc-ex:first-child{border-top:none}
.rc-ok{background:#DCFCE7;color:#166534;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.rc-ko{background:#FEE2E2;color:#B91C1C;border-radius:10px;padding:12px 14px;font-size:13.5px}
</style>
</head>
<body>
<div class="page">
  <header class="topbar"><div class="topbar-inner">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">&#9776;</button>
    <div class="logo"><img loading="lazy" class="logo-img" src="assets/logo.png" alt="Diaspo'Actif"> DIASPO'ACTIF</div>
    <nav class="nav"><a href="index.html">Accueil</a><a href="dashboard-administrateur.html">Tableau de bord</a><a href="evenements.html">Événements</a></nav>
    <div class="topbar-right"><select class="lang-select" id="lang-select"></select><div id="auth-area" class="auth-area"></div></div>
  </div></header>
  <main class="rc" id="rc"><p class="rc-note">Chargement…</p></main>
</div>
<script src="assets/data.js"></script>
<script src="assets/demo.js?v=2"></script>
<script src="assets/app.js?v=13"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let APERCU = null;

async function charger() {
  const root = $('#rc');
  try { APERCU = await api('POST', '/admin/evenements/compte-rendu-anciens', { dryRun: true }); }
  catch (e) { root.innerHTML = '<div class="rc-card"><h1>Accès réservé</h1><p class="rc-note">' + esc(e.message || 'Réservé aux administrateurs.') + '</p></div>'; return; }
  dessiner();
}
function dessiner(resultat) {
  const a = APERCU;
  $('#rc').innerHTML = '<h1>📨 Relances des comptes-rendus — anciens événements</h1>'
    + '<p class="sub">Les événements terminés <b>avant le 5 octobre 2026</b> n\'ont jamais reçu la relance « racontez votre événement ». Cet outil la leur envoie : une <b>notification</b> et un <b>e-mail</b> par organisateur (groupés s\'il en a plusieurs), signés de l\'équipe Diaspo\'Actif avec nos félicitations. Chaque événement n\'est relancé qu\'<b>une seule fois</b>.</p>'
    + '<div class="rc-card"><h2>Aperçu — rien n\'a encore été envoyé</h2>'
    + '<div class="rc-grid"><div class="rc-kpi"><b>' + a.createurs + '</b><span>organisateurs à relancer</span></div><div class="rc-kpi"><b>' + a.evenements + '</b><span>événements concernés (lot de 300 au plus)</span></div></div>'
    + (a.exemples && a.exemples.length ? '<div style="margin-top:8px"><div class="rc-note" style="margin-bottom:4px">Exemples :</div>' + a.exemples.map(x => '<div class="rc-ex">Compte n°' + x.createur_id + ' — ' + x.nb + ' événement(s) : ' + x.evenements.map(esc).join(' · ') + '</div>').join('') + '</div>' : '<p class="rc-note">Aucun ancien événement à relancer : tout est à jour.</p>')
    + '</div>'
    + (a.evenements ? '<div class="rc-card"><h2>Envoyer</h2><p class="rc-note">L\'envoi est <b>réel</b> (e-mails aux organisateurs) et ne peut pas être annulé. Avancez par petites vagues si vous préférez : ce qui reste s\'envoie au lot suivant.</p>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px"><label for="rc-lot" class="rc-note">Taille du lot</label><select id="rc-lot"><option value="20">20 événements</option><option value="100">100 événements</option><option value="300" selected>300 événements</option></select>'
      + '<button class="rc-btn pri" id="rc-envoyer">Envoyer les relances</button><button class="rc-btn out" id="rc-actualiser">Actualiser l\'aperçu</button></div></div>' : '<div class="rc-card"><button class="rc-btn out" id="rc-actualiser">Actualiser l\'aperçu</button></div>')
    + (resultat ? resultat : '');
  const env = $('#rc-envoyer'), act = $('#rc-actualiser');
  if (act) act.onclick = charger;
  if (env) env.onclick = async () => {
    const lot = Number($('#rc-lot').value);
    if (!confirm('Envoyer maintenant les relances (jusqu\'à ' + lot + ' événements) aux organisateurs ? Les e-mails partent réellement et ne peuvent pas être rappelés.')) return;
    env.disabled = true; env.textContent = 'Envoi en cours…';
    try {
      const r = await api('POST', '/admin/evenements/compte-rendu-anciens', { dryRun: false, limite: lot });
      APERCU = await api('POST', '/admin/evenements/compte-rendu-anciens', { dryRun: true });
      dessiner('<div class="rc-ok">✅ ' + r.notifications + ' notification(s) et ' + r.emails + ' e-mail(s) envoyé(s) pour ' + r.evenements_traites + ' événement(s).' + (r.restants ? ' Il en reste ' + r.restants + ' : relancez un lot.' : ' Tout est à jour.') + '</div>');
    } catch (e) { dessiner('<div class="rc-ko">' + esc(e.message || 'Envoi impossible.') + '</div>'); }
  };
}
charger();
</script>
<script src="assets/cookies-banner.js"></script>
</body>
</html>
