<style>
.fp-wrap{max-width:760px;margin:0 auto;padding:26px 20px 70px;}
.fp-affiche{width:100%;max-height:300px;border-radius:var(--radius);object-fit:cover;display:block;background:var(--bg);}
.fp-cat{display:inline-block;margin-top:16px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;background:#F26422;letter-spacing:.04em;text-transform:uppercase;}
.fp-title{font-size:26px;font-weight:900;margin:10px 0 4px;color:var(--navy);line-height:1.2;}
.fp-orga{font-size:13px;color:var(--muted);margin-bottom:18px;}
.fp-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;}
.fp-meta{display:flex;flex-wrap:wrap;gap:14px 26px;}
.fp-meta div{font-size:13.5px;color:var(--muted);}
.fp-meta strong{display:block;font-size:15px;color:var(--navy);font-weight:700;margin-top:2px;}
.fp-desc{font-size:14.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;}
.fp-h2{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 14px;}
.fp-field{margin-bottom:15px;}
.fp-label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px;}
.fp-req{color:#dc2626;}
.fp-hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45;}
.fp-input,.fp-select,.fp-textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--text);}
.fp-input:focus,.fp-select:focus,.fp-textarea:focus{outline:2px solid #F26422;outline-offset:1px;border-color:#F26422;}
.fp-textarea{min-height:92px;resize:vertical;}
.fp-check{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--text);margin-bottom:8px;cursor:pointer;line-height:1.45;}
.fp-check input{margin-top:3px;width:17px;height:17px;flex-shrink:0;cursor:pointer;}
.fp-submit{width:100%;padding:15px;border-radius:10px;border:none;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#F26422,#c2410c);color:#fff;}
.fp-submit:disabled{cursor:not-allowed;background:#e5e7eb;color:#9ca3af;}
.fp-error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:9px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;line-height:1.5;}
.fp-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
.fp-closed{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:var(--radius);padding:16px 18px;font-size:14.5px;font-weight:600;margin-bottom:18px;text-align:center;line-height:1.5;}
.fp-don{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;}
.fp-don-img{width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:12px;}
.fp-don-titre{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:5px;}
.fp-don-desc{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:12px;}
.fp-bar{height:9px;background:#fff;border-radius:99px;overflow:hidden;margin:9px 0 6px;}
.fp-bar-fill{height:100%;background:linear-gradient(135deg,#F26422,#c2410c);}
.fp-don-montant{font-size:19px;font-weight:900;color:var(--navy);}
.fp-don-sub{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.fp-don-btn{display:block;width:100%;padding:13px;border-radius:10px;font-weight:800;font-size:15px;text-align:center;text-decoration:none;background:linear-gradient(135deg,#F26422,#c2410c);color:#fff;}
.fp-media{border:1px dashed var(--border);border-radius:10px;padding:13px;margin-bottom:9px;}
.fp-media-list{font-size:12.5px;color:#059669;margin-top:7px;line-height:1.7;}
.fp-ok-icon{font-size:52px;text-align:center;margin-bottom:8px;}
.fp-ok-titre{font-size:22px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:6px;}
.fp-ok-sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:20px;}
.fp-ref{background:var(--bg);border-radius:10px;padding:14px;text-align:center;margin-bottom:18px;}
.fp-ref-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.fp-ref-val{font-size:22px;font-weight:900;color:var(--navy);letter-spacing:.04em;margin-top:3px;font-variant-numeric:tabular-nums;}
.fp-qr{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:10px;border:1px solid var(--border);}
.fp-qr img,.fp-qr canvas{display:block;}
/* Cadenas organisateur : volontairement discret (même intention que le cadenas administrateur
   junior de login.html) — visible pour qui le cherche, invisible pour le grand public. */
.fp-cadenas{display:block;margin:26px auto 0;background:none;border:none;cursor:pointer;font-size:15px;opacity:.16;padding:6px 10px;line-height:1;transition:opacity .2s;}
.fp-cadenas:hover,.fp-cadenas:focus{opacity:.75;outline:none;}
.fp-org{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;}
.fp-org-box{background:#fff;border-radius:14px;max-width:900px;width:100%;padding:22px;margin:auto;}
.fp-org-onglets{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px;border-bottom:1px solid var(--border);padding-bottom:10px;}
.fp-org-onglet{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--navy);}
.fp-org-onglet.actif{background:#0D2B4E;color:#fff;border-color:#0D2B4E;}
.fp-org-stat{display:inline-block;min-width:96px;background:var(--bg);border-radius:10px;padding:11px 14px;margin:0 8px 8px 0;}
.fp-org-stat b{display:block;font-size:21px;color:var(--navy);}
.fp-org-stat span{font-size:11.5px;color:var(--muted);}
.fp-org-tab{width:100%;border-collapse:collapse;font-size:13px;}
.fp-org-tab th{text-align:left;padding:7px 8px;background:#0D2B4E;color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.fp-org-tab td{padding:7px 8px;border-bottom:1px solid var(--border);}
.fp-org-lab{display:block;font-size:12px;font-weight:700;color:var(--navy);margin:10px 0 4px;}
@media(max-width:600px){
  .fp-wrap{padding:18px 15px 80px;}
  .fp-title{font-size:22px;}
  .fp-card{padding:17px 16px;}
  .fp-affiche{max-height:200px;}
}
</style>

<script>
/* ══════════════ FORMULAIRE D'INSCRIPTION PUBLIC (priorité 4 du cahier des charges v2) ══════
   Page 100 % publique : AUCUN compte n'est requis pour s'inscrire ni pour donner (règles #4/#6).
   On appelle /api/auth/me uniquement pour préremplir les champs d'une personne déjà connectée —
   jamais pour bloquer l'accès. Même convention que cagnotte.html. */
(function(){
  function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const slug = new URLSearchParams(location.search).get('slug');
  const el = document.getElementById('fp-content');
  let _f = null, _user = null;
  /* Médias du projet déjà téléversés (URL de notre CDN renvoyées par .../public/upload). */
  let _photos = [], _videoUrl = null, _pdfUrl = null;

  const TYPE_LABELS = {
    evenement:'Événement', rencontre:'Rencontre', conference:'Conférence', formation:'Formation',
    networking:'Networking', forum:'Forum', projet:'Projet', initiative:'Initiative', autre:'Autre',
  };
  const PARTICIPATION_LABELS = {
    participant:'Participant', benevole:'Bénévole', intervenant:'Intervenant', exposant:'Exposant',
  };
  const RAISON_LABELS = {
    complet:'😔 Toutes les places ont été prises — les inscriptions sont closes.',
    date_depassee:'⌛ La date limite d\'inscription est dépassée.',
    pas_encore_ouvertes:'🕐 Les inscriptions ne sont pas encore ouvertes.',
    fermees:'🔒 Les inscriptions sont fermées.',
  };

  function fmtDate(d){
    if (!d) return null;
    try { return new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
    catch(e){ return d; }
  }

  /* ── Champs personnalisés (priorité 3) : 13 types, rendus génériquement ─────────────────
     Le serveur a déjà nettoyé/borné chaque champ (type whitelisté, options bornées) — on se
     contente d'échapper à l'affichage. `fpc_` préfixe les name= pour ne jamais entrer en
     collision avec les champs fixes du formulaire. */
  function champHtml(c){
    const req = c.obligatoire ? ' <span class="fp-req">*</span>' : '';
    const nom = 'fpc_' + c.id;
    const label = '<label class="fp-label" for="'+escH(nom)+'">'+escH(c.label)+req+'</label>';
    const opts = Array.isArray(c.options) ? c.options : [];
    let input = '';
    switch (c.type) {
      case 'texte_long':
        input = '<textarea class="fp-textarea" id="'+escH(nom)+'" name="'+escH(nom)+'"'+(c.obligatoire?' required':'')+'></textarea>'; break;
      case 'nombre':
        input = '<input class="fp-input" type="number" id="'+escH(nom)+'" name="'+escH(nom)+'"'+(c.obligatoire?' required':'')+'>'; break;
      case 'date':
        input = '<input class="fp-input" type="date" id="'+escH(nom)+'" name="'+escH(nom)+'"'+(c.obligatoire?' required':'')+'>'; break;
      case 'heure':
        input = '<input class="fp-input" type="time" id="'+escH(nom)+'" name="'+escH(nom)+'"'+(c.obligatoire?' required':'')+'>'; break;
      case 'liste_deroulante':
        input = '<select class="fp-select" id="'+escH(nom)+'" name="'+escH(nom)+'"'+(c.obligatoire?' required':'')+'>'
              + '<option value="">— Choisir —</option>'
              + opts.map(function(o){ return '<option value="'+escH(o)+'">'+escH(o)+'</option>'; }).join('')
              + '</select>'; break;
      case 'choix_unique':
        input = opts.map(function(o,i){
          return '<label class="fp-check"><input type="radio" name="'+escH(nom)+'" value="'+escH(o)+'"'+(c.obligatoire&&i===0?' required':'')+'><span>'+escH(o)+'</span></label>';
        }).join(''); break;
      case 'choix_multiple':
        input = opts.map(function(o){
          return '<label class="fp-check"><input type="checkbox" name="'+escH(nom)+'" value="'+escH(o)+'"><span>'+escH(o)+'</span></label>';
        }).join(''); break;
      case 'consentement':
        /* Le libellé porte déjà l'énoncé du consentement : on ne le répète pas au-dessus. */
        return '<div class="fp-field"><label class="fp-check"><input type="checkbox" id="'+escH(nom)+'" name="'+escH(nom)+'" value="oui"'+(c.obligatoire?' required':'')+'><span>'+escH(c.label)+req+'</span></label></div>';
      case 'signature':
        input = '<input class="fp-input" type="text" id="'+escH(nom)+'" name="'+escH(nom)+'" placeholder="Tapez votre nom complet en guise de signature"'+(c.obligatoire?' required':'')+'>'
              + '<div class="fp-hint">Votre nom saisi ici vaut signature électronique.</div>'; break;
      case 'fichier': case 'photo': case 'video':
        /* Ces types passent par l'espace « Présentation de projet » (upload vers notre CDN) —
           ici on ne collecte qu'une indication écrite, jamais un fichier orphelin non contrôlé. */
        input = '<input class="fp-input" type="text" id="'+escH(nom)+'" name="'+escH(nom)+'" placeholder="Décrivez le document — vous pourrez le joindre ci-dessous"'+(c.obligatoire?' required':'')+'>'; break;
      default:
        input = '<input class="fp-input" type="text" id="'+escH(nom)+'" name="'+escH(nom)+'"'+(c.obligatoire?' required':'')+'>';
    }
    return '<div class="fp-field">'+label+input+'</div>';
  }

  function lireChamps(champs){
    const rep = {};
    (champs||[]).forEach(function(c){
      const nom = 'fpc_' + c.id;
      if (c.type === 'choix_multiple') {
        const vals = Array.prototype.slice.call(document.querySelectorAll('input[name="'+CSS.escape(nom)+'"]:checked')).map(function(i){ return i.value; });
        if (vals.length) rep[c.id] = vals;
      } else if (c.type === 'choix_unique') {
        const sel = document.querySelector('input[name="'+CSS.escape(nom)+'"]:checked');
        if (sel) rep[c.id] = sel.value;
      } else if (c.type === 'consentement') {
        const box = document.getElementById(nom);
        if (box && box.checked) rep[c.id] = 'oui';
      } else {
        const inp = document.getElementById(nom);
        if (inp && inp.value.trim()) rep[c.id] = inp.value.trim();
      }
    });
    return rep;
  }

  /* ── Aperçu de la collecte (règle #5) : teaser seulement, jamais la page complète de don.
     Le bouton redirige vers la vraie page de don Diaspo'Actif (cagnotte.html). ───────────── */
  function donHtml(don){
    if (!don) return '';
    const aMontant = don.montant_collecte != null;   /* null si visibilite_montant = 'masque' */
    const pct = (aMontant && don.objectif_montant) ? Math.min(100, Math.round(don.montant_collecte / don.objectif_montant * 100)) : null;
    const dev = escH(don.devise || 'EUR');
    return '<div class="fp-card fp-don">'
      + (don.image_url ? '<img class="fp-don-img" src="'+escH(don.image_url)+'" alt="">' : '')
      + '<div class="fp-don-titre">💚 '+escH(don.titre || 'Faire un don')+'</div>'
      + (don.description ? '<div class="fp-don-desc">'+escH(String(don.description).slice(0,260))+'</div>' : '')
      + (aMontant ? '<div class="fp-don-montant">'+Number(don.montant_collecte).toLocaleString('fr-FR')+' '+dev+'</div>' : '')
      + (pct != null ? '<div class="fp-bar"><div class="fp-bar-fill" style="width:'+pct+'%"></div></div>' : '')
      + (aMontant && don.objectif_montant ? '<div class="fp-don-sub">sur un objectif de '+Number(don.objectif_montant).toLocaleString('fr-FR')+' '+dev+'</div>' : '<div class="fp-don-sub">Chaque contribution compte, quel qu\'en soit le montant.</div>')
      + '<a class="fp-don-btn" href="cagnotte.html?slug='+encodeURIComponent(don.slug)+'">FAIRE UN DON</a>'
      + '<div class="fp-hint" style="text-align:center;margin-top:9px;">Le don est totalement facultatif et indépendant de votre inscription — aucun compte n\'est nécessaire.</div>'
      + '</div>';
  }

  function render(f){
    const ouvert = f.inscriptions_ouvertes;
    const champs = Array.isArray(f.champs_custom) ? f.champs_custom : [];
    const dateStr = fmtDate(f.date_evt);
    const heure = [f.heure_debut, f.heure_fin].filter(Boolean).join(' — ');

    let h = '';
    if (f.affiche_url) h += '<img class="fp-affiche" src="'+escH(f.affiche_url)+'" alt="">';
    h += '<span class="fp-cat">'+escH(TYPE_LABELS[f.type] || f.type || 'Inscription')+'</span>';
    h += '<h1 class="fp-title">'+escH(f.nom)+'</h1>';
    if (f.organisateur) h += '<div class="fp-orga">Organisé par '+escH(f.organisateur)+'</div>';

    /* Bloc informations pratiques — n'affiche que ce qui est réellement renseigné. */
    const metas = [];
    if (dateStr) metas.push('<div>Date<strong>'+escH(dateStr)+'</strong></div>');
    if (heure) metas.push('<div>Horaires<strong>'+escH(heure)+'</strong></div>');
    if (f.lieu) metas.push('<div>Lieu<strong>'+escH(f.lieu)+'</strong></div>');
    if (f.adresse) metas.push('<div>Adresse<strong>'+escH(f.adresse)+'</strong></div>');
    if (f.places_max) metas.push('<div>Places<strong>'+escH(f.places_max)+'</strong></div>');
    if (f.nb_inscrits != null) metas.push('<div>Déjà inscrits<strong>'+escH(f.nb_inscrits)+'</strong></div>');
    if (metas.length) h += '<div class="fp-card"><div class="fp-meta">'+metas.join('')+'</div></div>';
    if (f.description) h += '<div class="fp-card"><div class="fp-desc">'+escH(f.description)+'</div></div>';

    h += donHtml(f.don);

    if (!ouvert) {
      h += '<div class="fp-closed">'+escH(RAISON_LABELS[f.raison_fermeture] || 'Les inscriptions sont actuellement fermées.')+'</div>';
      h += cadenasHtml();
      el.innerHTML = h;
      brancherCadenas();
      return;
    }

    h += '<form class="fp-card" id="fp-form" novalidate>'
      + '<h2 class="fp-h2">S\'inscrire</h2>'
      + '<div id="fp-error" style="display:none;"></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-type">Je participe en tant que</label>'
      + '<select class="fp-select" id="fp-type">'
      + Object.keys(PARTICIPATION_LABELS).map(function(k){ return '<option value="'+k+'">'+escH(PARTICIPATION_LABELS[k])+'</option>'; }).join('')
      + '</select></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-nom">Nom <span class="fp-req">*</span></label><input class="fp-input" id="fp-nom" autocomplete="family-name" required></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-prenom">Prénom <span class="fp-req">*</span></label><input class="fp-input" id="fp-prenom" autocomplete="given-name" required></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-profession">Profession <span class="fp-req">*</span></label><input class="fp-input" id="fp-profession" required></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-tel">Téléphone</label><input class="fp-input" id="fp-tel" type="tel" autocomplete="tel" inputmode="tel"></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-email">Adresse e-mail</label><input class="fp-input" id="fp-email" type="email" autocomplete="email" inputmode="email">'
      + '<div class="fp-hint">Renseignez au moins un téléphone <strong>ou</strong> un e-mail pour que l\'organisateur puisse vous joindre.</div></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-adresse">Adresse</label><input class="fp-input" id="fp-adresse" autocomplete="street-address"></div>'
      + '<div class="fp-field"><label class="fp-label" for="fp-observation">Observation</label><textarea class="fp-textarea" id="fp-observation" placeholder="Une précision à transmettre à l\'organisateur ?"></textarea></div>';

    if (champs.length) h += '<h2 class="fp-h2" style="margin-top:26px;">Informations complémentaires</h2>' + champs.map(champHtml).join('');

    /* Présentation de projet (priorités 11-12) : repliée par défaut, jamais imposée. */
    if (f.autoriser_projet) {
      h += '<h2 class="fp-h2" style="margin-top:26px;">Présenter un projet ou une initiative</h2>'
        + '<label class="fp-check"><input type="checkbox" id="fp-projet-actif"><span>Je souhaite présenter un projet ou une initiative lors de cette rencontre</span></label>'
        + '<div id="fp-projet-bloc" style="display:none;margin-top:14px;">'
        + '<div class="fp-field"><label class="fp-label" for="fp-projet-nom">Nom du projet</label><input class="fp-input" id="fp-projet-nom"></div>'
        + '<div class="fp-field"><label class="fp-label" for="fp-projet-desc">Description</label><textarea class="fp-textarea" id="fp-projet-desc"></textarea></div>'
        + '<div class="fp-field"><label class="fp-label" for="fp-projet-obj">Objectifs</label><textarea class="fp-textarea" id="fp-projet-obj"></textarea></div>'
        + '<div class="fp-media"><label class="fp-label">Photos (3 maximum, 5 Mo chacune)</label>'
        + '<input type="file" id="fp-up-photo" accept="image/*" multiple><div class="fp-media-list" id="fp-liste-photo"></div></div>'
        + '<div class="fp-media"><label class="fp-label">Document PDF (10 Mo maximum)</label>'
        + '<input type="file" id="fp-up-pdf" accept="application/pdf"><div class="fp-media-list" id="fp-liste-pdf"></div></div>'
        + '<div class="fp-media"><label class="fp-label">Vidéo (2 minutes maximum, 60 Mo)</label>'
        + '<input type="file" id="fp-up-video" accept="video/mp4,video/webm"><div class="fp-media-list" id="fp-liste-video"></div></div>'
        + '</div>';
    }

    h += '<button type="submit" class="fp-submit" id="fp-submit" style="margin-top:22px;">Valider mon inscription</button>'
      + '<div class="fp-hint" style="text-align:center;margin-top:10px;">Aucun compte n\'est nécessaire pour s\'inscrire.</div>'
      + '</form>';

    h += cadenasHtml();
    el.innerHTML = h;
    brancherFormulaire(f, champs);
    brancherCadenas();
  }

  function cadenasHtml(){
    return '<button type="button" class="fp-cadenas" id="fp-cadenas" title="Accès organisateur" aria-label="Accès organisateur">🔒</button>';
  }

  function brancherFormulaire(f, champs){
    const form = document.getElementById('fp-form');
    if (_user) {   /* préremplissage confort d'une personne déjà connectée — jamais bloquant */
      if (_user.nom) document.getElementById('fp-nom').value = _user.nom;
      if (_user.prenom) document.getElementById('fp-prenom').value = _user.prenom;
      if (_user.email) document.getElementById('fp-email').value = _user.email;
    }

    const chk = document.getElementById('fp-projet-actif');
    if (chk) chk.addEventListener('change', function(){
      document.getElementById('fp-projet-bloc').style.display = chk.checked ? '' : 'none';
    });

    brancherUpload('fp-up-photo', 'photo', 'fp-liste-photo');
    brancherUpload('fp-up-pdf', 'pdf', 'fp-liste-pdf');
    brancherUpload('fp-up-video', 'video', 'fp-liste-video');

    form.addEventListener('submit', function(e){ e.preventDefault(); soumettre(f, champs); });
  }

  function erreur(msg){
    const box = document.getElementById('fp-error');
    if (!box) return;
    box.className = 'fp-error';
    box.textContent = msg;
    box.style.display = '';
    box.scrollIntoView({behavior:'smooth', block:'center'});
  }

  /* Upload des médias vers NOTRE CDN via .../public/upload (aucun compte requis, rate-limité
     par IP côté serveur, contrôlé par octets magiques + durée réelle pour la vidéo). */
  function brancherUpload(inputId, type, listeId){
    const input = document.getElementById(inputId);
    if (!input) return;
    const liste = document.getElementById(listeId);
    input.addEventListener('change', async function(){
      const fichiers = Array.prototype.slice.call(input.files || []);
      if (!fichiers.length) return;
      for (const fichier of fichiers) {
        if (type === 'photo' && _photos.length >= 3) { liste.textContent = '3 photos maximum.'; break; }
        liste.innerHTML += '<div>⏳ Envoi de ' + escH(fichier.name) + '…</div>';
        try {
          const fd = new FormData();
          fd.append('type', type);
          fd.append('fichier', fichier);
          const r = await fetch('/api/formulaires-inscription/public/upload', { method:'POST', body: fd });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || 'Envoi impossible.');
          if (type === 'photo') _photos.push(data.url);
          else if (type === 'pdf') _pdfUrl = data.url;
          else _videoUrl = data.url;
          rafraichirListe(type, liste);
        } catch(err) {
          liste.innerHTML = '<div style="color:#dc2626;">❌ ' + escH(err.message) + '</div>';
        }
      }
      input.value = '';
    });
  }

  function rafraichirListe(type, liste){
    if (type === 'photo') liste.innerHTML = _photos.map(function(u,i){ return '<div>✅ Photo '+(i+1)+' envoyée</div>'; }).join('');
    else if (type === 'pdf') liste.innerHTML = _pdfUrl ? '<div>✅ Document PDF envoyé</div>' : '';
    else liste.innerHTML = _videoUrl ? '<div>✅ Vidéo envoyée</div>' : '';
  }

  async function soumettre(f, champs){
    const btn = document.getElementById('fp-submit');
    const val = function(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    const projetActif = !!(document.getElementById('fp-projet-actif') || {}).checked;

    /* Contrôles côté client en miroir du serveur : message immédiat, mais c'est bien le serveur
       qui fait foi (il revalide tout, y compris les champs personnalisés obligatoires). */
    if (!val('fp-nom') || !val('fp-prenom') || !val('fp-profession')) return erreur('Nom, prénom et profession sont obligatoires.');
    if (!val('fp-tel') && !val('fp-email')) return erreur('Veuillez renseigner au moins un numéro de téléphone ou une adresse e-mail.');
    for (const c of champs) {
      if (!c.obligatoire) continue;
      const rep = lireChamps([c])[c.id];
      if (rep === undefined || rep === '' || (Array.isArray(rep) && !rep.length)) return erreur('Le champ « ' + c.label + ' » est obligatoire.');
    }

    btn.disabled = true; btn.textContent = 'Envoi en cours…';
    try {
      const r = await fetch('/api/formulaires-inscription/public/' + encodeURIComponent(slug) + '/inscriptions', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
        body: JSON.stringify({
          nom: val('fp-nom'), prenom: val('fp-prenom'), profession: val('fp-profession'),
          telephone: val('fp-tel'), email: val('fp-email'), adresse: val('fp-adresse'),
          observation: val('fp-observation'),
          type_participation: (document.getElementById('fp-type')||{}).value || 'participant',
          reponses: lireChamps(champs),
          presente_projet: projetActif,
          projet_nom: projetActif ? val('fp-projet-nom') : '',
          projet_description: projetActif ? val('fp-projet-desc') : '',
          projet_objectifs: projetActif ? val('fp-projet-obj') : '',
          projet_photos: projetActif ? _photos : [],
          projet_video_url: projetActif ? _videoUrl : null,
          projet_pdf_url: projetActif ? _pdfUrl : null,
        }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Inscription impossible.');
      confirmation(f, data);
    } catch(err) {
      erreur(err.message);
      btn.disabled = false; btn.textContent = 'Valider mon inscription';
    }
  }

  /* ── Confirmation + QR individuel (priorité 7) ──────────────────────────────────────────
     La personne n'a pas de compte : cet écran est sa SEULE occasion de récupérer son QR, d'où
     l'invitation explicite à le conserver. Le QR est signé côté serveur (HMAC) — il ne contient
     aucune donnée personnelle, juste une référence signée vérifiée au moment du check-in. */
  function confirmation(f, data){
    const insc = data.inscription || {};
    let h = '<div class="fp-card">'
      + '<div class="fp-ok-icon">🎉</div>'
      + '<div class="fp-ok-titre">Inscription confirmée</div>'
      + '<div class="fp-ok-sub">Merci ! Votre inscription à <strong>'+escH(f.nom)+'</strong> a bien été enregistrée.</div>'
      + '<div class="fp-ref"><div class="fp-ref-label">Votre référence</div><div class="fp-ref-val">'+escH(insc.reference||'')+'</div></div>';

    if (insc.qr_payload) {
      h += '<div class="fp-label" style="text-align:center;">Votre billet d\'entrée</div>'
        + '<div class="fp-qr" id="fp-qr"></div>'
        + '<div class="fp-hint" style="text-align:center;margin-top:9px;">📸 <strong>Conservez cette page</strong> (capture d\'écran ou impression) : ce QR code sera scanné à l\'entrée. En cas de perte, votre référence ci-dessus suffit.</div>';
    }
    h += '</div>';

    h += donHtml(f.don);

    /* Règle #4 : proposition de compte facultative, JAMAIS bloquante, et uniquement à qui n'en
       a pas déjà un (sinon on l'inciterait à créer un doublon au lieu de se connecter). */
    if (!data.compte_existant) {
      h += '<div class="fp-card" style="text-align:center;">'
        + '<div class="fp-don-titre">Créer votre compte Diaspo\'Actif ?</div>'
        + '<div class="fp-don-desc">Facultatif — votre inscription est déjà enregistrée. Un compte vous permet de retrouver vos inscriptions et de rejoindre la communauté.</div>'
        + '<a class="fp-don-btn" href="inscription.html">Créer mon compte</a></div>';
    }
    h += '<div style="text-align:center;"><a href="index.html" class="footer-link">← Retour à l\'accueil</a></div>';

    el.innerHTML = h;
    window.scrollTo({top:0, behavior:'smooth'});

    if (insc.qr_payload) {
      /* qrcodejs est chargé en `defer` (CDN) : au premier rendu il peut ne pas être prêt, et il
         peut aussi ne jamais arriver (réseau filtré, hors-ligne). On réessaie un temps borné,
         puis on assume l'absence de QR — la référence affichée au-dessus suffit à l'accueil,
         donc on ne laisse JAMAIS un cadre vide sans explication. */
      var essais = 0;
      const dessiner = function(){
        const box = document.getElementById('fp-qr');
        if (!box) return;
        if (typeof QRCode === 'undefined') {
          if (++essais > 40) {   /* ~6 s */
            box.innerHTML = '<div class="fp-hint" style="text-align:center;">Le QR code n\'a pas pu être affiché sur cet appareil. Présentez simplement votre référence <strong>'+escH(insc.reference||'')+'</strong> à l\'accueil.</div>';
            return;
          }
          return setTimeout(dessiner, 150);
        }
        new QRCode(box, { text: insc.qr_payload, width: 210, height: 210, colorDark:'#0D2B4E', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
      };
      dessiner();
    }
  }

  /* ══ ESPACE ORGANISATEUR (cadenas) ═══════════════════════════════════════════════════════
     Le code saisi est échangé une seule fois contre un JETON signé par le serveur, valable 12 h
     et lié à ce seul formulaire ; c'est ce jeton qui accompagne ensuite chaque appel (en-tête
     X-Formulaire-Acces). Le code lui-même n'est jamais conservé ni renvoyé. Le jeton vit dans
     sessionStorage : il disparaît à la fermeture de l'onglet, ce qui évite de laisser un accès
     ouvert sur un téléphone prêté ou un poste partagé. */
  const CLE_JETON = 'fp_acces_' + slug;
  let _jeton = null;
  try { _jeton = sessionStorage.getItem(CLE_JETON); } catch(e) { _jeton = null; }

  function brancherCadenas(){
    const b = document.getElementById('fp-cadenas');
    if (b) b.addEventListener('click', demanderCode);
  }

  /* Entrée sans code, réservée aux comptes habilités : le tableau de bord ouvre cette page avec
     ?gerer=<id>. Si la session n'a pas le droit, l'appel échoue et le cadenas reste la seule voie. */
  async function ouvrirParSession(fid){
    _fid = Number(fid);
    try {
      await apiOrg('GET', '/formulaires-inscription/' + _fid);
      _sessionHabilitee = true;
      ouvrirEspace();
      return true;
    } catch(e) { _fid = null; return false; }
  }

  async function demanderCode(){
    if (_jeton || _sessionHabilitee) return ouvrirEspace();
    const code = prompt("Code d'accès organisateur :");
    if (!code) return;
    try {
      const r = await fetch('/api/formulaires-inscription/public/' + encodeURIComponent(slug) + '/acces', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Accès refusé.');
      _jeton = d.jeton;
      try { sessionStorage.setItem(CLE_JETON, _jeton); } catch(e) {}
      ouvrirEspace();
    } catch(err) { alert(err.message); }
  }

  /* Tout appel de l'espace organisateur passe par ici : le jeton est ajouté systématiquement, et
     un jeton périmé (12 h) ramène proprement à la demande de code au lieu d'une erreur opaque. */
  async function apiOrg(methode, chemin, corps){
    /* Deux façons d'être autorisé : le jeton du cadenas, ou une session habilitée (administration
       ou compte Diaspo'Actif Officiel). On envoie ce qu'on a, le serveur tranche. */
    const opts = { method: methode, headers: {}, credentials: 'same-origin' };
    if (_jeton) opts.headers['X-Formulaire-Acces'] = _jeton;
    if (corps !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(corps); }
    const r = await fetch('/api' + chemin, opts);
    const d = await r.json().catch(function(){ return {}; });
    if (!r.ok) {
      if (r.status === 403 || r.status === 404) {
        if (_jeton) { _jeton = null; try { sessionStorage.removeItem(CLE_JETON); } catch(e) {} }
        throw new Error(_sessionHabilitee ? "Vous n'avez pas accès à ce formulaire." : 'Votre accès a expiré — ressaisissez le code.');
      }
      throw new Error(d.error || 'Erreur.');
    }
    return d;
  }

  function ouvrirEspace(){
    let ov = document.getElementById('fp-org');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'fp-org'; ov.className = 'fp-org';
      ov.addEventListener('click', function(e){ if (e.target === ov) fermerEspace(); });
      document.body.appendChild(ov);
    }
    ov.style.display = 'flex';
    ov.innerHTML = '<div class="fp-org-box"><div class="fp-empty">Chargement…</div></div>';
    onglet('inscrits');
  }

  function fermerEspace(){
    arreterScan();
    const ov = document.getElementById('fp-org');
    if (ov) ov.style.display = 'none';
  }
  window.fpFermerEspace = fermerEspace;

  function coquille(titre, contenu, actif){
    const ongl = [['inscrits','\u{1F465} Inscrits'],['checkin','✅ Check-in'],['stats','\u{1F4CA} Statistiques'],['exports','\u{1F4E4} Exports'],['reglages','⚙️ Réglages']];
    return '<div class="fp-org-box">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">'
      + '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;">Espace organisateur</div>'
      + '<h3 style="margin:2px 0 0;font-size:19px;color:var(--navy);">' + escH(titre) + '</h3></div>'
      + '<button type="button" onclick="fpFermerEspace()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);">✕</button></div>'
      + '<div class="fp-org-onglets">'
      + ongl.map(function(o){ return '<button type="button" class="fp-org-onglet' + (o[0]===actif?' actif':'') + '" onclick="fpOnglet(&quot;' + o[0] + '&quot;)">' + o[1] + '</button>'; }).join('')
      + '</div><div id="fp-org-contenu">' + contenu + '</div></div>';
  }

  async function onglet(nom){
    const ov = document.getElementById('fp-org');
    if (!ov) return;
    arreterScan();
    ov.innerHTML = coquille(_f ? _f.nom : '', '<div class="fp-empty">Chargement…</div>', nom);
    const zone = document.getElementById('fp-org-contenu');
    try {
      if (nom === 'inscrits')      await vueInscrits(zone);
      else if (nom === 'checkin')  vueCheckin(zone);
      else if (nom === 'stats')    await vueStats(zone);
      else if (nom === 'exports')  await vueExports(zone);
      else if (nom === 'reglages') await vueReglages(zone);
    } catch(e) {
      zone.innerHTML = '<div class="fp-error">' + escH(e.message) + '</div>';
      if (e.message.indexOf('expiré') >= 0) setTimeout(function(){ fermerEspace(); }, 1800);
    }
  }
  window.fpOnglet = onglet;

  /* L'identifiant interne du formulaire n'est pas exposé par la lecture publique (volontairement).
     Il est porté par le jeton lui-même, qui est signé : on peut donc le lire sans risque. */
  let _fid = null, _sessionHabilitee = false;
  function idFormulaire(){
    if (_fid) return _fid;
    if (_jeton) { _fid = JSON.parse(atob(_jeton)).fid; return _fid; }
    return _fid;   /* renseigné par ouvrirParSession() quand on entre avec un compte habilité */
  }

  const STATUTS_INSC = { inscrit:'\u{1F4DD} Inscrit', confirme:'✅ Confirmé', present:'\u{1F7E2} Présent', absent:'⚪ Absent', annule:'❌ Annulé' };

  async function vueInscrits(zone){
    const fid = idFormulaire();
    const d = await apiOrg('GET', '/formulaires-inscription/' + fid + '/inscriptions');
    const list = d.inscriptions || [];
    zone.innerHTML = '<input class="fp-input" id="fp-org-q" placeholder="Rechercher un nom, un téléphone, une référence…" style="margin-bottom:12px;">'
      + '<div style="overflow-x:auto;"><table class="fp-org-tab"><thead><tr><th>Référence</th><th>Nom</th><th>Contact</th><th>Type</th><th>Statut</th><th></th></tr></thead><tbody id="fp-org-tbody"></tbody></table></div>'
      + '<div id="fp-org-vide" style="display:none;" class="fp-empty">Aucun inscrit pour le moment.</div>';
    const dessiner = function(filtre){
      const q = (filtre||'').toLowerCase();
      const vus = list.filter(function(i){ return !q || ((i.nom||'') + ' ' + (i.prenom||'') + ' ' + (i.telephone||'') + ' ' + (i.email||'') + ' ' + (i.reference||'')).toLowerCase().indexOf(q) >= 0; });
      document.getElementById('fp-org-vide').style.display = vus.length ? 'none' : 'block';
      document.getElementById('fp-org-tbody').innerHTML = vus.map(function(i){
        return '<tr><td><strong>' + escH(i.reference||'—') + '</strong></td>'
          + '<td>' + escH(i.prenom||'') + ' ' + escH(i.nom) + '<div style="font-size:11px;color:var(--muted);">' + escH(i.profession||'') + '</div></td>'
          + '<td style="font-size:12px;">' + (i.telephone?escH(i.telephone)+'<br>':'') + escH(i.email||'') + '</td>'
          + '<td>' + escH(PARTICIPATION_LABELS[i.type_participation]||i.type_participation) + '</td>'
          + '<td><select onchange="fpStatutInsc(' + i.id + ',this.value)" class="fp-select" style="padding:4px 6px;font-size:12px;">'
          + Object.keys(STATUTS_INSC).map(function(k){ return '<option value="' + k + '"' + (i.statut===k?' selected':'') + '>' + STATUTS_INSC[k] + '</option>'; }).join('')
          + '</select></td>'
          + '<td><button type="button" onclick="fpFiche(' + i.id + ')" title="Fiche complète" style="border:1px solid var(--border);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;">\u{1F50D}</button></td></tr>';
      }).join('');
    };
    dessiner('');
    document.getElementById('fp-org-q').addEventListener('input', function(e){ dessiner(e.target.value); });
  }

  window.fpStatutInsc = async function(id, statut){
    try { await apiOrg('PATCH', '/formulaires-inscription/inscriptions/' + id + '/statut', { statut }); }
    catch(e) { alert(e.message); }
  };

  window.fpFiche = async function(id){
    const zone = document.getElementById('fp-org-contenu');
    zone.innerHTML = '<div class="fp-empty">Chargement…</div>';
    try {
      const d = await apiOrg('GET', '/formulaires-inscription/inscriptions/' + id);
      const i = d.inscription;
      const champs = Array.isArray(i.champs_custom) ? i.champs_custom : [];
      const rep = i.reponses || {};
      const ligne = function(l, v){ return (v===null||v===undefined||v==='') ? '' :
        '<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);"><div style="flex:0 0 40%;font-size:12.5px;color:var(--muted);">' + escH(l) + '</div><div style="flex:1;font-size:13.5px;white-space:pre-wrap;">' + escH(v) + '</div></div>'; };
      const photos = Array.isArray(i.projet_photos) ? i.projet_photos : [];
      zone.innerHTML = '<button type="button" onclick="fpOnglet(&quot;inscrits&quot;)" style="background:none;border:none;color:var(--navy);font-weight:700;font-size:13px;cursor:pointer;padding:0 0 10px;">← Retour à la liste</button>'
        + '<h4 style="margin:0 0 3px;font-size:18px;color:var(--navy);">' + escH(i.prenom||'') + ' ' + escH(i.nom) + '</h4>'
        + '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">' + escH(i.reference||'') + ' · ' + escH(STATUTS_INSC[i.statut]||i.statut) + ' · ' + escH(PARTICIPATION_LABELS[i.type_participation]||i.type_participation) + (i.checkin_at?' · Pointé le ' + escH(String(i.checkin_at).slice(0,16).replace('T',' ')):'') + '</div>'
        + ligne('Profession', i.profession) + ligne('Téléphone', i.telephone) + ligne('E-mail', i.email)
        + ligne('Adresse', i.adresse) + ligne('Observation', i.observation)
        + ligne('Inscrit le', (i.created_at||'').slice(0,16).replace('T',' '))
        + (champs.length ? '<h4 style="margin:18px 0 6px;font-size:14px;color:var(--navy);">Réponses au formulaire</h4>'
            + champs.map(function(c){ var v = rep[c.id]; if (Array.isArray(v)) v = v.join(', ');
              return '<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);"><div style="flex:0 0 40%;font-size:12.5px;color:var(--muted);">' + escH(c.label) + '</div><div style="flex:1;font-size:13.5px;color:' + (v?'inherit':'#94a3b8') + ';">' + (v?escH(v):'— non renseigné') + '</div></div>'; }).join('') : '')
        + (i.presente_projet ? '<h4 style="margin:18px 0 6px;font-size:14px;color:var(--navy);">\u{1F4CB} Projet présenté</h4>'
            + ligne('Nom du projet', i.projet_nom) + ligne('Description', i.projet_description) + ligne('Objectifs', i.projet_objectifs)
            + (photos.length ? '<div style="padding:9px 0;"><div style="font-size:12.5px;color:var(--muted);margin-bottom:6px;">Photos (' + photos.length + ') — cliquez pour ouvrir ou enregistrer</div><div style="display:flex;gap:8px;flex-wrap:wrap;">'
                + photos.map(function(u){ return '<a href="' + escH(u) + '" target="_blank" download><img src="' + escH(u) + '" style="width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--border);"></a>'; }).join('') + '</div></div>' : '')
            + (i.projet_pdf_url ? '<div style="padding:7px 0;"><a href="' + escH(i.projet_pdf_url) + '" target="_blank" download style="font-weight:700;color:var(--navy);font-size:13px;">\u{1F4C4} Télécharger le document PDF ↗</a></div>' : '')
            + (i.projet_video_url ? '<div style="padding:7px 0;"><video src="' + escH(i.projet_video_url) + '" controls style="width:100%;max-height:260px;border-radius:8px;background:#000;"></video>'
                + '<div style="margin-top:5px;"><a href="' + escH(i.projet_video_url) + '" target="_blank" download style="font-weight:700;color:var(--navy);font-size:13px;">⬇️ Télécharger la vidéo</a></div></div>' : '')
          : '')
        + (i.qr_payload ? '<h4 style="margin:18px 0 6px;font-size:14px;color:var(--navy);">\u{1F39F}️ Billet</h4><div class="fp-qr" id="fp-org-qr"></div>' : '');
      if (i.qr_payload) {
        const box = document.getElementById('fp-org-qr');
        if (typeof QRCode !== 'undefined') new QRCode(box, { text: i.qr_payload, width:160, height:160, colorDark:'#0D2B4E', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
        else box.innerHTML = '<div class="fp-hint">Référence : <strong>' + escH(i.reference||'') + '</strong></div>';
      }
    } catch(e) { zone.innerHTML = '<div class="fp-error">' + escH(e.message) + '</div>'; }
  };

  /* ── Check-in ─────────────────────────────────────────────────────────────────────────── */
  let _flux = null, _timer = null, _dernier = 0;

  function vueCheckin(zone){
    zone.innerHTML = '<div id="fp-scan-res" style="min-height:60px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;padding:13px;font-size:14px;color:var(--muted);text-align:center;margin-bottom:12px;">Scannez un QR code ou saisissez une référence.</div>'
      + '<div style="background:#000;border-radius:10px;overflow:hidden;margin-bottom:10px;"><video id="fp-scan-video" autoplay playsinline muted style="width:100%;max-height:260px;display:block;object-fit:cover;"></video><canvas id="fp-scan-canvas" style="display:none;"></canvas></div>'
      + '<div style="display:flex;gap:8px;margin-bottom:14px;"><button type="button" id="fp-scan-on" class="fp-submit" style="flex:1;padding:11px;font-size:14px;background:#0D2B4E;">▶ Démarrer la caméra</button>'
      + '<button type="button" id="fp-scan-off" class="fp-submit" style="flex:1;padding:11px;font-size:14px;background:#dc2626;display:none;">⏹ Arrêter</button></div>'
      + '<label class="fp-org-lab">Saisie manuelle (QR illisible, billet perdu…)</label>'
      + '<div style="display:flex;gap:7px;"><input class="fp-input" id="fp-scan-ref" placeholder="DA-2026-000123" style="text-transform:uppercase;">'
      + '<button type="button" id="fp-scan-val" class="fp-submit" style="width:auto;padding:11px 18px;font-size:14px;background:#16a34a;">Valider</button></div>';
    document.getElementById('fp-scan-on').addEventListener('click', demarrerScan);
    document.getElementById('fp-scan-off').addEventListener('click', arreterScan);
    const val = function(){ pointer(null, document.getElementById('fp-scan-ref').value); };
    document.getElementById('fp-scan-val').addEventListener('click', val);
    document.getElementById('fp-scan-ref').addEventListener('keydown', function(e){ if (e.key === 'Enter') val(); });
  }

  function chargerJsQR(){
    return new Promise(function(resolve, reject){
      if (typeof jsQR !== 'undefined') return resolve();
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js';
      sc.onload = function(){ typeof jsQR !== 'undefined' ? resolve() : reject(new Error('Lecteur QR indisponible.')); };
      sc.onerror = function(){ reject(new Error('Lecteur QR inaccessible (connexion ?).')); };
      document.head.appendChild(sc);
    });
  }

  async function demarrerScan(){
    const res = document.getElementById('fp-scan-res');
    try {
      await chargerJsQR();
      _flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.getElementById('fp-scan-video');
      v.srcObject = _flux; await v.play();
      document.getElementById('fp-scan-on').style.display = 'none';
      document.getElementById('fp-scan-off').style.display = '';
      res.textContent = "Recherche d'un QR code…";
      const cv = document.getElementById('fp-scan-canvas'), ctx = cv.getContext('2d');
      _timer = setInterval(function(){
        if (v.readyState !== v.HAVE_ENOUGH_DATA) return;
        if (Date.now() - _dernier < 2500) return;
        cv.width = v.videoWidth; cv.height = v.videoHeight;
        ctx.drawImage(v, 0, 0);
        const img = ctx.getImageData(0, 0, cv.width, cv.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) { _dernier = Date.now(); pointer(code.data, null); }
      }, 200);
    } catch(e) {
      res.innerHTML = '<span style="color:#dc2626;">Caméra indisponible : ' + escH(e.message) + ' — utilisez la saisie manuelle.</span>';
    }
  }

  function arreterScan(){
    if (_flux) { _flux.getTracks().forEach(function(t){ t.stop(); }); _flux = null; }
    if (_timer) { clearInterval(_timer); _timer = null; }
    const v = document.getElementById('fp-scan-video'); if (v) v.srcObject = null;
    const on = document.getElementById('fp-scan-on'); if (on) on.style.display = '';
    const off = document.getElementById('fp-scan-off'); if (off) off.style.display = 'none';
  }

  async function pointer(qr, reference){
    const res = document.getElementById('fp-scan-res');
    if (!res || (!qr && !(reference||'').trim())) return;
    res.innerHTML = '⏳ Vérification…';
    try {
      const fid = idFormulaire();
      const d = await apiOrg('POST', '/formulaires-inscription/checkin',
        qr ? { qr_payload: qr, formulaire_id: fid } : { reference: (reference||'').trim(), formulaire_id: fid });
      if (d.valide) {
        const i = d.inscription;
        res.style.background = '#f0fdf4';
        res.innerHTML = '<div><div style="font-size:24px;">' + (d.deja_presente?'⚠️':'✅') + '</div>'
          + '<div style="font-size:16px;font-weight:800;color:#166534;">' + escH(i.prenom||'') + ' ' + escH(i.nom) + '</div>'
          + '<div style="font-size:12.5px;color:#15803d;">' + escH(PARTICIPATION_LABELS[i.type_participation]||i.type_participation) + ' · ' + escH(i.reference||'') + '</div>'
          + (d.deja_presente?'<div style="font-size:12px;color:#b45309;margin-top:4px;font-weight:700;">Déjà pointé — entrée tout de même autorisée.</div>':'') + '</div>';
        const c = document.getElementById('fp-scan-ref'); if (c) c.value = '';
      } else {
        res.style.background = '#fef2f2';
        res.innerHTML = '<div><div style="font-size:24px;">⛔</div><div style="font-weight:700;color:#991b1b;">' + escH(d.motif||'Refusé') + '</div></div>';
      }
    } catch(e) {
      res.style.background = '#fef2f2';
      res.innerHTML = '<div style="color:#991b1b;font-weight:700;">' + escH(e.message) + '</div>';
    }
  }

  /* ── Statistiques ─────────────────────────────────────────────────────────────────────── */
  async function vueStats(zone){
    const fid = idFormulaire();
    const d = await apiOrg('GET', '/formulaires-inscription/' + fid + '/stats');
    const carte = function(v, l){ return '<div class="fp-org-stat"><b>' + escH(v==null?'∞':v) + '</b><span>' + escH(l) + '</span></div>'; };
    zone.innerHTML = carte(d.total_inscrits,'Inscrits') + carte(d.places_restantes,'Places restantes') + carte(d.nb_projets_presentes,'Projets présentés')
      + '<h4 style="margin:16px 0 7px;font-size:14px;color:var(--navy);">Par type de participation</h4>'
      + Object.keys(d.par_type||{}).map(function(k){ return carte(d.par_type[k], PARTICIPATION_LABELS[k]||k); }).join('')
      + '<h4 style="margin:16px 0 7px;font-size:14px;color:var(--navy);">Par statut</h4>'
      + Object.keys(d.par_statut||{}).map(function(k){ return carte(d.par_statut[k], (STATUTS_INSC[k]||k).replace(/^\S+\s/,'')); }).join('');
  }

  /* ── Exports ──────────────────────────────────────────────────────────────────────────────
     Un téléchargement classique (lien href) ne peut pas porter l'en-tête du jeton : on récupère
     donc le fichier par fetch, puis on déclenche l'enregistrement depuis le contenu reçu. */
  async function vueExports(zone){
    zone.innerHTML = '<label class="fp-org-lab">Contenu</label>'
      + '<select class="fp-select" id="fp-exp-type"><option value="tous">Tous les inscrits</option><option value="participant">Participants</option><option value="benevole">Bénévoles</option><option value="intervenant">Intervenants</option><option value="exposant">Exposants</option><option value="presence">Liste de présence (imprimable)</option></select>'
      + '<label class="fp-org-lab">Format</label>'
      + '<select class="fp-select" id="fp-exp-format"><option value="csv">CSV</option><option value="excel">Excel</option><option value="pdf">PDF (imprimable)</option></select>'
      + '<button type="button" id="fp-exp-btn" class="fp-submit" style="margin-top:16px;">⬇️ Télécharger</button>'
      + '<div id="fp-exp-msg" class="fp-hint" style="text-align:center;margin-top:9px;"></div>';
    document.getElementById('fp-exp-btn').addEventListener('click', async function(){
      const msg = document.getElementById('fp-exp-msg');
      msg.textContent = 'Préparation du fichier…';
      try {
        const fid = idFormulaire();
        const type = document.getElementById('fp-exp-type').value;
        const format = document.getElementById('fp-exp-format').value;
        const enTetes = {}; if (_jeton) enTetes['X-Formulaire-Acces'] = _jeton;
        const r = await fetch('/api/formulaires-inscription/' + fid + '/export?type=' + encodeURIComponent(type) + '&format=' + encodeURIComponent(format), { headers: enTetes, credentials: 'same-origin' });
        if (!r.ok) throw new Error('Export impossible.');
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (type === 'presence' ? 'presence' : type) + '-formulaire.' + (format === 'excel' ? 'xls' : format === 'pdf' ? 'html' : 'csv');
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        msg.textContent = 'Fichier téléchargé.';
      } catch(e) { msg.textContent = e.message; }
    });
  }

  /* ── Réglages : modification réelle du formulaire ─────────────────────────────────────── */
  async function vueReglages(zone){
    const fid = idFormulaire();
    const d = await apiOrg('GET', '/formulaires-inscription/' + fid);
    const f = d.formulaire;
    const v = function(k){ return f[k] == null ? '' : f[k]; };
    zone.innerHTML = '<div id="fp-reg-msg"></div>'
      + '<label class="fp-org-lab">Statut du formulaire</label>'
      + '<select class="fp-select" id="fp-reg-statut">'
      + [['brouillon','\u{1F4DD} Brouillon (invisible du public)'],['ouvert','\u{1F7E2} Ouvert aux inscriptions'],['ferme','\u{1F534} Fermé'],['archive','\u{1F5C4} Archivé']]
          .map(function(o){ return '<option value="' + o[0] + '"' + (f.statut===o[0]?' selected':'') + '>' + o[1] + '</option>'; }).join('') + '</select>'
      + '<label class="fp-org-lab">Nom</label><input class="fp-input" id="fp-reg-nom" value="' + escH(v('nom')) + '">'
      + '<label class="fp-org-lab">Date</label><input class="fp-input" type="date" id="fp-reg-date" value="' + escH(v('date_evt')) + '">'
      + '<label class="fp-org-lab">Lieu</label><input class="fp-input" id="fp-reg-lieu" value="' + escH(v('lieu')) + '">'
      + '<label class="fp-org-lab">Adresse</label><input class="fp-input" id="fp-reg-adresse" value="' + escH(v('adresse')) + '">'
      + '<label class="fp-org-lab">Description</label><textarea class="fp-textarea" id="fp-reg-desc">' + escH(v('description')) + '</textarea>'
      + '<label class="fp-org-lab">Nombre maximum de participants (vide = illimité)</label><input class="fp-input" type="number" min="0" id="fp-reg-places" value="' + escH(v('places_max')) + '">'
      + '<button type="button" id="fp-reg-btn" class="fp-submit" style="margin-top:18px;">Enregistrer les modifications</button>';
    document.getElementById('fp-reg-btn').addEventListener('click', async function(){
      const msg = document.getElementById('fp-reg-msg');
      const btn = document.getElementById('fp-reg-btn');
      btn.disabled = true; btn.textContent = 'Enregistrement…';
      try {
        const statut = document.getElementById('fp-reg-statut').value;
        await apiOrg('PUT', '/formulaires-inscription/' + fid, {
          nom: document.getElementById('fp-reg-nom').value.trim(),
          date_evt: document.getElementById('fp-reg-date').value || null,
          lieu: document.getElementById('fp-reg-lieu').value.trim(),
          adresse: document.getElementById('fp-reg-adresse').value.trim(),
          description: document.getElementById('fp-reg-desc').value.trim(),
          places_max: document.getElementById('fp-reg-places').value === '' ? null : Number(document.getElementById('fp-reg-places').value),
        });
        if (statut !== f.statut) await apiOrg('PATCH', '/formulaires-inscription/' + fid + '/statut', { statut });
        msg.innerHTML = '<div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:9px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;">✅ Modifications enregistrées.</div>';
      } catch(e) {
        msg.innerHTML = '<div class="fp-error">' + escH(e.message) + '</div>';
      }
      btn.disabled = false; btn.textContent = 'Enregistrer les modifications';
    });
  }

  /* ── Chargement ────────────────────────────────────────────────────────────────────────── */
  if (!slug) {
    el.innerHTML = '<div class="fp-empty">🔒 Lien incomplet — aucun formulaire indiqué.</div>';
    return;
  }
  const gerer = new URLSearchParams(location.search).get('gerer');
  if (gerer) setTimeout(function(){ ouvrirParSession(gerer); }, 400);

  fetch('/api/auth/me', {credentials:'same-origin'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ _user = d && d.user ? d.user : null; })
    .catch(function(){ _user = null; })
    .finally(function(){
      fetch('/api/formulaires-inscription/public/' + encodeURIComponent(slug), {credentials:'same-origin'})
        .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw j; return j; }); })
        .then(function(d){ _f = d.formulaire; render(_f); })
        .catch(function(err){
          el.innerHTML = '<div class="fp-empty">🔒 ' + escH((err && err.error) || 'Ce formulaire est introuvable ou n\'est plus disponible.') + '</div>';
        });
    });
})();
</script>

  

  <script>
  (function(){
    function render(user){
      var box = document.getElementById('hb-account-section');
      var navLogin = document.getElementById('mob-nav-login');
      if (!box) return;
      if (user){
        var dash = {utilisateur:'dashboard-utilisateur.html', initiative:'dashboard-initiative.html', administrateur:'dashboard-administrateur.html', collectivite:'dashboard-collectivite.html'};
        var dashHref = dash[user.role] || 'index.html';
        box.innerHTML = '<a href="' + dashHref + '#apparence">⚙️ Paramètres</a><a href="#" id="hb-logout-link">🚪 Déconnexion</a>';
        var out = document.getElementById('hb-logout-link');
        if (out) out.addEventListener('click', function(e){
          e.preventDefault();
          fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'}).finally(function(){ window.location.href = 'index.html'; });
        });
        if (navLogin) navLogin.href = dashHref;
      } else {
        box.innerHTML = '<a href="login.html">🔑 Se connecter</a><a href="inscription.html">✨ Créer un compte</a>';
      }
    }
    fetch('/api/auth/me', {credentials:'same-origin'}).then(function(r){ return r.json(); })
      .then(function(d){ render(d && d.user); }).catch(function(){ render(null); });
  })();
  </script>
