<style>
#ip-root { font-family:'IBM Plex Sans', sans-serif; color:oklch(0.2 0.006 30); }
#ip-root button, #ip-root input, #ip-root select, #ip-root textarea { font-family:inherit; }
/* Deux colonnes (2026-09-27, demande explicite : "à droite l'inscription, à gauche les autres
   événements du même organisme + un calendrier") — .ip-layout reste en une seule colonne
   centrée (comportement historique, .ip-wrap inchangé) tant qu'aucun autre événement n'existe
   pour cet organisateur ; la classe --two-col n'est ajoutée par le JS que si la colonne
   gauche a réellement du contenu, pour ne jamais laisser une colonne vide béante. */
.ip-layout{max-width:640px;margin:0 auto;}
/* Trois colonnes (2026-10-30, demande explicite : « Calendrier, information à gauche. Éléments
   visuels au centre en haut. Les différents types d'inscription en dessous. Et à droite, le
   descriptif de l'événement. Et le programme. ») — chaque colonne latérale n'apparaît que si
   elle a réellement du contenu (classes posées par JS, ipAppliquerLayout()), pour ne jamais
   laisser une colonne vide béante : fiche sans événement lié/sans contact → pas de colonne
   gauche ; fiche sans description ni programme → pas de colonne droite. */
/* width:100% explicite — bug réel trouvé à l'exécution : .ip-layout est un enfant de .page, qui
   est en display:flex (pas le flux "block" normal supposé jusqu'ici) sans align-items:stretch
   effectif à cet endroit. Un enfant flex sans largeur explicite se dimensionne à son CONTENU
   (fit-content), pas à l'espace disponible : la piste minmax(…,1fr) de la grille se résolvait
   donc systématiquement à son plancher (480px) au lieu de se partager l'espace restant, même
   quand le conteneur avait largement la place d'aller jusqu'à max-width. Avec width:100%,
   .ip-layout remplit enfin son conteneur (dans la limite de max-width) et 1fr fonctionne
   normalement — condition réelle pour que « élargis-le vers la droite » utilise de la place
   neuve au lieu de retomber sur le plancher de la colonne centrale à chaque fois. */
/* Mise en page à colonnes (infos / centre / description / programme), désormais pilotée en JS
   (ipAppliquerLayout, assets embarqués plus bas) plutôt qu'en CSS pur media-query (2026-10-30,
   demande explicite : « tu crées une colonne à droite de description pour le programme. Sans
   diminuer tout le rendu »). Avec jusqu'à 4 colonnes possibles, écrire toutes les combinaisons de
   grid-template-columns par tranche de largeur en CSS pur serait ingérable et fragile — deux bugs
   réels avaient déjà été trouvés à l'exécution sur la version 3-colonnes plus simple (débordement
   invisible sous un seuil trop bas, colonne centrale qui ne récupérait jamais l'espace libre).
   Le JS recalcule donc, à partir des colonnes RÉELLEMENT présentes : le gabarit de colonnes, le
   seuil d'activation de la grille (= largeur minimale nécessaire + 84px de marge — même marge de
   sécurité qui avait corrigé le débordement invisible) et le max-width, y compris au redimensionnement.
   display:grid / display:flex (empilé) ne dépend donc que de la classe .ip-layout--grid. */
.ip-layout.ip-layout--has-left,.ip-layout.ip-layout--has-right,.ip-layout.ip-layout--has-programme{width:100%;display:flex;flex-direction:column;}
.ip-layout.ip-layout--grid{display:grid;gap:28px;align-items:start;}
/* Empilé : types d'inscription d'abord (accès direct à l'inscription), puis descriptif, puis
   programme, puis calendrier/infos pratiques en dernier. "order" n'a d'effet que sur les enfants
   directs d'un conteneur flex/grid, d'où le display:flex ci-dessus en mode empilé. */
#ip-root{order:1;}
#ip-right{order:2;}
#ip-programme-col{order:3;}
#ip-side{order:4;}
.ip-layout--grid #ip-root,.ip-layout--grid #ip-right,.ip-layout--grid #ip-programme-col,.ip-layout--grid #ip-side{order:initial;}
.ip-wrap{padding:32px 16px 60px;}
.ip-layout--grid.ip-layout--has-left .ip-wrap,.ip-layout--grid.ip-layout--has-right .ip-wrap,.ip-layout--grid.ip-layout--has-programme .ip-wrap{padding-left:0;}
.ip-side{display:none;}
.ip-layout--has-left #ip-side,.ip-layout--has-right #ip-right,.ip-layout--has-programme #ip-programme-col{display:flex;flex-direction:column;gap:18px;padding:0 16px 28px;}
.ip-layout--grid #ip-side{padding:32px 0 20px 16px;position:sticky;top:20px;}
.ip-layout--grid #ip-right{padding:32px 16px 20px 0;position:sticky;top:20px;}
.ip-layout--grid.ip-layout--has-programme #ip-right{padding-right:0;}
.ip-layout--grid #ip-programme-col{padding:32px 16px 20px 0;position:sticky;top:20px;}
.ip-side-box{background:#fff;border:1px solid oklch(0.9 0.004 30);border-radius:14px;padding:16px;}
.ip-side-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:oklch(0.5 0.006 30);margin:0 0 12px;}
/* Cartouche bleue scintillante des comptes rendus (2026-10-30, consigne explicite, à conserver partout où
   un compte rendu est affiché) — bandeau fc-band/fc-cr du fil d'actualité, étendu en plein bord de la carte. */
.ip-side-box--cr{padding:0;overflow:hidden;}
.ip-cr-band{border-radius:13px 13px 0 0;}
.ip-side-box--cr .ip-cr-liste{padding:14px 16px 16px;}
/* Informations pratiques (2026-10-30, demande explicite) : date/heure, lieu, mode de
   participation, renseignements (coordonnées de la fiche) — dérivées de l'événement lié et de
   insc_fiches.contact_*, aucune nouvelle saisie requise côté organisateur. */
.ip-info-list{display:flex;flex-direction:column;gap:14px;}
.ip-info-item{display:flex;gap:10px;align-items:flex-start;}
.ip-info-icon{font-size:16px;line-height:1.3;flex-shrink:0;width:20px;text-align:center;}
.ip-info-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:oklch(0.5 0.006 30);margin-bottom:2px;}
.ip-info-value{font-size:13px;color:oklch(0.2 0.006 30);line-height:1.4;}
.ip-ics-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;margin-top:4px;border-radius:8px;border:1px solid oklch(0.85 0.004 30);background:#fff;color:oklch(0.3 0.006 30);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.ip-ics-btn:hover{border-color:oklch(0.32 0.09 258);color:oklch(0.32 0.09 258);}
/* Programme (2026-10-30) : insc_fiches.programme_texte, une ligne par temps fort (voir
   inscriptions-admin.html, renderProgramme()) — jamais affiché publiquement jusqu'ici. */
/* Programme en bulles heure/étape (2026-10-30, demande explicite : « tu mets les heures à gauche
   et ce qui va se passer à droite [...] dans une même bulle »), voir ipParseProgramme/ipRenderProgramme. */
.ip-programme-list{display:flex;flex-direction:column;gap:12px;}
.ip-prog-etape{display:flex;gap:12px;align-items:flex-start;background:oklch(0.97 0.004 30);border:1px solid oklch(0.91 0.004 30);border-radius:12px;padding:10px 12px;}
.ip-prog-heures{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:oklch(0.94 0.05 258);color:oklch(0.28 0.1 258);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;line-height:1.4;min-width:56px;text-align:center;}
.ip-prog-heures span+span{padding-top:3px;margin-top:3px;border-top:1px solid oklch(0.82 0.06 258);}
.ip-prog-corps{min-width:0;flex:1;}
.ip-prog-titre{font-size:13px;font-weight:700;color:oklch(0.22 0.006 30);}
.ip-prog-detail{font-size:12.5px;color:oklch(0.42 0.006 30);line-height:1.45;margin-top:2px;}
.ip-programme-fichier{display:flex;align-items:center;gap:10px;border:1px solid oklch(0.9 0.004 30);border-radius:8px;padding:8px 10px;text-decoration:none;margin-top:14px;}
.ip-right-section{margin:0 0 26px;}
.ip-right-section-titre{font-size:13px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
/* Aperçu du descriptif + "Voir plus" (2026-10-30, demande explicite : « montre deux tiers du
   descriptif et mets un bouton voir plus ») — la hauteur repliée est calculée en JS comme 2/3 de
   la hauteur réelle du texte (ipAjusterApercuDescription), pas une valeur fixe : un descriptif
   court reste court, un très long descriptif est vraiment coupé aux deux tiers. mask-image
   plutôt qu'un dégradé peint sur une couleur de fond fixe : fonctionne pareil quel que soit le
   thème (clair, sombre/Nuit dorée) sans avoir à deviner la couleur de fond exacte. Le bouton
   reste caché tant que le texte tient déjà dans l'aperçu — pas de "Voir plus" qui ne ferait rien. */
.ip-desc-wrap[data-collapsed="1"] .ip-desc,.ip-prog-wrap[data-collapsed="1"] .ip-programme-list{max-height:var(--ip-collapsed-h,210px);overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 70%,transparent 100%);}
.ip-desc-plus{display:inline-flex;align-items:center;gap:5px;margin-top:2px;background:none;border:none;padding:0;font:inherit;font-weight:700;font-size:13px;color:oklch(0.32 0.09 258);cursor:pointer;}
.ip-desc-plus:hover{text-decoration:underline;}
/* Bug réel trouvé à l'exécution (pas un artefact d'outil) : display:inline-flex posé juste
   au-dessus s'applique inconditionnellement — en CSS, une règle d'auteur l'emporte toujours sur
   la feuille de style par défaut du navigateur, quelle que soit la spécificité ; l'attribut
   hidden (qui repose sur [hidden]{display:none} dans cette feuille par défaut) se retrouvait
   donc sans effet, et "Voir plus" restait visible même sur un descriptif court qui n'en a pas
   besoin. Règle explicite, plus spécifique, pour le réaffirmer. */
.ip-desc-plus[hidden]{display:none;}
.ip-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:700;text-transform:capitalize;}
.ip-cal-nav{background:none;border:1px solid oklch(0.88 0.004 30);border-radius:6px;cursor:pointer;font-size:13px;color:oklch(0.4 0.006 30);width:24px;height:24px;line-height:1;padding:0;}
.ip-cal-nav:disabled{opacity:.35;cursor:default;}
/* minmax(0,1fr), pas juste 1fr (2026-10-11, bug réel signalé, capture à l'appui : "le calendrier
   déborde") : les jours avec événement sont des <button>, dont la largeur minimale intrinsèque
   (style natif du navigateur) ne rétrécit jamais sous "1fr" tout seul — ça forçait toute la
   colonne (et donc chaque ligne, les pistes de la grille étant partagées) à déborder de
   l'encadré par-dessus la colonne de droite. min-width:0 sur chaque cellule en renfort, pour les
   mêmes raisons. */
.ip-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center;}
.ip-cal-dow{font-size:10px;color:oklch(0.55 0.006 30);font-weight:600;padding-bottom:4px;}
.ip-cal-day{font-size:12px;padding:6px 0;border-radius:6px;color:oklch(0.35 0.006 30);position:relative;min-width:0;}
.ip-cal-day.ip-cal-vide{visibility:hidden;}
.ip-cal-day.has-event{background:oklch(0.94 0.05 258);color:oklch(0.32 0.09 258);font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.ip-cal-day.has-event:hover{background:oklch(0.88 0.07 258);}
.ip-cal-day.has-event.passe{background:oklch(0.93 0.004 30);color:oklch(0.6 0.006 30);}
.ip-cal-day.has-event.passe:hover{background:oklch(0.9 0.004 30);}
.ip-cal-day.today{box-shadow:inset 0 0 0 1.5px oklch(0.32 0.09 258 / .55);}
/* Calendrier interactif + comptes rendus + visuels de l'événement (2026-10-29, demande explicite) */
.ip-cal-day.has-event{padding:0;height:30px;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;}
.ip-cal-day.has-event:focus-visible,.ip-cal-nav:focus-visible,.ip-cal-auj:focus-visible{outline:2px solid oklch(0.32 0.09 258);outline-offset:1px;}
.ip-cal-day.courant{background:oklch(0.32 0.09 258);color:#fff;}
.ip-cal-day.courant:hover{background:oklch(0.26 0.09 258);}
.ip-cal-day.choisi{box-shadow:0 0 0 2px oklch(0.72 0.15 55);}
.ip-cal-day.a-cr::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:oklch(0.62 0.17 150);}
.ip-cal-nav{min-height:0;padding:0;}
.ip-cal-auj{min-height:0;background:none;border:1px solid oklch(0.88 0.004 30);border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;color:oklch(0.4 0.006 30);padding:3px 8px;text-transform:none;}
.ip-cal-auj:hover{border-color:oklch(0.32 0.09 258);}
.ip-cal-legende{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:10.5px;color:oklch(0.5 0.006 30);}
.ip-cal-legende i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
.ip-cal-aide{margin:10px 0 0;font-size:11.5px;color:oklch(0.55 0.006 30);}
.ip-cal-jour{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.ip-cal-jour-titre{font-size:12px;font-weight:700;text-transform:capitalize;}
.ip-jour-evt{border:1px solid oklch(0.9 0.004 30);border-radius:10px;padding:10px;background:oklch(0.985 0.004 258);}
.ip-jour-evt-titre{font-size:12.5px;font-weight:700;line-height:1.3;margin:0 0 3px;}
.ip-jour-evt-meta{font-size:11px;color:oklch(0.5 0.006 30);margin-bottom:8px;}
.ip-jour-actions{display:flex;flex-wrap:wrap;gap:6px;}
.ip-jour-btn{display:inline-block;font-size:11.5px;font-weight:700;text-decoration:none;border-radius:6px;padding:6px 10px;border:1px solid oklch(0.32 0.09 258);color:oklch(0.32 0.09 258);background:#fff;}
.ip-jour-btn.plein{background:oklch(0.32 0.09 258);color:#fff;}
.ip-jour-btn.cr{border-color:oklch(0.5 0.14 150);color:oklch(0.38 0.12 150);}
.ip-badge-courant{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:oklch(0.32 0.09 258);background:oklch(0.94 0.05 258);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;}
.ip-cr-liste{display:flex;flex-direction:column;gap:10px;}
.ip-cr-card{display:flex;gap:10px;text-decoration:none;color:inherit;border:1px solid oklch(0.92 0.004 30);border-radius:10px;padding:8px;transition:border-color .15s;}
.ip-cr-card:hover,.ip-cr-card:focus-visible{border-color:#1558C8;}
.ip-cr-card .ip-autre-img{background:#EFF4FF;}
.ip-cr-resume{font-size:11.5px;color:oklch(0.45 0.006 30);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.ip-cr-lien{font-size:11px;font-weight:700;color:#1558C8;margin-top:4px;}
.ip-visuels{margin:18px 0;}
.ip-visuels-titre{font-size:12px;font-weight:600;color:oklch(0.5 0.006 30);margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em;}
.ip-photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
.ip-photo{position:relative;padding:0;border:none;border-radius:10px;overflow:hidden;cursor:zoom-in;background:oklch(0.96 0.004 30);aspect-ratio:4/3;}
.ip-photo:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;background:oklch(0.94 0.01 258);}
.ip-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.ip-photo:not(:first-child) img{object-fit:contain;}
.ip-photo:focus-visible{outline:2px solid oklch(0.32 0.09 258);outline-offset:2px;}
.ip-photo-plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,43,78,.62);color:#fff;font-size:20px;font-weight:700;}
.ip-videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px;}
.ip-video-titre{font-size:12.5px;font-weight:600;margin:0 0 6px;}
.ip-video-cadre{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;}
.ip-video-cadre iframe,.ip-video-cadre video{position:absolute;inset:0;width:100%;height:100%;border:0;}
.ip-lightbox{position:fixed;inset:0;z-index:2000;background:rgba(5,15,30,.92);display:flex;align-items:center;justify-content:center;padding:16px;}
.ip-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
.ip-lightbox button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;}
.ip-lightbox button:hover{background:rgba(255,255,255,.28);}
.ip-lightbox .lb-x{top:14px;right:14px;}
.ip-lightbox .lb-p{left:12px;top:50%;margin-top:-22px;}
.ip-lightbox .lb-n{right:12px;top:50%;margin-top:-22px;}
.ip-lightbox .lb-c{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:12.5px;}
/* Documents & médias — photos en « vrais cadres » (2026-10-30, demande explicite : « affiche les
   photos entières. En petit, mais entière [...] de sorte à ce qu'on puisse cliquer dessus pour les
   découvrir ») — remplace l'ancienne vignette 36×36 rognée (object-fit:cover) par un cadre qui
   montre l'image ENTIÈRE (object-fit:contain, lettré sur un fond neutre plutôt que recadré), assez
   grand pour être lisible, cliquable pour ouvrir en grand dans la même visionneuse que les photos
   de l'événement (ipOuvrirPhoto, réutilisée avec IP_DOC_PHOTOS). */
.ip-docs-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:12px;}
.ip-docs-photo{display:flex;flex-direction:column;gap:6px;border:1px solid oklch(0.9 0.004 30);border-radius:10px;padding:8px;background:#fff;cursor:pointer;text-align:left;font:inherit;}
.ip-docs-photo:hover,.ip-docs-photo:focus-visible{border-color:oklch(0.32 0.09 258);}
.ip-docs-photo-frame{width:100%;aspect-ratio:1/1;border-radius:6px;background:oklch(0.96 0.004 30);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ip-docs-photo-frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.ip-docs-photo-label{font-size:11.5px;color:oklch(0.4 0.006 30);line-height:1.3;}
.ip-autres-list{display:flex;flex-direction:column;gap:10px;}
.ip-autre-card{display:flex;gap:10px;text-decoration:none;color:inherit;border:1px solid oklch(0.92 0.004 30);border-radius:10px;padding:8px;transition:border-color .15s;scroll-margin-top:20px;}
.ip-autre-card:hover,.ip-autre-card.ip-autre-surlignee{border-color:oklch(0.32 0.09 258);}
.ip-autre-img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:oklch(0.94 0.01 258);}
.ip-autre-titre{font-size:12.5px;font-weight:700;line-height:1.3;margin:0 0 3px;}
.ip-autre-meta{font-size:11px;color:oklch(0.55 0.006 30);}

<script>
const IP_TYPE_ICONS = {texte_court:'text',texte_long:'textarea',nombre:'number',email:'email',telephone:'tel',date:'date',heure:'time',adresse:'text',url:'url'};
let IP_FICHE=null, IP_TYPES=[], IP_EVENEMENTS=[], IP_TYPE_ACTIF=null, IP_APERCU=false, IP_MEDIAS=[], IP_CANDIDATURE=null, IP_PARRAINAGE=null;
let IP_DOC_PHOTOS = [];
/* Documents & médias (2026-10-30, demande explicite : « créer deux véritables cadres [...] affiche
   les photos entières. En petit, mais entière [...] de sorte à ce qu'on puisse cliquer dessus pour
   les découvrir. Pas juste en zoomant. [...] éventuellement la vidéo [...] même principe que les
   Reels : si on met la souris dessus, tu enclenches la lecture ») — les photos de cette section
   avaient jusqu'ici une vignette 36×36 rognée (object-fit:cover), remplacée par de vrais cadres
   (object-fit:contain, rien n'est coupé) cliquables vers la visionneuse plein écran déjà utilisée
   pour les photos de l'événement (ipOuvrirPhoto, ici avec sa propre liste IP_DOC_PHOTOS pour ne
   jamais mélanger les deux galeries — une photo de cette section n'est jamais dans celle de
   l'événement, voir ipRenderVisuels()). Les vidéos restent lues au clic (controls, comme avant)
   mais démarrent aussi dès le survol, en muet (lecture non muette bloquée par les navigateurs sans
   geste de l'utilisateur), et se remettent en pause au départ de la souris — aperçu, pas lecture
   complète automatique. */
function ipRenderMedias() {
  if (!IP_MEDIAS.length) return '';
  const videos = IP_MEDIAS.filter(m => m.type === 'video');
  const photos = IP_MEDIAS.filter(m => m.type === 'photo');
  const autres = IP_MEDIAS.filter(m => m.type !== 'video' && m.type !== 'photo');
  IP_DOC_PHOTOS = photos;
  return `
    <div style="margin:22px 0; padding-top:18px; border-top:1px solid oklch(0.92 0.004 30);">
      <div style="font-size:12px; font-weight:600; color:oklch(0.5 0.006 30); margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em;">Documents &amp; médias</div>
      ${videos.map(m => `
        <div style="margin-bottom:10px;">
          ${m.libelle ? `<div style="font-size:12.5px; font-weight:600; margin-bottom:6px;">${escH(m.libelle)}</div>` : ''}
          <video src="${escH(m.url)}" controls muted preload="metadata" playsinline style="width:100%; border-radius:10px; background:#000; display:block;" onmouseenter="this.play().catch(()=>{})" onmouseleave="this.pause();this.currentTime=0;"></video>
        </div>`).join('')}
      ${photos.length ? `<div class="ip-docs-photos">
        ${photos.map((m, i) => `
          <button type="button" class="ip-docs-photo" onclick="ipOuvrirPhoto(${i}, IP_DOC_PHOTOS)" aria-label="Agrandir ${ipAttr(m.libelle || 'la photo')}">
            <span class="ip-docs-photo-frame"><img src="${ipAttr(m.url)}" alt="${ipAttr(m.libelle || 'Photo')}" loading="lazy"></span>
            ${m.libelle ? `<span class="ip-docs-photo-label">${escH(m.libelle)}</span>` : ''}
          </button>`).join('')}
      </div>` : ''}
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${autres.map(m => `
          <a href="${escH(m.url)}" target="_blank" rel="noopener" style="display:flex; align-items:center; gap:10px; border:1px solid oklch(0.9 0.004 30); border-radius:8px; padding:8px 10px; text-decoration:none;">
            <div style="width:36px;height:36px;border-radius:6px;background:oklch(0.94 0.05 20);color:oklch(0.42 0.16 20);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">📄</div>
            <span style="font-size:13px; color:oklch(0.2 0.006 30);">${escH(m.libelle || 'Document PDF')}</span>
          </a>`).join('')}
      </div>
    </div>`;
}
const IP_BANDEAU_APERCU = `<div style="background:oklch(0.95 0.04 85); border:1px solid oklch(0.8 0.08 85); color:oklch(0.4 0.13 85); font-size:12.5px; font-weight:600; text-align:center; padding:9px 12px; border-radius:8px; margin-bottom:16px;">🔍 Aperçu en temps réel — cette fiche est encore en brouillon, seul le propriétaire peut voir cette page. Elle se met à jour à chaque modification.</div>`;

function ipConditionRemplie(cond, reponses) {
  if (!cond) return true;
  const v = reponses[cond.champ_source];
  if (cond.operateur === 'different') return String(v ?? '') !== String(cond.valeur ?? '');
  if (cond.operateur === 'coche') return v === true || v === 'oui' || v === 'true';
  return String(v ?? '') === String(cond.valeur ?? '');
}

/* Promotion programmée par option (2026-09-27, demande explicite) : même sémantique que
   prixEffectifOption() côté serveur (server/index.js) — purement informatif ici, le montant
   réellement facturé est toujours recalculé côté serveur (jamais confiance au client). */
function ipEstEnPromo(o) { return o.promo_prix != null && o.promo_prix !== ''; }
function ipPrixEffectif(o) {
  const prix = Number(o.prix) || 0;
  if (!ipEstEnPromo(o)) return prix;
  const now = new Date().toISOString();
  const debutOk = !o.promo_date_debut || o.promo_date_debut <= now;
  const finOk = !o.promo_date_fin || o.promo_date_fin >= now;
  return (debutOk && finOk) ? (Number(o.promo_prix) || prix) : prix;
}
function ipPrixLabelHtml(o) {
  const prix = Number(o.prix) || 0;
  if (!ipEstEnPromo(o)) return `${prix.toFixed(2)} €`;
  const now = new Date().toISOString();
  const promoPrix = Number(o.promo_prix) || prix;
  const debutOk = !o.promo_date_debut || o.promo_date_debut <= now;
  const finOk = !o.promo_date_fin || o.promo_date_fin >= now;
  if (debutOk && finOk) {
    return `<span style="text-decoration:line-through;opacity:.55;font-weight:400;">${prix.toFixed(2)} €</span> <span style="color:#DC2626;">${promoPrix.toFixed(2)} €</span>`;
  }
  if (o.promo_date_debut && o.promo_date_debut > now) {
    const d = new Date(o.promo_date_debut).toLocaleDateString('fr-FR');
    return `${prix.toFixed(2)} € <span style="display:block;font-size:10.5px;font-weight:600;color:#DC2626;">À partir du ${d} : ${promoPrix.toFixed(2)} €</span>`;
  }
  return `${prix.toFixed(2)} €`;
}

function ipChampHtml(c) {
  const req = c.obligatoire ? '<span class="ip-oblig">*</span>' : '';
  const aide = c.description_aide ? `<div class="aide">${escH(c.description_aide)}</div>` : '';
  let options = []; try { options = JSON.parse(c.options_json || '[]'); } catch(e) {}
  let champHtml = '';
  if (c.type_champ === 'texte_long') champHtml = `<textarea name="${escH(c.nom)}" placeholder="${escH(c.placeholder||'')}">${escH(c.valeur_defaut||'')}</textarea>`;
  else if (c.type_champ === 'liste_deroulante' || c.type_champ === 'choix_unique') {
    champHtml = `<select name="${escH(c.nom)}"><option value="">-- Choisir --</option>${options.map(o=>`<option value="${escH(o)}">${escH(o)}</option>`).join('')}</select>`;
  } else if (c.type_champ === 'choix_multiple') {
    champHtml = options.map(o=>`<label style="display:block;font-weight:400;font-size:13px;margin:4px 0;"><input type="checkbox" name="${escH(c.nom)}[]" value="${escH(o)}"> ${escH(o)}</label>`).join('');
  } else if (c.type_champ === 'options_payantes') {
    /* Catalogue libre d'extras payants (2026-09-25, demande explicite) — même mécanique de
       collecte que choix_multiple (checkboxes name="${nom}[]"), déjà gérée génériquement par
       ipSoumettre() plus bas : aucun changement nécessaire à la collecte. Le prix affiché ici
       est purement informatif (data-prix, lu par ipRecalculerTotal pour le bouton) — le montant
       réellement facturé est toujours recalculé côté serveur depuis le catalogue (jamais confiance
       au client), voir calculerMontantOptionsPayantes(). */
    champHtml = `<div style="display:flex;flex-direction:column;gap:8px;">${options.map(o => `
      <label style="display:flex;align-items:center;gap:10px;border:1px solid oklch(0.9 0.004 30);border-radius:8px;padding:8px 10px;font-weight:400;cursor:pointer;">
        <input type="checkbox" name="${escH(c.nom)}[]" value="${escH(o.libelle)}" data-prix="${ipPrixEffectif(o)}" style="width:16px;height:16px;flex-shrink:0;">
        ${o.photo_url ? `<img src="${escH(o.photo_url)}" style="width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;">` : ''}
        <span style="flex:1;font-size:13px;">${escH(o.libelle)}</span>
        <span style="font-size:13px;font-weight:700;color:oklch(0.32 0.09 258);">${ipPrixLabelHtml(o)}</span>
      </label>`).join('') || '<div style="font-size:12.5px;color:oklch(0.55 0.006 30);">Aucune option disponible.</div>'}</div>`;
  } else if (c.type_champ === 'liens_utiles') {
    /* Liste de liens fournie par l'organisateur (2026-09-28, demande explicite) — purement
       informative : volontairement AUCUN attribut `name`, donc ignorée par la collecte
       générique de ipSoumettre() (form.querySelectorAll('[name]')) — rien à soumettre pour ce
       champ, jamais une réponse du participant. Voir aussi l'exemption explicite côté serveur
       (POST /api/insc/public/:slug/inscriptions) qui traite ce type comme jamais "obligatoire",
       quelle que soit la valeur de c.obligatoire. */
    /* Liens de parrainage (2026-10-30, demande explicite : « encadre-le et marque bien lien de
       parrainage pour ne pas qu'on confonde ces liens avec une inscription »). Le serveur marque
       o.parrainage ('verifie' = code d'invitation existant ET actif, 'inactif' = code connu mais
       désactivé) sur les liens /join/CODE de notre domaine — voir marquerLiensParrainage(). Ces
       liens sont regroupés dans un cadre titré, à part des liens ordinaires ; les liens ordinaires
       ne changent pas. */
    const lienHtml = o => `
      <a href="${escH(o.url)}" target="_blank" rel="noopener" class="ip-lu-lien" style="display:flex;align-items:center;gap:10px;border:1px solid oklch(0.9 0.004 30);border-radius:8px;padding:8px 10px;text-decoration:none;color:inherit;">
        ${o.photo_url ? `<img src="${escH(o.photo_url)}" style="width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;">` : ''}
        <span style="flex:1;font-size:13px;font-weight:600;">${escH(o.titre)}</span>
        <span style="font-size:12px;font-weight:600;color:#1565C0;white-space:nowrap;">Ouvrir ↗</span>
      </a>`;
    const parr = options.filter(o => o && o.parrainage);
    const autresLiens = options.filter(o => o && !o.parrainage);
    const cadreParr = parr.length ? `
      <div class="ip-lp-cadre">
        <div class="ip-lp-tete"><span class="ip-lp-titre">🔗 ${parr.length > 1 ? 'Liens de parrainage' : 'Lien de parrainage'}</span>${parr.every(o => o.parrainage === 'verifie') ? '<span class="ip-lp-ok">✓ vérifié</span>' : ''}</div>
        <div class="ip-lp-note">Pour inviter des personnes à rejoindre Diaspo'Actif — ${parr.length > 1 ? 'ce ne sont pas des inscriptions' : "ce n'est pas une inscription"} à cet événement.</div>
        <div style="display:flex;flex-direction:column;gap:8px;">${parr.map(o => lienHtml(o).replace('</a>', o.parrainage === 'inactif' ? '<span class="ip-lp-inactif">inactif</span></a>' : '</a>')).join('')}</div>
      </div>` : '';
    champHtml = `<div style="display:flex;flex-direction:column;gap:8px;">${cadreParr}${autresLiens.map(lienHtml).join('') || (parr.length ? '' : '<div style="font-size:12.5px;color:oklch(0.55 0.006 30);">Aucun lien disponible.</div>')}</div>`;
  } else if (c.type_champ === 'oui_non') {
    champHtml = `<select name="${escH(c.nom)}"><option value="">-- Choisir --</option><option value="oui">Oui</option><option value="non">Non</option></select>`;
  } else if (c.type_champ === 'case_a_cocher') {
    champHtml = `<label style="font-weight:400;"><input type="checkbox" name="${escH(c.nom)}" value="oui"> ${escH(c.placeholder||'')}</label>`;
  } else if (c.type_champ === 'upload_photo' || c.type_champ === 'upload_fichier') {
    champHtml = `<input type="file" name="${escH(c.nom)}" accept="${c.type_champ==='upload_photo'?'image/*':'*'}" onchange="ipUploadChamp(this,'${escH(c.nom)}')"><div id="ip-upload-${escH(c.nom)}" style="font-size:12px;color:oklch(0.55 0.006 30);margin-top:4px;"></div>`;
  } else if (['upload_documents_titres','upload_images_titrees','upload_videos_titrees'].includes(c.type_champ)) {
    return ipRepeatableChampHtml(c, req, aide);
  } else {
    const type = IP_TYPE_ICONS[c.type_champ] || 'text';
    champHtml = `<input type="${type}" name="${escH(c.nom)}" placeholder="${escH(c.placeholder||'')}" value="${escH(c.valeur_defaut||'')}">`;
  }
  // Image de question (2026-09-25, demande explicite : champ "Sondage") — utilisable sur
  // n'importe quel type_champ, affichée au-dessus du libellé, jamais confondue avec les photos
  // par option (options_payantes, ci-dessus) qui sont propres à chaque choix coché.
  const image = c.image_url ? `<img src="${escH(c.image_url)}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:block;">` : '';
  return `<div class="ip-champ" data-champ="${escH(c.nom)}" data-condition='${c.condition_json?escH(c.condition_json):''}'>
    ${image}<label>${escH(c.libelle)} ${req}</label>${champHtml}${aide}
  </div>`;
}

/* ── Champs répétables titrés (2026-09-23, demande explicite : "candidature à un trophée") ──
   Documents (PDF) et Images uploadent via /api/insc/public/upload (déjà limité à image/PDF côté
   serveur) ; les Vidéos prennent un LIEN (YouTube/Vimeo/Drive…) plutôt qu'un envoi de fichier —
   même convention que video1_url ailleurs sur la plateforme, cette route d'upload ne sachant de
   toute façon traiter que de l'image ou du PDF. Réponse finale = liste de {titre, url}, jamais
   un fichier seul, injectée dans `reponses` à la soumission (voir ipSoumettre ci-dessous). */
window.ipRepeatableValues = {};
const IP_REPEATABLE_CONFIG = {
  upload_documents_titres: { kind: 'file', accept: 'application/pdf', icon: '📄', ajouterLabel: 'Ajouter un document', placeholderTitre: 'Ex : Dossier de candidature' },
  upload_images_titrees:   { kind: 'file', accept: 'image/*',         icon: '🖼️', ajouterLabel: 'Ajouter une image',   placeholderTitre: 'Ex : Photo du projet' },
  upload_videos_titrees:   { kind: 'url',  accept: null,              icon: '🎬', ajouterLabel: 'Ajouter une vidéo',   placeholderTitre: 'Ex : Présentation du projet' },
};
function ipRepeatableChampHtml(c, req, aide) {
  const cfg = IP_REPEATABLE_CONFIG[c.type_champ];
  if (!window.ipRepeatableValues[c.nom]) window.ipRepeatableValues[c.nom] = [];
  return `<div class="ip-champ" data-champ="${escH(c.nom)}" data-condition='${c.condition_json?escH(c.condition_json):''}'>
    <label>${escH(c.libelle)} ${req}</label>${aide}
    <div id="ip-repeat-${escH(c.nom)}" style="display:flex;flex-direction:column;gap:8px;margin-top:6px;"></div>
    <button type="button" class="ip-btn outline" style="margin-top:8px;font-size:12.5px;" onclick="ipRepeatableAjouter('${escH(c.nom)}')">${cfg.icon} + ${cfg.ajouterLabel}</button>
  </div>`;
}
function ipRepeatableAjouter(nom) {
  window.ipRepeatableValues[nom].push({ titre: '', url: '' });
  ipRepeatableRender(nom);
}
function ipRepeatableSupprimer(nom, idx) {
  window.ipRepeatableValues[nom].splice(idx, 1);
  ipRepeatableRender(nom);
}
function ipRepeatableRender(nom) {
  const c = (IP_TYPE_ACTIF?.champs || []).find(x => x.nom === nom);
  const cfg = IP_REPEATABLE_CONFIG[c?.type_champ];
  const zone = document.getElementById('ip-repeat-' + nom);
  if (!zone || !cfg) return;
  const entries = window.ipRepeatableValues[nom] || [];
  zone.innerHTML = entries.map((e, i) => `
    <div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;background:oklch(0.98 0.002 30);border:1px solid oklch(0.9 0.004 30);border-radius:8px;padding:8px;">
      <span style="flex:1;min-width:140px;">
        <input type="text" placeholder="${escH(cfg.placeholderTitre)}" value="${escH(e.titre)}" style="width:100%;height:38px;box-sizing:border-box;" oninput="window.ipRepeatableValues['${escH(nom)}'][${i}].titre=this.value">
        <span style="display:block;font-size:11px;color:oklch(0.5 0.16 20);margin-top:2px;">Titre obligatoire pour cette entrée</span>
      </span>
      ${cfg.kind === 'url'
        ? `<input type="url" placeholder="https://…" value="${escH(e.url)}" style="flex:1;min-width:160px;height:38px;" oninput="window.ipRepeatableValues['${escH(nom)}'][${i}].url=this.value">`
        : `<span style="flex:1;min-width:160px;">
             <input type="file" accept="${cfg.accept}" onchange="ipRepeatableUpload(this,'${escH(nom)}',${i})">
             <span id="ip-repeat-status-${escH(nom)}-${i}" style="display:block;font-size:11.5px;color:oklch(0.55 0.006 30);margin-top:2px;">${e.url ? '✅ Fichier envoyé' : ''}</span>
           </span>`}
      <button type="button" onclick="ipRepeatableSupprimer('${escH(nom)}',${i})" style="background:none;border:none;color:oklch(0.5 0.16 20);font-size:18px;cursor:pointer;padding:4px 8px;">×</button>
    </div>`).join('') || `<div style="font-size:12px;color:oklch(0.6 0.006 30);">Aucune entrée pour l'instant.</div>`;
}
async function ipRepeatableUpload(input, nom, idx) {
  const file = input.files[0]; if (!file) return;
  const statusEl = document.getElementById(`ip-repeat-status-${nom}-${idx}`);
  if (statusEl) statusEl.textContent = '⏳ Envoi…';
  // Marqueur "en cours d'envoi" (2026-09-24) — même bug déjà rencontré et corrigé sur le
  // sélecteur de photo de couverture des invitations (parrainage.html) : sans lui, cliquer sur
  // "Confirmer mon inscription" pendant l'envoi soumettait une entrée avec un titre mais sans
  // URL (le fichier n'avait pas encore fini d'être envoyé), rejetée comme "incomplète" — lu et
  // bloqué explicitement par ipSoumettre() ci-dessous.
  const entree = window.ipRepeatableValues[nom]?.[idx];
  if (entree) entree.uploading = true;
  try {
    const fd = new FormData(); fd.append('fichier', file);
    const res = await fetch('/api/insc/public/upload', { method: 'POST', body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Erreur');
    window.ipRepeatableValues[nom][idx].url = d.url;
    if (statusEl) statusEl.textContent = '✅ ' + file.name;
  } catch (e) { if (statusEl) statusEl.textContent = '❌ ' + e.message; }
  finally { if (entree) entree.uploading = false; }
}

window.ipUploadValues = {};
async function ipUploadChamp(input, nom) {
  const file = input.files[0]; if (!file) return;
  const statusEl = document.getElementById('ip-upload-' + nom);
  statusEl.textContent = '⏳ Envoi…';
  try {
    const fd = new FormData(); fd.append('fichier', file);
    const res = await fetch('/api/insc/public/upload', { method: 'POST', body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Erreur');
    window.ipUploadValues[nom] = d.url;
    statusEl.textContent = '✅ ' + file.name;
  } catch (e) { statusEl.textContent = '❌ ' + e.message; }
}

function ipReevaluerConditions() {
  const reponses = {};
  document.querySelectorAll('#ip-form-champs [name]').forEach(el => {
    if (el.type === 'checkbox') { if (el.checked) reponses[el.name] = el.value || true; }
    else reponses[el.name] = el.value;
  });
  document.querySelectorAll('#ip-form-champs .ip-champ[data-condition]').forEach(div => {
    const cond = div.dataset.condition ? JSON.parse(div.dataset.condition) : null;
    div.style.display = ipConditionRemplie(cond, reponses) ? '' : 'none';
  });
  ipRecalculerTotal();
}
/* Total affiché purement informatif — bascule le libellé du bouton de "Confirmer mon
   inscription" à "💳 Payer X € et confirmer" dès qu'une option payante est cochée, même sur un
   type par ailleurs gratuit (2026-09-25, demande explicite). Le vrai montant facturé n'est
   jamais lu ici : il est recalculé côté serveur au même instant, voir
   calculerMontantOptionsPayantes() dans server/index.js. */
function ipRecalculerTotal() {
  if (!IP_TYPE_ACTIF) return;
  let total = IP_TYPE_ACTIF.gratuit ? 0 : (Number(IP_TYPE_ACTIF.prix) || 0);
  document.querySelectorAll('#ip-form-champs input[type=checkbox][data-prix]:checked').forEach(el => {
    const div = el.closest('.ip-champ');
    if (div && div.style.display === 'none') return;
    total += Number(el.dataset.prix) || 0;
  });
  const btn = document.querySelector('#ip-form-champs button[type=submit]');
  if (btn && !btn.disabled) btn.textContent = total > 0 ? `💳 Payer ${total.toFixed(2)} € et confirmer` : 'Confirmer mon inscription';
  /* Le brouillon n'a de sens que s'il y a quelque chose à payer. */
  const zoneBrouillon = document.getElementById('ip-zone-brouillon');
  if (zoneBrouillon) zoneBrouillon.style.display = total > 0 ? '' : 'none';
}

function ipOuvrirType(typeId) {
  /* Number() des deux côtés (2026-09-27, bug réel signalé : "on ne peut pas s'inscrire") —
     insc_types.id revient de PostgreSQL sous forme de texte ("11"), alors que le onclick
     généré plus bas (onclick="ipOuvrirType(${t.id})") l'interpole en littéral NUMÉRIQUE dans
     le HTML : la comparaison stricte "11" === 11 échouait toujours, silencieusement (aucune
     erreur, le bouton "S'inscrire" ne faisait juste rien) — même famille de bug que
     users.id/BIGSERIAL déjà rencontrée ailleurs sur cette plateforme. */
  const type = IP_TYPES.find(t => Number(t.id) === Number(typeId));
  if (!type || type.complet || type.periode_ouverte === false) return;
  IP_TYPE_ACTIF = type;
  /* Doublon E-mail/Téléphone (2026-10-11, demande explicite, capture à l'appui) : certains
     organisateurs ajoutent leur propre champ personnalisé "Adresse e-mail"/"Numéro de téléphone"
     (type_champ email/telephone) en plus des deux champs génériques toujours affichés — la
     personne voit alors deux fois la même question. Quand un tel champ personnalisé existe pour
     ce type, le générique correspondant est masqué et c'est la réponse au champ personnalisé qui
     alimente email/téléphone à la soumission (voir ipSoumettre) : zéro perte de billet/e-mail de
     confirmation, juste une question en moins à l'écran. */
  const ipChampEmailPerso = type.champs.find(c => c.type_champ === 'email');
  const ipChampTelPerso = type.champs.find(c => c.type_champ === 'telephone');
  window.ipUploadValues = {};
  window.ipRepeatableValues = {};
  const evtChoix = IP_EVENEMENTS.length > 1 ? `
    <div class="ip-champ">
      <label>À quel événement souhaitez-vous participer ? <span class="ip-oblig">*</span></label>
      <select name="__evenement_id" required>
        <option value="">-- Choisir --</option>
        ${IP_EVENEMENTS.map(e => `<option value="${e.id}">${escH(e.titre)}${e.date_evt?' — '+escH(e.date_evt):''}</option>`).join('')}
      </select>
    </div>` : '';
  document.getElementById('ip-root').innerHTML = `
    ${IP_APERCU ? IP_BANDEAU_APERCU : ''}
    <button class="ip-btn outline" style="margin-bottom:18px;" onclick="ipRenderAccueil()">← Retour</button>
    <h2 style="font-size:18px;font-weight:700;margin:0 0 4px;">${escH(type.label)}</h2>
    <div style="font-size:12.5px;color:oklch(0.5 0.006 30);margin-bottom:20px;">${type.gratuit ? 'Gratuit' : (type.prix != null ? type.prix.toFixed(2) + ' €' : '')}</div>
    ${type.description ? `<p style="color:oklch(0.5 0.006 30);font-size:13px;margin-bottom:20px;">${escH(type.description)}</p>` : ''}
    <form id="ip-form-champs" onsubmit="return ipSoumettre(event)">
      ${evtChoix}
      <div class="ip-champ"><label>Nom <span class="ip-oblig">*</span></label><input type="text" name="__nom" required></div>
      <div class="ip-champ"><label>Prénom <span class="ip-oblig">*</span></label><input type="text" name="__prenom" required></div>
      ${ipChampEmailPerso ? '' : `<div class="ip-champ"><label>E-mail</label><input type="email" name="__email"></div>`}
      ${ipChampTelPerso ? '' : `<div class="ip-champ"><label>Téléphone</label><input type="tel" name="__telephone"></div>`}
      ${type.champs.map(ipChampHtml).join('')}
      <div id="ip-erreur" style="color:oklch(0.5 0.16 20);font-size:13px;margin-bottom:12px;display:none;"></div>
      ${IP_APERCU
        ? `<div style="background:oklch(0.95 0.04 85); border:1px solid oklch(0.8 0.08 85); color:oklch(0.4 0.13 85); font-size:12.5px; padding:10px 12px; border-radius:8px;">🔍 Fiche non publiée — ce bouton s'activera une fois la fiche publiée.</div>`
        : `<button type="submit" class="ip-btn" style="width:100%;height:46px;font-size:14.5px;">${type.gratuit ? 'Confirmer mon inscription' : '💳 Payer ' + (type.prix != null ? type.prix.toFixed(2) + ' €' : '') + ' et confirmer'}</button>
           <div id="ip-zone-brouillon" style="margin-top:10px;${type.gratuit ? 'display:none;' : ''}">
             <button type="submit" data-brouillon="1" class="ip-btn outline" style="width:100%;height:42px;font-size:13px;">📝 Garder en brouillon (payer plus tard)</button>
             <p style="font-size:11.5px;color:oklch(0.5 0.006 30);margin:8px 0 0;text-align:center;">Une inscription non payée est conservée 24 h, puis supprimée — sauf si vous la gardez en brouillon.</p>
           </div>`}
    </form>`;
  document.getElementById('ip-form-champs').addEventListener('input', ipReevaluerConditions);
  document.getElementById('ip-form-champs').addEventListener('change', ipReevaluerConditions);
  ipReevaluerConditions();
  type.champs.filter(c => IP_REPEATABLE_CONFIG[c.type_champ]).forEach(c => ipRepeatableRender(c.nom));
}

async function ipSoumettre(ev) {
  ev.preventDefault();
  const form = ev.target;
  const errEl = document.getElementById('ip-erreur');
  errEl.style.display = 'none';
  const reponses = {};
  let evenementId = null, nom, prenom, email, telephone;
  form.querySelectorAll('[name]').forEach(el => {
    if (el.name === '__evenement_id') { evenementId = el.value; return; }
    if (el.name === '__nom') { nom = el.value; return; }
    if (el.name === '__prenom') { prenom = el.value; return; }
    if (el.name === '__email') { email = el.value; return; }
    if (el.name === '__telephone') { telephone = el.value; return; }
    const div = el.closest('.ip-champ');
    if (div && div.style.display === 'none') return; // champ masqué par condition, non soumis
    const baseName = el.name.replace(/\[\]$/, '');
    if (el.type === 'checkbox') {
      if (el.name.endsWith('[]')) { if (el.checked) { reponses[baseName] = reponses[baseName] || []; reponses[baseName].push(el.value); } }
      else reponses[baseName] = el.checked ? 'oui' : '';
    } else if (window.ipUploadValues[baseName]) {
      reponses[baseName] = window.ipUploadValues[baseName];
    } else reponses[baseName] = el.value;
  });
  // Champs répétables titrés (Documents/Images/Vidéos) — pas de [name] dans le DOM, exclus de
  // la boucle ci-dessus par construction. Bug réel signalé (2026-09-24) : une entrée avec un
  // fichier envoyé mais sans titre (ou l'inverse) disparaissait auparavant en silence — jamais
  // enregistrée ni ct client ni côté serveur (POST /api/insc/public/:slug/inscriptions filtre
  // pareil, en dernier rempart) — donnant l'impression qu'"aucun titre n'était jamais demandé"
  // alors que la personne avait bien envoyé un document. Bloque désormais la soumission avec un
  // message clair au lieu de perdre la donnée sans un mot. Une ligne jamais touchée après un
  // "+ Ajouter" (titre ET fichier vides) reste silencieusement ignorée — cas normal.
  let repetableProbleme = null;
  for (const [nom, entries] of Object.entries(window.ipRepeatableValues || {})) {
    const div = document.querySelector(`.ip-champ[data-champ="${CSS.escape(nom)}"]`);
    if (div && div.style.display === 'none') continue; // masqué par condition, non soumis
    const libelle = div?.querySelector('label')?.textContent?.replace('*', '').trim() || 'un champ';
    const complets = [];
    for (const e of (entries || [])) {
      if (e.uploading) { repetableProbleme = `« ${libelle} » : l'envoi d'un fichier est encore en cours, patientez quelques secondes.`; break; }
      const titre = (e.titre || '').trim(), url = (e.url || '').trim();
      if (!titre && !url) continue;
      if (!titre || !url) { repetableProbleme = `« ${libelle} » : donnez un titre à chaque document/lien ajouté (ou retirez la ligne incomplète avec ×).`; break; }
      complets.push({ titre, url });
    }
    if (repetableProbleme) break;
    reponses[nom] = complets;
  }
  if (repetableProbleme) { errEl.textContent = repetableProbleme; errEl.style.display = 'block'; return false; }
  // Champ E-mail/Téléphone générique masqué (voir ipOuvrirType) : la réponse au champ
  // personnalisé équivalent sert alors d'e-mail/téléphone pour la confirmation et le billet.
  if (!email) { const c = IP_TYPE_ACTIF.champs.find(c => c.type_champ === 'email'); if (c) email = reponses[c.nom]; }
  if (!telephone) { const c = IP_TYPE_ACTIF.champs.find(c => c.type_champ === 'telephone'); if (c) telephone = reponses[c.nom]; }
  /* « Garder en brouillon » = second bouton d'envoi du formulaire (data-brouillon) : mêmes champs,
     mêmes contrôles, mais aucun paiement (2026-10-29). */
  const brouillon = !!(ev.submitter && ev.submitter.dataset && ev.submitter.dataset.brouillon === '1');
  if (brouillon && !email) { errEl.textContent = 'Indiquez votre adresse e-mail pour pouvoir retrouver votre brouillon.'; errEl.style.display = 'block'; return false; }
  const btn = brouillon ? ev.submitter : form.querySelector('button[type=submit]');
  const libelleBtn = btn.textContent;
  form.querySelectorAll('button[type=submit]').forEach(b => { b.disabled = true; });
  btn.textContent = 'Envoi…';
  try {
    const payload = { type_id: IP_TYPE_ACTIF.id, evenement_id: evenementId || null, nom, prenom, email: email || null, telephone: telephone || null, reponses, ...(brouillon ? { brouillon: true } : {}) };
    const r = await fetch(`/api/insc/public/${IP_SLUG}/inscriptions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (!r.ok) { const err = new Error(d.error || 'Erreur'); err.reprise = !!d.reprise_possible; throw err; }
    if (d.checkout_url) { window.location.href = d.checkout_url; return; }
    ipRenderConfirmation(d);
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
    /* Inscription déjà commencée mais jamais payée : on propose de la retrouver et de continuer. */
    if (e.reprise) ipAjouterBoutonReprise(errEl, { email: email || '', type_id: IP_TYPE_ACTIF.id });
    form.querySelectorAll('button[type=submit]').forEach(b => { b.disabled = false; });
    btn.textContent = libelleBtn; ipRecalculerTotal();
  }
}

/* ── Colonne "Autres événements du même organisateur" + calendrier (2026-09-27, demande
   explicite : "présente à droite les événements du même compte... tu mets même à disposition
   un calendrier créé automatiquement par les dates de ces événements") — persiste à l'identique
   quel que soit l'écran affiché dans #ip-root (accueil, formulaire, confirmation, fermée…),
   rendue une seule fois après le chargement initial plutôt que recalculée à chaque changement
   d'écran. N'apparaît que si l'organisateur a d'autres événements à venir : jamais de colonne
   vide. */
let IP_AUTRES_EVENEMENTS = [];
let IP_COMPTES_RENDUS = [];
let IP_CAL_MOIS = null; // { y, m } — mois actuellement affiché dans le mini-calendrier
let IP_CAL_JOUR = null; // 'AAAA-MM-JJ' — jour choisi par le visiteur (panneau sous le calendrier)
const IP_CAL_MOIS_NOMS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const IP_CAL_JOURS = ['L','M','M','J','V','S','D'];

/* Échappement strict pour les attributs HTML (escH ne protège pas les guillemets). */
function ipAttr(s) { return escH(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
/* Date du jour en heure LOCALE (toISOString donnait la date UTC : un événement du soir pouvait basculer en "passé"). */
function ipAujourdhui() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function ipAutreEvtUrl(e) {
  return e.fiche_slug ? `inscription-publique.html?slug=${encodeURIComponent(e.fiche_slug)}` : `evenements.html#evt-${e.id}`;
}
function ipAutreEvtDateLabel(e) {
  if (!e.date_evt) return '';
  const dt = new Date(String(e.date_evt).slice(0,10) + 'T00:00:00');
  if (isNaN(dt)) return e.date_evt;
  return dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + (e.heure_debut ? ' · ' + String(e.heure_debut).slice(0,5) : '');
}
/* Événements déjà passés (2026-09-28, demande explicite) — le serveur inclut aussi les
   événements des 90 derniers jours ; c'est ici, côté affichage, qu'on distingue passé/à venir. */
function ipEstEvenementPasse(e) {
  if (!e.date_evt) return false;
  return String(e.date_fin || e.date_evt).slice(0,10) < ipAujourdhui();
}
/* Tous les événements connus de la page, ramenés à une même forme : celui de CETTE fiche (courant),
   les autres événements du même compte, et — pour que le calendrier remonte plus loin que 90 jours —
   les événements dont un compte rendu est publié. Dédoublonnés par identifiant. */
function ipEvenementsAgenda() {
  const vus = new Set(), liste = [];
  const ajouter = (e, courant) => {
    if (!e || !e.date_evt || vus.has(Number(e.id))) return;
    vus.add(Number(e.id));

  const aujIdx = moisIdx(todayStr);
  const premierMoisIdx = dates.length ? Math.min(moisIdx(dates[0]), aujIdx) : null;
  const dernierMoisIdx = dates.length ? Math.max(moisIdx(dates[dates.length-1]), aujIdx) : null;
  const moisCourantIdx = y*12+m;
  const aCourant = Object.values(map).some(l => l.some(e => e.courant));

      <span>${IP_CAL_MOIS_NOMS[m]} ${y}</span>
      <button type="button" class="ip-cal-nav" onclick="ipCalMoisSuivant()" ${dernierMoisIdx!=null && moisCourantIdx>=dernierMoisIdx?'disabled':''} aria-label="Mois suivant">›</button>

      <span><i style="background:oklch(0.88 0.07 258)"></i>Autres événements</span>
      ${aCr ? `<span><i style="background:oklch(0.62 0.17 150);border-radius:50%"></i>Compte rendu</span>` : ''}

/* Classes + gabarit de grille posés une fois le contenu réel connu (jamais à l'avance) : chaque

const IP_COL = { left: 280, right: 420, prog: 360, gap: 28, centreMin: 480 };

function ipAppliquerLayout() {
  const layout = document.getElementById('ip-layout');
  const side = document.getElementById('ip-side');
  const right = document.getElementById('ip-right');
  const prog = document.getElementById('ip-programme-col');
  if (!layout || !side || !right) return;
  const hasLeft = !!side.innerHTML.trim();
  const hasRight = !!right.innerHTML.trim();
  const hasProg = !!(prog && prog.innerHTML.trim());
  layout.classList.toggle('ip-layout--has-left', hasLeft);
  layout.classList.toggle('ip-layout--has-right', hasRight);
  layout.classList.toggle('ip-layout--has-programme', hasProg);
  if (!hasLeft && !hasRight && !hasProg) {
    layout.classList.remove('ip-layout--grid');
    layout.style.gridTemplateColumns = '';
    layout.style.maxWidth = '';
    return;
  }
  const totalMin = (hasLeft ? IP_COL.left + IP_COL.gap : 0) + IP_COL.centreMin
    + (hasRight ? IP_COL.right + IP_COL.gap : 0) + (hasProg ? IP_COL.prog + IP_COL.gap : 0);
  layout.style.maxWidth = (totalMin + 364) + 'px';
  const enGrille = window.innerWidth >= (totalMin + 84);
  layout.classList.toggle('ip-layout--grid', enGrille);
  layout.style.gridTemplateColumns = enGrille ? ipGabaritColonnes(hasLeft, hasRight, hasProg) : '';
}

/* Visionneuse plein écran, réutilisable par n'importe quelle liste de photos (2026-10-30 : d'abord
   IP_PHOTOS pour les photos/vidéos de l'événement, désormais aussi IP_DOC_PHOTOS pour les photos de
   « Documents & médias », demande explicite « cliquer dessus pour les découvrir ») — IP_LB_PHOTOS
   retient la liste ouverte pour que la navigation précédent/suivant et Échap fonctionnent pareil
   quelle que soit la source. */
let IP_LB_PHOTOS = [];
function ipOuvrirPhoto(i, photos) {
  IP_LB_PHOTOS = photos || IP_PHOTOS;
  if (!IP_LB_PHOTOS.length) return;
  IP_LB_INDEX = i;
  let lb = document.getElementById('ip-lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'ip-lightbox'; lb.className = 'ip-lightbox'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Photos de l\'événement');
    lb.addEventListener('click', (ev) => { if (ev.target === lb) ipFermerPhoto(); });
    document.body.appendChild(lb);
    document.addEventListener('keydown', ipToucheLightbox);
  }
  ipRenderPhoto();
}
function ipRenderPhoto() {
  const lb = document.getElementById('ip-lightbox'); if (!lb) return;
  const p = IP_LB_PHOTOS[IP_LB_INDEX];
  lb.innerHTML = `
    <img src="${ipAttr(p.url)}" alt="${ipAttr(p.libelle || '')}">
    <button type="button" class="lb-x" onclick="ipFermerPhoto()" aria-label="Fermer">✕</button>
    ${IP_LB_PHOTOS.length > 1 ? `<button type="button" class="lb-p" onclick="ipPhotoSuivante(-1)" aria-label="Photo précédente">‹</button>
    <button type="button" class="lb-n" onclick="ipPhotoSuivante(1)" aria-label="Photo suivante">›</button>` : ''}
    <div class="lb-c">${IP_LB_INDEX + 1} / ${IP_LB_PHOTOS.length}</div>`;
  const x = lb.querySelector('.lb-x'); if (x) x.focus();
}
function ipPhotoSuivante(d) { IP_LB_INDEX = (IP_LB_INDEX + d + IP_LB_PHOTOS.length) % IP_LB_PHOTOS.length; ipRenderPhoto(); }
function ipFermerPhoto() {
  const lb = document.getElementById('ip-lightbox'); if (lb) lb.remove();
  document.removeEventListener('keydown', ipToucheLightbox);
}
function ipToucheLightbox(e) {
  if (!document.getElementById('ip-lightbox')) return;
  if (e.key === 'Escape') ipFermerPhoto();
  else if (e.key === 'ArrowLeft' && IP_LB_PHOTOS.length > 1) ipPhotoSuivante(-1);
  else if (e.key === 'ArrowRight' && IP_LB_PHOTOS.length > 1) ipPhotoSuivante(1);
}

/* Retrouver une inscription payante restée sans paiement et reprendre le paiement (2026-10-29,
   demande explicite). `cle` = { email, type_id } (formulaire) ou { reference } (lien d'annulation
   Stripe, écran de brouillon). Le montant est toujours recalculé côté serveur. */
async function ipReprendre(cle, btn, errEl) {
  const libelle = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Recherche de votre inscription…'; }
  try {
    const r = await fetch(`/api/insc/public/${IP_SLUG}/inscriptions/reprendre`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(cle) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur');
    window.location.href = d.checkout_url;
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = libelle; }
    if (errEl) { errEl.textContent = e.message; errEl.style.display = 'block'; }
    else alert(e.message);
  }
}
/* Bouton « Retrouver mon inscription et continuer » (sous le message d'erreur du formulaire). */
function ipAjouterBoutonReprise(errEl, cle) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'ip-btn'; b.style.cssText = 'margin-top:10px;width:100%;height:44px;';
  b.textContent = '🔁 Retrouver mon inscription et continuer';
  b.onclick = () => ipReprendre(cle, b, errEl);
  errEl.appendChild(b);
}
function ipRenderBrouillon(d) {
  document.getElementById('ip-root').innerHTML = `
    <div class="ip-confirmation">

      <p style="font-size:13px;color:oklch(0.5 0.006 30);margin-top:8px;">Rien n'a été payé et votre place n'est pas confirmée. Pour la retrouver plus tard, remplissez de nouveau le formulaire avec la même adresse e-mail et cliquez sur « Retrouver mon inscription et continuer ».</p>
      <button class="ip-btn" id="ip-brouillon-payer" style="margin-top:16px;">💳 Payer et confirmer maintenant</button>
      <div id="ip-brouillon-err" style="color:oklch(0.5 0.16 20);font-size:13px;margin-top:10px;display:none;"></div>

  const b = document.getElementById('ip-brouillon-payer');

}

function ipRenderConfirmation(d) {
  if (d.brouillon) return ipRenderBrouillon(d);
  /* Statut "inscrit" = validation manuelle activée par l'organisateur (validation_auto=0,
     demande explicite du 2026-09-09) : ne JAMAIS afficher "Inscription confirmée" ni un lien
     QR dans ce cas — l'inscription n'est pas encore réellement confirmée, le QR ne serait pas

  const parStatut = {

  const info = parStatut[d.statut] || { icon: '✅', titre: 'Inscription confirmée !', note: null };

  document.getElementById('ip-root').innerHTML = `

/* Bloc "Dossier de candidature" (2026-09-27, demande explicite) — jamais de remplissage ni
   détection dans l'app : documents PDF à télécharger + adresse e-mail de réception, plus un
   bouton "J'ai candidaté" auto-déclaratif (compte requis) qui alimente la gestion de la fiche
   côté organisateur. "Dossier de candidature" plutôt que juste "Candidature" dans le libellé
   pour ne jamais être confondu avec le module recrutement (candidatures d'emploi).
   Repliée derrière un bouton "Accéder à la candidature" (2026-09-28, demande explicite) — la
   page d'accueil montrait jusqu'ici modalités/documents/bouton de déclaration en clair, ce qui
   noyait les autres types d'inscription ; même patron de navigation que ipOuvrirType() (le clic
   remplace #ip-root par la vue détaillée, avec un "← Retour" vers ipRenderAccueil()). */
function ipCandidatureVisible() {
  const cand = IP_CANDIDATURE;
  if (!cand || !cand.config || !cand.config.actif) return false;
  const c = cand.config;
  const now = new Date();
  if (c.date_ouverture && new Date(c.date_ouverture) > now) return false;
  if (c.date_fermeture && new Date(c.date_fermeture) < now) return false;
  return true;
}
function ipRenderCandidature() {
  if (!ipCandidatureVisible()) return '';

}
/* Réponse d'un visiteur sans compte (2026-09-28, demande explicite) — id de la déclaration créée

   pas de session à laquelle le rattacher) : sert ensuite à ipDeposerCandidatureDoc() pour que ce
   même visiteur puisse déposer ses documents sans se reconnecter. */
let IP_CAND_VISITEUR_ID = null;
function ipOuvrirCandidature() {
  if (!ipCandidatureVisible()) return;
  const cand = IP_CANDIDATURE;
  const c = cand.config;
  const docs = cand.documents || [];
  const connecte = typeof CURRENT_USER !== 'undefined' && !!CURRENT_USER;
  const visiteurValide = !connecte && !!IP_CAND_VISITEUR_ID;
  /* Dépôt de document (2026-09-28, demande explicite : "créer un onglet Déposer un document qui

     pourront déposer les différents documents" y compris sans compte) — chaque document a un
     contrôle de dépôt lié à CE document précis (pas un dépôt générique). Un visiteur sans compte
     ne peut déposer qu'une fois sa réponse validée ci-dessous (IP_CAND_VISITEUR_ID rempli) : avant
     ça, aucun identifiant (ni user_id, ni declaration_id) n'existe encore pour rattacher le fichier.
     Le "Télécharger ↓" passe par ipTelechargerDocument() (blob local) plutôt qu'un lien
     target="_blank" classique : sur certains navigateurs mobiles, ouvrir un PDF ainsi fait quitter
     l'onglet/l'appli vers un lecteur externe, obligeant à "aller le rechercher" — plainte
     utilisateur explicite.
     Sélection = mise en attente, PAS d'envoi (2026-09-28, demande explicite : "pas prendre en
     compte automatiquement le document... s'il y a une erreur, on ne pourra pas rectifier") —
     choisir un fichier ne fait plus qu'un aperçu local (IP_CAND_DOCS_STAGED, un objet File ne
     survit pas au re-rendu innerHTML donc gardé hors du DOM) avec un bouton "💾 Enregistrer"
     explicite et un "✕" pour annuler la sélection sans rien envoyer. Une fois un document déjà
     déposé, "👁️ Prévisualiser" l'ouvre tel qu'il est réellement enregistré, distinct du
     "Télécharger ↓" qui télécharge le modèle vierge de l'organisateur. */
  const docsHtml = docs.map(d => {

          <div style="display:flex; gap:6px;">

            <button type="button" onclick="ipAnnulerDocumentCandidature(${d.id})" title="Annuler la sélection" style="font-size:12px;font-weight:700;padding:5px 9px;border-radius:6px;border:1px solid oklch(0.8 0.006 30);background:#fff;color:oklch(0.4 0.006 30);cursor:pointer;">✕</button>

    } else if (!connecte && !visiteurValide) {

    } else {

         c'est très compliqué de savoir") — id stable par document, mis à jour directement par

      deposerHtml = `

            ${depot ? `<button type="button" onclick="ipPrevisualiserDocumentDepose('${escH(depot.url)}')" style="background:none;border:none;font-size:11px;color:#8B12D6;font-weight:600;white-space:nowrap;cursor:pointer;padding:0;font-family:inherit;">👁️ Prévisualiser</button>` : ''}

      <button type="button" onclick="ipTelechargerDocument('${escH(d.pdf_url)}', '${escH(d.titre).replace(/'/g, "\\'")}')" style="background:none;border:none;font-size:11.5px;color:#8B12D6;font-weight:600;white-space:nowrap;cursor:pointer;padding:0;font-family:inherit;">Télécharger ↓</button>

  const emailHtml = c.email_reception

    : '';

      <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:oklch(0.5 0.006 30);margin-bottom:8px;">📄 Documents pour répondre à la candidature</div>
      <div class="ip-cand-docs">${docsHtml}</div>
      ${emailHtml}
      ${ipRenderFormulaireReponse(cand, connecte, visiteurValide)}
    </div>`;
  if (connecte) ipCandPrefill(cand.mes_reponses);
}
/* Formulaire "Répondre à la candidature" (2026-09-28, demande explicite) — remplace l'ancien
   bouton "J'ai candidaté" purement déclaratif. Connecté : identité reprise automatiquement du
   compte (nom/prénom/organisme/e-mail/téléphone), rien à saisir à part un message facultatif —
   voir mon_organisme/mon_message renvoyés par GET /insc/public/:slug. Sans compte : petite
   cartouche à remplir soi-même (nom, prénom, organisme, e-mail, téléphone), aucune création de
   compte. Dans les deux cas, valider crée/replace la réponse ; pour un visiteur sans compte, ça
   débloque aussi le dépôt des documents ci-dessus (voir IP_CAND_VISITEUR_ID). */
function ipRenderFormulaireReponse(cand, connecte, visiteurValide) {
  if (visiteurValide) {
    return `<div style="font-size:12.5px;color:#1C8A0E;font-weight:700;background:#F0FDF4;border:1px solid #86EFAC;border-radius:8px;padding:10px 12px;">✅ Votre réponse est enregistrée — vous pouvez déposer vos documents ci-dessus.</div>`;
  }
  /* Mini-formulaire (2026-10-06) : l'organisateur choisit ce qui est demandé et ce qui est obligatoire ; sans réglage
     enregistré, comportement d'avant (nom, prénom, e-mail obligatoires ; organisme, téléphone, message facultatifs). */
  const form = cand.formulaire || { identite: { prenom: { demande: true, obligatoire: true }, nom: { demande: true, obligatoire: true }, email: { demande: true, obligatoire: true }, telephone: { demande: true, obligatoire: false }, organisme: { demande: true, obligatoire: false }, message: { demande: true, obligatoire: false } }, champs: [] };
  const idt = form.identite;
  const etoile = k => idt[k].obligatoire ? ' *' : '';
  const champCss = 'height:38px;border:1px solid oklch(0.85 0.004 30);border-radius:8px;padding:0 10px;font-size:13px;box-sizing:border-box;';
  const saisies = [
    idt.nom.demande ? `<input id="ip-cand-nom" type="text" placeholder="Nom${etoile('nom')}" style="${champCss}">` : '',
    idt.prenom.demande ? `<input id="ip-cand-prenom" type="text" placeholder="Prénom${etoile('prenom')}" style="${champCss}">` : '',
    idt.organisme.demande ? `<input id="ip-cand-organisme" type="text" placeholder="Nom de l'organisme${etoile('organisme')}" style="${champCss}">` : '',
    idt.email.demande ? `<input id="ip-cand-email" type="email" placeholder="Adresse e-mail${etoile('email')}" style="${champCss}">` : '',
    idt.telephone.demande ? `<input id="ip-cand-telephone" type="tel" placeholder="Téléphone${etoile('telephone')}" style="${champCss}">` : '',
  ].filter(Boolean);
  const contactEtOu = idt.email.demande && idt.telephone.demande && !idt.email.obligatoire && !idt.telephone.obligatoire
    ? '<div style="font-size:11.5px;color:oklch(0.5 0.006 30);">Indiquez au moins une adresse e-mail ou un numéro de téléphone.</div>' : '';
  const identiteHtml = connecte
    ? `<div style="font-size:12.5px;color:oklch(0.4 0.006 30);margin-bottom:10px;">Vous répondez en tant que <strong>${escH([CURRENT_USER.prenom, CURRENT_USER.nom].filter(Boolean).join(' ') || CURRENT_USER.email)}</strong>${cand.mon_organisme ? ` — ${escH(cand.mon_organisme)}` : ''}${CURRENT_USER.email ? ` (${escH(CURRENT_USER.email)})` : ''}</div>`
    : (saisies.length ? `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">${saisies.join('')}${contactEtOu}</div>` : '');
  /* Questions de l'organisateur : rendues par ipChampHtml (mêmes types de champ que les formulaires d'inscription). */
  const champsLibres = (form.champs || []).filter(c => c.demande !== false);
  const questionsHtml = champsLibres.length
    ? `<div id="ip-cand-champs" style="display:flex;flex-direction:column;gap:12px;margin-bottom:12px;">${champsLibres.map(c => ipChampHtml({ nom: c.nom, libelle: c.libelle, type_champ: c.type_champ, obligatoire: c.obligatoire ? 1 : 0, options_json: JSON.stringify(c.options || []), placeholder: c.placeholder || '', description_aide: c.aide || '', valeur_defaut: '' })).join('')}</div>` : '';
  const commentaireHtml = idt.message.demande
    ? `<textarea id="ip-cand-message" placeholder="Commentaire libre — exprimez-vous simplement${idt.message.obligatoire ? ' *' : ' (facultatif)'}" style="width:100%;min-height:70px;border:1px solid oklch(0.85 0.004 30);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;box-sizing:border-box;margin-bottom:10px;">${connecte ? escH(cand.mon_message || '') : ''}</textarea>` : '';
  return `
    <div style="border-top:1px solid oklch(0.92 0.004 30);margin-top:14px;padding-top:14px;">
      <div class="ip-cand-titre" style="font-size:13.5px;margin-bottom:8px;">✍️ Répondre à la candidature</div>
      ${identiteHtml}
      ${questionsHtml}
      ${commentaireHtml}
      <button class="ip-cand-declare-btn" onclick="ipRepondreCandidature(this)">${connecte && cand.deja_declare ? 'Mettre à jour ma réponse' : '✍️ Valider ma réponse'}</button>
      ${!connecte ? `<div style="text-align:center;margin-top:10px;"><a href="inscription.html" target="_blank" rel="noopener" style="font-size:12px;color:#6B0FA3;font-weight:700;text-decoration:none;">Créer un compte Diaspo'Actif →</a></div>` : ''}
    </div>`;
}
/* Réponses aux questions du mini-formulaire : lit les champs du bloc #ip-cand-champs (cases multiples en liste). */
function ipCandCollecterReponses() {
  const box = document.getElementById('ip-cand-champs'), rep = {};
  if (!box) return rep;

   perd la main, l'utilisateur doit "aller le rechercher"). Repli sur l'ouverture classique en
   nouvel onglet si le fetch échoue (CORS ou réseau) — jamais de blocage silencieux. */
async function ipTelechargerDocument(url, titre) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('Téléchargement impossible.');
    const blob = await r.blob();
    const ext = (url.split('?')[0].split('.').pop() || 'pdf').toLowerCase();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(titre || 'document').replace(/[^a-z0-9 _-]/gi, '').trim() || 'document'}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();

   première fois côté public). Ré-agencé le même jour (demande explicite : « tu mets les heures à
   gauche et ce qui va se passer à droite [...] dans une même bulle ») : le texte libre est
   regroupé par étape en détectant les lignes qui ne contiennent qu'une heure ("10h00", "10:00") —
   deux heures consécutives = début puis fin d'un créneau, tout le texte qui suit (jusqu'à la
   prochaine heure) est le contenu de cette étape. Une ligne de texte rencontrée avant toute heure
   (ex. un titre de section libre) reste une étape sans heure, affichée sans bulle. Format tolérant
   à l'ancien texte saisi avant cette mise en forme : sans aucune heure reconnue, tout redevient une
   seule étape "sans heure" (comportement identique à l'ancien rendu en liste). */
function ipParseProgramme(lignes) {
  const reHeure = /^(\d{1,2})\s*[h:]\s*(\d{2})$/i;
  const etapes = [];
  let courante = null;
  /* true juste après avoir lu une heure de début, tant que l'heure de fin n'est pas encore
     arrivée. Piloté par une variable dédiée plutôt que déduit de courante.debut/fin : un texte
     d'intro SANS heure (ex. "Déroulement de la matinée") crée une première étape avec debut=null,
     et sans cette variable séparée, la condition « courante.debut && courante.fin » restait
     bloquée à faux pour toujours — chaque heure suivante tombait alors dans aucune des deux
     branches et disparaissait silencieusement (bug réel trouvé à l'exécution : aucune heure
     n'apparaissait nulle part dans le rendu, pas même comme texte). */
  let attenteFin = false;
  lignes.forEach(l => {
    const m = l.match(reHeure);

      if (attenteFin && courante) { courante.fin = heure; attenteFin = false; }
      else { courante = { debut: heure, fin: null, textes: [] }; etapes.push(courante); attenteFin = true; }
    } else {
      attenteFin = false;
      if (!courante) { courante = { debut: null, fin: null, textes: [] }; etapes.push(courante); }
      courante.textes.push(l);

/* Aperçu + "Voir plus" — générique (description : 2/3, demande explicite ; programme : 3/4 "voire

   temps et le bouton resterait injustement masqué. La hauteur repliée est calculée depuis la
   hauteur RÉELLE du contenu (pas une valeur fixe) : un texte court n'est jamais inutilement coupé. */
function ipAjusterApercu(wrapId, innerId, btnId, ratio, seuilMin) {
  const wrap = document.getElementById(wrapId), inner = document.getElementById(innerId), btn = document.getElementById(btnId);
  if (!wrap || !inner || !btn) return;
  wrap.dataset.collapsed = '0';
  requestAnimationFrame(() => {
    const hauteurTotale = inner.scrollHeight;
    if (hauteurTotale <= seuilMin) { btn.hidden = true; return; }
    wrap.style.setProperty('--ip-collapsed-h', Math.round(hauteurTotale * ratio) + 'px');
    wrap.dataset.collapsed = '1';

    btn.textContent = 'Voir plus ↓';
  });

      /* Prolonger (2026-10-31, demande explicite : « allonger le temps des candidatures ») — visible seulement par
         l'organisateur de la fiche (ou un administrateur) quand elle est fermée ; la fenêtre vient de assets/prolonger-fiche.js. */
      const peutProlonger = estFermee && typeof CURRENT_USER !== 'undefined' && CURRENT_USER && f.id
        && (Number(CURRENT_USER.id) === Number(f.owner_user_id) || CURRENT_USER.role === 'administrateur');
      document.getElementById('ip-root').innerHTML = `
        ${f.affiche_url ? `<img class="ip-affiche" src="${escH(f.affiche_url)}" alt="">` : ''}
        ${f.nom ? `<h1 class="ip-titre">${escH(f.nom)}</h1>` : ''}
        <div class="ip-statut-card ${estFermee ? 'ip-statut-fermee' : 'ip-statut-attente'}">
          <div class="ip-statut-icon">${estFermee ? '🔒' : '⏳'}</div>
          <p class="ip-statut-msg">${escH(d.message)}</p>
          ${dateTxt ? `<p class="ip-statut-date">${estFermee ? 'Fermées depuis le' : 'Ouverture le'} <strong>${escH(dateTxt)}</strong></p>` : ''}
          ${peutProlonger ? `<button type="button" id="ip-prolonger" style="margin-top:14px;padding:10px 18px;border:none;border-radius:8px;background:#ff6b00;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;">⏳ Prolonger les inscriptions et les candidatures</button>` : ''}
        </div>
        ${ipRenderVisuels()}
        ${ipRenderMedias()}`;
      const boutonProlonger = document.getElementById('ip-prolonger');
      if (boutonProlonger) boutonProlonger.addEventListener('click', () => ouvrirModaleProlongerFiche(f.id, { onDone: () => location.reload() }));
      return;
    }
    IP_FICHE = d.fiche; IP_TYPES = d.types; IP_EVENEMENTS = d.evenements; IP_APERCU = !!d.apercu;
    /* Retour de Stripe Checkout (2026-09-22) — le webhook confirme le paiement de façon
       asynchrone, donc ce message reste optimiste (délai de quelques secondes possible avant
       la vraie confirmation/QR par e-mail) plutôt que d'interroger une route dédiée. */
    if (IP_PAIEMENT_STATUT === 'succes') {
      document.getElementById('ip-root').innerHTML = `
        ${IP_APERCU ? IP_BANDEAU_APERCU : ''}
        <div class="ip-confirmation">
          <div class="grand">✅</div>
          <h2 style="font-size:19px;font-weight:700;margin:0 0 8px;">Paiement reçu !</h2>
          <p style="color:oklch(0.5 0.006 30);font-size:13.5px;">${IP_PAIEMENT_REF ? `Numéro d'inscription : <strong style="font-family:'IBM Plex Mono',monospace;">${escH(IP_PAIEMENT_REF)}</strong>` : ''}</p>
          <p style="font-size:13px;color:oklch(0.5 0.006 30);margin-top:8px;">Votre confirmation et votre billet vous seront envoyés par e-mail sous quelques instants.</p>
        </div>${ipRenderMedias()}`;
      return;
    }
    ipRenderAccueil();
    /* Boutons de don (2026-09-28, demande explicite) — deux mécanismes indépendants, tous deux
       injectés après le rendu principal puisqu'ils nécessitent chacun un appel réseau propre :
       le don spécifiquement lié à cette fiche (ipRenderDonLie) et le don "vedette" du compte
       organisateur, affiché partout (assets/don-banner.js). */
    ipRenderDonLie().then(html => { const el = document.getElementById('ip-don-lie'); if (el && html) el.innerHTML = html; });
    if (IP_FICHE.owner_user_id && window.DonBanner) {
      DonBanner.render(IP_FICHE.owner_user_id, { mode: 'inline', container: document.getElementById('ip-don-banner') });
    }
    if (IP_PAIEMENT_STATUT === 'annule') {
      const notice = document.createElement('div');
      notice.style.cssText = 'background:oklch(0.95 0.04 85);border:1px solid oklch(0.8 0.08 85);color:oklch(0.4 0.13 85);font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:16px;';
      notice.textContent = '⚠️ Paiement annulé — votre inscription est gardée 24 h : vous pouvez reprendre le paiement.';
      /* La référence (lien de retour de Stripe) suffit à retrouver l'inscription : un seul clic. */
      if (IP_PAIEMENT_REF) {
        const errReprise = document.createElement('div');
        errReprise.style.cssText = 'color:oklch(0.5 0.16 20);font-size:12.5px;margin-top:8px;display:none;';
        const bReprise = document.createElement('button');
        bReprise.type = 'button'; bReprise.className = 'ip-btn'; bReprise.style.cssText = 'display:block;margin-top:10px;width:100%;height:44px;';
        bReprise.textContent = '🔁 Retrouver mon inscription et continuer';
        bReprise.onclick = () => ipReprendre({ reference: IP_PAIEMENT_REF }, bReprise, errReprise);
        notice.append(bReprise, errReprise);
      }
      document.getElementById('ip-root').prepend(notice);
    }
  } catch (e) {
    document.getElementById('ip-root').innerHTML = `<div style="text-align:center;padding:60px 20px;color:oklch(0.5 0.16 20);">Fiche introuvable.</div>`;
  }
})();
</script>
<script src="/assets/cookies-banner.js"></script>
<script src="/assets/don-banner.js"></script>
<script src="/assets/theme-manager.js"></script>
<script src="assets/back-button.js"></script>
</body>
</html>
