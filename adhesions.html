<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diaspo'Actif — Cotisations & Adhésions</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="assets/styles.v2.css">
<link rel="stylesheet" href="/assets/responsive.v2.css?v=2">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b00">
<link rel="stylesheet" href="/assets/ui-enhancements.v2.css">
<link rel="stylesheet" href="/assets/design-upgrade.v2.css">
<link rel="stylesheet" href="/assets/theme-manager.css">
<style>
.adh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px;}
.adh-card{border:1px solid var(--border);border-radius:14px;padding:18px;border-top:5px solid var(--orange);transition:box-shadow .15s;}
.adh-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.1);}
.adh-icon{font-size:32px;margin-bottom:8px;}
.adh-media-photo{width:calc(100% + 36px);margin:-18px -18px 12px;border-radius:14px 14px 0 0;aspect-ratio:16/9;object-fit:cover;display:block;}
.adh-media-video-wrap{position:relative;width:calc(100% + 36px);margin:-18px -18px 12px;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:16/9;background:#000;}
.adh-media-video{width:100%;height:100%;object-fit:cover;display:block;}
.adh-media-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:20px;cursor:pointer;}
.adh-nom{font-size:16px;font-weight:800;margin:0 0 4px;}
.adh-type{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
.adh-montant{font-size:20px;font-weight:800;color:#2563EB;margin-bottom:10px;}
.adh-desc{font-size:13px;color:var(--muted);margin-bottom:14px;}
.carte-membre{background:linear-gradient(135deg,#1e2761,#3a4a9e);border-radius:18px;padding:24px;color:#fff;max-width:400px;margin:0 auto;box-shadow:0 12px 32px rgba(0,0,0,.2);}
.carte-membre .cm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.carte-membre .cm-statut{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;text-transform:uppercase;}
.cm-statut.a_jour{background:#10b981;}
.cm-statut.non_a_jour{background:#ef4444;}
.cm-statut.en_attente{background:#94a3b8;}
.carte-membre .cm-nom{font-size:20px;font-weight:800;margin:0 0 2px;}
.carte-membre .cm-init{font-size:13px;opacity:.85;margin-bottom:16px;}
.carte-membre .cm-qr{background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:center;margin-bottom:14px;}
.carte-membre .cm-meta{font-size:12px;opacity:.85;display:flex;justify-content:space-between;}
.notice{background:#fff3e0;border:1px solid #ffb74d;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app">
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="DA" style="height:28px;"> Diaspo'Actif</a>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="annuaire.html">Annuaire</a>
      <a href="vitrines.html">Vitrines</a>
    </div>
    <div id="nav-user"></div>
  </div>
</nav>

<div class="container" style="padding-top:20px;">
  <div class="flex-between" style="margin-bottom:16px;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 style="margin:0;">🎫 Cotisations & Adhésions</h1>
      <p id="adh-init-nom" style="margin:4px 0 0;color:var(--muted);font-size:13px;">Chargement…</p>
    </div>
    <button class="btn btn-outline" id="btn-ma-carte" style="display:none;" onclick="afficherMaCarte()">🪪 Ma carte de membre</button>
  </div>

  <div id="adh-alert-zone"></div>

  <div id="adh-public-formules"><div style="text-align:center;padding:40px;color:var(--muted);">Chargement des formules…</div></div>

  <div id="adh-carte-zone" style="display:none;margin-top:30px;"></div>
</div>
</div><!-- /app -->

<script src="assets/ds.js"></script>
<script src="assets/demo.js?v=2"></script>
<script src="assets/app.js?v=11"></script>
<script src="assets/profile-qr.js"></script>
<script>
const ADH_TYPE_LABELS = {
  don_libre: 'Don libre', don_ponctuel: 'Don ponctuel',
  cotisation_mensuelle: 'Cotisation mensuelle', cotisation_trimestrielle: 'Cotisation trimestrielle',
  cotisation_semestrielle: 'Cotisation semestrielle', cotisation_annuelle: 'Cotisation annuelle',
  adhesion_unique: 'Adhésion unique', participation_projet: 'Participation à un projet',
  contribution_exceptionnelle: 'Contribution exceptionnelle', autre: 'Autre',
};

const params = new URLSearchParams(location.search);
const INIT_ID = params.get('initiative');
let FORMULES = [];
let ADHESIONS_OUVERTES = true;

async function init(){
  const paiement = params.get('paiement');
  if (paiement === 'succes') {
    document.getElementById('adh-alert-zone').innerHTML = '<div class="notice">✅ Paiement confirmé ! Votre adhésion est en cours de traitement.</div>';
    /* Proposition de compte pour les invités (option 2, 2026-08-08) : la fusion vers le
       nouveau compte se déclenche automatiquement à l'inscription si l'e-mail correspond
       (cf. POST /api/auth/signup côté serveur) — on se contente ici de proposer le lien. */
    let meApresPaiement = { user: null };
    try { meApresPaiement = await api('GET', '/auth/me'); } catch(e) {}
    if (!meApresPaiement.user) {
      let emailInvite = '';
      try { emailInvite = sessionStorage.getItem('adh_invite_email') || ''; sessionStorage.removeItem('adh_invite_email'); } catch(e) {}
      document.getElementById('adh-alert-zone').innerHTML += `<div class="notice" style="background:#eff6ff;border-color:#93c5fd;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <span>🔑 <strong>Créez votre compte Diaspo'Actif</strong> pour retrouver cette adhésion, votre reçu et vos rappels à tout moment.</span>
        <a href="inscription.html?role=utilisateur${emailInvite ? '&email=' + encodeURIComponent(emailInvite) : ''}" class="btn btn-orange" style="padding:7px 16px;font-size:12.5px;">Créer mon compte</a>
      </div>`;
    }
  } else if (paiement === 'annule') {
    document.getElementById('adh-alert-zone').innerHTML = '<div class="notice">❌ Paiement annulé — aucune somme n\'a été débitée.</div>';
  }
  if (!INIT_ID) {
    document.getElementById('adh-public-formules').innerHTML = '<div class="notice">Aucune initiative spécifiée. Utilisez le lien depuis le profil d\'une initiative.</div>';
    return;
  }
  try {
    const init = await api('GET', `/initiatives/${INIT_ID}`);
    const initData = init.initiative || init;
    document.getElementById('adh-init-nom').textContent = `${initData.nom || ''} — choisissez une formule et adhérez en ligne.`;
    ADHESIONS_OUVERTES = initData.adhesions_ouvertes !== false;
    if (!ADHESIONS_OUVERTES) {
      document.getElementById('adh-alert-zone').innerHTML += '<div class="notice">🔒 Les adhésions sont actuellement fermées pour cette structure. Si vous êtes déjà adhérent, vous pouvez toujours consulter votre carte et la renouveler ci-dessus.</div>';
    }
  } catch(e){}
  try {
    const r = await api('GET', `/initiatives/${INIT_ID}/adhesion-formules`);
    FORMULES = r.formules || [];
    renderFormules();
  } catch(e) {
    document.getElementById('adh-public-formules').innerHTML = `<div class="notice">Erreur de chargement : ${e.message}</div>`;
  }
  document.getElementById('btn-ma-carte').style.display = 'inline-block';
}

function renderFormules(){
  const el = document.getElementById('adh-public-formules');
  if (!FORMULES.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">Aucune formule d\'adhésion disponible pour le moment.</div>';
    return;
  }
  el.innerHTML = `<div class="adh-grid">
    ${FORMULES.map(f => `
      <div class="adh-card" style="border-top-color:${f.couleur||'#ff6b00'};">
        ${f.media_type==='photo' && f.media_url ? `<img src="${escHtml(f.media_url)}" class="adh-media-photo" alt="">` :
          f.media_type==='video' && f.media_url ? `<div class="adh-media-video-wrap"><video src="${escHtml(f.media_url)}" class="adh-media-video" muted></video><button type="button" class="adh-media-play" onclick="this.previousElementSibling.play();this.style.display='none';">▶️</button></div>` :
          `<div class="adh-icon">${f.icone||'🎫'}</div>`}
        <div class="adh-nom">${escHtml(f.nom)}</div>
        <div class="adh-type">${ADH_TYPE_LABELS[f.type_contribution]||f.type_contribution}</div>
        <div class="adh-montant">${
          f.montant_type==='fixe' ? `${f.montant_fixe} ${f.devise}` :
          f.montant_type==='libre' ? `Montant libre${f.montant_max?' (max '+f.montant_max+' '+f.devise+')':''}` :
          `À partir de ${f.montant_min} ${f.devise}`
        }</div>
        ${f.description?`<div class="adh-desc">${mdBold(escHtml(f.description))}</div>`:''}
        ${f.max_adherents ? `<div style="font-size:11.5px;color:${f.places_restantes<=0?'#dc2626':'var(--muted)'};margin:2px 0 8px;">${f.places_restantes<=0?'🚫 Complet':`👥 ${f.places_restantes} place${f.places_restantes>1?'s':''} restante${f.places_restantes>1?'s':''}`}</div>` : ''}
        ${!ADHESIONS_OUVERTES
          ? `<button class="btn btn-outline" style="width:100%;" disabled>🔒 Adhésions fermées</button>`
          : f.max_adherents && f.places_restantes<=0
          ? `<button class="btn btn-outline" style="width:100%;" disabled>🚫 Complet</button>`
          : `<button class="btn btn-orange" style="width:100%;" onclick="ouvrirPaiement(${f.id})">Adhérer / Contribuer</button>`}
      </div>`).join('')}
  </div>`;
}

function escHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

const ADH_RECURRENTS = ['cotisation_mensuelle', 'cotisation_trimestrielle', 'cotisation_semestrielle', 'cotisation_annuelle'];

async function ouvrirPaiement(formuleId){
  /* Paiement invité (2026-08-08) : une personne sans compte Diaspo'Actif peut payer directement
     — plus de redirection forcée vers la connexion. Le formulaire ci-dessous demande alors
     nom/prénom/e-mail (déjà toujours obligatoires) directement au visiteur. */
  let me = { user: null };
  try { me = await api('GET', '/auth/me'); } catch(e) {}
  const formule = FORMULES.find(f=>f.id===formuleId);
  if (!formule) { showToast?.('Cette formule n\'est plus disponible. Contactez l\'association.', 'warning'); return; }
  let montant = null;
  if (formule.montant_type !== 'fixe') {
    const suggestion = formule.montant_type === 'minimum' ? formule.montant_min : (formule.montant_min || 10);
    const saisie = prompt(`Montant à verser (${formule.devise})${formule.montant_type==='minimum'?' — minimum '+formule.montant_min:''}${formule.montant_max?' — maximum '+formule.montant_max:''} :`, suggestion);
    if (saisie === null) return;
    montant = Number(saisie);
    if (!montant || montant <= 0) { showToast?.('Montant invalide.', 'warning'); return; }
  }
  ouvrirFormulaireAdhesion(formule, montant, me.user ? me.user.id : null);
}

/* Formulaire personnalisable (incrément 2, 2026-08-07) — n'apparaît que si la formule a
   réellement des champs à collecter (obligatoire/facultatif), pour ne pas ajouter d'étape
   inutile aux formules qui n'en configurent aucun. Préremplit depuis le profil du compte
   connecté (point 9 du cahier des charges) — l'association garde la main sur les champs à
   rendre obligatoires, mais l'adhérent n'a rien à ressaisir de ce qu'il a déjà déclaré. */
async function ouvrirFormulaireAdhesion(formule, montant, userId){
  const champsConfig = formule.champs_config || {};
  const champsCustom = formule.champs_custom || [];
  const champsActifs = ADH_CHAMPS_CATALOGUE_PUB.filter(c => champsConfig[c.key] === 'obligatoire' || champsConfig[c.key] === 'facultatif');
  /* nom/prénom/e-mail sont toujours "obligatoire" (verrouillés côté association), donc
     champsActifs n'est jamais vide en pratique — ce court-circuit ne sert que de filet de
     sécurité si jamais ça changeait un jour. */
  if (!champsActifs.length && !champsCustom.length) return continuerPaiement(formule.id, montant);

  /* Invité (userId null) : pas de profil à préremplir, la personne saisit tout elle-même. */
  let profil = {};
  if (userId) { try { profil = (await api('GET', `/profil/${userId}`)).profil || {}; } catch(e) {} }
  const PREFILL = {
    nom: profil.nom, prenom: profil.prenom, email: profil.email, telephone: profil.telephone,
    ville: profil.ville, pays: profil.pays, nationalite: profil.nationalite1,
    pays_origine: profil.origine1, pays_residence: profil.pays,
  };

  const overlay = document.createElement('div');
  overlay.id = 'adh-form-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:460px;width:94%;max-height:85vh;overflow-y:auto;">
      <h3 style="margin:0 0 6px;font-size:16px;">📝 ${escHtml(formule.nom)}</h3>
      ${!userId ? `<p style="font-size:12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:8px 10px;margin:0 0 10px;">Vous adhérez sans compte Diaspo'Actif — renseignez simplement vos coordonnées ci-dessous. 🔑 <a href="login.html?next=${encodeURIComponent(location.href)}">Déjà un compte ? Connectez-vous</a> pour préremplir automatiquement.</p>` : ''}
      ${formule.texte_intro ? `<p style="font-size:12.5px;color:var(--muted,#888);margin:0 0 10px;white-space:pre-wrap;">${mdBold(escHtml(formule.texte_intro))}</p>` : ''}
      <div id="adh-form-champs" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;"></div>
      ${formule.conditions_adhesion ? `<div style="font-size:11.5px;color:var(--muted,#888);background:#f9fafb;border-radius:8px;padding:8px 10px;margin-bottom:10px;white-space:pre-wrap;">${mdBold(escHtml(formule.conditions_adhesion))}</div>` : ''}
      ${(formule.reglement_pdf_url || formule.statuts_pdf_url) ? `<div style="font-size:12px;margin-bottom:12px;">
        ${formule.reglement_pdf_url ? `<a href="${escHtml(formule.reglement_pdf_url)}" target="_blank" rel="noopener" style="color:#2563eb;">📄 Règlement intérieur</a>` : ''}
        ${formule.reglement_pdf_url && formule.statuts_pdf_url ? ' · ' : ''}
        ${formule.statuts_pdf_url ? `<a href="${escHtml(formule.statuts_pdf_url)}" target="_blank" rel="noopener" style="color:#2563eb;">📄 Statuts de l'association</a>` : ''}
      </div>` : ''}
      <div id="adh-form-err" style="display:none;color:#dc2626;font-size:12.5px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="document.getElementById('adh-form-overlay').remove()">Annuler</button>
        <button class="btn btn-orange" id="adh-form-continuer">Continuer →</button>
      </div>
    </div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);

  const zone = document.getElementById('adh-form-champs');
  zone.innerHTML = champsActifs.map(c => {
    const val = escHtml(PREFILL[c.key] || '');
    const req = champsConfig[c.key] === 'obligatoire';
    let input;
    if (c.key === 'date_naissance') input = `<input type="date" class="input adh-champ-reponse" data-key="${c.key}" value="${val}" style="width:100%;">`;
    else if (c.key === 'email') input = `<input type="email" class="input adh-champ-reponse" data-key="${c.key}" value="${val}" style="width:100%;">`;
    else if (c.key === 'sexe') input = `<select class="input adh-champ-reponse" data-key="${c.key}" style="width:100%;"><option value="">—</option><option value="Femme" ${val==='Femme'?'selected':''}>Femme</option><option value="Homme" ${val==='Homme'?'selected':''}>Homme</option><option value="Autre" ${val==='Autre'?'selected':''}>Autre</option></select>`;
    else if (c.key === 'pourquoi_adherer') input = `<textarea class="input adh-champ-reponse" data-key="${c.key}" rows="2" style="width:100%;">${val}</textarea>`;
    else if (c.key === 'photo' || c.key === 'piece_identite') input = `<input type="file" class="adh-champ-reponse-file" data-key="${c.key}" accept="image/*,application/pdf" style="width:100%;font-size:12px;">`;
    else input = `<input type="text" class="input adh-champ-reponse" data-key="${c.key}" value="${val}" style="width:100%;">`;
    return `<div><label style="font-size:12px;font-weight:600;">${escHtml(c.label)}${req?' *':''}</label><div style="margin-top:3px;">${input}</div></div>`;
  }).join('') + champsCustom.map(c => `
    <div><label style="font-size:12px;font-weight:600;">${escHtml(c.label)}${c.mode==='obligatoire'?' *':''}</label>
      <div style="margin-top:3px;"><input type="text" class="input adh-champ-reponse" data-key="${escHtml(c.id)}" style="width:100%;"></div>
    </div>`).join('');

  document.getElementById('adh-form-continuer').onclick = async () => {
    const err = document.getElementById('adh-form-err');
    err.style.display = 'none';
    const reponses = {};
    const manquants = [];
    zone.querySelectorAll('.adh-champ-reponse').forEach(el => { reponses[el.dataset.key] = el.value.trim(); });
    for (const c of champsActifs) {
      if (champsConfig[c.key] === 'obligatoire' && !reponses[c.key]) manquants.push(c.label);
    }
    for (const c of champsCustom) {
      if (c.mode === 'obligatoire' && !reponses[c.id]) manquants.push(c.label);
    }
    /* Champs de type fichier (photo/pièce d'identité) : téléversés séparément avant de
       poursuivre, seule l'URL obtenue est envoyée dans les réponses. */
    for (const fileInput of zone.querySelectorAll('.adh-champ-reponse-file')) {
      const key = fileInput.dataset.key;
      const champ = champsActifs.find(c => c.key === key);
      if (fileInput.files[0]) {
        try {
          const fd = new FormData(); fd.append('document', fileInput.files[0]);
          const r = await fetch('/api/upload/document', { method:'POST', credentials:'include', body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || 'Échec du téléversement.');
          reponses[key] = d.url;
        } catch(e) { manquants.push(`${champ?.label || key} (échec d'envoi)`); }
      } else if (champ && champsConfig[key] === 'obligatoire') {
        manquants.push(champ.label);
      }
    }
    if (manquants.length) { err.textContent = `Champs obligatoires manquants : ${manquants.join(', ')}`; err.style.display = 'block'; return; }
    overlay.remove();
    continuerPaiement(formule.id, montant, reponses);
  };
}
const ADH_CHAMPS_CATALOGUE_PUB = [
  { key:'nom', label:'Nom' }, { key:'prenom', label:'Prénom' }, { key:'email', label:'Adresse e-mail' },
  { key:'date_naissance', label:'Date de naissance' }, { key:'sexe', label:'Sexe' },
  { key:'adresse', label:'Adresse' }, { key:'ville', label:'Ville' }, { key:'code_postal', label:'Code postal' },
  { key:'pays', label:'Pays' }, { key:'telephone', label:'Numéro de téléphone' },
  { key:'profession', label:'Profession' }, { key:'entreprise', label:'Entreprise' },
  { key:'nationalite', label:'Nationalité' }, { key:'pays_origine', label:"Pays d'origine" }, { key:'pays_residence', label:'Pays de résidence' },
  { key:'photo', label:'Photo' }, { key:'piece_identite', label:"Pièce d'identité" },
  { key:'comment_connu', label:"Comment avez-vous connu l'association ?" }, { key:'pourquoi_adherer', label:'Pourquoi souhaitez-vous adhérer ?' },
  { key:'competences', label:'Compétences' }, { key:'centres_interet', label:"Centres d'intérêt" },
];

function continuerPaiement(formuleId, montant, reponses){
  const formule = FORMULES.find(f=>f.id===formuleId);
  const recurrent = ADH_RECURRENTS.includes(formule.type_contribution);
  if (recurrent) return confirmerPaiementAdhesion(formuleId, montant, false, reponses);

  const overlay = document.createElement('div');
  overlay.id = 'adh-pay-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:400px;width:94%;">
      <h3 style="margin:0 0 6px;font-size:16px;">💳 Confirmer le paiement</h3>
      <p style="font-size:13px;color:var(--muted,#888);margin:0 0 14px;">« ${escHtml(formule.nom)} » — <strong>${(montant ?? formule.montant_fixe)} ${escHtml(formule.devise)}</strong></p>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#374151;margin:0 0 14px;cursor:pointer;">
        <input type="checkbox" id="adh-save-card"> Enregistrer cette carte pour mes prochains achats
      </label>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="document.getElementById('adh-pay-overlay').remove()">Annuler</button>
        <button class="btn btn-orange" id="adh-pay-confirm">💳 Payer maintenant</button>
      </div>
    </div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('adh-pay-confirm').onclick = () => {
    const saveCard = document.getElementById('adh-save-card').checked;
    overlay.remove();
    confirmerPaiementAdhesion(formuleId, montant, saveCard, reponses);
  };
}

async function confirmerPaiementAdhesion(formuleId, montant, saveCard, reponses){
  try {
    const r = await api('POST', `/adhesion-formules/${formuleId}/payer`, { ...(montant != null ? { montant } : {}), enregistrer_carte: saveCard, reponses: reponses || {} });
    if (r.checkout_url) {
      /* Mémorise l'e-mail saisi par l'invité pour préremplir la proposition de création de
         compte au retour de Stripe (voir init() ci-dessus) — jamais transmis à un tiers. */
      if (reponses?.email) { try { sessionStorage.setItem('adh_invite_email', reponses.email); } catch(e) {} }
      location.href = r.checkout_url; return;
    }
  } catch(e) {
    showToast?.('Erreur : ' + e.message, 'danger');
  }
}

async function afficherMaCarte(){
  const zone = document.getElementById('adh-carte-zone');
  zone.style.display = 'block';
  zone.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">Chargement de votre carte…</div>';
  zone.scrollIntoView({ behavior: 'smooth' });
  try {
    /* Trouve la fiche membre de l'utilisateur connecté pour cette initiative (self-service, ne
       dépend pas d'être propriétaire — cf. GET /initiatives/:id/mon-adhesion-membre). */
    const { membre_id: membreId } = await api('GET', `/initiatives/${INIT_ID}/mon-adhesion-membre`);
    if (!membreId) { zone.innerHTML = '<div class="notice">Vous n\'avez pas encore d\'adhésion pour cette initiative.</div>'; return; }
    const carte = await api('GET', `/adhesion-membres/${membreId}/carte`);
    zone.innerHTML = `
      <div class="carte-membre">
        <div class="cm-top">
          <strong>🎫 Carte de membre</strong>
          <span class="cm-statut ${carte.statut}">${carte.statut==='a_jour'?'À jour':carte.statut==='non_a_jour'?'Non à jour':'En attente'}</span>
        </div>
        <div class="cm-nom">${escHtml(carte.prenom||'')} ${escHtml(carte.nom||'')}</div>
        <div class="cm-init">${escHtml(carte.initiative||'')} — ${escHtml(carte.formule||'')}</div>
        <div class="cm-qr" id="cm-qr-box"></div>
        <div class="cm-meta">
          <span>N° ${carte.numero_adherent}</span>
          <span>${carte.date_expiration ? 'Valide jusqu\'au ' + new Date(carte.date_expiration).toLocaleDateString('fr-FR') : 'Sans expiration'}</span>
        </div>
        ${carte.renouvelable ? `<div style="margin-top:12px;text-align:center;">
          <button class="btn btn-orange" onclick="ouvrirPaiement(${carte.formule_id})">🔄 Renouveler mon adhésion</button>
        </div>` : ''}
      </div>`;
    if (window.ProfileQR) {
      ProfileQR.render(document.getElementById('cm-qr-box'), {
        url: `${location.origin}${carte.verify_url}`,
        userName: `${carte.prenom||''} ${carte.nom||''}`.trim(),
        userRole: carte.formule,
        size: 140, showActions: true, compact: true,
      });
    }
  } catch(e) {
    zone.innerHTML = `<div class="notice">Erreur : ${e.message}</div>`;
  }
}

init();
</script>
