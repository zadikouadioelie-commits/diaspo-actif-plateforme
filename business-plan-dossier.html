<style>
/* ============================================================
   DOSSIER BUSINESS PLAN — gabarit "Premium" (investisseurs).
   Système de design défini dans la maquette validée : navy/orange
   de la charte Diaspo'Actif, trois registres typographiques déjà
   chargés ailleurs sur la plateforme (Space Grotesk / Public Sans /
   JetBrains Mono), aucune dépendance PDF côté serveur — la mise en
   page A4 est un vrai document HTML imprimable (@page + window.print()),
   cohérent avec le seul autre export PDF existant sur la plateforme
   (business-plan-view.html).
   ============================================================ */
html,body{background:#EDEFF3;}
.dossier-toolbar{
  position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.dossier-toolbar .left{display:flex;align-items:center;gap:14px;}
.dossier-back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;}
.dossier-back:hover{color:var(--orange);}
.dossier-toolbar select{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;}
.dossier-stage{max-width:900px;margin:32px auto 100px;}
#dossier-loading,#dossier-error{max-width:600px;margin:100px auto;text-align:center;color:var(--muted);}

:root{
  --dp-paper:#F7F5F0; --dp-ink:#181B20; --dp-ink-soft:#4B5160; --dp-line:#DBD6C8;
  --dp-navy:#0D2B4E; --dp-orange:#F26422; --dp-blue:#1E4F8A; --dp-green:#1A7A52;
  --dp-mono:"JetBrains Mono",Consolas,monospace;
  --dp-display:"Space Grotesk",Arial,sans-serif; --dp-body:"Public Sans",Arial,sans-serif;
}
.sheet{
  width:210mm;min-height:297mm;background:var(--dp-paper);color:var(--dp-ink);
  margin:0 auto 28px;box-shadow:0 20px 45px -20px rgba(20,23,28,.3), 0 2px 8px rgba(20,23,28,.08);
  font-family:var(--dp-body);position:relative;
}
.sheet.dark{--dp-paper:#14171C;--dp-ink:#F4F2EA;--dp-ink-soft:#9CA1AC;--dp-line:#2B2F38;}
.pg{min-height:297mm;display:flex;flex-direction:column;padding:20mm 18mm 15mm;box-sizing:border-box;}
.pg-chrome-top{
  display:flex;justify-content:space-between;align-items:center;font-family:var(--dp-mono);
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dp-ink-soft);
  padding-bottom:12px;border-bottom:1px solid var(--dp-line);margin-bottom:22px;
}
.pg-chrome-top .brand{display:flex;align-items:center;gap:8px;}
.pg-chrome-top .brand img{width:15px;height:15px;}
.pg-chrome-bottom{
  display:flex;justify-content:space-between;align-items:center;font-family:var(--dp-mono);
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dp-ink-soft);
  padding-top:12px;border-top:1px solid var(--dp-line);margin-top:auto;
}
.eyebrow-tag{font-family:var(--dp-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dp-orange);font-weight:600;margin:0 0 8px;}
.pg-title{font-family:var(--dp-display);font-size:25px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance;color:var(--dp-ink);}
.pg-sub{color:var(--dp-ink-soft);font-size:12.5px;line-height:1.55;margin:0 0 20px;}
.block-title{font-family:var(--dp-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dp-ink-soft);margin:16px 0 10px;font-weight:600;}
.block-title:first-of-type{margin-top:0;}

.kpi-row{display:grid;gap:12px;margin-bottom:6px;break-inside:avoid;}
.kpi-row.n2{grid-template-columns:repeat(2,1fr);} .kpi-row.n3{grid-template-columns:repeat(3,1fr);} .kpi-row.n4{grid-template-columns:repeat(4,1fr);}
.kpi{background:rgba(13,43,78,.035);border:1px solid var(--dp-line);border-radius:4px;padding:13px 14px 11px;break-inside:avoid;}
.sheet.dark .kpi{background:rgba(255,255,255,.04);}
.kpi .kl{font-family:var(--dp-mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dp-ink-soft);margin:0 0 8px;}
.kpi .kv{font-family:var(--dp-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;margin:0 0 3px;letter-spacing:-.01em;line-height:1.15;}
.kpi .kn{font-size:10px;color:var(--dp-ink-soft);margin-top:2px;}

table.doc-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
table.doc-table th{font-family:var(--dp-mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dp-ink-soft);text-align:right;font-weight:500;padding:0 8px 7px 0;border-bottom:1px solid var(--dp-ink-soft);}
table.doc-table th:first-child{text-align:left;}
table.doc-table td{padding:8px 8px 8px 0;border-bottom:1px solid var(--dp-line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;}
table.doc-table td:first-child{text-align:left;font-weight:600;}
table.doc-table tr:last-child td{border-bottom:none;}
table.doc-table tr.total td{font-weight:700;border-top:1.5px solid var(--dp-ink);padding-top:9px;}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:6px;}
.field{margin-bottom:12px;break-inside:avoid;}
.field .fl{font-family:var(--dp-mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dp-ink-soft);margin:0 0 3px;}
.field .fv{margin:0;font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--dp-ink);}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--dp-mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--dp-line);border-radius:20px;color:var(--dp-ink-soft);}

.bmc-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr) auto;gap:1px;background:var(--dp-line);border:1px solid var(--dp-line);}
.bmc-cell{background:var(--dp-paper);padding:10px;}
.bmc-cell h5{font-family:var(--dp-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dp-ink-soft);margin:0 0 6px;font-weight:600;}
.bmc-cell.value h5{color:var(--dp-orange);}
.bmc-cell p{font-size:10px;line-height:1.5;margin:0;white-space:pre-wrap;}
.bmc-partenaires{grid-row:1/3;} .bmc-activites{grid-row:1;} .bmc-proposition{grid-row:1/3;} .bmc-relations{grid-row:1;}
.bmc-segments{grid-row:1/3;} .bmc-ressources{grid-row:2;} .bmc-canaux{grid-row:2;} .bmc-couts{grid-column:1/4;} .bmc-revenus{grid-column:4/6;}

.team-card{display:flex;gap:12px;padding:14px;break-inside:avoid;}
.team-avatar{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--dp-display);font-weight:700;font-size:14px;flex:none;}

.empty-note{color:var(--dp-ink-soft);font-size:11.5px;font-style:italic;}
.annexe-qr{width:44px;height:44px;}
.annexe-qr img{display:block;width:100%;height:100%;}

@media print{
  .topbar,.dossier-toolbar{display:none!important;}
  html,body{background:#fff;}
  .dossier-stage{margin:0;max-width:none;}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:0;}
  .pg{break-after:page;min-height:calc(297mm - 1px);}
  .pg:last-child{break-after:auto;}
  @page{size:A4;margin:0;}
}
</style>

<!-- Génération PowerPoint 100% côté navigateur, même logique "zéro dépendance serveur" que
     html2pdf.js/jsPDF déjà utilisés ailleurs sur la plateforme (cv-builder.html, mes-billets.html).

     plateforme pour gsap (cv-builder.html, mes-billets.html), sert le bundle officiel. Version figée
     à 4.0.1 : la 3.12.0 a été testée en conditions réelles et son export (pres.write/writeFile) reste
     bloqué indéfiniment dans le navigateur, même pour une diapositive triviale -- bug confirmé de
     cette version précise, pas de notre code (4.0.1 exporte correctement en ~20ms). -->

function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
const has = v => v !== null && v !== undefined && String(v).trim() !== '' && !(Array.isArray(v) && !v.length);
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) : ''; }
function fmtEUR(n){ return has(n) && !isNaN(Number(n)) ? `${Number(n).toLocaleString('fr-FR')} €` : (has(n) ? String(n) : ''); }
function pct(n){ return has(n) ? `${n}${String(n).includes('%')?'':' %'}` : ''; }
const TYPES = { startup:'Startup', pme:'PME', association:'Association', ong:'ONG', cooperative:'Coopérative', social:'Entreprise sociale', freelance:'Freelance', autre:'Projet' };
const STATUTS = { brouillon:'Brouillon', complet:'Dossier complet', archive:'Archivé' };

/* ---- Gabarits ----
   Même base de données, même structure de pages — seuls changent le dosage de couleur, la
   composition de couverture et le degré de sobriété (cf. maquette validée). Le logo reste
   toujours celui de Diaspo'Actif, jamais recoloré. */
const TEMPLATES = {
  premium:   { label:'🟣 Premium — investisseurs', navy:'#0D2B4E', orange:'#F26422', blue:'#1E4F8A', paper:'#F7F5F0', ink:'#181B20', inkSoft:'#4B5160', line:'#DBD6C8', cover:'dark', coverBg:'radial-gradient(ellipse 900px 500px at 15% 8%, rgba(242,100,34,.14), transparent 60%), linear-gradient(165deg,#14171C 0%,#0D2B4E 130%)' },
  corporate: { label:'🟦 Corporate — institutions', navy:'#0D2B4E', orange:'#F26422', blue:'#1E4F8A', paper:'#FFFFFF', ink:'#0D2B4E', inkSoft:'#5A6B85', line:'#DDE3EE', cover:'light' },
  moderne:   { label:'🟢 Moderne — entrepreneurial', navy:'#0D2B4E', orange:'#F26422', blue:'#1E4F8A', paper:'#EEF2F8', ink:'#0D2B4E', inkSoft:'#5A6B85', line:'#D7DFEC', cover:'dark', coverBg:'linear-gradient(135deg,#0D2B4E,#1E4F8A)' },
  impact:    { label:'🌍 Impact — social & territorial', navy:'#0D2B4E', orange:'#1A7A52', blue:'#1E4F8A', paper:'#F4F0E6', ink:'#0D2B4E', inkSoft:'#6B6250', line:'#E4DCC8', cover:'impact' },
  finance:   { label:'🏦 Finance — banques & financeurs', navy:'#14171C', orange:'#8A6D3F', blue:'#1E4F8A', paper:'#FFFFFF', ink:'#14171C', inkSoft:'#5B5F66', line:'#E2E4E8', cover:'light' },
};
let ACTIVE_TPL = TEMPLATES.premium;
function applyTemplate(key){
  const t = TEMPLATES[key] || TEMPLATES.premium;
  ACTIVE_TPL = t;
  const root = document.documentElement.style;
  root.setProperty('--dp-navy', t.navy); root.setProperty('--dp-orange', t.orange); root.setProperty('--dp-blue', t.blue);
  root.setProperty('--dp-paper', t.paper); root.setProperty('--dp-ink', t.ink); root.setProperty('--dp-ink-soft', t.inkSoft); root.setProperty('--dp-line', t.line);
}
function onTemplateChange(key){
  applyTemplate(key);
  if (DOSSIER_BP) renderDossier(DOSSIER_BP, key, ACTIVE_FORMAT);
}

/* ---- Formats par audience ----
   Reprend le principe des 7 formats de l'ancien générateur (business-plan-edit.html,
   buildFinalReportHTML) -- la meilleure idée qui lui manquait à celui-ci : un banquier, un
   organisme de subvention et un partenaire commercial ne veulent pas lire le même dossier.
   Contrairement à l'ancien (qui recombine des blocs de texte simples), les formats ici
   filtrent l'ensemble déjà riche de pages (matrices, graphiques, gabarits) -- même contenu
   source, sélection différente. "complet" = comportement actuel, aucune restriction. */
const FORMATS = {
  complet:     { label:'📄 Business Plan complet', ids:null },
  bancaire:    { label:'🏦 Dossier bancaire', ids:['resume','traction','marche','finances','planfinancement','tresorerie','risques','financement','equipe','annexes'] },
  investisseur:{ label:'💼 Dossier investisseur', ids:['resume','probleme','solution','traction','marche','pestel','swot','bmc','produits','bcg','finances','planfinancement','risques','financement','equipe'] },
  subvention:  { label:'🏛️ Dossier subvention', ids:['resume','probleme','solution','marche','persona','impact','finances','calendrier','equipe','annexes'] },
  partenaire:  { label:'🤝 Dossier partenaire', ids:['resume','traction','bmc','produits','strategie_marketing','plan_commercial','organisation','equipe'] },
};
let ACTIVE_FORMAT = 'complet';
function onFormatChange(key){
  ACTIVE_FORMAT = key;
  if (DOSSIER_BP) renderDossier(DOSSIER_BP, Object.keys(TEMPLATES).find(k=>TEMPLATES[k]===ACTIVE_TPL) || 'premium', key);
}

/* ---- Adaptation automatique au profil du projet ----
   Même règle exacte que bpAppliquerConditionnels() dans l'éditeur (type_initiative + mots-clés
   du secteur) : le générateur ne réinvente pas une seconde classification, il réutilise celle
   que le porteur de projet a déjà vue s'appliquer à son questionnaire. Sert uniquement à
   PRIORISER l'affichage de champs qui existent déjà dans le schéma (jamais un nouveau champ
   inventé) -- une startup SaaS voit ses métriques d'usage remontées en KPI cards plutôt que
   noyées dans du texte, une exploitation agricole voit sa capacité de production de même. */
function classifyProfile(bp){
  const type = bp.type_initiative || '', secteur = (bp.secteur||'').toLowerCase();
  return {
    numerique: ['startup','social'].includes(type) || /num[ée]rique|digital|app|logiciel|saas|web/.test(secteur),
    association: ['association','ong'].includes(type),
    agriculture: /agri|agro|ferme|élevage|elevage|maraîch|maraich/.test(secteur),
  };
}

function fieldGrid(data, schema){ const rows = Object.entries(schema).filter(([k]) => has(data?.[k])); if (!rows.length) return ''; return `<div class="field-grid">${rows.map(([k,l]) => `<div class="field"><p class="fl">${esc(l)}</p><p class="fv">${esc(data[k])}</p></div>`).join('')}</div>`; }

/* ---- Page : Marché ---- */
function parseNum(v){ if (!has(v)) return null; const n = parseFloat(String(v).replace(',','.').replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; }

/* Matrice concurrentielle : Menace (0-100, champ numérique garanti côté formulaire) en X,
   Part de marché estimée en Y quand elle se laisse lire comme un nombre ("15%", "15", "≈15 %"
   parsent tous ; un texte purement qualitatif comme "faible" ne parse pas). Seuls les
   concurrents dont LES DEUX valeurs sont exploitables sont placés sur le graphique — jamais de
   position devinée. En dessous de 2 concurrents plaçables, on retombe sur le tableau seul. */
function competitiveMatrix(concurrents){
  const points = concurrents.map(c => ({ c, x: parseNum(c.menace), y: parseNum(c.parts_marche) })).filter(p => p.x!=null && p.y!=null);
  if (points.length < 2) return '';
  const maxY = Math.max(...points.map(p=>p.y), 1);
  const W=320, H=170, PAD=34;
  const sx = x => PAD + (x/100)*(W-PAD-14);
  const sy = y => H-PAD - (y/maxY)*(H-PAD-14);
  const dots = points.map(p => `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="5" style="fill:var(--dp-orange)" opacity="0.85"/><text x="${(sx(p.x)+8).toFixed(1)}" y="${(sy(p.y)+3).toFixed(1)}" font-family="Public Sans,Arial" font-size="9" style="fill:var(--dp-ink)">${esc(p.c.nom)}</text>`).join('');
  return `<p class="block-title">Matrice concurrentielle</p>
    <div style="display:flex;gap:20px;align-items:center;">
      <svg width="320" height="170" viewBox="0 0 ${W} ${H}">
        <line x1="${PAD}" y1="14" x2="${PAD}" y2="${H-PAD}" stroke="#DBD6C8"/>
        <line x1="${PAD}" y1="${H-PAD}" x2="${W-6}" y2="${H-PAD}" stroke="#DBD6C8"/>
        <text x="${PAD}" y="10" font-family="JetBrains Mono,monospace" font-size="8" fill="#4B5160">Part de marché ↑</text>
        <text x="${W-6}" y="${H-PAD+14}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="8" fill="#4B5160">Menace →</text>
        ${dots}
      </svg>
      <p style="font-size:11px;line-height:1.6;color:var(--dp-ink-soft);flex:1;margin:0;">Positionnement des concurrents pour lesquels un niveau de menace et une part de marché ont été estimés. Les autres concurrents renseignés restent listés dans le tableau ci-dessous.</p>
    </div>`;
}

function pageMarche(bp){
  const m = (bp.sections||{}).marche || {};
  const tamRow = kpiRow([['TAM — Marché total', has(m.tam)?fmtEUR(m.tam):''],['SAM — Marché accessible', has(m.sam)?fmtEUR(m.sam):''],['SOM — Marché visé', has(m.som)?fmtEUR(m.som):'']]);
  const textSchema = { taille_marche:"Taille du marché", tendances:"Tendances du marché", profil_client:"Profil client", segmentation:"Segmentation", positionnement:"Positionnement", avantage_concurrentiel:"Avantage concurrentiel", opportunites:"Opportunités de marché", barrieres_entree:"Barrières à l'entrée" };
  const grid = fieldGrid(m, textSchema);
  const concurrents = Array.isArray(m.concurrents) ? m.concurrents.filter(c=>has(c.nom)) : [];
  const matrix = competitiveMatrix(concurrents);
  const concTable = concurrents.length ? `<p class="block-title">${matrix?'Concurrents renseignés':'Concurrence'}</p><table class="doc-table"><thead><tr><th style="text-align:left;">Concurrent</th><th style="text-align:left;">Positionnement</th><th>Prix</th><th>Menace</th></tr></thead><tbody>${concurrents.map(c=>`<tr><td>${esc(c.nom)}</td><td style="text-align:left;">${esc(c.positionnement||'—')}</td><td>${esc(c.prix||'—')}</td><td>${esc(c.menace||'—')}</td></tr>`).join('')}</tbody></table>` : '';
  if (!tamRow && !grid && !concTable) return '';
  return page('marche','',`
    ${chromeTop(bp,'Marché')}
    <p class="eyebrow-tag">Étude de marché</p>
    <h2 class="pg-title">Dimension et dynamique du marché</h2>
    ${tamRow}
    ${grid}
    ${matrix}
    ${concTable}
    ${chromeBottom()}
  `);
}

/* Entonnoir commercial : barres proportionnelles à la valeur, taux de conversion entre chaque
   étage calculé à partir des vrais chiffres saisis (jamais un pourcentage inventé). */
function funnelDiagram(stages){
  const max = Math.max(...stages.map(([,v]) => v), 1);
  const rows = stages.map(([label,val], i) => {
    const wPct = Math.max(8, Math.round((val/max)*100));
    const conv = i>0 && stages[i-1][1]>0 ? Math.round(val/stages[i-1][1]*100) : null;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <div style="width:88px;font-size:9.5px;color:var(--dp-ink-soft);text-align:right;flex:none;">${esc(label)}</div>
      <div style="flex:1;background:var(--dp-line);border-radius:2px;height:20px;position:relative;">
        <div style="width:${wPct}%;height:100%;background:${i===stages.length-1?'var(--dp-orange)':'var(--dp-navy)'};opacity:${1-i*0.12};border-radius:2px;"></div>
      </div>
      <div style="width:52px;font-family:var(--dp-mono);font-size:10.5px;font-weight:600;flex:none;">${val.toLocaleString('fr-FR')}</div>
      <div style="width:44px;font-family:var(--dp-mono);font-size:9px;color:var(--dp-ink-soft);flex:none;">${conv!=null?conv+' %':''}</div>
    </div>`;
  }).join('');
  return `<p class="block-title">Funnel commercial</p><div style="margin-bottom:6px;">${rows}</div>`;
}

/* Diagramme de flux : étapes côte à côte reliées par des flèches, chaque intitulé étant un champ
   réellement saisi (l'ordre gauche→droite est le seul apport du gabarit). Le texte de chaque
   étape est tronqué pour tenir dans la case ; le champ complet reste visible plus bas dans la
   page (field-grid), le diagramme n'en est qu'un résumé visuel. */
function processFlow(stages){
  const boxes = stages.map(([label,val], i) => `
    <div style="flex:1;min-width:0;">
      <div style="background:rgba(13,43,78,.035);border:1px solid var(--dp-line);border-radius:4px;padding:10px 12px;height:100%;">
        <p style="font-family:var(--dp-mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--dp-orange);font-weight:700;margin:0 0 6px;">${String(i+1).padStart(2,'0')} · ${esc(label)}</p>
        <p style="font-size:9.5px;line-height:1.4;margin:0;color:var(--dp-ink);">${esc(String(val).slice(0,90))}${String(val).length>90?'…':''}</p>
      </div>
    </div>
    ${i<stages.length-1 ? `<div style="flex:none;display:flex;align-items:center;color:var(--dp-line);font-size:16px;padding:0 2px;">→</div>` : ''}`).join('');
  return `<p class="block-title">Chaîne opérationnelle</p><div style="display:flex;align-items:stretch;margin-bottom:14px;">${boxes}</div>`;
}

  const ca1 = Number(pf.ca_1)||0, resultat1 = ca1 - ['achats_1','salaires_1','loyers_1','marketing_charge_1','autres_charges_1'].reduce((s,k)=>s+(Number(pf[k])||0),0);
  const margeBrute1 = ca1>0 ? Math.round(((ca1-(Number(pf.achats_1)||0))/ca1)*100) : null;
  const margeNette1 = ca1>0 ? Math.round((resultat1/ca1)*100) : null;
  const bfrCalcule = (has(pf.stock_moyen_valeur)||has(pf.creances_clients)||has(pf.dettes_fournisseurs)) && typeof BPCalc!=='undefined'
    ? BPCalc.calcBFR({ stockMoyen:pf.stock_moyen_valeur, creancesClients:pf.creances_clients, dettesFournisseurs:pf.dettes_fournisseurs })
    : null;
  const ratiosRow = kpiRow([

    ['BFR (jours de CA)', (bfrCalcule!=null && ca1>0)?`${Math.round(bfrCalcule/ca1*365)} j`:''],
  ]);
  const CR = { ca:"Chiffre d'affaires", achats:"Achats & charges variables", salaires:"Salaires & charges", loyers:"Loyers", marketing_charge:"Marketing", autres_charges:"Autres charges" };

    const caVals = annees.map(a => Number(pf[`ca_${a}`])||0).filter(v=>v>0);
    if (caVals.length >= 2){
      const max = Math.max(...caVals);
      const bw = 320/annees.length, gap=8;
      const bars = annees.map((a,i) => { const v = Number(pf[`ca_${a}`])||0; if (!v) return ''; const h = Math.round((v/max)*90); const x = i*bw+gap/2; return `<rect x="${x}" y="${108-h}" width="${bw-gap}" height="${h}" style="fill:${i===annees.length-1?'var(--dp-orange)':'var(--dp-navy)'}" opacity="${i===annees.length-1?1:0.35+0.1*i}"/><text x="${x+(bw-gap)/2}" y="${108-h-4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" style="fill:var(--dp-ink-soft)">${Math.round(v/1000)}k</text><text x="${x+(bw-gap)/2}" y="119" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" style="fill:var(--dp-ink-soft)">An ${a}</text>`; }).join('');
      chart = `<p class="block-title">Chiffre d'affaires prévisionnel</p><svg width="100%" height="122" viewBox="0 0 320 122" preserveAspectRatio="xMinYMid meet"><line x1="0" y1="108" x2="320" y2="108" stroke="#DBD6C8"/>${bars}</svg>`;
    }

  const charges1 = [['achats_1','Achats','var(--dp-navy)'],['salaires_1','Salaires','var(--dp-orange)'],['loyers_1','Loyers','var(--dp-blue)'],['marketing_charge_1','Marketing','#8B93A1'],['autres_charges_1','Autres','var(--dp-ink-soft)']].filter(([k])=>has(pf[k])&&Number(pf[k])>0);

    donut = `<p class="block-title">Répartition des charges (An 1)</p><div style="display:flex;align-items:center;gap:16px;"><svg width="86" height="86" viewBox="0 0 36 36"><circle r="16" cx="18" cy="18" fill="transparent" stroke="#DBD6C8" stroke-width="4"/>${arcs}</svg><div style="font-size:9.5px;line-height:2;">${charges1.map(([k,l,c])=>`<p style="margin:0;"><span style="color:${c};">●</span> ${esc(l)} — ${Math.round(Number(pf[k])/total*100)}%</p>`).join('')}</div></div>`;

function pagePlanFinancement(bp){
  const pf = (bp.sections||{}).plan_financier || {};
  const RESSOURCES = { pf_apport:"Apport personnel", pf_associes:"Associés", pf_famille:"Famille", pf_business_angels:"Business Angels", pf_banque:"Banque", pf_subvention:"Subvention", pf_investisseur:"Investisseur", pf_crowdfunding:"Crowdfunding", pf_diaspo_invest:"Diaspo'Invest", pf_autres_ress:"Autres ressources" };

  const ress = Object.entries(RESSOURCES).filter(([k])=>has(pf[k])&&Number(pf[k])>0);
  const emp = Object.entries(EMPLOIS).filter(([k])=>has(pf[k])&&Number(pf[k])>0);
  const totalRess = ress.reduce((s,[k])=>s+Number(pf[k]),0), totalEmp = emp.reduce((s,[k])=>s+Number(pf[k]),0);

  const immos = (pf.immobilisations_liste||[]).filter(i=>has(i.nom));
  const dettes = (pf.dettes||[]).filter(d=>has(d.nom));

  if (!ress.length && !emp.length && !immos.length && !dettes.length) return '';

  const planTable = (title, entries, total) => !entries.length ? '' : `<div style="flex:1;"><p class="block-title" style="margin-top:0;">${title}</p><table class="doc-table"><tbody>${entries.map(([k,l])=>`<tr><td>${esc(l)}</td><td>${fmtEUR(pf[k])}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${fmtEUR(total)}</td></tr></tbody></table></div>`;

  const immoTable = immos.length ? `<p class="block-title">Immobilisations</p><table class="doc-table"><thead><tr><th style="text-align:left;">Élément</th><th>Montant</th><th>Amortissement</th></tr></thead><tbody>${immos.map(i=>`<tr><td>${esc(i.nom)}</td><td>${has(i.montant)?fmtEUR(i.montant):'—'}</td><td>${has(i.duree_amortissement)?`${i.duree_amortissement} ans`:'—'}</td></tr>`).join('')}</tbody></table>` : '';
  const detteTable = dettes.length ? `<p class="block-title">Emprunts</p><table class="doc-table"><thead><tr><th style="text-align:left;">Emprunt</th><th>Montant</th><th>Taux</th><th>Durée</th><th>Mensualité</th></tr></thead><tbody>${dettes.map(d=>`<tr><td>${esc(d.nom)}</td><td>${has(d.montant)?fmtEUR(d.montant):'—'}</td><td>${has(d.taux)?pct(d.taux):'—'}</td><td>${has(d.duree)?`${d.duree} mois`:'—'}</td><td>${has(d.mensualite)?fmtEUR(d.mensualite):'—'}</td></tr>`).join('')}</tbody></table>` : '';

  return page('planfinancement','',`
    ${chromeTop(bp,'Plan de financement')}
    <p class="eyebrow-tag">Besoins & ressources de démarrage</p>
    <h2 class="pg-title">Plan de financement</h2>
    ${(ress.length||emp.length) ? `<div style="display:flex;gap:20px;margin-bottom:6px;">${planTable('Ressources', ress, totalRess)}${planTable('Emplois', emp, totalEmp)}</div>${(totalRess&&totalEmp&&Math.abs(totalRess-totalEmp)>1) ? `<p style="font-size:10px;color:var(--dp-orange);margin:0 0 14px;">⚠️ Écart entre ressources et emplois : ${fmtEUR(Math.abs(totalRess-totalEmp))}.</p>` : ''}` : ''}
    ${immoTable}

    ${chromeBottom()}
  `);
}

/* ---- Page : Trésorerie mensuelle ----
   cf_{poste}_{Mn} déjà saisis dans l'éditeur (12 colonnes) -- ici uniquement l'agrégation
   entrées/sorties par mois + le solde cumulé, jamais une donnée recalculée différemment. */
function pageTresorerie(bp){
  const pf = (bp.sections||{}).plan_financier || {};
  const ENTREES = ['ventes','subventions','emprunts'], SORTIES = ['salaires','fournisseurs','impots','charges_sociales','publicite','internet','assurances','carburant','eau','electricite'];
  const mois = Array.from({length:12}, (_,i) => i+1);
  const data = mois.map(m => {
    const entree = ENTREES.reduce((s,p)=>s+(Number(pf[`cf_${p}_M${m}`])||0),0);
    const sortie = SORTIES.reduce((s,p)=>s+(Number(pf[`cf_${p}_M${m}`])||0),0);
    return { m, entree, sortie, net: entree-sortie };
  });
  if (!data.some(d=>d.entree||d.sortie)) return '';
  let cumul = 0;
  const cumules = data.map(d => cumul += d.net);
  const maxAbs = Math.max(...data.map(d=>Math.abs(d.net)), 1);
  const bw = 640/12, gap=6, midY=60;
  const bars = data.map((d,i) => {
    if (!d.net) return '';
    const h = Math.round((Math.abs(d.net)/maxAbs)*50);
    const x = i*bw+gap/2, y = d.net>=0 ? midY-h : midY;
    return `<rect x="${x}" y="${y}" width="${bw-gap}" height="${h}" style="fill:${d.net>=0?'var(--dp-green,#1A7A52)':'#B5451F'}" opacity="0.85"/>`;
  }).join('');
  const chart = `<p class="block-title">Solde de trésorerie mensuel (entrées − sorties)</p><svg width="100%" height="130" viewBox="0 0 660 130" preserveAspectRatio="xMinYMid meet"><line x1="0" y1="${midY}" x2="660" y2="${midY}" stroke="var(--dp-line)"/>${bars}${mois.map((m,i)=>`<text x="${i*bw+bw/2}" y="122" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" style="fill:var(--dp-ink-soft)">M${m}</text>`).join('')}</svg>`;
  const dernierCumul = cumules[cumules.length-1];
  const kRow = kpiRow([
    ['Solde cumulé fin d\'année', fmtEUR(dernierCumul)],
    ['Mois le plus tendu', fmtEUR(Math.min(...cumules))],
    ['Mois le plus favorable', fmtEUR(Math.max(...cumules))],
  ]);
  return page('tresorerie','',`
    ${chromeTop(bp,'Trésorerie')}
    <p class="eyebrow-tag">Prévisionnel mensuel — Année 1</p>
    <h2 class="pg-title">Trésorerie mois par mois</h2>
    <p class="pg-sub" style="max-width:100%;">Un projet rentable sur l'année peut manquer de trésorerie un mois donné si les encaissements arrivent après les décaissements — c'est ce que cette page vérifie.</p>
    ${kRow}
    ${chart}
    ${chromeBottom()}
  `);
}

/* ---- Page générique (sections non encore dotées d'une mise en page dédiée) ---- */
function pageGenerique(bp, key, label, eyebrow, headline){
  const data = (bp.sections||{})[key] || {};
  const schema = FIELD_LABELS[key];
  let content = schema ? fieldGrid(data, schema) : '';
  // Le titre de bloc ne se répète que si un contenu principal (field-grid) le précède déjà —
  // sinon le tableau EST le contenu de la page et un second titre ferait doublon avec le <h2>.
  const hadContent = !!content;
  if (key === 'produits' && Array.isArray(data.items) && data.items.length) {
    content += `${hadContent?'<p class="block-title">Catalogue</p>':''}<table class="doc-table"><thead><tr><th style="text-align:left;">Produit</th><th style="text-align:left;">Description</th><th>Prix</th><th>Marge</th></tr></thead><tbody>${data.items.filter(i=>has(i.nom)).map(i=>`<tr><td>${esc(i.nom)}</td><td style="text-align:left;">${esc(i.description||'—')}</td><td>${esc(i.prix_vente||'—')}</td><td>${has(i.marge)?esc(i.marge)+'%':'—'}</td></tr>`).join('')}</tbody></table>`;
  }
  if (key === 'calendrier' && Array.isArray(data.phases) && data.phases.length) {
    content += `${hadContent?'<p class="block-title">Jalons</p>':''}<table class="doc-table"><thead><tr><th style="text-align:left;">Phase</th><th style="text-align:left;">Période</th><th style="text-align:left;">Statut</th></tr></thead><tbody>${data.phases.filter(p=>has(p.nom)).map(p=>`<tr><td>${esc(p.nom)}</td><td style="text-align:left;">${[p.debut&&fmtDate(p.debut),p.fin&&fmtDate(p.fin)].filter(Boolean).join(' → ')||'—'}</td><td style="text-align:left;">${esc(p.statut||'—')}</td></tr>`).join('')}</tbody></table>`;
  }
  if (key === 'plan_commercial') {
    const f = [['nb_prospects_funnel','Prospects'],['nb_contacts_funnel','Contacts'],['nb_rdv_funnel','RDV'],['nb_propositions_funnel','Propositions'],['nb_contrats_funnel','Clients']].map(([k,l]) => [l, parseNum(data[k])]).filter(([,v]) => v!=null && v>=0);
    if (f.length >= 2) content = funnelDiagram(f) + content;
    const kpis = kpiRow([['CAC (via commercial)', data.ca_par_commercial],['Panier moyen', has(data.panier_moyen_commercial)?fmtEUR(data.panier_moyen_commercial):''],['Cycle de vente moyen', data.cycle_vente_moyen],['Objectif mensuel', has(data.objectif_mensuel_commercial)?fmtEUR(data.objectif_mensuel_commercial):'']]);
    if (kpis) content = kpis + content;
  }
  // Chaîne opérationnelle : quand au moins 2 des étapes classiques sont renseignées, la
  // séquence fournisseur → production → qualité → logistique se lit d'un coup d'œil plutôt
  // que d'être éclatée en 4 blocs de texte sans lien visible entre eux. Les intitulés
  // eux-mêmes ne sont jamais inventés, seul l'ORDRE (déjà logique dans tout process de
  // production) vient du gabarit -- le contenu de chaque étape reste le texte saisi.
  if (key === 'plan_operationnel') {
    const stages = [['Fournisseurs',data.fournisseurs],['Production',data.production],['Contrôle qualité',data.qualite],['Logistique',data.logistique]].filter(([,v])=>has(v));
    if (stages.length >= 2) content = processFlow(stages) + content;
  }
  // Profil agricole : la capacité de production prime sur le texte libre -- remontée en KPI
  // cards plutôt que noyée dans le champ "Capacité actuelle" en prose.
  if (key === 'plan_operationnel' && classifyProfile(bp).agriculture) {
    const agri = (((bp.sections||{}).produits||{}).capacite_exploitation||[]).find(c => has(c.capacite_actuelle)||has(c.volume_actuel)||has(c.saisonnalite));
    const kpis = kpiRow([
      ['Capacité actuelle', data.capacite_actuelle_globale || agri?.capacite_actuelle],
      ['Capacité maximale', data.capacite_maximale_globale || agri?.capacite_maximale],
      ['Taux d\'utilisation', pct(data.taux_utilisation_op)],
      ['Saisonnalité', agri?.saisonnalite],
    ]);
    if (kpis) content = kpis + content;
  }
  if (key === 'annexes' && Array.isArray(data.items) && data.items.length) {
    const rows = data.items.filter(a=>has(a.nom));
    content += `<table class="doc-table"><thead><tr><th style="text-align:left;">N°</th><th style="text-align:left;">Document</th><th style="text-align:left;">Type</th><th style="text-align:left;">Description</th><th style="text-align:left;">Accès</th></tr></thead><tbody>${rows.map((a,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(a.nom)}</td><td style="text-align:left;">${esc(a.type||'—')}</td><td style="text-align:left;">${esc(a.description||'—')}</td><td style="text-align:left;">${has(a.url)?`<div id="qr-annexe-${bp.id}-${i}" class="annexe-qr" data-url="${esc(a.url)}"></div>`:'—'}</td></tr>`).join('')}</tbody></table>`;
  }
  if (key === 'impact' && Array.isArray(data.indicateurs) && data.indicateurs.length) {
    content = kpiRow(data.indicateurs.filter(i=>has(i.nom)&&has(i.valeur_actuelle)).map(i=>[i.nom, i.valeur_actuelle, has(i.valeur_cible)?`Cible : ${i.valeur_cible}`:''])) + content;
  }
  if (key === 'impact') {
    content = kpiRow([['Bénéficiaires directs', data.beneficiaires_directs],['Bénéficiaires indirects', data.beneficiaires_indirects],['Emplois directs créés', data.emplois_directs],['Emplois indirects', data.emplois_indirects]]) + content;
  }
  if (!content || !content.trim()) return '';
  return page(key,'',`
    ${chromeTop(bp,label)}
    <p class="eyebrow-tag">${esc(eyebrow)}</p>
    <h2 class="pg-title">${esc(headline)}</h2>
    ${content}
    ${chromeBottom()}
  `);
}

/* ---- Assemblage ----
   Chaque section générique porte 3 textes distincts, comme les pages « héros » :
   [libellé classique (repère en haut de page), accroche éditoriale, titre développé]. */
const GENERIC_SECTIONS = {
  probleme: ['Analyse du problème','Le problème','Ce que nous résolvons'],
  solution: ['Solution proposée','La solution','Comment nous le résolvons'],
  produits: ['Produits & services','Ce que nous vendons','Notre catalogue'],
  strategie_marketing: ['Stratégie marketing','Acquisition','Comment nous trouvons nos clients'],
  plan_commercial: ['Plan commercial','Approche commerciale','De la prospection au contrat'],
  plan_operationnel: ['Plan opérationnel','Fonctionnement','Comment ça tourne au quotidien'],
  organisation: ['Organisation & gouvernance','Gouvernance','Qui décide quoi'],
  rh: ['Ressources humaines','Effectifs','Recruter au bon rythme'],
  calendrier: ['Calendrier de mise en œuvre','Feuille de route','Les prochaines étapes'],
  impact: ['Impact','Retombées','Impact économique, social & environnemental'],
  annexes: ['Annexes','Pièces jointes','Documents complémentaires'],
};
function pageGeneriqueLabels(bp,key){ const [chrome,eyebrow,headline] = GENERIC_SECTIONS[key]; return { id:key, label:chrome, html: pageGenerique(bp,key,chrome,eyebrow,headline) }; }
const generic = (bp,key) => pageGeneriqueLabels(bp,key);

let DOSSIER_BP = null; // rendu accessible à generatePPTX() une fois le chargement terminé

/* Construit (ou reconstruit, au changement de gabarit) l'intégralité du document dans le DOM.
   Séparée de init() pour être rappelable par onTemplateChange() sans re-fetcher les données. */
function renderDossier(bp, tplKey, formatKey){
  const tpl = TEMPLATES[tplKey] || TEMPLATES.premium;
  const format = FORMATS[formatKey] || FORMATS.complet;

  // Ordre narratif investisseur : la thèse, puis le problème/solution, la preuve, le marché
  // et le modèle, le détail opérationnel, la finance, et enfin l'équipe qui porte tout ça.
  const pageDefs = [
    { id:'resume', label:'Résumé exécutif', html: pageResume(bp) },
    generic(bp,'probleme'), generic(bp,'solution'),
    { id:'traction', label:'Traction', html: pageTraction(bp) },
    { id:'marche', label:'Marché', html: pageMarche(bp) },
    { id:'pestel', label:'Matrice PESTEL', html: pagePESTEL(bp) },
    { id:'persona', label:'Persona', html: pagePersona(bp) },
    { id:'swot', label:'Analyse SWOT', html: pageSWOT(bp) },
    { id:'bmc', label:'Business Model', html: pageBMC(bp) },
    generic(bp,'produits'),
    { id:'bcg', label:'Matrice BCG', html: pageBCG(bp) },
    generic(bp,'strategie_marketing'), generic(bp,'plan_commercial'),
    { id:'capsoncas', label:'CAP-SONCAS', html: pageCapSoncas(bp) },
    generic(bp,'plan_operationnel'), generic(bp,'organisation'), generic(bp,'rh'), generic(bp,'calendrier'),
    { id:'finances', label:'Plan financier', html: pageFinances(bp) },
    { id:'planfinancement', label:'Plan de financement', html: pagePlanFinancement(bp) },
    { id:'tresorerie', label:'Trésorerie', html: pageTresorerie(bp) },
    { id:'risques', label:'Analyse des risques', html: pageRisques(bp) },
    generic(bp,'impact'),
    { id:'financement', label:'Financement', html: pageFinancement(bp) },
    generic(bp,'annexes'),
    { id:'equipe', label:'Équipe', html: pageEquipe(bp) },
  ].filter(p => p.html).filter(p => !format.ids || format.ids.includes(p.id));

  // Pages de séparation de chapitre : une grande composition graphique, peu de texte, insérée
  // avant la première page réellement présente de chaque chapitre -- jamais de chapitre listé
  // s'il n'a produit aucune page (calculé sur pageDefs déjà filtré, pas sur une liste figée).
  const CHAPTERS = [
    { num:1, titre:'Le projet', sous:'Résumé, problème et solution', ids:['resume','probleme','solution'] },
    { num:2, titre:'Marché & traction', sous:'Étude de marché, positionnement et preuves', ids:['traction','marche','pestel','persona','swot'] },
    { num:3, titre:'Modèle & opérations', sous:'Business model, produits et organisation', ids:['bmc','produits','bcg','strategie_marketing','plan_commercial','capsoncas','plan_operationnel','organisation','rh','calendrier'] },
    { num:4, titre:'Finances', sous:'Trajectoire financière, risques et impact', ids:['finances','planfinancement','tresorerie','risques','impact','financement'] },
    { num:5, titre:"Équipe & annexes", sous:'Qui porte le projet', ids:['equipe','annexes'] },
  ];
  let currentChapitre = null, bodyHtml = '';
  pageDefs.forEach(p => {
    const chap = CHAPTERS.find(c => c.ids.includes(p.id));
    if (chap && chap.num !== currentChapitre) {
      currentChapitre = chap.num;
      const itemsLabels = pageDefs.filter(pd => chap.ids.includes(pd.id)).map(pd => pd.label);
      bodyHtml += pageChapitre(bp, tpl, chap.num, chap.titre, chap.sous, itemsLabels);
    }
    bodyHtml += p.html;
  });

  const stage = document.getElementById('dossier-stage');
  stage.innerHTML = pageCouverture(bp, tpl) + pageToc(bp) + bodyHtml + pageConclusion(bp, tpl);

  // Table des matières + numérotation, calculées sur les pages réellement produites.
  const sheets = [...stage.querySelectorAll('.sheet')];
  sheets.forEach((sheet, i) => {
    const n = i+1;
    const badge = sheet.querySelector('.dp-pagenum');
    if (badge) badge.textContent = `${String(n).padStart(2,'0')} / ${sheets.length}`;
  });
  const tocList = document.getElementById('dp-toc-list');
  if (tocList) {
    const entries = pageDefs.map(p => ({ label:p.label, num: sheets.findIndex(s=>s.dataset.pageId===p.id)+1 }));
    tocList.innerHTML = entries.map((e,i) => `<div style="display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--dp-line);font-size:12px;"><span style="font-family:var(--dp-mono);color:var(--dp-orange);font-weight:600;">${String(i+1).padStart(2,'0')}</span><span style="flex:1;">${esc(e.label)}</span><span style="font-family:var(--dp-mono);color:var(--dp-ink-soft);">${String(e.num).padStart(2,'0')}</span></div>`).join('');
  }

  renderAnnexeQRCodes();
}

/* QR codes sur les annexes qui ont un lien -- posés après coup (la bibliothèque dessine dans
   un élément DOM déjà présent, elle ne peut pas produire une chaîne HTML à l'avance). Si le
   CDN n'a pas encore fini de charger, on réessaie une fois après un court délai plutôt que de
   laisser des cases vides silencieusement. */
function renderAnnexeQRCodes(attempt){
  const zones = document.querySelectorAll('.annexe-qr');
  if (!zones.length) return;
  if (typeof QRCode === 'undefined') {
    if ((attempt||0) < 5) setTimeout(() => renderAnnexeQRCodes((attempt||0)+1), 300);
    return;
  }
  zones.forEach(el => {
    if (el.dataset.rendered) return;
    el.innerHTML = '';
    new QRCode(el, { text: el.dataset.url, width: 88, height: 88, colorDark: ACTIVE_TPL.navy, colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
    el.dataset.rendered = '1';
  });
}

/* ===========================================================================
   GÉNÉRATION POWERPOINT — 100% côté navigateur (pptxgenjs, chargé en CDN, voir
   <head>). Réutilise exactement les mêmes données que le PDF (DOSSIER_BP), mais
   une mise en page bien plus synthétique : diapositives courtes, un message par
   diapo, jamais une page du PDF recopiée telle quelle. Polices "sûres" (Calibri/
   Cambria) plutôt que Space Grotesk/Public Sans : contrairement au PDF (rendu
   par le navigateur qui embarque la police), un .pptx s'ouvre avec les polices
   installées sur le PC du destinataire — une police non standard retomberait
   silencieusement sur autre chose et pourrait décaler les textes.
   =========================================================================== */
function logoToPng(size){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      canvas.getContext('2d').drawImage(img, 0, 0, size, size);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error('Logo introuvable'));
    img.src = LOGO_DATA;
  });
}

    {
      const fi = s.financement||{}, pf = s.plan_financier||{};
      const emplois = [['pf_terrain','Terrain'],['pf_construction','Construction'],['pf_materiel','Matériel'],['pf_vehicules','Véhicules'],['pf_logiciels','Logiciels'],['pf_stocks','Stocks'],['pf_tresorerie','Trésorerie'],['pf_frais_admin','Frais admin.'],['pf_communication','Communication'],['pf_recrutement','Recrutement']].filter(([k])=>has(pf[k])&&Number(pf[k])>0);
      if (has(fi.montant) || emplois.length>=2) {
        const slide = pres.addSlide(); slide.background = { color: C.white };
        chrome(slide, 'Funding Need');
        title(slide, has(fi.montant) ? `${fmtEUR(fi.montant)} recherchés` : 'Besoin de financement', { fontSize:26, h:0.9 });
        if (has(fi.utilisation)) sub(slide, fi.utilisation, 2.0);
        if (emplois.length>=2) {
          slide.addChart(pres.ChartType.pie, [{ name:'Utilisation des fonds', labels: emplois.map(([,l])=>l), values: emplois.map(([k])=>Number(pf[k])) }], {
            x:W-5.6, y:2.7, w:5.0, h:4.2, showTitle:false, showLegend:true, legendPos:'r', legendColor:C.soft, legendFontSize:9,
            showValue:false, showPercent:true, dataLabelColor:C.white, dataLabelFontSize:9,
            chartColors:[C.navy,C.orange,C.blue,C.green,'8B93A1','C7A76C','6B4C9A','3D8C7A','9C5A3C','5C6B8A'],
          });
        }
      }
    }

    /* ---------- Impact ---------- */
    {
      const im = s.impact||{};
      const cells = [ { label:'Bénéficiaires directs', value:im.beneficiaires_directs }, { label:'Emplois directs créés', value:im.emplois_directs }, { label:'Emplois indirects', value:im.emplois_indirects } ];
      if (cells.some(c=>has(c.value)) || has(im.social) || has(im.economique)) {
        const slide = pres.addSlide(); slide.background = { color: C.white };
        chrome(slide, 'Impact');
        title(slide, 'Impact économique, social & environnemental', { fontSize:22, h:0.7, y:1.0 });
        statRow(slide, 1.85, cells, 1.3);
        const texts = [['Impact économique',im.economique],['Impact social',im.social]].filter(([,v])=>has(v));
        texts.forEach(([l,v],i) => {
          slide.addText(l, { x:MX+i*6.2, y:3.5, w:5.8, h:0.35, fontFace:FB, fontSize:10, bold:true, color:C.navy });
          slide.addText(v, { x:MX+i*6.2, y:3.9, w:5.8, h:2.5, fontFace:FB, fontSize:11.5, color:C.ink, valign:'top' });
        });
      }
    }

    /* ---------- Risques ---------- */
    {
      const items = (s.risques?.items||[]).filter(r=>has(r.description));
      if (items.length) {
        const slide = pres.addSlide(); slide.background = { color: C.white };
        chrome(slide, 'Risks');
        title(slide, 'Ce qui pourrait mal tourner', { fontSize:24, h:0.7, y:1.0 });
        const rows = [[{text:'Risque',options:{bold:true,color:C.white,fill:{color:C.navy}}},{text:'Probabilité',options:{bold:true,color:C.white,fill:{color:C.navy}}},{text:'Impact',options:{bold:true,color:C.white,fill:{color:C.navy}}},{text:'Prévention',options:{bold:true,color:C.white,fill:{color:C.navy}}}]]
          .concat(items.slice(0,6).map(r => [r.description||'—', r.probabilite||'—', r.impact||'—', r.prevention||'—']));
        slide.addTable(rows, { x:MX, y:1.9, w:W-MX*2, colW:[4.4,2.1,2.1,3.7], fontFace:FB, fontSize:10, color:C.ink, border:{type:'solid', color:C.line, pt:0.5}, autoPage:false });
      }
    }

    /* ---------- Équipe ---------- */
    {
      const membres = (s.infos_generales?.membres_equipe||[]).filter(m=>has(m.nom));
      if (membres.length || has(s.infos_generales?.equipe_fondatrice)) {
        const slide = pres.addSlide(); slide.background = { color: C.white };
        chrome(slide, 'Team');
        title(slide, 'Qui porte le projet', { fontSize:26, h:0.9 });
        if (membres.length) {
          const cols = Math.min(membres.length,4), gap=0.25, cw=(W-MX*2-gap*(cols-1))/cols;
          const palette=[C.navy,C.orange,C.blue,C.green];
          membres.slice(0,4).forEach((m,i) => {
            const x = MX+i*(cw+gap), y = 2.4;
            const initials = (m.nom||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
            slide.addShape(OV, { x:x+cw/2-0.4, y, w:0.8, h:0.8, fill:{color:palette[i%4]}, line:{type:'none'} });
            slide.addText(initials, { x:x+cw/2-0.4, y, w:0.8, h:0.8, align:'center', valign:'middle', fontFace:FD, fontSize:16, bold:true, color:C.white });
            slide.addText(m.nom, { x, y:y+0.95, w:cw, h:0.35, align:'center', fontFace:FB, fontSize:12, bold:true, color:C.ink });
            if (has(m.fonction)) slide.addText(m.fonction, { x, y:y+1.28, w:cw, h:0.3, align:'center', fontFace:FB, fontSize:9.5, color:C.orange });
            const desc = [m.formation, m.experience_secteur].filter(has).join(' · ');
            if (has(desc)) slide.addText(desc, { x, y:y+1.6, w:cw, h:0.8, align:'center', fontFace:FB, fontSize:9, color:C.soft, valign:'top' });
          });
        } else {
          sub(slide, s.infos_generales.equipe_fondatrice, 2.2);
        }
      }
    }

    /* ---------- Conclusion / Contact ---------- */
    {
      const fi = s.financement||{}, ig = s.infos_generales||{};
      const slide = pres.addSlide(); slide.background = { color: C.dark };
      if (logoPng) slide.addImage({ data: logoPng, x:MX, y:0.6, w:0.7, h:0.7 });
      slide.addText('PROCHAINE ÉTAPE', { x:MX, y:2.6, w:W-MX*2, h:0.4, fontFace:FB, fontSize:11, color:C.orange, charSpacing:1.5, bold:true });
      const ask = has(fi.montant) ? `${fmtEUR(fi.montant)} recherchés${has(fi.utilisation)?' — '+fi.utilisation.split(/[.\n]/)[0]:''}.` : 'Merci de l\'attention portée à ce dossier.';
      slide.addText(ask, { x:MX, y:3.05, w:W-MX*2, h:1.3, fontFace:FD, fontSize:26, bold:true, color:C.white, valign:'top' });
      const contactBits = [ig.responsable, ig.email].filter(has);
      if (contactBits.length) slide.addText(contactBits.join('   ·   '), { x:MX, y:4.6, w:W-MX*2, h:0.4, fontFace:FB, fontSize:12, color:'D8DCE3' });
      slide.addText('DIASPO\'ACTIF — ÉCOSYSTÈME DIASPORA', { x:MX, y:7.5-0.6, w:8, h:0.3, fontFace:FB, fontSize:8.5, color:'6B7280', charSpacing:1 });
    }

    const fileName = `${(bp.nom_projet||'business-plan').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase()}-dossier-investisseur.pptx`;
    await pres.writeFile({ fileName });
  } catch(e) {
    console.error(e);
    alert("Erreur lors de la génération du PowerPoint : " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '📊 Générer le PowerPoint';
  }
}

function showError(msg){
  document.getElementById('dossier-loading').style.display = 'none';
  const el = document.getElementById('dossier-error');
  el.style.display = '';
  el.innerHTML = `<div style="font-size:40px;margin-bottom:10px;">🚫</div><p>${esc(msg)}</p><a href="business-plan.html" class="btn btn-outline" style="margin-top:12px;display:inline-block;">← Retour à mes Business Plans</a>`;
}

init();
</script>
<script src="assets/back-button.js"></script>
</body>
</html>
