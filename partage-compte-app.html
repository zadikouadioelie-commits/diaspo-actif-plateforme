<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060A14">
<title>Diaspo'Actif</title>
<meta name="description" content="Diaspo'Actif, la plateforme de la diaspora.">
<meta property="og:title" content="Diaspo'Actif">
<meta property="og:image" content="https://diaspoactif.com/assets/logo.png">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Design « Nuit dorée » (assets/theme-nuit-doree.css) : nuit bleue, verre dépoli, or, titres Bodoni */
  :root{
    --nuit:#060A14; --nuit2:#0B1226; --texte:#E8ECF6; --doux:#A9B4CC; --faible:#7C88A4;
    --or:#E3C06E; --or2:#B9893A; --verre:rgba(255,255,255,.045); --verre2:rgba(255,255,255,.08);
    --bord:rgba(227,192,110,.24); --bord2:rgba(255,255,255,.09);
    --degore:linear-gradient(135deg,#F3DC9B 0%,#E3C06E 38%,#B9893A 100%);
    --display:"Bodoni Moda","Didot",Georgia,serif; --sans:"Manrope","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:var(--nuit);color:var(--texte);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:22px 14px 34px;position:relative}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(520px 520px at -4% 14%,rgba(40,80,190,.42),transparent 70%),radial-gradient(460px 460px at 104% 40%,rgba(150,105,25,.30),transparent 70%),radial-gradient(420px 420px at 40% 108%,rgba(30,70,170,.34),transparent 70%),radial-gradient(ellipse at 50% -10%,#14234a 0%,var(--nuit) 62%)}
  .marque{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.02em;margin:2px 0 16px;text-decoration:none}
  .marque img{width:38px;height:38px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 1.5px var(--bord)}
  .invit{max-width:460px;width:100%;color:var(--doux);font-size:14.5px;line-height:1.5;text-align:center;margin:0 0 14px}
  .invit b{color:var(--or);font-weight:700}
  .carte{width:100%;max-width:460px;background:linear-gradient(160deg,rgba(23,37,77,.85),rgba(10,16,36,.92));border:1px solid var(--bord);border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -30px #000,0 0 0 1px rgba(255,255,255,.03) inset}
  .couv{height:150px;background:linear-gradient(135deg,#0B1226,#1B3A7A 60%,#B9893A) center/cover no-repeat;position:relative}
  .couv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,16,36,.85))}
  .tete{position:relative;padding:0 20px}
  .avatar{width:92px;height:92px;border-radius:50%;border:3px solid var(--or);background:var(--degore);color:#1a1202;font-family:var(--display);font-weight:600;font-size:32px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:-46px;box-shadow:0 10px 26px -8px rgba(0,0,0,.7),0 0 0 4px rgba(6,10,20,.6);position:relative;z-index:1}
  .avatar.carre{border-radius:22px}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{margin:12px 0 8px;font-family:var(--display);font-weight:500;font-size:27px;line-height:1.15;letter-spacing:-.005em;color:#fff;word-break:break-word}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
  .badge{display:inline-block;background:var(--verre2);color:var(--texte);border:1px solid var(--bord2);font-weight:700;font-size:12.5px;border-radius:999px;padding:4px 12px}
  .badge.v{background:rgba(227,192,110,.14);border-color:var(--bord);color:var(--or)}
  .corps{padding:6px 20px 22px}
  .infos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
  .infos div{background:var(--verre);border:1px solid var(--bord2);border-radius:14px;padding:9px 10px;min-width:0}
  .infos span{display:block;font-size:10.5px;font-weight:700;color:var(--or);text-transform:uppercase;letter-spacing:.1em}
  .infos b{display:block;font-size:13.5px;line-height:1.25;margin-top:3px;color:#fff;font-weight:700;word-break:break-word}
  .desc{font-size:15px;line-height:1.6;color:var(--doux);margin:12px 0 0;white-space:pre-line;word-break:break-word}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;text-align:center;padding:0 18px;transition:transform .2s}
  .btn:active{transform:scale(.98)}
  .btn.p{background:var(--degore);color:#1a1202;box-shadow:0 10px 28px -10px rgba(227,192,110,.65)}
  .btn.s{background:var(--verre);color:var(--texte);border:1px solid var(--bord)}
  .btn:focus-visible{outline:3px solid var(--or);outline-offset:2px}
  .pied{max-width:460px;color:var(--faible);font-size:12.5px;text-align:center;margin:18px 0 0}
  @media (max-width:380px){.infos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<a class="marque" href="/"><img src="/assets/logo.png" alt=""><span>Diaspo’Actif</span></a>
<!--INVITATION-->
<!--CARTE-->
<p class="pied">Diaspo’Actif · Du Sud au Nord · 2026</p>
</body>
</html>
