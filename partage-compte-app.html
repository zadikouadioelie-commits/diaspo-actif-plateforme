<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D2B4E">
<title>Diaspo'Actif</title>
<meta name="description" content="Diaspo'Actif, la plateforme de la diaspora.">
<meta property="og:title" content="Diaspo'Actif">
<meta property="og:image" content="https://diaspoactif.com/assets/logo.png">
<link rel="icon" href="/assets/logo.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:linear-gradient(160deg,#0D2B4E 0%,#14407A 55%,#1B5BA8 100%);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#0D1B2A;display:flex;flex-direction:column;align-items:center;padding:22px 14px 34px}
  .marque{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;margin:2px 0 16px;text-decoration:none}
  .marque img{width:38px;height:38px;border-radius:50%;background:#fff;padding:3px}
  .invit{max-width:460px;width:100%;color:#DCE8F8;font-size:14.5px;line-height:1.45;text-align:center;margin:0 0 12px}
  .invit b{color:#fff}
  .carte{width:100%;max-width:460px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .couv{height:150px;background:linear-gradient(135deg,#0D2B4E,#1B5BA8 60%,#F26422) center/cover no-repeat}
  .tete{position:relative;padding:0 20px}
  .avatar{width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:#1B4B8C;color:#fff;font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:-46px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .avatar.carre{border-radius:20px}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{margin:10px 0 6px;font-size:22px;line-height:1.2;color:#0D1B2A;word-break:break-word}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
  .badge{display:inline-block;background:#EEF4FF;color:#1B3A6B;font-weight:700;font-size:12.5px;border-radius:999px;padding:4px 11px}
  .badge.v{background:#E7F8EE;color:#15803D}
  .corps{padding:6px 20px 22px}
  .infos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .infos div{background:#F2F6FC;border-radius:12px;padding:8px 9px;min-width:0}
  .infos span{display:block;font-size:10.5px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.02em}
  .infos b{display:block;font-size:13.5px;line-height:1.25;margin-top:2px;word-break:break-word}
  .desc{font-size:15px;line-height:1.55;color:#334155;margin:10px 0 0;white-space:pre-line;word-break:break-word}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;text-align:center;padding:0 18px}
  .btn.p{background:#F26422;color:#fff}
  .btn.s{background:#fff;color:#0D2B4E;border:2px solid #0D2B4E}
  .pied{max-width:460px;color:#9FB6D6;font-size:12.5px;text-align:center;margin:16px 0 0}
  @media (max-width:380px){.infos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<a class="marque" href="/"><img src="/assets/logo.png" alt=""><span>Diaspo’Actif</span></a>
<!--INVITATION-->
<!--CARTE-->
<p class="pied">Diaspo’Actif · Du Sud au Nord · 2026</p>
</body>
</html>
