<svg viewBox="0 0 1600 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="violetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241A38"/>
      <stop offset="55%" stop-color="#2E2148"/>
      <stop offset="100%" stop-color="#160F24"/>
    </linearGradient>
    <linearGradient id="violetReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A5A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A2A5A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="460" fill="url(#violetSky)"/>

  <!-- gratte-ciels -->
  <g fill="#160F24" opacity="0.9">
    <rect x="0"    y="220" width="60"  height="240"/>
    <rect x="70"   y="190" width="50"  height="270"/>
    <rect x="130"  y="240" width="80"  height="220"/>
    <rect x="220"  y="160" width="55"  height="300"/>
    <rect x="285"  y="210" width="45"  height="250"/>
    <rect x="340"  y="180" width="70"  height="280"/>
    <rect x="420"  y="250" width="50"  height="210"/>
    <rect x="480"  y="140" width="60"  height="320"/>
    <rect x="550"  y="200" width="55"  height="260"/>
  </g>
  <g fill="#E9C9FF" opacity="0.35">
    <circle cx="20"  cy="260" r="1.5"/><circle cx="40" cy="300" r="1.5"/><circle cx="90"  cy="230" r="1.5"/>
    <circle cx="240" cy="210" r="1.5"/><circle cx="260" cy="260" r="1.5"/><circle cx="360" cy="220" r="1.5"/>
    <circle cx="500" cy="190" r="1.5"/><circle cx="520" cy="240" r="1.5"/>
  </g>

  <!-- reflet dans l'eau -->
  <rect x="0" y="370" width="1600" height="90" fill="url(#violetReflect)"/>

  <!-- anneaux concentriques -->
  <g fill="none" stroke="#C48CFF">
    <g opacity="0.55" transform="translate(70,60)">
      <circle r="30"/><circle r="48"/><circle r="66"/><circle r="84"/>
    </g>
    <g opacity="0.45" transform="translate(1480,260)">
      <circle r="60"/><circle r="90"/><circle r="120"/><circle r="150"/>
    </g>
  </g>
</svg>
