<style>
.vo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px;}
.vo-card{border:1px solid var(--border);border-radius:14px;padding:18px;}
.vo-nom{font-size:16px;font-weight:800;margin:0 0 4px;}
.vo-meta{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px;}
.vo-resolution{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.vo-choix-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.vo-choix-pill{padding:10px 20px;border:2px solid var(--border);border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;min-height:44px;display:flex;align-items:center;}
.vo-choix-pill.selected{border-color:var(--orange);background:var(--orange);color:#fff;}
.vo-choix-pill[aria-pressed="true"]::before{content:'✓ ';margin-right:4px;}
.vo-choix-pill:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px;}
.notice{background:#fff3e0;border:1px solid #ffb74d;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img class="logo-img" src="assets/logo.png" alt="Diaspo'Actif"> DIASPO'ACTIF</div>
    <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="annuaire.html">Annuaire</a>
        <a href="vitrines.html">Boutiques</a>
    </nav>
    <div class="topbar-right"><div id="auth-area" class="auth-area"></div></div>
  </div>
</header>

<div class="container" style="padding-top:20px;">
  <div class="flex-between" style="margin-bottom:16px;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 style="margin:0;">🗳️ Mes votes</h1>
      <p style="margin:4px 0 0;color:var(--muted);font-size:13px;">Consultations, assemblées générales et élections auxquelles vous êtes invité(e). Chaque vote est signé avec votre <a href="confidentialite.html">Code de Sécurité Diaspo'Actif (DS-ID)</a>.</p>
    </div>
  </div>

  <div id="vo-liste"><div style="text-align:center;padding:40px;color:var(--muted);">Chargement…</div></div>

  <div id="vo-bulletin-zone" style="display:none;margin-top:30px;"></div>
</div>
</div><!-- /app -->

<script src="assets/ds.js"></script>
<script src="assets/demo.js?v=2"></script>
<script src="assets/app.js?v=13"></script>
<script>
const VOTE_TYPE_LABELS = { ag_ordinaire: 'AG ordinaire', ag_extraordinaire: 'AG extraordinaire', consultation: 'Consultation', election: 'Élection' };
const VOTE_STATUT_LABELS = { brouillon: '⚪ Brouillon', ouvert: '🟢 Ouvert', clos: '🔴 Fermé', annule: '⛔ Annulé' };

let MES_VOTES = [];

async function init(){
  try {
    const me = await api('GET', '/auth/me');
    if (!me.user) { location.href = `login.html?next=${encodeURIComponent(location.href)}`; return; }
  } catch(e) { location.href = `login.html?next=${encodeURIComponent(location.href)}`; return; }

  try {
    const r = await api('GET', '/mes-votes');
    MES_VOTES = r.votes || [];
    renderListe();
  } catch(e) {
    document.getElementById('vo-liste').innerHTML = `<div class="notice">Erreur : ${e.message}</div>`;
  }
}

function escHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

function renderListe(){
  const el = document.getElementById('vo-liste');
  if (!MES_VOTES.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">Aucun vote pour le moment.</div>';
    return;
  }
  el.innerHTML = `<div class="vo-grid">
    ${MES_VOTES.map(v => `
      <div class="vo-card" style="overflow:hidden;">
        ${v.image_url ? `<div style="height:120px;margin:-16px -16px 10px;background:url('${escHtml(v.image_url)}') center/cover;"></div>` : ''}
        <div class="vo-nom">${escHtml(v.nom)}</div>
        <div class="vo-meta">${escHtml(v.init_nom)} — ${VOTE_TYPE_LABELS[v.type_scrutin]||v.type_scrutin} — ${VOTE_STATUT_LABELS[v.statut]||v.statut}</div>
        ${v.a_vote ? '<p style="color:#10b981;font-weight:700;">✅ Vous avez déjà voté</p>' :
          v.statut === 'ouvert' ? `<button class="btn btn-orange" onclick="ouvrirAuth(${v.id})">Participer au vote</button>` :
          '<p style="color:var(--muted);font-size:13px;">Non disponible pour le moment.</p>'}
      </div>`).join('')}
  </div>`;
}

let VOTE_SCRUTIN_ID = null;
let VOTE_RESOLUTIONS = [];
let VOTE_REPONSES = {};

async function ouvrirAuth(scrutinId){
  const code = prompt('Entrez votre Code de Sécurité Diaspo\'Actif (DS-ID) pour signer votre bulletin.\nVous ne l\'avez pas encore ? Générez-le dans Profil → Confidentialité :');
  if (!code) return;
  try {
    const r = await api('POST', `/vote-scrutins/${scrutinId}/authentifier`, { code });
    VOTE_SCRUTIN_ID = scrutinId;
    VOTE_RESOLUTIONS = r.resolutions || [];
    VOTE_REPONSES = {}; VOTE_COMMENTS = {}; VOTE_MAX = {}; VOTE_OPTS = {};
    renderBulletin(r.scrutin, code);
  } catch(e) {
    notifier(e.message, 'danger');
  }
}

function renderBulletin(scrutin, code){
  const zone = document.getElementById('vo-bulletin-zone');
  zone.style.display = 'block';
  zone.innerHTML = `
    <h2>🗳️ ${escHtml(scrutin.nom)}</h2>
    ${VOTE_RESOLUTIONS.map(r => renderResolution(r)).join('')}
    <button class="btn btn-orange" style="margin-top:10px;" onclick="soumettreBulletin('${code}')">✅ Valider mon vote</button>
  `;
  zone.scrollIntoView({ behavior: 'smooth' });
}

/* ── Questions (2026-10-10) : réponses à choix (une, deux au maximum, plusieurs), Oui / Non, réponse libre, commentaire facultatif.
      Toutes les valeurs passent par des attributs data-* : aucune réponse n'est jamais collée dans un attribut onclick (une option contenant une
      apostrophe cassait l'ancien affichage). ── */
let VOTE_OPTS = {};      // résolution -> liste des réponses proposées
let VOTE_MAX = {};       // résolution -> nombre de réponses acceptées
let VOTE_COMMENTS = {};  // résolution -> commentaire facultatif

function notifier(message, type){
  let z = document.getElementById('vo-notif');
  if (!z) { z = document.createElement('div'); z.id = 'vo-notif'; z.setAttribute('role', 'alert'); z.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;max-width:92vw;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);color:#fff;'; document.body.appendChild(z); }
  z.style.background = type === 'danger' ? '#b91c1c' : '#b45309';
  z.textContent = message; z.style.display = 'block';
  clearTimeout(z._t); z._t = setTimeout(() => { z.style.display = 'none'; }, 5000);
}

function indiceMax(max, nb){
  if (max <= 1) return 'Une seule réponse possible';
  if (max >= nb) return 'Plusieurs réponses possibles — cochez celles qui vous conviennent';
  return max === 2 ? 'Deux réponses au maximum' : max + ' réponses au maximum';
}

function renderResolution(r){
  let options = [];
  try { options = JSON.parse(r.options_json || '[]'); } catch(e) {}
  const mode = r.mode || (r.type_reponse === 'oui_non_abstention' ? 'pca' : r.type_reponse === 'classement' ? 'classement' : 'choix');
  VOTE_OPTS[r.id] = options;
  let choixHtml = '';
  if (mode === 'libre') {
    choixHtml = '<textarea class="input vo-libre" rows="4" maxlength="2000" data-res="' + r.id + '" placeholder="Écrivez votre réponse ici…" style="width:100%;margin-top:10px;"></textarea>';
  } else if (mode === 'oui_non') {
    VOTE_OPTS[r.id] = ['Oui', 'Non']; VOTE_MAX[r.id] = 1;
    choixHtml = '<div class="vo-choix-group">' + ['Oui', 'Non'].map((c, i) =>
      '<div class="vo-choix-pill" role="button" tabindex="0" data-res="' + r.id + '" data-idx="' + i + '">' + (i === 0 ? '👍 ' : '👎 ') + c + '</div>').join('') + '</div>';
  } else if (mode === 'pca') {
    VOTE_OPTS[r.id] = ['Pour', 'Contre', 'Abstention']; VOTE_MAX[r.id] = 1;
    choixHtml = '<div class="vo-choix-group">' + ['Pour', 'Contre', 'Abstention'].map((c, i) =>
      '<div class="vo-choix-pill" role="button" tabindex="0" data-res="' + r.id + '" data-idx="' + i + '">' + (c === 'Pour' ? '🟢' : c === 'Contre' ? '🔴' : '⚪') + ' ' + c + '</div>').join('') + '</div>';
  } else if (mode === 'classement') {
    choixHtml = '<p style="font-size:12px;color:var(--muted);margin:8px 0 0;">Cliquez les options dans l\'ordre de préférence.</p>' +
      '<div class="vo-choix-group" id="vo-classement-' + r.id + '">' + options.map((o, i) =>
        '<div class="vo-choix-pill" role="button" tabindex="0" data-classe="' + r.id + '" data-idx="' + i + '">' + escHtml(o) + '</div>').join('') + '</div>' +
      '<p style="font-size:13px;margin-top:8px;">Ordre choisi : <span id="vo-ordre-' + r.id + '">—</span> ' +
      '<button type="button" class="btn btn-sm btn-outline" data-reinit="' + r.id + '">Recommencer</button></p>';
  } else {
    const max = mode === 'choix' ? Math.max(1, Math.min(options.length, Number(r.max_choix) || 1)) : 1;
    VOTE_MAX[r.id] = max;
    choixHtml = '<p style="font-size:12px;color:var(--muted);margin:8px 0 0;" id="vo-indice-' + r.id + '">' + indiceMax(max, options.length) + '</p>' +
      '<div class="vo-choix-group">' + options.map((o, i) =>
        '<div class="vo-choix-pill" role="button" tabindex="0" aria-pressed="false" data-res="' + r.id + '" data-idx="' + i + '">' + escHtml(o) + '</div>').join('') + '</div>';
  }
  const commentaire = r.commentaire
    ? '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">💬 Un commentaire ? <span style="font-weight:400;color:var(--muted);">(facultatif)</span></label>' +
      '<textarea class="input vo-commentaire" rows="2" maxlength="1000" data-res="' + r.id + '" placeholder="Ajoutez un commentaire si vous le souhaitez" style="width:100%;"></textarea>'
    : '';
  return '<div class="vo-resolution"><strong>' + escHtml(r.titre) + '</strong>' +
    (r.description ? '<p style="font-size:13px;color:var(--muted);">' + escHtml(r.description) + '</p>' : '') +
    choixHtml + commentaire + '</div>';
}

/* Un seul écouteur pour toutes les questions affichées. */
document.addEventListener('click', function(e){
  const reinit = e.target.closest('[data-reinit]');
  if (reinit) {
    const id = reinit.getAttribute('data-reinit');
    delete VOTE_REPONSES[id];
    document.querySelectorAll('#vo-classement-' + id + ' .vo-choix-pill').forEach(p => p.classList.remove('selected'));
    document.getElementById('vo-ordre-' + id).textContent = '—';
    return;
  }
  const classe = e.target.closest('[data-classe]');
  if (classe) { ajouterClassement(classe.getAttribute('data-classe'), Number(classe.getAttribute('data-idx')), classe); return; }
  const pill = e.target.closest('.vo-choix-pill[data-res]');
  if (pill) basculer(pill.getAttribute('data-res'), Number(pill.getAttribute('data-idx')), pill);
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('vo-choix-pill')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', function(e){
  const t = e.target;
  if (t.classList && t.classList.contains('vo-libre')) VOTE_REPONSES[t.getAttribute('data-res')] = t.value;
  if (t.classList && t.classList.contains('vo-commentaire')) VOTE_COMMENTS[t.getAttribute('data-res')] = t.value;
});

function basculer(resId, idx, el){
  const option = (VOTE_OPTS[resId] || [])[idx];
  if (option === undefined) return;
  const max = VOTE_MAX[resId] || 1;
  const groupe = el.parentElement;
  if (max === 1) {
    VOTE_REPONSES[resId] = option;
    groupe.querySelectorAll('.vo-choix-pill').forEach(p => { p.classList.remove('selected'); p.setAttribute('aria-pressed', 'false'); });
    el.classList.add('selected'); el.setAttribute('aria-pressed', 'true');
    return;
  }
  let liste = Array.isArray(VOTE_REPONSES[resId]) ? VOTE_REPONSES[resId] : [];
  if (liste.includes(option)) {
    liste = liste.filter(x => x !== option);
    el.classList.remove('selected'); el.setAttribute('aria-pressed', 'false');
  } else {
    if (liste.length >= max) { notifier('Vous pouvez choisir ' + indiceMax(max, 99).toLowerCase() + '.', 'warning'); return; }
    liste = liste.concat(option);
    el.classList.add('selected'); el.setAttribute('aria-pressed', 'true');
  }
  VOTE_REPONSES[resId] = liste;
  const indice = document.getElementById('vo-indice-' + resId);
  if (indice) indice.textContent = indiceMax(max, (VOTE_OPTS[resId] || []).length) + ' · ' + liste.length + ' choisie' + (liste.length > 1 ? 's' : '');
}

function ajouterClassement(resId, idx, el){
  const option = (VOTE_OPTS[resId] || [])[idx];
  if (option === undefined) return;
  if (!Array.isArray(VOTE_REPONSES[resId])) VOTE_REPONSES[resId] = [];
  if (VOTE_REPONSES[resId].includes(option)) return;
  VOTE_REPONSES[resId].push(option);
  el.classList.add('selected');
  document.getElementById('vo-ordre-' + resId).textContent = VOTE_REPONSES[resId].join(' > ');
}

function reponseVide(v){ return v == null || v === '' || (Array.isArray(v) && !v.length) || (typeof v === 'string' && !v.trim()); }

async function soumettreBulletin(code){
  const reponses = VOTE_RESOLUTIONS
    .filter(r => !reponseVide(VOTE_REPONSES[r.id]))
    .map(r => ({ resolution_id: r.id, choix: VOTE_REPONSES[r.id], commentaire: (VOTE_COMMENTS[r.id] || '').trim() || undefined }));
  if (!reponses.length) { notifier('Répondez à au moins une question.', 'warning'); return; }
  if (reponses.length < VOTE_RESOLUTIONS.length) {
    if (!confirm('Certaines questions n\'ont pas de réponse. Continuer quand même ?')) return;
  }
  try {
    await api('POST', '/vote-scrutins/' + VOTE_SCRUTIN_ID + '/voter', { code, reponses });
    document.getElementById('vo-bulletin-zone').innerHTML = '<div class="notice" style="background:#d1fae5;border-color:#10b981;">✅ Votre vote a été enregistré. Merci pour votre participation.</div>';
    const r = await api('GET', '/mes-votes');
    MES_VOTES = r.votes || [];
    renderListe();
  } catch(e) {
    notifier(e.message, 'danger');
  }
}

init();
</script>
<script src="assets/back-button.js"></script>
</body>
</html>
