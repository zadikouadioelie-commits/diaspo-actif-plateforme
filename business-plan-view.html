<style>
  html,body{background:#EEF1F6;}
  /* minmax(0,1fr) + min-width:0 : sans eux, un tableau ou une grille trop large élargit la colonne du
     document au-delà de l'écran (page décalée à droite, boutons du haut coupés). */
  .bpv-shell{max-width:1180px;width:100%;box-sizing:border-box;margin:0 auto;padding:24px 20px 80px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start;}
  .bpv-doc{min-width:0;}
  .bpv-actionbar{min-width:0;}
  @media(max-width:860px){.bpv-shell{grid-template-columns:minmax(0,1fr);} .bpv-toc{display:none;}}

  /* ---- Barre d'actions ---- */
  .bpv-actionbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px;}
  .bpv-actionbar .left{display:flex;align-items:center;gap:10px;}
  .bpv-back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;}
  .bpv-back:hover{color:var(--orange);}

  /* ---- Sommaire (TOC) ---- */
  /* Sommaire à son propre défilement : collé sous la barre du site (qui est elle-même fixe, d'où
     --bpv-top mesuré en JS) pour rester visible pendant la lecture du document. */
  .bpv-toc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 0;overflow-y:auto;overscroll-behavior:contain;}
  /* Deux niveaux de défilement indépendants sur ordinateur (demande 2026-10-10) : la page ne défile plus,
     le sommaire (gauche) et le document (droite) ont chacun leur propre barre — le sommaire reste donc
     toujours visible. (Un simple « sticky » ne marche pas ici : html et body ont tous deux overflow-x:hidden.) */
  @media(min-width:861px){
    .bpv-shell{height:calc(100vh - var(--bpv-tb,84px));overflow:hidden;grid-template-rows:auto minmax(0,1fr);padding-bottom:16px;}
    .bpv-toc, .bpv-doc{min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;}
    .bpv-doc{scroll-behavior:smooth;}
    .page{min-height:0!important;} /* sinon « 100vh » + bandeaux au-dessus = la page défile encore */
  }
  .bpv-toc-title{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 16px 8px;}
  .bpv-toc a{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12.5px;font-weight:600;color:var(--text);text-decoration:none;border-left:3px solid transparent;transition:background .1s;}
  .bpv-toc a:hover{background:var(--surface2,#f3f4f6);}
  .bpv-toc a.active{border-left-color:var(--orange,#ff6b00);color:var(--orange,#ff6b00);background:#fff7f0;}
  .bpv-toc .n{width:16px;text-align:center;font-size:13px;}

  /* ---- Document ---- */
  /* Coins arrondis appliqués localement (couverture + dernier bloc) plutôt qu'un overflow:hidden
     sur tout le conteneur (2026-09-01) : ce document peut dépasser 5000px de haut une fois
     rempli -- clipper un si grand conteneur pour arrondir 16px de coin est inutilement coûteux
     à composer, et provoquait un rendu figé/déchiré au défilement observé en testant. Le fond
     blanc de .bpv-doc n'a de toute façon rien à clipper hors de la couverture (seul bloc à fond
     plein) et du dernier bloc visible. */
  .bpv-doc{background:#fff;border:1px solid var(--border);border-radius:16px;padding:0;box-shadow:0 2px 16px rgba(13,43,78,.06);}
  .bpv-doc > *:first-child{border-radius:16px 16px 0 0;overflow:hidden;}
  .bpv-doc > *:last-child{border-radius:0 0 16px 16px;overflow:hidden;}

  /* Couverture */
  .bpv-cover{background:linear-gradient(135deg,#0D2B4E,#173e6b);color:#fff;padding:52px 56px 40px;position:relative;}
  .bpv-cover-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 14px;margin-bottom:18px;}
  .bpv-cover-logo{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--orange,#ff6b00),#ffb27a);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:18px;overflow:hidden;}
  .bpv-cover-logo img{width:100%;height:100%;object-fit:cover;}
  .bpv-cover h1{margin:0 0 8px;font-size:32px;font-weight:800;line-height:1.15;}
  .bpv-cover .slogan{font-size:16px;font-style:italic;opacity:.88;margin:0 0 22px;}
  .bpv-cover-meta{display:flex;flex-wrap:wrap;gap:8px;}
  .bpv-cover-meta span{font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 12px;}
  .bpv-cover-foot{margin-top:26px;font-size:11.5px;opacity:.7;}
  .bpv-cover.has-photo{background-size:cover;background-position:center;}
  .bpv-cover.has-photo::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(13,43,78,.88),rgba(23,62,107,.82));}
  .bpv-cover.has-photo > *{position:relative;z-index:1;}

  /* Vidéo de pitch + galerie (2026-08-31) */
  .bpv-media-block{padding:28px 56px;border-top:1px solid var(--border);display:flex;gap:22px;flex-wrap:wrap;}
  .bpv-media-video{flex:1 1 380px;max-width:520px;}
  .bpv-media-video video{width:100%;border-radius:12px;display:block;background:#000;}
  .bpv-media-video h4, .bpv-media-galerie h4{margin:0 0 10px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  .bpv-media-galerie{flex:1 1 260px;}
  .bpv-media-galerie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
  .bpv-media-galerie-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;}

  /* Référentiel monétaire (multidevise, 2026-08-31) */
  .bpv-devise-referentiel{padding:22px 56px;border-top:1px solid var(--border);background:#fafbfc;}
  .bpv-devise-referentiel h4{margin:0 0 12px;font-size:13px;font-weight:800;color:#0D2B4E;}
  .bpv-devise-lignes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 24px;}
  .bpv-devise-lignes .k{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  .bpv-devise-lignes .v{display:block;font-size:13.5px;font-weight:700;color:#1a2233;}
  .bpv-devise-note{margin:12px 0 0;font-size:11.5px;color:var(--muted);font-style:italic;}
  .cm-principal{font-weight:800;}
  .cm-secondaire{font-weight:500;color:var(--muted);font-size:.86em;margin-left:6px;}
  .cm-secondaire::before{content:'— ';}

  /* Sections */
  .bpv-section{padding:34px 56px;border-top:1px solid var(--border);}
  .bpv-section:first-of-type{border-top:none;}
  .bpv-section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .bpv-section-head .ic{font-size:22px;}
  .bpv-section-head h2{margin:0;font-size:19px;font-weight:800;color:#0D2B4E;}
  .bpv-empty-section{color:var(--muted);font-size:13px;font-style:italic;}

  .bpv-field{margin-bottom:16px;}
  .bpv-field:last-child{margin-bottom:0;}
  .bpv-field h4{margin:0 0 4px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
  .bpv-field p{margin:0;font-size:14.5px;line-height:1.65;white-space:pre-wrap;color:#1a2233;}
  .bpv-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;}
  @media(max-width:640px){.bpv-field-grid{grid-template-columns:1fr;}}

  /* Tableaux */
  .bpv-table-wrap{overflow-x:auto;margin-bottom:8px;}
  table.bpv-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.bpv-table th{text-align:left;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid var(--border);padding:6px 10px;white-space:nowrap;}
  table.bpv-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.bpv-table tr:last-child td{border-bottom:none;}
  table.bpv-table tbody tr:nth-child(even){background:#fafbfd;}
  /* Colonnes de montants/nombres (2026-09-01) : alignées à droite avec chiffres tabulaires,
     comme le reste de la plateforme -- une colonne de nombres alignée à gauche oblige l'œil à
     comparer des chiffres qui ne s'empilent pas visuellement. */
  table.bpv-table td.num, table.bpv-table th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.bpv-table td.num strong, table.bpv-table th.num{font-variant-numeric:tabular-nums;}

  /* Cartes (concurrents, risques, phases...) */
  .bpv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:8px;}
  .bpv-mini-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .bpv-mini-card strong{font-size:13.5px;}
  .bpv-mini-card .row{font-size:12px;color:var(--muted);margin-top:4px;}

  /* BMC */
  .bmc-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto;gap:8px;}
  .bmc-cell{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fafbfc;min-height:70px;}
  .bmc-cell h5{margin:0 0 4px;font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--orange,#ff6b00);}
  .bmc-cell p{margin:0;font-size:12.5px;line-height:1.5;white-space:pre-wrap;}
  .bmc-partenaires{grid-row:1/3;}
  .bmc-activites{grid-row:1;}
  .bmc-proposition{grid-row:1/3;}
  .bmc-relations{grid-row:1;}
  .bmc-segments{grid-row:1/3;}
  .bmc-ressources{grid-row:2;}
  .bmc-canaux{grid-row:2;}
  .bmc-couts{grid-column:1/3;}
  .bmc-revenus{grid-column:3/6;}
  @media(max-width:760px){.bmc-grid{grid-template-columns:1fr 1fr;} .bmc-cell{grid-row:auto!important;grid-column:auto!important;}}

  /* Timeline calendrier */
  .bpv-timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:20px;display:flex;flex-direction:column;gap:18px;}
  .bpv-timeline .pt{position:relative;}
  .bpv-timeline .pt::before{content:'';position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--orange,#ff6b00);}
  .bpv-timeline .pt-dates{font-size:11px;color:var(--muted);font-weight:700;}
  .bpv-timeline .pt-nom{font-size:14.5px;font-weight:800;margin:2px 0 4px;}

  .badge-statut{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--surface2,#f3f4f6);color:var(--muted);}

  #bpv-loading, #bpv-error{max-width:600px;margin:80px auto;text-align:center;color:var(--muted);}

  /* ===== Refonte de la consultation (2026-10-17, proposition de l'utilisateur) : pleine largeur, plus d'espace, cartouches ===== */
  html,body{background:#F1F4F9;}
  .bpv-shell{max-width:none;padding:22px clamp(16px,2.4vw,44px) 20px;grid-template-columns:clamp(250px,17vw,310px) minmax(0,1fr);gap:clamp(18px,2vw,34px);}
  @media(max-width:860px){.bpv-shell{grid-template-columns:minmax(0,1fr);}}
  .bpv-actionbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px 24px;margin-bottom:8px;}
  .bpv-head{flex:1 1 420px;min-width:0;}
  .bpv-crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .bpv-crumb a{color:var(--muted);text-decoration:none;font-weight:600;}
  .bpv-crumb a:hover{color:var(--orange);}
  .bpv-crumb b{color:var(--text);font-weight:700;}
  .bpv-titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .bpv-logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--orange,#ff6b00),#ffb27a);display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none;}
  .bpv-logo img{width:100%;height:100%;object-fit:cover;}
  .bpv-titlerow h1{margin:0;font-size:clamp(22px,2.3vw,31px);font-weight:800;color:#0D2B4E;line-height:1.15;overflow-wrap:anywhere;}
  .bpv-stade{font-size:12.5px;font-weight:800;padding:5px 14px;border-radius:99px;background:#FFE7D6;color:#B84C1A;border:1px solid #F8CDB0;white-space:nowrap;}
  .bpv-slogan{margin:8px 0 0;font-style:italic;color:#475569;font-size:14.5px;}
  .bpv-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:12.5px;color:var(--muted);}
  .bpv-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .bpv-actions .btn{padding:9px 16px;font-size:13px;border-radius:12px;}

  .bpv-toc{background:#fff;border:1px solid #E3E9F2;border-radius:18px;padding:18px 10px 14px;box-shadow:0 2px 12px rgba(13,43,78,.05);}
  .bpv-toc-title{padding:0 14px 10px;letter-spacing:.08em;}
  .bpv-toc a{gap:12px;padding:8px 12px;margin:2px 0;border-radius:12px;border-left:0;font-size:13px;}
  .bpv-toc a .n{width:30px;height:30px;border-radius:10px;background:#F1F4F9;display:grid;place-items:center;font-size:15px;flex:none;transition:background .12s;}
  .bpv-toc a:hover{background:#F6F8FB;}
  .bpv-toc a.active{background:#FFF0E8;color:#B84C1A;}
  .bpv-toc a.active .n{background:#FFD9C2;}

  .bpv-doc{border:1px solid #E3E9F2;border-radius:20px;padding:clamp(22px,3vw,46px) clamp(20px,3.6vw,68px) 60px;box-shadow:0 4px 24px rgba(13,43,78,.06);}
  .bpv-doc > *:first-child, .bpv-doc > *:last-child{border-radius:0;overflow:visible;}
  .bpv-cover{display:none;}   /* titre de couverture : réservé à l'impression et au PDF (le titre est déjà dans l'en-tête de la page) */
  .bpv-banner{height:clamp(170px,22vw,320px);border-radius:16px;background:#0D2B4E center/cover no-repeat;margin:0 0 30px;box-shadow:0 8px 28px rgba(13,43,78,.18);}
  .bpv-media-block{padding:0 0 34px;border-top:0;}
  .bpv-devise-referentiel{padding:22px 28px;border:1px solid #D4E3F7;border-radius:18px;background:#EDF4FD;margin:0 0 40px;}
  .bpv-devise-title{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .bpv-devise-title .ic{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid #D4E3F7;display:grid;place-items:center;font-size:18px;flex:none;}
  .bpv-devise-title h4{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0D2B4E;}
  .bpv-devise-lignes{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 0;}
  .bpv-devise-lignes > div{padding:2px 24px;border-left:1px solid #CFE0F5;}
  .bpv-devise-lignes > div:first-child{border-left:0;padding-left:0;}
  .bpv-devise-lignes .k{font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:600;margin-bottom:4px;}
  .bpv-devise-lignes .v{font-size:15px;font-weight:800;color:#0D2B4E;}

  .bpv-section{padding:40px 0 14px;border-top:1px solid #E8EDF4;}
  .bpv-section:first-of-type{border-top:none;padding-top:6px;}
  .bpv-section-head{gap:14px;margin-bottom:28px;padding-bottom:14px;border-bottom:1px solid #EEF2F7;}
  .bpv-section-head .ic{width:42px;height:42px;border-radius:50%;background:#FFE7D6;display:grid;place-items:center;font-size:20px;flex:none;}
  .bpv-section-head h2{font-size:22px;}
  .bpv-field-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px 64px;}
  .bpv-field{margin-bottom:22px;}
  .bpv-field-grid > .bpv-field{margin-bottom:0;}
  .bpv-field h4{letter-spacing:.07em;margin-bottom:6px;}
  .bpv-field p{font-size:15px;line-height:1.7;}
  .bpv-ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:34px 72px;margin-bottom:10px;}
  .bpv-ig-item{display:flex;gap:18px;align-items:flex-start;min-width:0;}
  .bpv-ig-item .ico{width:22px;height:22px;flex:none;margin-top:2px;color:#64748b;}
  .bpv-ig-item .ico svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .bpv-ig-item .k{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#6b7a90;margin-bottom:5px;}
  .bpv-ig-item .v{display:block;font-size:15.5px;color:#1a2233;line-height:1.5;overflow-wrap:anywhere;}
  .bpv-section .bpv-cards{gap:16px;}
  .bpv-mini-card{padding:16px 18px;border-radius:14px;}

  /* PDF : le document cloné retrouve son titre de couverture et ses marges d'origine */
  .bpv-doc.bpv-pdf{padding:0;border-radius:0;}
  .bpv-doc.bpv-pdf .bpv-cover{display:block;}
  .bpv-doc.bpv-pdf .bpv-banner{display:none;}
  .bpv-doc.bpv-pdf .bpv-pj video, .bpv-doc.bpv-pdf .bpv-pj iframe, .bpv-doc.bpv-pdf .bpv-pj-frame{display:none;}
  #bpv-fulldoc{padding:0;border:0;border-radius:0;box-shadow:none;background:#fff;}
  .bpv-doc.bpv-pdf .bpv-section, .bpv-doc.bpv-pdf .bpv-devise-referentiel, .bpv-doc.bpv-pdf .bpv-media-block{margin-left:12mm;margin-right:12mm;}

  /* ===== Pagination (2026-10-17, demande explicite) : une rubrique par page, tout l'espace, boutons Précédent / Suivant, saut direct ===== */
  .bpv-shell .bpv-doc{padding:0;display:flex;flex-direction:column;overflow:hidden;}
  .bpv-page{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(22px,3vw,44px) clamp(20px,3.6vw,76px) 36px;scroll-behavior:smooth;}
  .bpv-page .bpv-section{border-top:0;padding:6px 0 0;}
  .bpv-page .bpv-field-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:30px 56px;}
  .bpv-section-head{align-items:center;}
  .bpv-section-head h2{flex:1;min-width:0;}
  .bpv-num{margin-right:8px;color:#B84C1A;font-variant-numeric:tabular-nums;}
  .bpv-pagetag{font-size:12px;font-weight:800;letter-spacing:.04em;color:#6b7a90;background:#F1F4F9;border-radius:99px;padding:5px 13px;white-space:nowrap;}
  .bpv-toc a .t{flex:1;min-width:0;}
  .bpv-toc a .p{flex:none;font-size:11px;font-weight:800;color:#8a97ab;font-variant-numeric:tabular-nums;}
  .bpv-toc a.active .p{color:#B84C1A;}

  .bpv-pager{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,2vw,28px);border-top:1px solid #E3E9F2;background:linear-gradient(180deg,#fff,#F8FAFD);}
  .bpv-pg-btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:8px 18px;border-radius:14px;border:1.5px solid #D7DFEC;background:#fff;color:#0D2B4E;font:700 14px/1.2 inherit;font-family:inherit;cursor:pointer;text-align:left;max-width:30%;transition:background .12s,border-color .12s,transform .1s;}
  .bpv-pg-btn small{display:block;font-size:11px;font-weight:600;color:#6b7a90;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
  .bpv-pg-btn:hover:not([disabled]){border-color:#B84C1A;background:#FFF7F2;transform:translateY(-1px);}

<!-- Génération PDF réelle (point 17 du cahier des charges "Gestion multidevise" : "il ne suffit
     pas que les conversions apparaissent uniquement dans l'interface") -- même bibliothèque déjà

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
/* ===========================================================================
   CONSULTATION BUSINESS PLAN — lecture seule, mise en page "document".
   Réutilise GET /api/business-plans/:id (même contrôle d'accès propriétaire/
   collaborateur que l'éditeur, aucune nouvelle route serveur). Chaque section
   n'affiche que les champs réellement remplis — jamais de champ vide, pour
   garder un vrai rendu "document fini" plutôt qu'un formulaire vidé.
   =========================================================================== */
let bp; // promu en variable de module (pas seulement locale à init()) : fmtMontant() en a besoin
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function nl2br(s){ return esc(s); } // white-space:pre-wrap gère déjà les retours à la ligne
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) : ''; }
/* Multidevise (2026-08-31) : remplace l'ancien formatage EUR codé en dur par le service centralisé
   (assets/currency-manager.js), piloté par la config du plan chargé (bp.devise_config). Le 2ᵉ
   paramètre `devise` n'était de toute façon jamais transmis par aucun appelant -- conservé pour
   compat mais ignoré : la devise de référence vient désormais toujours de la config du plan. */
function fmtMontant(n){ return (n===null||n===undefined||n==='') ? '' : CurrencyManager.afficherMontant(n, bp?.devise_config); }
const has = v => v !== null && v !== undefined && String(v).trim() !== '';

const TYPES = { startup:'🚀 Startup', pme:'🏢 PME', association:'🤝 Association', ong:'🌍 ONG', cooperative:'🌾 Coopérative', social:'💚 Social', autre:'📋 Autre' };
/* Miroir de BP_TRANSMISSION_BADGES (business-plan.html) — labels seuls, pas de couleurs ici. */
const BP_TRANSMISSION_LABELS = {
  soumis:'🔵 Transmis à Diaspo\'Actif', en_analyse:'🟠 En cours d\'analyse', infos_demandees:'🟠 En cours d\'analyse',
  retenu:'🟣 Orientation en cours', oriente_partenaire:'🟢 Organisme identifié', mise_en_relation:'🤝 Mise en relation',
  accompagnement:'✅ Accompagnement en cours', abouti:'❌ Dossier clôturé', sans_suite:'❌ Dossier clôturé',
};

/* ---- Schéma des sections texte simples : {champ: Libellé} dans l'ordre d'affichage ---- */
const TEXT_SECTIONS = {
  resume_executif: { projet:'Le projet en bref', probleme:'Le problème identifié', solution:'Notre solution', marche:'Le marché visé', besoins:'Besoins de financement', objectifs:'Objectifs' },
  presentation: { vision:'Vision', mission:'Mission', valeurs:'Valeurs', obj_court:'Objectifs à 12 mois', obj_moyen:'Objectifs à 1-3 ans', obj_long:'Objectifs à 3-5 ans', historique:'Historique du projet', motivations:"Motivations de l'équipe" },
  probleme: {
    description:'Le problème', pourquoi:'Causes', qui_concerne:'Qui est concerné', ampleur:'Ampleur', consequences:'Conséquences actuelles', pourquoi_pas_resolu:"Pourquoi ce problème n'est pas déjà résolu", preuves:'Preuves & sources',
    nb_personnes_concernees:'Nombre de personnes concernées', frequence_probleme:'Fréquence du problème', cout_probleme:'Coût du problème', solutions_existantes:'Solutions actuellement utilisées', cout_solutions_existantes:'Coût des solutions existantes', limites_solutions_existantes:'Limites des solutions existantes',
    consequences_financieres:'Conséquences financières', consequences_sociales:'Conséquences sociales', consequences_environnementales:'Conséquences environnementales', resultats_entretiens_clients:"Résultats d'entretiens clients", nb_personnes_interrogees:'Nombre de personnes interrogées', resultats_enquetes:"Résultats d'enquêtes", temoignages_probleme:'Témoignages',
  },
  solution: {
    description:'La solution', fonctionnement:'Fonctionnement', innovation:'Ce qui est innovant', avantages:'Avantages pour le client', valeur_ajoutee:'Valeur ajoutée', differenciants:'Facteurs différenciants',
    niveau_developpement:'Niveau de développement', date_prototype:'Date du prototype', nb_tests:'Nombre de tests réalisés', nb_utilisateurs_test:'Utilisateurs testeurs', resultats_tests_solution:'Résultats des tests', taux_satisfaction:'Taux de satisfaction', ameliorations_prevues:'Améliorations prévues',
    cout_developpement:'Coût de développement', cout_production:'Coût de production', certification_necessaire:'Certification nécessaire', reglementation_solution:'Réglementation applicable', propriete_intellectuelle_solution:'Propriété intellectuelle de la solution', risques_technologiques:'Risques technologiques', possibilite_reproduction:'Possibilité de reproduction par un concurrent', ce_qui_empeche_copie:'Ce qui empêche la copie',
  },
  marche: { taille_marche:'Taille du marché', evolution:'Évolution du marché', potentiel:'Potentiel visé', tendances:'Tendances', barrieres_entree:"Barrières à l'entrée", reglementation:'Réglementation applicable', profil_client:'Profil du client type', segmentation:'Segmentation', besoins_clients:'Besoins des clients', localisation_clients:'Localisation des clients', opportunites:'Opportunités', menaces_marche:'Menaces', positionnement:'Positionnement', avantage_concurrentiel:'Avantage concurrentiel' },
  strategie_marketing: { identite_marque:'Identité de marque', strategie_digitale:'Stratégie digitale', communication:'Communication', publicite:'Publicité', partenariats:'Partenariats marketing', evenements:'Événements', fidelisation:'Fidélisation' },
  plan_commercial: { objectifs_vente:'Objectifs de vente', prospection:'Prospection', tunnel_vente:'Tunnel de vente', politique_tarifaire:'Politique tarifaire', argumentaire:'Argumentaire commercial', sav:'Service après-vente', kpi_commerciaux:'Indicateurs suivis' },
  plan_operationnel: { production:'Production', logistique:'Logistique', fournisseurs:'Fournisseurs', equipements:'Équipements', technologies:'Technologies utilisées', qualite:'Contrôle qualité', securite:'Sécurité' },
  organisation: { dirigeants:'Dirigeants & gouvernance', equipe:"Composition de l'équipe", responsabilites:'Répartition des responsabilités', consultants:'Consultants externes', benevoles:'Bénévoles' },
  rh: { effectif_actuel:'Effectif actuel', effectif_prevu:'Effectif prévu à 12 mois', recrutements:'Recrutements prévus', competences:'Compétences recherchées', formations:'Formations prévues', politique_rh:'Politique RH' },
  impact: { economique:'Impact économique', social:'Impact social', environnemental:'Impact environnemental', territorial:'Impact territorial', kpi_impact:"Indicateurs d'impact" },
  // financement : plus dans TEXT_SECTIONS -- rendu par la fonction dédiée renderFinancement()
  // (2026-09-01), la section a trop de champs typés différemment (montants, %, dates, tableau
  // répétable) pour le renderFieldGrid générique texte-brut.
};

const NIVEAU_DEV_LABELS = { idee:'Idée', prototype:'Prototype', mvp:'MVP (version minimale testable)', commercialise:'Déjà commercialisé' };
const PF_RESSOURCES ={ pf_apport:'Apport personnel', pf_associes:'Associés', pf_famille:'Famille & proches', pf_business_angels:'Business angels', pf_banque:'Prêt bancaire', pf_subvention:'Subvention', pf_investisseur:'Investisseur', pf_crowdfunding:'Crowdfunding', pf_diaspo_invest:"Diaspo'Invest", pf_autres_ress:'Autres ressources' };
const PF_EMPLOIS = { pf_terrain:'Terrain', pf_construction:'Construction / aménagement', pf_materiel:'Matériel', pf_vehicules:'Véhicules', pf_logiciels:'Logiciels & outils', pf_stocks:'Stock initial', pf_tresorerie:'Trésorerie de départ', pf_frais_admin:'Frais administratifs', pf_communication:'Communication', pf_recrutement:'Recrutement' };
const CR_LIGNES = { ca:"Chiffre d'affaires", autres_produits:'Autres produits', achats:'Achats & charges variables', salaires:'Salaires & charges', loyers:'Loyers', marketing_charge:'Marketing', autres_charges:'Autres charges' };

/* Rendu dédié de "Recherche de financement" (2026-09-01) -- la section mélange texte libre,
   montants, pourcentages, dates et un tableau répétable (utilisation_postes[]) ; le
   renderFieldGrid générique (texte brut uniquement) produisait des montants non formatés
   ("45000" au lieu de "45 000 €") et n'affichait qu'une poignée de champs sur la vingtaine que
   compte réellement cette section -- tous les champs niveau Investisseur (capitalisation, levée
   de fonds, scénarios, stratégie de sortie) restaient invisibles sur cette page alors qu'ils
   sont bien saisis et sauvegardés. */
function renderFinancement(data){
  if (!data) return '';
  const grid = rows => rows.length ? `<div class="bpv-field-grid">${rows.map(([l,v]) => `<div class="bpv-field"><h4>${esc(l)}</h4><p>${nl2br(v)}</p></div>`).join('')}</div>` : '';
  const champ = (label, val) => has(val) ? `<div class="bpv-field"><h4>${esc(label)}</h4><p>${nl2br(val)}</p></div>` : '';
  const titre = t => `<div class="bpv-field" style="margin-top:16px;"><h4 style="text-transform:none;font-size:13px;letter-spacing:0;color:#0D2B4E;">${t}</h4></div>`;
  const pct = v => has(v) ? `${v} %` : '';
  const montant = v => has(v) ? fmtMontant(v) : '';
  const TYPE_INSTRUMENT = { actions:'Actions', obligations_convertibles:'Obligations convertibles', compte_courant:'Compte courant d’associé', autre:'Autre' };
  const TYPE_SORTIE = { acquisition:'Acquisition', revente:'Revente', dividendes:'Dividendes', croissance_long_terme:'Croissance long terme', aucune:'Aucune stratégie de sortie prévue' };

  let html = '';
  html += grid([['Montant recherché', montant(data.montant)], ['Calendrier de décaissement', data.calendrier_decaissement]].filter(([,v])=>has(v)));
  html += champ('Utilisation des fonds', data.utilisation);
  html += champ('Contreparties proposées', data.contreparties);
  html += champ('Retour sur investissement estimé', data.roi);
  html += champ('Financeurs ciblés', data.recherche_active);

  const montantCalendrier = [
    ['Montant minimum', montant(data.montant_minimum_necessaire)], ['Montant idéal', montant(data.montant_ideal_financement)],
    ['Montant maximum', montant(data.montant_maximum_financement)],
    ['Date limite', data.date_limite ? fmtDate(data.date_limite) : ''], ['Date souhaitée de réception', data.date_souhaitee_reception ? fmtDate(data.date_souhaitee_reception) : ''],
    ['Durée de couverture', data.duree_couverture_financement], ['Mois de runway', data.nb_mois_runway],
  ].filter(([,v])=>has(v));
  if (montantCalendrier.length) html += titre('Montant & calendrier') + grid(montantCalendrier);
  html += champ('Financement par étapes', data.financement_par_etapes);

  const asso = [['Nombre d’adhérents', data.nb_adherents], ['Montant des cotisations', montant(data.montant_cotisations)], ['Dons reçus', montant(data.dons_recus)]].filter(([,v])=>has(v));
  if (asso.length) html += titre('Ressources associatives') + grid(asso);

  const postes = (data.utilisation_postes||[]).filter(p=>has(p.poste));
  if (postes.length) {
    html += titre('Utilisation détaillée des fonds, par poste') +
      `<div class="bpv-table-wrap"><table class="bpv-table"><thead><tr><th>Poste</th><th class="num">Montant</th><th class="num">Pourcentage</th></tr></thead><tbody>
      ${postes.map(p=>`<tr><td>${esc(p.poste)}</td><td class="num">${has(p.montant)?montant(p.montant):'—'}</td><td class="num">${has(p.pourcentage)?esc(String(p.pourcentage))+' %':'—'}</td></tr>`).join('')}
      </tbody></table></div>`;
  }

  const capitalisation = [
    ['Nombre de parts / actions', data.nb_parts_actions], ['Valeur nominale', montant(data.valeur_nominale)],
    ['Fondateur 1', pct(data.pct_fondateur1)], ['Fondateur 2', pct(data.pct_fondateur2)],
    ['Autres associés', pct(data.pct_autres_associes)], ['Investisseurs existants', pct(data.pct_investisseurs_existants)],
  ].filter(([,v])=>has(v));
  if (capitalisation.length) html += titre('💼 Capitalisation actuelle') + grid(capitalisation);
  html += champ('Autres détenteurs', data.autres_detenteurs);

  const levee = [
    ['Valorisation avant investissement', montant(data.valorisation_avant)], ['Valorisation après investissement', montant(data.valorisation_apres)],
    ['Pourcentage proposé', pct(data.pourcentage_propose)], ['Dilution maximale acceptée', pct(data.dilution_maximale_acceptee)],
    ['Type d’instrument', TYPE_INSTRUMENT[data.type_instrument] || data.type_instrument],
  ].filter(([,v])=>has(v));
  if (levee.length) html += titre('💼 Levée de fonds') + grid(levee);

  html += champ('Scénario à 50 % du financement demandé', data.scenario_financement_50);

function renderPlanFinancier(pf){
  if (!pf) return '';
  let html = '';
  const resume = [
    ['investissement_initial','Investissement initial'], ['apport_personnel','Apport personnel'],
    ['financement_recherche','Financement recherché'],
    ['seuil_rentabilite','Seuil de rentabilité'], ['point_mort','Point mort (mois)'],
  ].filter(([k]) => has(pf[k]));
  if (resume.length) {
    html += `<div class="bpv-field-grid" style="margin-bottom:20px;">${resume.map(([k,l]) => `
      <div class="bpv-field"><h4>${l}</h4><p>${k==='point_mort'?esc(pf[k])+' mois':fmtMontant(pf[k])}</p></div>`).join('')}</div>`;
  }
  {/* bfr : champ de texte libre ("Explication et montant…" dans l'éditeur), pas un nombre pur
       -- rendu ici en texte comme immobilisations/amortissements/scénarios, jamais via
       fmtMontant() (qui produisait "NaN EUR" dès que la valeur contenait autre chose qu'un
       chiffre, ex. "12 000 € pour couvrir 2 mois d'achat..."). Bug trouvé sur l'exemple réel
       publié, corrigé le 2026-08-31. */}
  ['bfr','immobilisations','amortissements','scenario_optimiste','scenario_realiste','scenario_prudent'].forEach(k => {
    const labels = { bfr:'Besoin en fonds de roulement (BFR)', immobilisations:'Immobilisations', amortissements:'Amortissements', scenario_optimiste:'Scénario optimiste', scenario_realiste:'Scénario réaliste', scenario_prudent:'Scénario prudent' };
    if (has(pf[k])) html += `<div class="bpv-field"><h4>${labels[k]}</h4><p>${nl2br(pf[k])}</p></div>`;
  });

  // Compte de résultat prévisionnel 5 ans — une colonne par devise active (point 15 du cahier
  // des charges "Gestion multidevise" : "si une troisième devise est activée, ajouter
  // automatiquement une colonne"). Sans devise secondaire configurée (cas par défaut/anciens
  // plans, point 28), devisesActives=[reference] => une seule colonne par année, identique au
  // rendu d'avant cette fonctionnalité.
  const anneesCR = [1,2,3,4,5].filter(a => Object.keys(CR_LIGNES).some(k => has(pf[`${k}_${a}`])));
  if (anneesCR.length) {
    const dcCR = CurrencyManager.normaliserConfig(bp?.devise_config);
    const devisesActives = [dcCR.reference, ...dcCR.secondaires.map(s => s.code)];
    const tauxParDevise = { [dcCR.reference]: 1 };
    dcCR.secondaires.forEach(s => { tauxParDevise[s.code] = s.taux; });
    const celluleMontant = (val, code) => {
      if (!has(val)) return '—';
      const montant = code === dcCR.reference ? Number(val) : CurrencyManager.convertir(val, tauxParDevise[code]);
      return montant !== null ? CurrencyManager.format(montant, code) : '—';
    };
    html += `<div class="bpv-field" style="margin-top:20px;"><h4>Compte de résultat prévisionnel</h4></div>
      <div class="bpv-table-wrap"><table class="bpv-table"><thead>
        <tr><th${devisesActives.length>1?' rowspan="2"':''}>Ligne</th>${anneesCR.map(a=>`<th class="num" colspan="${devisesActives.length}">Année ${a}</th>`).join('')}</tr>
        ${devisesActives.length>1 ? `<tr>${anneesCR.map(()=>devisesActives.map(code=>`<th class="num">${esc(code)}</th>`).join('')).join('')}</tr>` : ''}
      </thead><tbody>
      ${Object.entries(CR_LIGNES).map(([k,label]) => `<tr><td>${label}</td>${anneesCR.map(a=>devisesActives.map(code=>`<td class="num">${celluleMontant(pf[`${k}_${a}`], code)}</td>`).join('')).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  }

  // Plan de financement — Ressources / Emplois
  const ress = Object.entries(PF_RESSOURCES).filter(([k]) => has(pf[k]));
  const emp = Object.entries(PF_EMPLOIS).filter(([k]) => has(pf[k]));
  if (ress.length || emp.length) {
    // Total + équilibre (2026-09-01) : un plan de financement doit toujours avoir
    // Ressources = Emplois -- visible ici, pas seulement dans l'éditeur (BPCalc.detecterIncoherences),
    // pour qu'un lecteur externe (banque, investisseur) voie l'équilibre sans avoir accès à l'éditeur.
    const totalRess = Object.keys(PF_RESSOURCES).reduce((s,k) => s + (parseFloat(pf[k])||0), 0);
    const totalEmp = Object.keys(PF_EMPLOIS).reduce((s,k) => s + (parseFloat(pf[k])||0), 0);
    const equilibre = Math.abs(totalRess - totalEmp) < Math.max(1, Math.max(totalRess,totalEmp) * 0.01);
    html += `<div class="bpv-field" style="margin-top:20px;"><h4>Plan de financement</h4></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        ${ress.length ? `<div><div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px;">RESSOURCES</div>${ress.map(([k,l]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);"><span>${l}</span><strong style="font-variant-numeric:tabular-nums;">${fmtMontant(pf[k])}</strong></div>`).join('')}<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0 0;font-weight:800;"><span>Total</span><strong style="font-variant-numeric:tabular-nums;">${fmtMontant(totalRess)}</strong></div></div>` : ''}
        ${emp.length ? `<div><div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px;">EMPLOIS</div>${emp.map(([k,l]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);"><span>${l}</span><strong style="font-variant-numeric:tabular-nums;">${fmtMontant(pf[k])}</strong></div>`).join('')}<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0 0;font-weight:800;"><span>Total</span><strong style="font-variant-numeric:tabular-nums;">${fmtMontant(totalEmp)}</strong></div></div>` : ''}
      </div>
      ${(ress.length && emp.length) ? `<div style="margin-top:10px;font-size:12px;font-weight:700;color:${equilibre?'#0a7d4f':'#b3701f'};">${equilibre?'✅ Équilibré — Ressources = Emplois':`⚠️ Écart de ${fmtMontant(Math.abs(totalRess-totalEmp))} entre Ressources et Emplois`}</div>` : ''}`;
  }
  return html;
}

/* ---- Assemblage d'une section (titre + contenu), masquée entièrement si vide ---- */
/* ---- Pièces jointes d'une rubrique (2026-10-17) : images, vidéos, liens vidéo, PDF, Excel, Word, PowerPoint ---- */
let PJ = {};
const PJ_ICONES = { image:'🖼️', video:'🎬', lien:'🔗', pdf:'📕', excel:'📊', word:'📘', ppt:'📙', fichier:'📎' };
const PJ_LIBELLES = { pdf:'Document PDF', excel:'Tableur Excel', word:'Document Word', ppt:'Présentation', fichier:'Fichier', lien:'Lien vidéo' };
function pjType(d){
  const m = String(d.type_mime || '').toLowerCase(), u = String(d.url_bunny || '').toLowerCase().split('?')[0];
  if (m === 'video/link') return 'lien';
  if (m.startsWith('image/') || /\.(jpe?g|png|webp|gif)$/.test(u)) return 'image';
  if (m.startsWith('video/') || /\.(mp4|webm)$/.test(u)) return 'video';
  if (m === 'application/pdf' || /\.pdf$/.test(u)) return 'pdf';
  if (/\.(xlsx?|csv)$/.test(u) || /sheet|excel/.test(m)) return 'excel';
  if (/\.docx?$/.test(u) || /word/.test(m)) return 'word';
  if (/\.pptx?$/.test(u) || /powerpoint|presentation/.test(m)) return 'ppt';
  return 'fichier';
}
/* Intégration autorisée seulement pour YouTube (nocookie) et Vimeo ; tout autre lien reste un simple lien. */
function pjEmbed(u){
  try {
    const x = new URL(u), h = x.hostname.replace(/^www\./, '');
    if (h === 'youtu.be') return 'https://www.youtube.com/embed/' + encodeURIComponent(x.pathname.slice(1));
    if (h === 'youtube.com' || h === 'm.youtube.com') {
      const v = x.searchParams.get('v'); if (v) return 'https://www.youtube.com/embed/' + encodeURIComponent(v);
      const m = x.pathname.match(/^\/(embed|shorts)\/([\w-]+)/); if (m) return 'https://www.youtube.com/embed/' + m[2];
    }
    if (h === 'vimeo.com') { const m = x.pathname.match(/^\/(\d+)/); if (m) return 'https://player.vimeo.com/video/' + m[1]; }
  } catch (_) { /* adresse invalide : simple lien */ }
  return '';
}
function pjBlock(key){
  const L = PJ[key] || [];
  if (!L.length) return '';
  const ex = !!(bp && bp.exemple);   // exemple de référence : consultation seule, aucun téléchargement
  const tuiles = L.map(d => {
    const t = pjType(d), nom = esc(d.nom), u = esc(d.url_bunny);
    if (t === 'image') return `<figure class="bpv-pj-it">${ex ? `<img src="${u}" alt="${nom}" loading="lazy" style="cursor:default" oncontextmenu="return false" draggable="false">` : `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${nom}" loading="lazy"></a>`}<figcaption>${nom}</figcaption></figure>`;
    if (t === 'video') return `<figure class="bpv-pj-it bpv-pj-wide"><video src="${u}" controls preload="metadata" ${ex ? 'controlsList="nodownload" oncontextmenu="return false"' : ''}></video><figcaption>${nom}</figcaption></figure>`;
    if (t === 'lien') {
      const emb = pjEmbed(d.url_bunny);
      return emb ? `<figure class="bpv-pj-it bpv-pj-wide"><div class="bpv-pj-frame"><iframe src="${esc(emb)}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="${nom}"></iframe></div><figcaption>${nom}</figcaption></figure>`
        : `<a class="bpv-pj-file" href="${u}" target="_blank" rel="noopener noreferrer"><span class="ic">🔗</span><span class="tx"><b>${nom}</b><i>Lien vidéo</i></span><span class="go">↗</span></a>`;
    }
    return ex ? `<div class="bpv-pj-file off"><span class="ic">${PJ_ICONES[t]}</span><span class="tx"><b>${nom}</b><i>${PJ_LIBELLES[t]} · consultation seule</i></span></div>`
      : `<a class="bpv-pj-file" href="${u}" target="_blank" rel="noopener"><span class="ic">${PJ_ICONES[t]}</span><span class="tx"><b>${nom}</b><i>${PJ_LIBELLES[t]}</i></span><span class="go">↗</span></a>`;
  }).join('');
  return `<div class="bpv-pj"><h3>📎 Pièces jointes</h3><div class="bpv-pj-grid">${tuiles}</div></div>`;
}

function buildSection(meta, contentHtml){
  const pj = pjBlock(meta.key);
  const empty = (!contentHtml || !contentHtml.trim()) && !pj;
  return { meta, empty, html: `
    <section class="bpv-section" id="sec-${meta.key}">
      <div class="bpv-section-head"><span class="ic">${meta.icon}</span><h2><span class="bpv-num">__NUM__.</span>${esc(meta.label)}</h2><span class="bpv-pagetag">Page __NUM__ sur __TOT__</span></div>
      ${(!contentHtml || !contentHtml.trim()) ? `<div class="bpv-empty-section">Section non renseignée.</div>` : contentHtml}
      ${pj}
    </section>` };
}

/* En-tête de la page (2026-10-17) : fil d'Ariane, titre, stade du projet, slogan et repères. */
function bpvEntete(bp, s){
  const nom = bp.nom_projet || 'Sans titre';
  const titre = /business plan/i.test(nom) ? nom : 'Business Plan — ' + nom;
  document.getElementById('bpv-title').textContent = titre;
  document.getElementById('bpv-crumb-nom').textContent = nom;
  const stade = (s.infos_generales || {}).stade;
  const st = document.getElementById('bpv-stade');
  if (stade) { st.textContent = 'En ' + (BPV_STADES_LIBELLE[stade] || stade).toLowerCase(); st.style.display = ''; }
  if (bp.logo_url) { const l = document.getElementById('bpv-logo'); l.innerHTML = `<img src="${esc(bp.logo_url)}" alt="">`; l.style.display = ''; }
  if (bp.slogan) { const sl = document.getElementById('bpv-slogan'); sl.textContent = '« ' + bp.slogan + ' »'; sl.style.display = ''; }
  const statut = { brouillon:'✏️ Brouillon', complet:'✅ Complet', archive:'📦 Archivé' }[bp.statut] || '✏️ Brouillon';
  document.getElementById('bpv-meta').innerHTML = [
    TYPES[bp.type_initiative] || bp.type_initiative || '',
    bp.secteur ? '📂 ' + bp.secteur : '',
    statut,
    (bp.progression || 0) + ' % complété',
    bp.updated_at ? 'Mis à jour le ' + fmtDate(bp.updated_at) : ''
  ].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');
}

/* Modèle de référence (2026-10-17) : lecture seule, ni modifiable, ni supprimable, ni téléchargeable (dossier, PDF, impression masqués et refusés) ;
   seule la duplication est proposée — la copie appartient à celui qui la fait. Le serveur refuse de toute façon toute écriture sur ce plan. */
function bpvModeExemple(id){
  document.body.classList.add('bp-exemple');
  ['bpv-btn-dossier','bpv-btn-pdf','bpv-btn-edit'].forEach(i => { const b = document.getElementById(i); if (b) b.style.display = 'none'; });
  document.querySelectorAll('.bpv-actionbar button[onclick*="print"]').forEach(b => { b.style.display = 'none'; });
  const bar = document.querySelector('.bpv-actionbar');
  if (!bar || document.getElementById('bpv-exemple')) return;
  const c = document.createElement('div');
  c.className = 'bpv-exemple'; c.id = 'bpv-exemple'; c.setAttribute('role', 'note');
  c.innerHTML = `<span class="ic" aria-hidden="true">🌟</span>
    <div class="txt"><b>Exemple de référence</b><span>Ce business plan est un exemple fictif proposé à tous les comptes pour s'en inspirer. Il ne peut être ni modifié, ni supprimé, ni téléchargé ou imprimé.</span></div>
    <div class="chips"><i>🔒 Lecture seule</i><i>✋ Non modifiable</i><i>🚫 Non téléchargeable</i></div>
    <button type="button" class="btn btn-orange btn-sm" id="bpv-dup-exemple">📋 Dupliquer comme point de départ</button>`;
  bar.appendChild(c);
  document.getElementById('bpv-dup-exemple').onclick = async function(){
    this.disabled = true;
    try { const r = await api('POST', `/business-plans/${id}/duplicate`); window.location.href = `business-plan-edit.html?id=${r.id}`; }
    catch(e) { alert(e.message); this.disabled = false; }
  };
}

async function init(){
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { showError("Aucun business plan spécifié."); return; }
  try { bp = await api('GET', `/business-plans/${id}`); }
  catch(e) { showError(e.status === 403 ? "Vous n'avez pas accès à ce business plan." : (e.status === 404 ? 'Business plan introuvable.' : ('Erreur : ' + e.message))); return; }

  document.title = `${bp.nom_projet || 'Business Plan'} — Diaspo'Actif`;
  const s = bp.sections || {};

  bpvEntete(bp, s);
  document.getElementById('bpv-btn-dossier').href = `business-plan-dossier.html?id=${id}`;
  if (bp.exemple) bpvModeExemple(id);

  if (bp.mon_role === 'proprietaire' || bp.mon_role === 'editeur' || bp.mon_role === 'validateur') {
    const btn = document.getElementById('bpv-btn-edit');
    btn.href = `business-plan-edit.html?id=${id}`;
    btn.style.display = '';
  }

  /* Pièces jointes de chaque rubrique (field_key = 'piece_jointe') ; indisponibles : le plan s'affiche sans elles. */
  PJ = {};
  try { (await api('GET', `/business-plans/${id}/documents`)).filter(d => d.field_key === 'piece_jointe').sort((a, b) => Number(a.id) - Number(b.id)).forEach(d => { (PJ[d.section_key] = PJ[d.section_key] || []).push(d); }); } catch (e) { /* sans pièces jointes */ }

  const SECTION_META = [
    { key:'infos_generales', icon:'🏷', label:'Informations générales' },
    { key:'resume_executif', icon:'📄', label:'Résumé exécutif' },
    { key:'presentation', icon:'🏢', label:'Présentation détaillée' },
    { key:'probleme', icon:'🔍', label:'Analyse du problème' },
    { key:'solution', icon:'💡', label:'Solution proposée' },
    { key:'marche', icon:'📊', label:'Étude de marché' },
    { key:'swot', icon:'⚡', label:'Analyse SWOT' },
    { key:'business_model', icon:'🎯', label:'Business Model Canvas' },
    { key:'produits', icon:'📦', label:'Produits & Services' },
    { key:'strategie_marketing', icon:'📢', label:'Stratégie marketing' },
    { key:'plan_commercial', icon:'💼', label:'Plan commercial' },
    { key:'plan_operationnel', icon:'⚙️', label:'Plan opérationnel' },
    { key:'organisation', icon:'🏗', label:'Organisation & Gouvernance' },
    { key:'rh', icon:'👥', label:'Ressources humaines' },
    { key:'calendrier', icon:'📅', label:'Calendrier de mise en œuvre' },
    { key:'plan_financier', icon:'💰', label:'Plan financier' },
    { key:'risques', icon:'⚠️', label:'Analyse des risques' },
    { key:'impact', icon:'🌱', label:'Impact' },
    { key:'financement', icon:'🏦', label:'Recherche de financement' },
    { key:'annexes', icon:'📎', label:'Annexes' },
  ];

  const sections = SECTION_META.map(meta => {
    const data = s[meta.key] || {};
    let content = '';
    if (meta.key === 'infos_generales') content = renderInfosGenerales(data);
    else if (meta.key === 'swot') content = renderSwot(data);
    else if (meta.key === 'business_model') content = renderBMC(data);
    else if (meta.key === 'marche') content = renderFieldGrid(data, TEXT_SECTIONS.marche) + renderMarcheConcurrents(data.concurrents);
    else if (meta.key === 'produits') content = renderProduits(data);
    else if (meta.key === 'calendrier') content = renderCalendrier(data.phases);
    else if (meta.key === 'plan_financier') content = renderPlanFinancier(data);
    else if (meta.key === 'risques') content = renderRisques(data.items);
    else if (meta.key === 'annexes') content = renderAnnexes(data.items);
    else if (meta.key === 'solution') content = renderFieldGrid({ ...data, niveau_developpement: NIVEAU_DEV_LABELS[data.niveau_developpement] || data.niveau_developpement }, TEXT_SECTIONS.solution);
    else if (meta.key === 'financement') content = renderFinancement(data);
    else if (TEXT_SECTIONS[meta.key]) content = renderFieldGrid(data, TEXT_SECTIONS[meta.key]);
    return buildSection(meta, content);
  });

  const statutLabel = { brouillon:'✏️ Brouillon', complet:'✅ Complet', archive:'📦 Archivé' }[bp.statut] || 'Brouillon';
  const hasPhoto = !!bp.photo_principale_url;
  const cover = `
    <div class="bpv-cover${hasPhoto?' has-photo':''}"${hasPhoto?` style="background-image:url('${esc(bp.photo_principale_url)}')"`:''}>
      <span class="bpv-cover-badge">📄 Document de consultation — lecture seule</span>
      <div class="bpv-cover-logo">${bp.logo_url ? `<img src="${esc(bp.logo_url)}" alt="">` : (TYPES[bp.type_initiative]||'📋')[0]}</div>
      <h1>${esc(bp.nom_projet || 'Sans titre')}</h1>
      ${bp.slogan ? `<p class="slogan">"${esc(bp.slogan)}"</p>` : ''}
      <div class="bpv-cover-meta">
        <span>${TYPES[bp.type_initiative]||bp.type_initiative||'—'}</span>
        ${bp.secteur?`<span>📂 ${esc(bp.secteur)}</span>`:''}
        <span>${statutLabel}</span>
        <span>${bp.progression||0}% complété</span>
      </div>
      <div class="bpv-cover-foot">Dernière mise à jour le ${fmtDate(bp.updated_at)} — généré depuis Diaspo'Actif</div>
    </div>`;

  const galerie = bp.galerie || [];
  const mediaBlock = (bp.video_pitch_url || galerie.length) ? `
    <div class="bpv-media-block">
      ${bp.video_pitch_url ? `<div class="bpv-media-video"><h4>🎬 Vidéo de présentation</h4><video src="${esc(bp.video_pitch_url)}" controls></video></div>` : ''}
      ${galerie.length ? `<div class="bpv-media-galerie"><h4>🖼️ Galerie</h4><div class="bpv-media-galerie-grid">${galerie.map(g=>`<img src="${esc(g)}" alt="" onclick="window.open('${esc(g)}','_blank')">`).join('')}</div></div>` : ''}
    </div>` : '';

  /* Référentiel monétaire (point 19 du cahier des charges "Gestion multidevise") : affiché une
     seule fois en tête de document dès qu'au moins une devise secondaire est configurée -- les
     montants du reste du document ne répètent jamais le taux complet (point 20), juste la note
     discrète en pied de bloc. */
  const dc = bp.devise_config;
  const referentielBlock = (dc && dc.secondaires && dc.secondaires.length) ? `
    <div class="bpv-devise-referentiel">
      <div class="bpv-devise-title"><span class="ic" aria-hidden="true">💱</span><h4>Référentiel monétaire</h4></div>
      <div class="bpv-devise-lignes">
        <div><span class="k">Monnaie de référence</span><span class="v">${esc(dc.reference)} — ${esc(CurrencyManager.devise(dc.reference).nom)} (${esc(CurrencyManager.devise(dc.reference).symbole)})</span></div>
        ${dc.secondaires.map(sec => `
        <div><span class="k">Monnaie secondaire</span><span class="v">${esc(sec.code)} — ${esc(CurrencyManager.devise(sec.code).nom)} (${esc(CurrencyManager.devise(sec.code).symbole)})</span></div>
        <div><span class="k">Taux utilisé</span><span class="v">1 ${esc(dc.reference)} = ${esc(String(sec.taux))} ${esc(sec.code)}</span></div>
        <div><span class="k">Date du taux</span><span class="v">${fmtDate(sec.date) || '—'}</span></div>`).join('')}
      </div>
      <p class="bpv-devise-note">Les montants présentés dans ce document sont exprimés dans la monnaie de référence et convertis selon les taux enregistrés dans le Business Plan à la date indiquée.</p>
    </div>` : '';

  /* Historique de transmission à Diaspo'Actif (2026-08-31) : suivi interne du porteur, pas
     affiché à un visiteur qui aurait juste un lien de partage en lecture — même logique de
     visibilité que le bouton "Modifier" juste au-dessus. */
  const peutVoirTransmissions = ['proprietaire','editeur','validateur'].includes(bp.mon_role);
  const transmissionBlock = (peutVoirTransmissions && (bp.transmissions||[]).length) ? `
    <div class="bpv-section">
      <h3>📤 Historique de transmission à Diaspo'Actif</h3>
      ${bp.transmissions.map(t => `<div style="padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;font-size:13px;">
        <strong>${BP_TRANSMISSION_LABELS[t.statut] || t.statut}</strong> — ${fmtDate(t.date_soumission_da)}
        ${t.organismes_vises_texte ? `<div style="margin-top:4px;color:#64748b;">🎯 ${esc(t.organismes_vises_texte)}</div>` : (t.laisser_da_choisir ? `<div style="margin-top:4px;color:#64748b;">🧭 Diaspo'Actif a été chargé de choisir l'organisme</div>` : '')}
      </div>`).join('')}
    </div>` : '';

  const banniere = hasPhoto ? `<div class="bpv-banner" role="img" aria-label="Photo du projet" style="background-image:url('${esc(bp.photo_principale_url)}')"></div>` : '';

  /* ---- Pagination : une rubrique par page, sur toute la largeur ---- */
  const PAGES = sections.filter(sec => !sec.empty);
  const N = PAGES.length;
  const extras = banniere + mediaBlock + referentielBlock + transmissionBlock;   // en tête de la première page
  const numeroter = (html, n) => html.replace(/__NUM__/g, n).replace(/__TOT__/g, N);
  const pageHtml = i => N ? ((i === 0 ? extras : '') + numeroter(PAGES[i].html, i + 1)) : (extras + '<div class="bpv-empty-section">Ce business plan ne contient encore aucune rubrique renseignée.</div>');
  /* Version complète (toutes les rubriques à la suite) : réservée à l'impression et à l'export PDF, jamais affichée à l'écran. */
  document.getElementById('bpv-fulldoc').innerHTML = cover + extras + PAGES.map((p, i) => numeroter(p.html, i + 1).replace(/ id="sec-/g, ' data-sec="sec-')).join('');

  const pageEl = document.getElementById('bpv-page'), pagerEl = document.getElementById('bpv-pager'), tocEl = document.getElementById('bpv-toc');
  tocEl.innerHTML = `<div class="bpv-toc-title">Sommaire</div>` + PAGES.map((p, i) => `<a href="#page-${i + 1}" data-p="${i}"><span class="n">${p.meta.icon}</span><span class="t">${esc(p.meta.label)}</span><span class="p">${i + 1}</span></a>`).join('');
  let cur = 0;
  const titreDe = i => (PAGES[i] ? PAGES[i].meta.label : '');
  function dessinerPager(){
    if (!N) { pagerEl.style.display = 'none'; return; }
    pagerEl.innerHTML = `
      <button type="button" class="bpv-pg-btn" id="bpv-prev" ${cur === 0 ? 'disabled' : ''}>←<span>Précédent${cur > 0 ? `<small>${esc(titreDe(cur - 1))}</small>` : ''}</span></button>
      <div class="bpv-pg-mid">
        <label class="bpv-pg-sel"><span>Page</span><select id="bpv-pg-select" aria-label="Aller directement à une page">${PAGES.map((p, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${i + 1} · ${esc(p.meta.label)}</option>`).join('')}</select><span>sur ${N}</span></label>
        <div class="bpv-pg-chips" role="group" aria-label="Pages du business plan">${PAGES.map((p, i) => `<button type="button" class="bpv-chip${i === cur ? ' on' : ''}" data-p="${i}" title="${esc(p.meta.label)}" aria-label="Page ${i + 1} : ${esc(p.meta.label)}" ${i === cur ? 'aria-current="page"' : ''}>${i + 1}</button>`).join('')}</div>
      </div>
      <button type="button" class="bpv-pg-btn primary" id="bpv-next" ${cur === N - 1 ? 'disabled' : ''}><span>Suivant${cur < N - 1 ? `<small>${esc(titreDe(cur + 1))}</small>` : ''}</span>→</button>`;
  }
  function majSommaire(){
    tocEl.querySelectorAll('a').forEach(a => { const on = Number(a.dataset.p) === cur; a.classList.toggle('active', on); if (on) { a.setAttribute('aria-current', 'page'); const lt = a.offsetTop, lh = a.offsetHeight; if (lt < tocEl.scrollTop || lt + lh > tocEl.scrollTop + tocEl.clientHeight) tocEl.scrollTop = lt - tocEl.clientHeight / 2; } else a.removeAttribute('aria-current'); });
  }
  function allerA(i, ancrer){
    if (!N) return;
    cur = Math.max(0, Math.min(N - 1, i));
    pageEl.innerHTML = pageHtml(cur);
    pageEl.scrollTop = 0;
    if (!window.matchMedia('(min-width:861px)').matches && ancrer !== false) { const top = document.getElementById('bpv-shell').getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }
    dessinerPager(); majSommaire();
    try { history.replaceState(null, '', '#page-' + (cur + 1)); } catch (_) { /* ancre non mémorisée : sans conséquence */ }
  }
  pagerEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'bpv-prev') allerA(cur - 1); else if (b.id === 'bpv-next') allerA(cur + 1); else if (b.dataset.p != null) allerA(Number(b.dataset.p));
  });
  pagerEl.addEventListener('change', e => { if (e.target.id === 'bpv-pg-select') allerA(Number(e.target.value)); });
  tocEl.addEventListener('click', e => { const a = e.target.closest('a[data-p]'); if (!a) return; e.preventDefault(); allerA(Number(a.dataset.p)); });
  /* Flèches du clavier : page précédente / suivante (sauf pendant une saisie ou avec une touche de modification). */
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.key === 'ArrowRight') { allerA(cur + 1); e.preventDefault(); } else if (e.key === 'ArrowLeft') { allerA(cur - 1); e.preventDefault(); }
  });
  /* Page de départ : #page-5, ou l'ancienne ancre #sec-solution. */
  let depart = 0;
  const h = location.hash;
  if (/^#page-\d+$/.test(h)) depart = Number(h.slice(6)) - 1;
  else if (/^#sec-/.test(h)) { const k = PAGES.findIndex(p => 'sec-' + p.meta.key === h.slice(1)); if (k >= 0) depart = k; }
  allerA(depart, false);

  document.getElementById('bpv-loading').style.display = 'none';
  document.getElementById('bpv-shell').style.display = 'grid';
  /* La hauteur des deux colonnes = ce qu'il reste d'écran sous tout ce qui précède (barre du site, bandeaux éventuels) :
     la page elle-même ne défile pas, rien n'est coupé, et le sommaire reste en vue. */
  const shellEl = document.getElementById('bpv-shell');
  let tbPrec = null;
  const calerSommaire = () => { const v = Math.max(0, Math.round(shellEl.getBoundingClientRect().top + window.scrollY)); if (v !== tbPrec) { tbPrec = v; document.documentElement.style.setProperty('--bpv-tb', v + 'px'); } };
  calerSommaire(); window.addEventListener('resize', calerSommaire);
  setInterval(calerSommaire, 800); // un bandeau peut apparaître après coup au-dessus (ex. vérification d'e-mail) et décaler la page
}

/* Export PDF réel (point 17) -- même bibliothèque/pattern que cv-builder.js (repli sur
   window.print() si le CDN html2pdf est indisponible, jamais d'échec silencieux). Cible le
   document déjà affiché (#bpv-doc) : couverture (photo + référentiel monétaire déjà résolus),
   sections, tableaux multidevise -- tout ce qui est à l'écran est déjà correctement converti,
   aucune donnée à recalculer pour l'export. */
async function bpvExportPDF(){
  if (bp && bp.exemple) { alert('Cet exemple de référence ne peut pas être téléchargé. Dupliquez-le pour obtenir votre propre version.'); return; }
  const btn = document.getElementById('bpv-btn-pdf');
  if (typeof html2pdf === 'undefined') { window.print(); return; }
  const doc = document.getElementById('bpv-fulldoc');   // toutes les rubriques à la suite
  if (!doc) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Génération…'; }
  try {
    const clone = doc.cloneNode(true);
    clone.classList.add('bpv-pdf');
    clone.style.cssText = 'display:block;width:210mm;border:none;box-shadow:none;border-radius:0;';
    const filename = `${(bp?.nom_projet || 'business-plan').replace(/[^a-zA-Z0-9À-ÿ_-]+/g, '_')}.pdf`;
    await html2pdf().set({
      margin: 0,
      filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: '.bpv-section' }
    }).from(clone).save();
  } catch (e) {
    alert('Erreur lors de la génération du PDF : ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 Télécharger en PDF'; }
  }
}

function showError(msg){
  document.getElementById('bpv-loading').style.display = 'none';
  const el = document.getElementById('bpv-error');
  el.style.display = '';
  el.innerHTML = `<div style="font-size:40px;margin-bottom:10px;">🚫</div><p>${esc(msg)}</p><a href="business-plan.html" class="btn btn-outline" style="margin-top:12px;display:inline-block;">← Retour à mes Business Plans</a>`;
}

init();
</script>
