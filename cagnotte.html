<html lang="fr">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="/assets/ui-enhancements.v2.css">

<style>
.cg-wrap{max-width:820px;margin:0 auto;padding:30px 24px 60px;}
.cg-back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:16px;}
.cg-photo{width:100%;height:280px;border-radius:var(--radius);object-fit:cover;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:60px;}
.cg-cat{display:inline-block;margin-top:16px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;background:#F26422;letter-spacing:.04em;text-transform:uppercase;}
.cg-title{font-size:26px;font-weight:900;margin:10px 0 4px;color:var(--navy);}
.cg-organisateur{font-size:13px;color:var(--muted);margin-bottom:20px;}
.cg-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.cg-bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0;}
.cg-bar-fill{height:100%;background:linear-gradient(135deg,#F26422,#c2410c);}
.cg-montant{font-size:24px;font-weight:900;color:var(--navy);}
.cg-montant-sub{font-size:13px;color:var(--muted);margin-top:2px;}
.cg-stats{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap;}
.cg-stat{font-size:13px;color:var(--muted);}
.cg-stat strong{display:block;font-size:18px;color:var(--navy);}
.cg-participer{width:100%;margin-top:18px;padding:14px;border-radius:10px;border:none;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#F26422,#c2410c);color:#fff;}
.cg-participer:disabled{cursor:not-allowed;background:#e5e7eb;color:#9ca3af;}
.cg-participer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;}
.cg-desc{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;}
.cg-empty{text-align:center;padding:60px 20px;color:var(--muted);}
.cg-banner{border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;}
.cg-banner-ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
.cg-banner-annule{background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
.cg-contrib-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cg-contrib-item:last-child{border-bottom:none;}
.cg-montants-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.cg-montant-pill{padding:10px;border:1.5px solid var(--border);border-radius:8px;text-align:center;font-weight:700;cursor:pointer;background:#fff;}
.cg-montant-pill.actif{border-color:#F26422;background:#fff7ed;color:#c2410c;}
.cg-header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.cg-share-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--navy);}
.cg-share-btn:hover{border-color:#F26422;color:#F26422;}
.cg-share-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
.cg-share-modal{background:#fff;border-radius:16px;padding:26px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.cg-share-modal h3{margin:0 0 16px;font-size:16px;color:var(--navy);}
.cg-share-qr{width:180px;height:180px;margin:0 auto 14px;border-radius:12px;overflow:hidden;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;background:#fff;}
.cg-share-link{font-size:11px;color:var(--muted);word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:14px;}
.cg-share-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;}
.cg-share-actions a,.cg-share-actions button{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--navy);}
.cg-share-actions a:hover,.cg-share-actions button:hover{border-color:#F26422;color:#F26422;}
.cg-share-close{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;}
@media(min-width:769px){#sidebar,#sidebar-backdrop,#sidebar-toggle{display:none!important;}}
</style>
  <link rel="stylesheet" href="/assets/design-upgrade.v2.css">
  <link rel="stylesheet" href="/assets/theme-manager.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="topbar-inner">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">&#9776;</button>
      <div class="logo"><img loading="lazy" class="logo-img" src="assets/logo.png" alt="Diaspo'Actif"> DIASPO'ACTIF</div>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="annuaire.html">Annuaire</a>
        <a href="vitrines.html">Vitrines</a>
        <a href="cagnottes.html">Cagnottes</a>
      </nav>
      <div class="topbar-right">
        <select class="lang-select" id="lang-select"></select>
        <div id="auth-area" class="auth-area"></div>
      </div>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebar-close" aria-label="Fermer">&#x2715;</button>
    <div class="brand">Diaspo'Actif</div>
    <a href="index.html">🏠 Accueil</a>
    <a href="annuaire.html">🔍 Annuaire</a>
    <a href="vitrines.html">🏪 Vitrines</a>
    <a href="cagnottes.html">🪙 Cagnottes</a>
    <div id="hb-account-section"></div>
  </aside>

  <div class="cg-wrap" id="cg-content">
    <div class="cg-empty">Chargement…</div>
  </div>

  <footer class="footer">
    <span id="footer-text">Diaspo'Actif · Du Sud au Nord · 2026</span> ·
    <a href="mentions-legales.html" class="footer-link">Mentions légales</a> · <a href="politique-confidentialite.html" class="footer-link">Politique de confidentialité</a>
  </footer>
</div>

<script src="assets/data.js?v=7"></script>
<script src="assets/demo.js?v=2"></script>
<script src="assets/app.js?v=11"></script>

<script>
(function(){
  function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const CAG_STATUT_LABELS = {
    brouillon:{label:'Brouillon'}, active:{label:'🟢 Cagnotte active'}, en_pause:{label:'⏸️ En pause'},
    terminee:{label:'✅ Cagnotte terminée'}, expiree:{label:'⌛ Cagnotte expirée'},
  };
  const slug = new URLSearchParams(location.search).get('slug');
  const participationResult = new URLSearchParams(location.search).get('participation');
  const el = document.getElementById('cg-content');
  let _cagnotte = null;
  let _montantChoisi = null;

  function bannerHtml(){
    if (participationResult === 'succes') return `<div class="cg-banner cg-banner-ok">✅ Merci ! Votre participation a bien été enregistrée. — Toute l'équipe Diaspo'Actif vous remercie chaleureusement.</div>`;
    if (participationResult === 'annule') return `<div class="cg-banner cg-banner-annule">Le paiement a été annulé — vous pouvez réessayer quand vous le souhaitez.</div>`;
    return '';
  }

  /* Proposition de compte pour les invités (2026-08-17, même pattern que adhesions.html) —
     affichée sous la bannière de confirmation, jamais bloquante. */
  async function afficherPropositionCompte(){
    if (participationResult !== 'succes') return;
    let me = { user: null };
    try { me = await (await fetch('/api/auth/me', {credentials:'include'})).json(); } catch(e) {}
    if (me.user) return;
    let emailInvite = '';
    try { emailInvite = sessionStorage.getItem('cg_invite_email') || ''; sessionStorage.removeItem('cg_invite_email'); } catch(e) {}
    const zone = document.createElement('div');
    zone.className = 'cg-banner';
    zone.style.cssText = 'background:#eff6ff;border:1px solid #93c5fd;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;';
    zone.innerHTML = `<span>🔑 <strong>Créez votre compte Diaspo'Actif</strong> pour retrouver cette contribution et son reçu à tout moment.</span>
      <a href="inscription.html?role=utilisateur${emailInvite ? '&email=' + encodeURIComponent(emailInvite) : ''}" class="btn btn-orange" style="padding:7px 16px;font-size:12.5px;">Créer mon compte</a>`;
    const banniereOk = document.querySelector('.cg-banner-ok');
    if (banniereOk) banniereOk.insertAdjacentElement('afterend', zone);
  }

  function ouvrirParticipation(){
    /* Participation invitée (2026-08-17) : plus de redirection forcée vers la connexion — le
       formulaire ci-dessous demande nom/prénom/e-mail directement à la personne sans compte,
       même pattern que l'adhésion invitée (POST /api/adhesion-formules/:id/payer, 2026-08-08). */
    fetch('/api/auth/me', {credentials:'include'}).then(r=>r.json()).then(({user}) => {
      renderModalParticipation(user || null);
    });
  }

  function renderModalParticipation(user){
    fetch('/api/cagnottes/montants-predefinis').then(r=>r.json()).then(({ montants }) => {
      let modal = document.getElementById('cg-part-modal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'cg-part-modal'; modal.className = 'modal-overlay'; document.body.appendChild(modal); }
      _montantChoisi = montants[1] || montants[0];
      modal.innerHTML = `<div class="modal-box" style="max-width:420px;text-align:left;">
        <h3 style="margin:0 0 4px;">💛 Participer à « ${escH(_cagnotte.titre)} »</h3>
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Choisissez un montant, ou saisissez le vôtre.</p>
        <div class="cg-montants-grid" id="cg-part-montants">
          ${montants.map(m => `<div class="cg-montant-pill${m===_montantChoisi?' actif':''}" data-montant="${m}">${m} ${_cagnotte.devise}</div>`).join('')}
        </div>
        <input id="cg-part-libre" type="number" min="1" step="1" placeholder="Autre montant (${_cagnotte.devise})" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;">
        ${!user ? `
        <p style="font-size:12px;background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:8px 10px;margin:0 0 10px;">Vous participez sans compte Diaspo'Actif — renseignez simplement vos coordonnées ci-dessous. 🔑 <a href="login.html?retour=${encodeURIComponent(location.href)}">Déjà un compte ? Connectez-vous</a> pour préremplir automatiquement.</p>
        <input id="cg-part-nom" type="text" placeholder="Nom *" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;">
        <input id="cg-part-prenom" type="text" placeholder="Prénom" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;">
        <input id="cg-part-email" type="email" placeholder="Adresse e-mail *" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;">` : ''}
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-bottom:10px;">
          <input type="checkbox" id="cg-part-anonyme"> Participer anonymement (mon nom ne sera pas affiché publiquement)
        </label>
        <textarea id="cg-part-message" rows="2" placeholder="Message (optionnel)" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;margin-bottom:10px;"></textarea>
        <div id="cg-part-error" class="auth-error" style="display:none;margin-bottom:10px;"></div>
        <button class="cg-participer" id="cg-part-submit">💳 Continuer vers le paiement</button>
        <div style="text-align:center;margin-top:10px;">
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('cg-part-modal').remove()">Annuler</button>
        </div>
      </div>`;
      modal.querySelectorAll('.cg-montant-pill').forEach(p => p.addEventListener('click', () => {
        _montantChoisi = Number(p.dataset.montant);
        document.getElementById('cg-part-libre').value = '';
        modal.querySelectorAll('.cg-montant-pill').forEach(x => x.classList.toggle('actif', x === p));
      }));
      document.getElementById('cg-part-libre').addEventListener('input', function(){
        if (this.value) { _montantChoisi = null; modal.querySelectorAll('.cg-montant-pill').forEach(x => x.classList.remove('actif')); }
      });
      document.getElementById('cg-part-submit').addEventListener('click', () => soumettreParticipation(!user));
    });
  }

  function soumettreParticipation(invite){
    const errBox = document.getElementById('cg-part-error');
    errBox.style.display = 'none';
    const libre = Number(document.getElementById('cg-part-libre').value);
    const montant = libre > 0 ? libre : _montantChoisi;
    if (!montant || montant < 1) { errBox.textContent = 'Choisissez ou saisissez un montant valide.'; errBox.style.display = 'block'; return; }
    let nom, prenom, email;
    if (invite) {
      nom = document.getElementById('cg-part-nom').value.trim();
      prenom = document.getElementById('cg-part-prenom').value.trim();
      email = document.getElementById('cg-part-email').value.trim();
      if (!nom || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errBox.textContent = 'Merci de renseigner votre nom et une adresse e-mail valide.'; errBox.style.display = 'block'; return;
      }
    }
    const btn = document.getElementById('cg-part-submit');
    btn.disabled = true; btn.textContent = 'Redirection…';
    fetch('/api/cagnottes/' + _cagnotte.id + '/participer', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        montant, nom, prenom, email,
        anonyme: document.getElementById('cg-part-anonyme').checked,
        message: document.getElementById('cg-part-message').value.trim() || undefined,
      })
    }).then(async r => { const d = await r.json(); if (!r.ok) throw d; return d; })
      .then(({ checkout_url }) => {
        /* Mémorise l'e-mail invité pour préremplir la proposition de création de compte au
           retour de Stripe (voir afficherPropositionCompte ci-dessus) — jamais transmis à un
           tiers. */
        if (invite && email) { try { sessionStorage.setItem('cg_invite_email', email); } catch(e) {} }
        location.href = checkout_url;
      })
      .catch(err => { errBox.textContent = err.error || 'Erreur lors de la préparation du paiement.'; errBox.style.display = 'block'; btn.disabled = false; btn.textContent = '💳 Continuer vers le paiement'; });
  }
  window.cgOuvrirParticipation = ouvrirParticipation;

  /* Phase 2 point 9 : QR code + lien partageable. QR généré côté client via qrcodejs
     (même CDN que assets/profile-qr.js), chargé à la demande pour ne pas alourdir le
     chargement initial de la page. */
  const QRCODE_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  function loadQRLib(){
    return new Promise((resolve, reject) => {
      if (window.QRCode) { resolve(); return; }
      const s = document.createElement('script');
      s.src = QRCODE_CDN; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  window.ouvrirPartage = async function(titre){
    /* Ne PAS tronquer la query string : ?slug=... est ce qui identifie la cagnotte, sans
       lui le lien partagé retomberait sur une page "identifiant manquant". Le paramètre
       participer=1 permet une participation rapide en un clic depuis le QR code (2026-08-17) :
       la page cagnotte.html ouvre alors directement le formulaire au chargement. */
    const shareUrl = new URL(location.href.split('#')[0]);
    shareUrl.searchParams.set('participer', '1');
    const url = shareUrl.toString();
    let modal = document.getElementById('cg-share-modal-bg');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'cg-share-modal-bg';
      modal.className = 'cg-share-modal-bg';
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
      document.body.appendChild(modal);
    }
    modal.innerHTML = `
      <div class="cg-share-modal">
        <h3>📤 Partager cette cagnotte</h3>
        <div class="cg-share-qr" id="cg-share-qr">Chargement…</div>
        <div class="cg-share-link">${url}</div>
        <div class="cg-share-actions">
          <button onclick="navigator.clipboard.writeText('${url}').then(()=>{this.textContent='✅ Copié !';setTimeout(()=>this.textContent='🔗 Copier le lien',1500);})">🔗 Copier le lien</button>
          <a href="https://wa.me/?text=${encodeURIComponent(titre + ' — ' + url)}" target="_blank" rel="noopener">💬 WhatsApp</a>
          <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">📘 Facebook</a>
          <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(titre)}&url=${encodeURIComponent(url)}" target="_blank" rel="noopener">🐦 X</a>
        </div>
        <button class="cg-share-close" onclick="document.getElementById('cg-share-modal-bg').remove()">Fermer</button>
      </div>`;
    try {
      await loadQRLib();
      const qrEl = document.getElementById('cg-share-qr');
      if (qrEl) { qrEl.innerHTML = ''; new window.QRCode(qrEl, { text: url, width: 176, height: 176, colorDark: '#0F2A50', colorLight: '#ffffff' }); }
    } catch (e) {
      const qrEl = document.getElementById('cg-share-qr');
      if (qrEl) qrEl.innerHTML = '<span style="font-size:11px;color:var(--muted);">QR indisponible</span>';
    }
  };

  /* Communication autour de la cagnotte (Phase 2 point 8) — nouvelles publiées par le
     créateur/co-organisateur, visibles publiquement. */
  function renderActualites(cagnotteId){
    if (!cagnotteId) return;
    fetch('/api/cagnottes/' + cagnotteId + '/actualites', { credentials: 'include' }).then(r=>r.json()).then(({ actualites }) => {
      if (!actualites || !actualites.length) return;
      const box = document.createElement('div');
      box.className = 'cg-card';
      box.innerHTML = `<h3 style="margin:0 0 10px;font-size:15px;">📣 Actualités</h3>` +
        actualites.map(a => `<div class="cg-contrib-item" style="display:block;">
          <div>${escH(a.contenu)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px;">${escH(a.auteur_nom||'')} · ${new Date((a.created_at||'').replace(' ','T')+'Z').toLocaleDateString('fr-FR')}</div>
        </div>`).join('');
      el.appendChild(box);
    }).catch(()=>{});
  }

  function renderContributeurs(slug, afficherParticipants){
    if (!afficherParticipants) return;
    fetch('/api/cagnottes/public/' + encodeURIComponent(slug) + '/contributeurs').then(r=>r.json()).then(({ contributeurs }) => {
      if (!contributeurs || !contributeurs.length) return;
      const box = document.createElement('div');
      box.className = 'cg-card';
      box.innerHTML = `<h3 style="margin:0 0 10px;font-size:15px;">🙌 ${contributeurs.length} contributeur(s)</h3>` +
        contributeurs.map(p => `<div class="cg-contrib-item">
          <span>${escH(p.contributeur_nom)}${p.message ? ` — <span style="color:var(--muted);">${escH(p.message)}</span>` : ''}</span>
          ${p.montant != null ? `<strong>${Number(p.montant).toLocaleString('fr-FR')}</strong>` : ''}
        </div>`).join('');
      el.appendChild(box);
    }).catch(()=>{});
  }

  if (!slug) {
    el.innerHTML = `<div class="cg-empty">Aucune cagnotte demandée.</div>`;
  } else {
    fetch('/api/cagnottes/public/' + encodeURIComponent(slug), { credentials:'include' })
      .then(async r => { if (!r.ok) throw await r.json().catch(()=>({error:'Introuvable.'})); return r.json(); })
      .then(({ cagnotte:c }) => {
        _cagnotte = c;
        document.title = `${c.titre} — Diaspo'Actif Cagnottes`;
        const objectifTxt = c.objectif_montant
          ? `${Number(c.montant_collecte).toLocaleString('fr-FR')} ${c.devise} sur ${Number(c.objectif_montant).toLocaleString('fr-FR')} ${c.devise} — ${c.pourcentage}%`
          : `${Number(c.montant_collecte).toLocaleString('fr-FR')} ${c.devise} collectés (objectif libre)`;
        const barre = c.objectif_montant ? `<div class="cg-bar"><div class="cg-bar-fill" style="width:${c.pourcentage}%;"></div></div>` : '';
        const peutParticiper = c.statut === 'active';
        el.innerHTML = `
          <div class="cg-header-row">
            <a class="cg-back" href="cagnottes.html" style="margin:0;">← Toutes les cagnottes</a>
            <button class="cg-share-btn" onclick="ouvrirPartage('${escH(c.titre).replace(/'/g,"\\'")}')">📤 Partager</button>
          </div>
          ${bannerHtml()}
          ${c.image_url ? `<img class="cg-photo" src="${escH(c.image_url)}" alt="">` : `<div class="cg-photo">🪙</div>`}
          ${c.categorie ? `<span class="cg-cat">${escH(c.categorie)}</span>` : ''}
          <h1 class="cg-title">${escH(c.titre)}</h1>
          <div class="cg-organisateur">Organisée par ${escH(c.organisateur_nom || 'une initiative Diaspo\'Actif')} · ${CAG_STATUT_LABELS[c.statut]?.label || ''}</div>

          <div class="cg-card">
            <div class="cg-montant">${objectifTxt}</div>
            ${barre}
            <div class="cg-stats">
              <div class="cg-stat"><strong>${c.nb_contributeurs||0}</strong>contributeur(s)</div>
              ${c.date_fin ? `<div class="cg-stat"><strong>${new Date(c.date_fin).toLocaleDateString('fr-FR')}</strong>date de fin</div>` : ''}
            </div>
            <button class="cg-participer" id="cg-btn-participer" ${peutParticiper ? '' : 'disabled'}>💛 ${peutParticiper ? 'Participer' : 'Participation indisponible'}</button>
            ${peutParticiper ? '' : `<div class="cg-participer-note">Cette cagnotte n'accepte plus de contributions pour le moment.</div>`}
          </div>

          ${c.description ? `<div class="cg-card"><h3 style="margin:0 0 10px;font-size:15px;">À propos</h3><div class="cg-desc">${mdBold(escH(c.description))}</div></div>` : ''}
        `;
        if (peutParticiper) document.getElementById('cg-btn-participer').addEventListener('click', ouvrirParticipation);
        renderContributeurs(slug, !!c.afficher_participants);
        renderActualites(c.id);
        afficherPropositionCompte();
        /* Participation rapide via QR code (2026-08-17) : ?participer=1 ouvre directement le
           formulaire de participation au chargement, sans clic supplémentaire. */
        if (peutParticiper && new URLSearchParams(location.search).get('participer') === '1') ouvrirParticipation();
      })
      .catch(err => {
        el.innerHTML = `<div class="cg-empty">🔒 ${escH(err.error || 'Cette cagnotte est introuvable ou n\'est plus accessible.')}</div>`;
      });
  }
})();
</script>

  
  <script>
  (function(){
    function render(user){
      var box = document.getElementById('hb-account-section');
      var navLogin = document.getElementById('mob-nav-login');
      if (!box) return;
      if (user){
        var dash = {utilisateur:'dashboard-utilisateur.html', initiative:'dashboard-initiative.html', administrateur:'dashboard-administrateur.html', collectivite:'dashboard-collectivite.html'};
        var dashHref = dash[user.role] || 'index.html';
        box.innerHTML = '<a href="' + dashHref + '#apparence">⚙️ Paramètres</a><a href="#" id="hb-logout-link">🚪 Déconnexion</a>';
        var out = document.getElementById('hb-logout-link');
        if (out) out.addEventListener('click', function(e){
          e.preventDefault();
          fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'}).finally(function(){ window.location.href = 'index.html'; });
        });
        if (navLogin) navLogin.href = dashHref;
      } else {
        box.innerHTML = '<a href="login.html">🔑 Se connecter</a><a href="inscription.html">✨ Créer un compte</a>';
      }
    }
    fetch('/api/auth/me', {credentials:'same-origin'}).then(function(r){ return r.json(); })
      .then(function(d){ render(d && d.user ? d.user : null); }).catch(function(){ render(null); });
  })();
  </script>
